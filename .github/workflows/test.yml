name: CI

on:
  push:
    branches: [main]
  pull_request:

# **生きているのはエンジン（engine_core/）だけ。**
# 前はここが旧世代（apps/・tests/）を見ていた。旧世代は archive/ へ移したので、
# そのままだと「動いていないコードを検査して緑になる」状態になる。
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # `-n 4 --dist worksteal` は pyproject の addopts に入っている。
      # 既定の `--dist load` だと tests/eval/test_eval_suite.py の重い群が
      # 1本のワーカーに固まり、残りが遊んだまま終盤で止まる。
      - name: エンジンのテスト（49,626件）
        env:
          PYTHONPATH: engine_core
        run: pytest engine_core/tests

      - name: 7ゲート
        env:
          PYTHONPATH: engine_core
        run: python -m engine.eval

      - name: Lint
        run: ruff check engine_core/
