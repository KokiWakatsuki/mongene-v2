<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mongene-v2 中学数学問題ジェネレータ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    :root { color-scheme: only light; --accent: #2563eb; --border: #d4d4d8; --muted: #71717a; --text: #1a1a1a; --bg: #ffffff; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      max-width: 960px; margin: 0 auto; padding: 24px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-bottom: 14px; }
    legend { font-weight: 600; padding: 0 8px; font-size: 0.95rem; }
    .row { display: grid; grid-template-columns: 7em 1fr; gap: 12px; align-items: start; margin-bottom: 10px; }
    .row label { font-weight: 500; padding-top: 7px; }
    select, input[type="number"] {
      padding: 6px 10px; border: 1px solid #aaa; border-radius: 4px; font-size: 0.95rem;
    }
    select { width: 100%; }
    /* 生成ボタン */
    .action-btn {
      padding: 10px 22px; border: none; border-radius: 6px;
      background: var(--accent); color: white; cursor: pointer; font-size: 1rem; font-weight: 600;
    }
    .action-btn:disabled { background: #999; cursor: not-allowed; }
    .action-btn.secondary { background: #6b7280; }
    /* レベルボタン */
    .level-btn {
      padding: 6px 16px; border: 1.5px solid var(--border); border-radius: 20px;
      background: white; color: var(--text); cursor: pointer; font-size: 0.88rem; font-weight: 600;
    }
    .level-btn:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
    .level-btn.active { background: var(--accent); color: white !important; border-color: var(--accent); }
    .level-btn[disabled] { opacity: 0.38; cursor: not-allowed; border-style: dashed; }
    .level-wrap { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .level-desc { font-size: 0.82rem; color: var(--muted); margin-top: 5px; min-height: 1.3em; }
    .unlearned-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 12px;
      max-height: 200px; overflow-y: auto; padding: 8px; border: 1px solid var(--border); border-radius: 4px;
    }
    .unlearned-list label { font-weight: normal; font-size: 0.88rem; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #result { border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-top: 16px; background: #fafafa; color: var(--text); }
    .problem-text { font-size: 1.1rem; padding: 14px; background: white; border-radius: 4px; border: 1px solid #eee; color: var(--text); }
    .explanation { padding: 14px; background: white; border-radius: 4px; border: 1px solid #eee; color: var(--text); }
    #result h2, #result h3 { color: var(--text); }
    .diagram { padding: 14px; background: white; border-radius: 4px; border: 1px solid #eee; text-align: center; margin: 10px 0; }
    .diagram img { max-width: 100%; max-height: 400px; }
    .metadata { font-size: 0.8rem; color: var(--muted); margin-top: 12px; }
    .error { color: #b91c1c; padding: 12px; background: #fef2f2; border-radius: 4px; }
    .loading { color: var(--accent); }
    .lesson-meta { color: var(--muted); font-size: 0.85rem; padding-left: 7em; margin-top: -4px; margin-bottom: 6px; }
    .submit-row { text-align: center; padding: 8px 0; }
    .badge {
      display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 1px 7px;
      border-radius: 10px; background: #dbeafe; color: #1e40af; vertical-align: middle; margin-left: 6px;
    }
    .badge.exam { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>
  <h1>mongene-v2</h1>
  <p class="subtitle">中学数学問題自動生成システム — 184 lesson 対応（g1〜g3: 177件 ＋ 入試対策: 7件）</p>

  <fieldset>
    <legend>単元選択</legend>
    <div class="row">
      <label for="grade">学年</label>
      <select id="grade">
        <option value="1">中学1年</option>
        <option value="2">中学2年</option>
        <option value="3" selected>中学3年</option>
      </select>
    </div>
    <div class="row">
      <label for="domain">領域</label>
      <select id="domain"></select>
    </div>
    <div class="row">
      <label for="large_unit">大単元</label>
      <select id="large_unit"></select>
    </div>
    <div class="row">
      <label for="lesson">小単元</label>
      <select id="lesson"></select>
    </div>
    <div class="lesson-meta" id="lessonMeta"></div>
  </fieldset>

  <fieldset>
    <legend>出題条件</legend>
    <div class="row">
      <label for="form">問題形式</label>
      <select id="form">
        <option value="knowledge">知識</option>
        <option value="calculation">計算</option>
        <option value="visual">視覚読解</option>
        <option value="word_problem">文章題</option>
        <option value="proof">証明</option>
      </select>
    </div>
    <div class="row">
      <label>難易度レベル</label>
      <div>
        <div id="levelWrap" class="level-wrap"></div>
        <div id="levelDesc" class="level-desc"></div>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>未習熟の大単元（チェックした単元の lesson は前提として連鎖排除されます）</legend>
    <div class="unlearned-list" id="unlearnedList"></div>
  </fieldset>

  <div class="submit-row">
    <button id="submit" class="action-btn">問題生成（LLM あり）</button>
    <button id="inspect" class="action-btn secondary" style="margin-left:12px;" title="LLM なしでシステムの SymPy 計算結果だけを表示">中間表現を確認（LLM なし）</button>
    <span id="status"></span>
  </div>

  <div id="result" style="display:none">
    <h2>生成結果</h2>
    <div class="problem-text" id="problemText"></div>
    <div class="diagram" id="diagramBox" style="display:none">
      <img id="diagramImg" alt="図" />
    </div>
    <h3>解説</h3>
    <div class="explanation" id="explanationText"></div>
    <details>
      <summary>メタデータ</summary>
      <pre class="metadata" id="metadata"></pre>
    </details>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    let allLessons = [];
    let currentLevels = [];   // difficulty_levels[form] の配列
    let selectedLevel = null; // 現在選択中のlv番号

    // ── レッスン一覧ロード ──
    async function loadLessons() {
      const res = await fetch('/problems/lessons');
      const data = await res.json();
      allLessons = data.lessons;
      refreshDomain();
    }

    function currentGrade() { return parseInt($('grade').value, 10); }

    function refreshDomain() {
      const g = currentGrade();
      const domains = Array.from(new Set(allLessons.filter(l => l.grade === g).map(l => l.domain))).filter(Boolean);
      $('domain').innerHTML = domains.map(d => `<option value="${d}">${d}</option>`).join('');
      refreshLargeUnit();
      refreshUnlearned();
    }

    function refreshLargeUnit() {
      const g = currentGrade();
      const dom = $('domain').value;
      const lus = Array.from(new Set(allLessons.filter(l => l.grade === g && l.domain === dom).map(l => l.large_unit))).filter(Boolean);
      $('large_unit').innerHTML = lus.map(lu => `<option value="${lu}">${lu}</option>`).join('');
      refreshLesson();
    }

    function refreshLesson() {
      const g = currentGrade();
      const dom = $('domain').value;
      const lu = $('large_unit').value;
      const lessons = allLessons.filter(l => l.grade === g && l.domain === dom && l.large_unit === lu);
      $('lesson').innerHTML = lessons
        .map(l => {
          const isExam = l.lesson_id.startsWith('exam_');
          return `<option value="${l.lesson_id}" data-forms="${l.supported_forms.join(',')}" data-exam="${isExam}">`
            + `${isExam ? '★ ' : ''}${l.title}`
            + `</option>`;
        })
        .join('');
      onLessonChange();
    }

    function onLessonChange() {
      const opt = $('lesson').options[$('lesson').selectedIndex];
      if (!opt) { $('lessonMeta').textContent = ''; return; }
      const isExam = opt.dataset.exam === 'true';
      const badge = isExam ? '<span class="badge exam">入試対策</span>' : '';
      $('lessonMeta').innerHTML = `${opt.value}${badge}`;

      // 問題形式のフィルタリング
      const forms = (opt.dataset.forms || '').split(',').filter(Boolean);
      const formSel = $('form');
      [...formSel.options].forEach(o => (o.disabled = !forms.includes(o.value)));
      if (!forms.includes(formSel.value) && forms.length) formSel.value = forms[0];

      loadLevels();
    }

    // ── レベル取得・表示 ──
    async function loadLevels() {
      const opt = $('lesson').options[$('lesson').selectedIndex];
      if (!opt) return;
      const lessonId = opt.value;
      const form = $('form').value;

      $('levelWrap').innerHTML = '<span style="color:var(--muted);font-size:0.85rem;">読み込み中...</span>';
      $('levelDesc').textContent = '';
      currentLevels = [];
      selectedLevel = null;

      try {
        const res = await fetch(`/problems/mapping/${lessonId}`);
        if (!res.ok) throw new Error('mapping 取得失敗');
        const mapping = await res.json();
        const levels = Array.isArray(mapping.difficulty_levels?.[form])
          ? mapping.difficulty_levels[form]
          : [];
        currentLevels = levels;
        renderLevelButtons(levels);
      } catch (e) {
        $('levelWrap').innerHTML = `<span style="color:#b91c1c;font-size:0.85rem;">レベル情報取得失敗: ${esc(e.message)}</span>`;
      }
    }

    function renderLevelButtons(levels) {
      if (levels.length === 0) {
        $('levelWrap').innerHTML = '<span style="color:var(--muted);font-size:0.85rem;">このフォームにはレベル定義がありません</span>';
        return;
      }
      $('levelWrap').innerHTML = levels.map(lv => {
        const cls = lv.implementable ? 'level-btn' : 'level-btn';
        const dis = lv.implementable ? '' : 'disabled title="未実装（対応 Atom/Verb なし）"';
        return `<button type="button" class="${cls}" data-lv="${lv.lv}" ${dis}>Lv${lv.lv}</button>`;
      }).join('');

      // ボタンイベント
      $('levelWrap').querySelectorAll('.level-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', () => selectLevel(parseInt(btn.dataset.lv)));
      });

      // 最初の実装済みレベルを選択
      const first = levels.find(lv => lv.implementable);
      if (first) selectLevel(first.lv);
    }

    function selectLevel(lv) {
      selectedLevel = lv;
      $('levelWrap').querySelectorAll('.level-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.lv) === lv);
      });
      const data = currentLevels.find(l => l.lv === lv);
      $('levelDesc').textContent = data ? `Lv${lv}: ${data.description}` : '';
    }

    function refreshUnlearned() {
      const g = currentGrade();
      const groups = {};
      allLessons.filter(l => l.grade <= g && !l.lesson_id.startsWith('exam_')).forEach(l => {
        const key = `g${l.grade}|${l.large_unit}`;
        if (!groups[key]) groups[key] = { grade: l.grade, large_unit: l.large_unit, lesson_ids: [] };
        groups[key].lesson_ids.push(l.lesson_id);
      });
      const list = Object.values(groups).sort((a, b) =>
        a.grade - b.grade || a.large_unit.localeCompare(b.large_unit, 'ja')
      );
      $('unlearnedList').innerHTML = list
        .map(grp =>
          `<label><input type="checkbox" value="${grp.lesson_ids.join(',')}" /> 中${grp.grade} ${grp.large_unit}</label>`
        ).join('');
    }

    function collectUnlearned() {
      const result = [];
      $('unlearnedList').querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
        cb.value.split(',').filter(Boolean).forEach(id => result.push(id));
      });
      return Array.from(new Set(result));
    }

    // ── イベント ──
    $('grade').addEventListener('change', refreshDomain);
    $('domain').addEventListener('change', refreshLargeUnit);
    $('large_unit').addEventListener('change', refreshLesson);
    $('lesson').addEventListener('change', onLessonChange);
    $('form').addEventListener('change', loadLevels);

    // LaTeX 整形ヘルパー
    function prepareLatex(raw) {
      if (!raw) return '';
      return esc(raw)
        .replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => '$' + m.trim().replace(/<br\s*\/?>/g, ' ') + '$')
        .replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => '$' + m.trim().replace(/<br\s*\/?>/g, ' ') + '$')
        .replace(/\n/g, '<br/>');
    }

    // ── 問題生成 ──
    $('submit').addEventListener('click', async () => {
      const opt = $('lesson').options[$('lesson').selectedIndex];
      if (!opt) return;
      if (selectedLevel === null) {
        alert('難易度レベルを選択してください');
        return;
      }
      const payload = {
        curriculum: { grade: currentGrade(), lesson_ids: [opt.value] },
        problem_form: $('form').value,
        target_level: selectedLevel,
        unlearned_lesson_ids: collectUnlearned(),
      };

      $('submit').disabled = true;
      $('status').className = 'loading';
      $('status').textContent = ` 生成中… Lv${selectedLevel}（実 LLM 接続時は 10〜60 秒）`;
      $('result').style.display = 'none';

      try {
        const res = await fetch('/problems/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        $('result').style.display = 'block';
        if (!res.ok) {
          $('problemText').innerHTML = `<div class="error">${esc(data.detail || JSON.stringify(data))}</div>`;
          $('explanationText').textContent = '';
          $('metadata').textContent = '';
        } else {
          // 問題文
          const mainText = prepareLatex(data.content_problem_text);
          const subQTexts = (data.sub_questions || []).map((sq) => {
            const label = sq.label ? `<strong>${esc(sq.label)}</strong>&nbsp;` : '';
            return `<div style="margin-top:6px;">${label}${prepareLatex(sq.prompt_text)}</div>`;
          }).join('');
          $('problemText').innerHTML = mainText + (subQTexts ? `<div style="margin-top:10px; border-top:1px solid #eee; padding-top:8px;">${subQTexts}</div>` : '');

          // 図
          const diagUrl = data.visuals?.problem_diagram_url;
          if (diagUrl) {
            $('diagramImg').src = diagUrl + '?t=' + Date.now();
            $('diagramBox').style.display = 'block';
          } else {
            $('diagramBox').style.display = 'none';
          }

          // 解説
          const blocks = (data.sub_questions || []).map((sq) => {
            const label = sq.label ? `<strong>${esc(sq.label)}</strong>&nbsp;` : '';
            const prompt = prepareLatex(sq.prompt_text);
            const answer = `<span style="color:#1d4ed8;font-weight:600;">${esc('答え: ' + sq.answer.text_form)}</span>`;
            const exp = sq.explanation_text ? prepareLatex(sq.explanation_text) : '';
            return (
              `<div style="margin-bottom:16px; padding:10px; background:#f8faff; border-radius:4px; border:1px solid #dbeafe;">` +
              `<div style="margin-bottom:4px;">${label}${prompt}</div>` +
              `<div style="margin-left:1em; margin-bottom:4px;">${answer}</div>` +
              (exp ? `<div style="margin-left:1em; color:#374151; font-size:0.9rem; line-height:1.8;">${exp}</div>` : '') +
              `</div>`
            );
          });
          $('explanationText').innerHTML = blocks.join('');

          // メタデータ（difficulty_level を補完）
          const meta = { ...data.metadata, difficulty_level: selectedLevel };
          $('metadata').textContent = JSON.stringify(meta, null, 2);

          renderKatex();
        }
      } catch (e) {
        $('result').style.display = 'block';
        $('problemText').innerHTML = `<div class="error">${esc(e.message)}</div>`;
      } finally {
        $('submit').disabled = false;
        $('status').textContent = '';
      }
    });

    // ── 中間表現確認 ──
    $('inspect').addEventListener('click', async () => {
      const opt = $('lesson').options[$('lesson').selectedIndex];
      if (!opt) return;
      if (selectedLevel === null) {
        alert('難易度レベルを選択してください');
        return;
      }
      const payload = {
        curriculum: { grade: currentGrade(), lesson_ids: [opt.value] },
        problem_form: $('form').value,
        target_level: selectedLevel,
        unlearned_lesson_ids: [],
      };
      $('inspect').disabled = true;
      $('status').textContent = ` 中間表現取得中… Lv${selectedLevel}（LLM なし、即座に返却）`;
      $('result').style.display = 'none';
      try {
        const res = await fetch('/problems/inspect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        $('result').style.display = 'block';
        if (!res.ok) {
          $('problemText').innerHTML = `<div class="error">${esc(data.detail)}</div>`;
          $('explanationText').innerHTML = '';
          return;
        }
        const sqs = (data.sub_questions || []);
        let html = `<div style="background:#f0f9ff;padding:12px;border-radius:4px;border:1px solid #7dd3fc;font-size:0.9rem;">`;
        html += `<strong>Blueprint:</strong> ${esc(data.blueprint_id)} &nbsp; <strong>seed:</strong> ${data.seed} &nbsp; <strong>Lv:</strong> ${selectedLevel} &nbsp; <strong>難易度スコア:</strong> ${data.difficulty_score}<br/>`;
        html += `<strong>selected_tags:</strong> ${esc(JSON.stringify(data.selected_tags))}<br/>`;
        html += `<strong>Atom 情報:</strong><br/>`;
        for (const [slot, info] of Object.entries(data.sampled_atoms || {})) {
          html += `&nbsp; ${esc(slot)}: ${esc(JSON.stringify(info))}<br/>`;
        }
        html += `</div>`;
        html += sqs.map(sq => {
          const steps = (sq.logic_steps || []).map(s =>
            `<div style="margin-left:1em;color:#555;font-family:monospace;font-size:0.85rem;">`+
            `${esc(s.operation_name)}: <strong>$${esc(s.sympy_expr)}$</strong> &nbsp; — ${esc(s.narration_hint)}</div>`
          ).join('');
          return `<div style="margin-top:10px;"><strong>${esc(sq.label || '(1)')} ${esc(sq.prompt_hint)}</strong><br/>`+
            steps +
            `<div style="margin-left:1em;"><strong>答え (sympy_form): <span style="color:#1d4ed8">$${esc(sq.answer.sympy_form)}$</span></strong></div></div>`;
        }).join('');
        html += `<div style="margin-top:10px;color:#6b7280;font-size:0.8rem;">${esc(data.note)}</div>`;
        $('problemText').innerHTML = html;
        $('explanationText').innerHTML = '';
        $('metadata').textContent = '';
        $('diagramBox').style.display = 'none';
        if (window.renderMathInElement) {
          renderMathInElement($('problemText'), {
            delimiters: [{ left: '$', right: '$', display: false }],
            throwOnError: false,
          });
        }
      } catch (e) {
        $('result').style.display = 'block';
        $('problemText').innerHTML = `<div class="error">${esc(e.message)}</div>`;
      } finally {
        $('inspect').disabled = false;
        $('status').textContent = '';
      }
    });

    function renderKatex() {
      if (window.renderMathInElement) {
        renderMathInElement(document.getElementById('result'), {
          delimiters: [
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
          ],
          throwOnError: false,
          ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        });
      }
    }

    loadLessons();
  </script>
</body>
</html>
