# 決定論的評価ゲート G4 (form_conformance) が使う判定語彙集。
# scripts/eval_gates/g4_form_conformance.py から読み込まれる。
# ハードコードを避けるため、新しい語を追加したい場合はこのファイルを編集するだけでよい。
#
# 各形式のマーカーは「本文にこれらのどれかが含まれていれば、その形式らしいと判定する」
# ための高再現率ヒューリスティック。完全性は狙わない（spec §3-G4 / 親計画 §2.3）。

knowledge:
  # knowledge 形式が含むべきマーカー（無ければ FAIL）
  required_markers:
    - "次のうち"
    - "正しい"
    - "誤って"
    - "正誤"
    - "用語"
    - "性質"
    - "定義"
    - "穴埋め"
    - "空欄"
    - "当てはまる"
    - "呼び方"
    - "何というか"
    - "説明しなさい"
    - "選びなさい"
    - "答えなさい"
  # knowledge に含まれてはいけない裸の計算パターン（含んだら FAIL）
  forbidden_patterns:
    - "次の計算をしなさい"
    - "計算しなさい"

proof:
  required_markers:
    - "証明"
  structure_markers:
    - "仮定"
    - "結論"
    - "∴"
    - "合同"
    - "相似"
    - "∠"
    - "△"
    - "ゆえに"
    - "よって"

word_problem:
  # 場面設定語彙（これらのどれかを含むべき。無ければ FAIL）
  scenario_markers:
    - "工場"
    - "公園"
    - "お店"
    - "店"
    - "速さ"
    - "人数"
    - "代金"
    - "距離"
    - "時間"
    - "個数"
    - "料金"
    - "値段"
    - "定価"
    - "利益"
    - "割引"
    - "食塩水"
    - "濃度"
    - "電車"
    - "自動車"
    - "駅"
    - "池"
    - "橋"
    - "階段"
    - "クラス"
    - "生徒"
    - "先生"
    - "本"
    - "枚"
    - "個"
    - "円"
    - "km"
    - "m"

visual:
  # 図参照マーカー（本文がこれらを含むべき）
  reference_markers:
    - "図"
    - "グラフ"
    - "右の図"
    - "下の図"
    - "上の図"
    - "次の図"
    - "座標平面"

calculation:
  # calculation は物語語彙を含んではいけない（word_problem の scenario_markers と重複させない）
  # ここでは word_problem.scenario_markers をそのまま「含んではいけない語彙」として参照する運用とする。
  forbidden_scenario_markers_ref: "word_problem.scenario_markers"

# 図番号・注釈で許容される数値スロット（G2 の「素性不明の数値」判定から除外する）
allowed_unattributed_numbers:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  - "①"
  - "②"
  - "③"
  - "④"
  - "⑤"
