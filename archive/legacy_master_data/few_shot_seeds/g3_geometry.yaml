    ideal_problem_text: |
      半径 3 cm の球の体積を求めなさい。
    ideal_explanation_text: |
      球の体積の公式は $V = \dfrac{4}{3}\pi r^3$。
      $r = 3$ を代入して $V = \dfrac{4}{3}\pi \cdot 27 = 36\pi$（cm³）。
