# 概念ノード（BKT 習得度追跡・知識グラフの節点）。正 = このファイル（手書き）。
# M0 縦串（g2_l25 + 戻り先 g2_l24）分のみ整備。横展開は M1。
concepts:
  - id: linear_function.slope_from_two_points
    label: "2点の座標から傾きを求める"
    unit: g2_l25
  - id: linear_function.intercept_from_point
    label: "1点を代入して切片を求める"
    unit: g2_l24
  - id: linear_function.expression_from_two_points
    label: "2点から1次関数の式を決定する"
    unit: g2_l25
  - id: linear_function.expression_from_slope_point
    label: "傾きと1点から1次関数の式を決定する"
    unit: g2_l24
  - id: linear_function.parallel_condition
    label: "平行条件から傾きを読み式を構成する"
    unit: g2_l24
  - id: graph.read_lattice_points
    label: "グラフ上の格子点の座標を読み取る"
    unit: g2_l25
  # 横展開（M1 初手・g2 一次関数クラスタ）
  - id: linear_function.rate_of_change
    label: "2点から一次関数の変化の割合（傾き）を求める"
    unit: g2_l20
  - id: linear_function.intersection_of_two_lines
    label: "2直線の交点の座標を求める（連立方程式の解）"
    unit: g2_l27
  - id: linear_function.variable_range
    label: "x の変域から y の変域を求める・端点の対応（逆算含む）"
    unit: g2_l23
  - id: graph.read_slope_intercept
    label: "直線のグラフから傾きと切片を読み取る"
    unit: g2_l21
  - id: linear_function.solve_equation_for_y
    label: "2元1次方程式 ax+by=c を y=… の形に変形する"
    unit: g2_l26
  - id: linear_function.evaluate_at_x
    label: "1次関数 y=ax+b に x の値を代入して y を求める"
    unit: g2_l19
  - id: linear_function.evaluate_at_x_fraction
    label: "分数係数の1次関数 y=(p/q)x+b に x を代入して y を求める"
    unit: g2_l28
  - id: linear_function.point_on_line
    label: "y=ax+b のグラフが通る点(x0, y0)を代入で求める"
    unit: g2_l22
  - id: linear_function.draw_graph
    label: "傾きと切片を使い y=ax+b のグラフ（直線）をかく"
    unit: g2_l22
  - id: linear_function.draw_graph_fraction
    label: "分数の傾きのグラフを、通る格子点を利用して正確にかく"
    unit: g2_l22
  - id: linear_function.draw_graph_from_equation
    label: "2元1次方程式 ax+by=c を y=… に変形してグラフをかく"
    unit: g2_l26
  - id: linear_function.draw_special_lines
    label: "切片法で2元1次方程式をかき、x=k・y=k の特殊直線もかく"
    unit: g2_l26
  - id: linear_function.read_intersection_from_graph
    label: "2直線をかき交点の座標をグラフから読み取る"
    unit: g2_l27
  - id: linear_function.diagram_intersection
    label: "ダイヤグラム(時間-道のり)の2直線の交点(出会い/追いつき)をグラフから読み取る"
    unit: g2_l30
  - id: linear_function.draw_from_table
    label: "x-y の対応表からグラフ（直線）をかく"
    unit: g2_l28
  - id: linear_function.draw_segment
    label: "変域つき1次関数を、端点の開閉を区別して線分でかく"
    unit: g2_l23
  - id: linear_function.solve_time_from_area
    label: "面積の式 y=ax で目標の面積となる時刻を逆算する"
    unit: g2_l29
  - id: simultaneous_equations.solve_by_elimination
    label: "連立方程式を加減法で解く（係数の絶対値が等しい）"
    unit: g2_l11
  - id: simultaneous_equations.solve_by_elimination_add
    label: "連立方程式を加減法で解く（係数が絶対値等しく符号逆→足して消去）"
    unit: g2_l16
  - id: simultaneous_equations.solve_by_substitution
    label: "連立方程式を代入法で解く（そのまま代入／変形して代入）"
    unit: g2_l13
  - id: simultaneous_equations.solve_by_elimination_scaled
    label: "連立方程式を加減法で解く（係数をそろえる／両式を倍する）"
    unit: g2_l12
  - id: simultaneous_equations.solve_with_preprocessing
    label: "前処理を伴う連立方程式を解く（かっこ展開／分母を払う）"
    unit: g2_l14
  - id: simultaneous_equations.solve_abc_form
    label: "A=B=C 形の等式を連立に組み替えて解く"
    unit: g2_l15
  - id: linear_function.slope_sign_to_direction
    label: "傾きの符号からグラフの向き（右上がり/右下がり）を判別する"
    unit: g2_l21
  - id: linear_function.classify_line_by_signs
    label: "傾き・切片の符号からグラフのようす（向き×y軸の交わり方）を判別・適用する"
    unit: g2_l21
  - id: linear_function.range_endpoint_inclusion
    label: "変域の不等号（等号の有無）から端点が含まれるかを判別する"
    unit: g2_l23
  - id: simultaneous_equations.verify_solution
    label: "与えられた組が連立方程式の解かどうかを代入して判定する"
    unit: g2_l10
  - id: simultaneous_equations.substitute_and_evaluate
    label: "2元1次方程式の左辺に (x,y) を代入して左辺の値を求める"
    unit: g2_l10
  - id: linear_function.classify_as_linear
    label: "与えられた式が y が x の1次関数かどうかを判別する"
    unit: g2_l19
  - id: linear_function.coefficient_role
    label: "1次関数 y=ax+b の x の係数は傾き・定数項は切片を表すことを想起する"
    unit: g2_l19
  - id: linear_function.slope_as_rate_of_change
    label: "1次関数の式から変化の割合（x が1増えたときの y の増加量＝傾き）を求める"
    unit: g2_l21
  - id: linear_function.rate_of_change_is_constant
    label: "1次関数の変化の割合はつねに一定で傾きに等しいことを想起する"
    unit: g2_l20
  - id: linear_function.equation_solution_set_is_line
    label: "2元1次方程式の解の集合が直線になることを想起する"
    unit: g2_l26
  - id: linear_function.system_solution_is_intersection
    label: "連立方程式の解が2直線の交点であることを想起する"
    unit: g2_l27
  - id: polynomial.combine_like_terms_basic
    label: "同類項をまとめて式を簡単にする（1種の文字）"
    unit: g2_l2
  - id: polynomial.combine_like_terms_mixed
    label: "同類項をまとめて式を簡単にする（複数文字が混在し選別を要する）"
    unit: g2_l2
  - id: polynomial.add_polynomials
    label: "多項式の加法をかっこをそのまま外して整理する"
    unit: g2_l3
  - id: polynomial.subtract_polynomials
    label: "多項式の減法をうしろのかっこの符号を変えて外して整理する"
    unit: g2_l3
  - id: polynomial.distribute_multiply
    label: "分配法則で整数を多項式にかけて展開する"
    unit: g2_l5
  - id: polynomial.divide_polynomial
    label: "多項式を数で割る（逆数の乗法に直して分配する）"
    unit: g2_l5
