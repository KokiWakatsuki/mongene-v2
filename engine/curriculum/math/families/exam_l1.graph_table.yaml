family: math.exam_l1.graph_table
form: graph_table
source_desc: |
  一次関数と図形の融合（交点・三角形の面積）— グラフ
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 直線と図形の位置関係をグラフ上で把握する。
       example: 座標平面上に直線 y=-2x+8 と三角形OABがある。直線と x軸・y軸との交点、
                および三角形の頂点の位置関係をグラフ上に図示し、直線が三角形の内部を
                通るかどうかを読み取って答えよ。
  ---
  【なぜ図に直線と三角形を両方描くのか】読む対象そのものが「直線と三角形の位置関係」
  なので、両方を描かなければ問いが成立しない（read_box_plot が箱ひげ図を描いてよいのと
  同じ理屈）。禁じているのは**答えを図中に書いてしまうこと**で、交わる点に印や注記は
  出さない（frames.py の `read_position` の禁止要素 `labeled_answer_point`）。

  【退化の封じ方】候補の列挙で「通る」構成と「通らない」構成が**どちらも十分にある**
  ことを assert する。片方しか出ないと、図を見ずに常に同じ答えを書けば当たってしまう。
  また頂点が直線上にのる構成（判定があいまいになる）は solver 側で例外にする。

  【判定の根拠】各頂点を直線の式に入れた差 y−(mx+b) の符号がそろえば3頂点は直線の
  同じ側にあり通らない、割れていれば通る。double-solve はこの計算を図ではなく
  直線の式と頂点の座標からやり直す＝図が間違っていれば一致しない。

  【描画】新設の登録 visual `math.line_polygon_graph`（visuals/graph.py）。既存の
  座標平面の足場（`_grid_scaffold`）に、直線1本（既存の描き方と同一）と多角形
  （閉じた折れ線＋頂点の黒丸）を重ねるだけ。色に情報を載せない。

  【params】図の描画に要る値（直線の傾き・切片、三角形の頂点、描画範囲 pts）と点名。
  答え（通る／通らない）は置かない。
concepts_default: [exam.linear_line_through_triangle]
levels:
  "2":
    signature: exam_linear_line_through_triangle
    recipe: math.exam_linear_line_through_triangle
    params:
      slope_candidates: [-3, -2, -1, 1, 2, 3]
      intercept_candidates: [-6, -4, -2, 2, 4, 6, 8]
      vertex_x_candidates: [-4, -2, 0, 2, 4]
      vertex_y_candidates: [-4, -2, 0, 2, 4]
      leg: 4
    given: [condition]
    asked: [read_position]
    visual: required
    text: {tier: T1, template: lf_exam_linear_figure_v1, visual_builder: math.line_polygon_graph}
    hints: [steps_prefix]
    concept_tags: [exam.linear_line_through_triangle]
    cause_tags: []
remedial:
