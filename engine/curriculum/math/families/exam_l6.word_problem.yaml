family: math.exam_l6.word_problem
form: word_problem
source_desc: |
  相似と面積比・体積比の融合 — 文章題
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 誘導あり:相似を示す→面積比/体積比の小問が連なる融合。
       example: 三角形ABCで、辺AB上に点D、辺AC上に点Eをとり、DE//BCとする。
                AD:DB=2:3である。(1)三角形ADEと三角形ABCが相似であることを示せ。
                (2)三角形ADEと三角形ABCの面積比を求めよ。(3)三角形ADEの面積が8cm²の
                とき、四角形DBCEの面積を求めよ。
  Lv4 desc: 誘導なし:どの相似を使い比をどう合成するか自分で構成。
       example: 台形ABCD(AD//BC、AD=4cm、BC=6cm)の対角線ACとBDの交点をPとする。
                三角形APDと三角形BPCの面積比を求め、さらに三角形APDの面積が三角形APBの
                面積の何倍になるかを求めよ。
  ---
  【所在】recipe は `recipes/similarity_scale_ratio.py`（相似比の既存資産と同じ
  モジュール）。checker も同モジュールの EXAM_L6_SOLVERS を共有する。

  【Lv3 (1) をどう採点可能にしたか】台帳例の (1)「相似であることを示せ」は記述証明で、
  word_problem の frame の asked_vocab は {formulation, value} しか持たないため
  そのままでは載らない。**相似であることを使って出す値**である「相似比を最も簡単な
  整数の比で答える」に置き換える（記述の組み立ては solution_steps が担う）。
  これは g2_l57/exam_l7 の記述セルを ChoiceAnswer に畳んだのと同じ手で、
  proof form 側の Lv3（相似の記述証明）とは別に立てている。

  【Lv3 設計モデル】新 solver ゼロ。(2)(3) は既存 `math.similar_area_ratio`
  （面積比＝相似比の二乗・既知の面積からもう一方）に委ね、(3) の値は既存
  `math.similar_triangle_trapezoid_area_ratio` が出す 三角形ADE:四角形DBCE の比でも
  検算する（独立な2経路が一致することを構成時に確かめる）。四角形の面積が整数に
  なるよう、三角形ADEの面積を AD² の倍数として構成する。

  【Lv4 の眼目（新設 solver）】`math.trapezoid_diagonal_area_ratios`。
  AD∥BC から △APD∽△CPB（X字型）で面積比は相似比の二乗。一方 △APD と △APB は
  対角線BD上の PD・PB を底辺とし頂点Aを共有するので、面積比は PD:PB＝AD:BC。
  **同じ相似比を「二乗して使う」場面と「そのまま使う」場面が1問に同居する**のが
  Lv4（誘導なし）の眼目で、どちらを使うかを自分で選ばせる。
  高さは答えに効かない surface（場面を具体にし、dup の自由度を上げる既知の手）。

  【level_sep】
    Lv3 = 誘導あり3小問。op 列は convert_partial_to_whole_ratio →
          square_similarity_ratio → compute_whole_area/subtract_inner_triangle。
    Lv4 = 誘導なし1小問。op 列は identify_x_shape_similarity →
          square_similarity_ratio → compare_triangles_sharing_apex。
    小問数（3 対 1）と op 列がともに相異する。

  【dup】Lv3 = AD:DB の既約比(分母6まで≒11) × 面積の倍率(12) ≒ 130 通り…では
        足りないので、面積の倍率を 20 まで広げて ≒ 220、さらに比の分母を 8 まで
        広げて ≒ 300 通りにしてある（実測 dup_rate で確認する）。
        Lv4 = AD:BC の既約比(分母15まで≒70) × 高さ(12) ≒ 800 通り。
