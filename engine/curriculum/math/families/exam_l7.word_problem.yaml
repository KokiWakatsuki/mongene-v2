        - "一年生|二年生|通学にかかる時間|分|長い|5"
        - "男子|女子|一か月に読んだ本の冊数|冊|多い|2"
        - "バスケットボール部|サッカー部|一日の練習時間|時間|長い|1"
        - "東町の中学校の生徒|西町の中学校の生徒|ハンドボール投げの記録|メートル|大きい|4"
        - "去年の三年生|今年の三年生|英語のテストの得点|点|高い|10"
        - "東店|西店|一週間あたりの売り上げ個数|十個|多い|5"
        - "北市|南市|月ごとの最高気温|度|高い|4"
