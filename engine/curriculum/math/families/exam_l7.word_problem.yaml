family: math.exam_l7.word_problem
form: word_problem
source_desc: |
  データの活用（箱ひげ図・標本調査）— 文章題
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 誘導あり:データを読み四分位/推定の小問に沿って判断。
       example: ある中学校の1年生40人と2年生40人の通学時間を調べ、箱ひげ図に表した。
                (1)1年生の中央値を読み取れ。(2)四分位範囲が大きいのはどちらの学年か
                答えよ。(3)通学時間が20分以上の生徒が多いといえるのはどちらの学年か、
                箱ひげ図をもとに判断して答えよ。
  Lv4 desc: 誘導なし:複数データを比較し主張の妥当性を自分で構成。
       example: A組とB組の数学のテストの得点を箱ひげ図に表したところ、中央値はほぼ
                等しいが、A組の方が四分位範囲が大きかった。「A組の方が得点のばらつきが
                大きい」という主張が正しいといえるかどうか、箱ひげ図から読み取れる
                ことをもとに理由をつけて説明せよ。
  ---
  【Lv3 の段の作り】(1)「読む」→(2)「比べる」→(3)「判断する」と問いの質が上がる。
  (3) は中央値だけでは決まらず、第一四分位数・中央値・第三四分位数の三つがそろって
  上回るかどうかで決まる（既存 solver `math.judge_box_plot_trend_claim`）。
  中央値は必ず B が上になる構成にして「主張に一応の根拠がある」状態を作り、
  中央値だけを見て即断すると落ちるようにしてある。

  【Lv4 をどう採点可能にしたか】「理由をつけて説明せよ」は記述そのものを engine が
  採点できないので、**結論を選択（ChoiceAnswer）として答えさせ、根拠の組み立ては
  solution_steps が担う**——g2_l57.word_problem Lv4・g1_l58 の統計セルと同じ手。

  【Lv4 の眼目（新設 solver）】ばらつきの指標は四分位範囲と範囲の**二つ**ある。
  どちらでも A が大きければ主張は正しいといえるが、四分位範囲では A が大きいのに
  範囲では B が大きい場合は、指標の取り方で結論が変わるので「正しいとはいえない」。
  台帳 example の前提「中央値はほぼ等しい」は、中央値が**等しい**構成にして満たす
  （ばらつきだけが論点になる）。両方の結論が同じくらい出るよう構成で保証する
  ——片方に潰れると図を見ずに答えられてしまう。

  【level_sep】
    Lv3 = 誘導あり3小問。given は scenario だけ。op 列は読む／比べる／判断する。
    Lv4 = 誘導なし1小問。given に quantities（主張の前提）が加わる。op 列は
          read_iqr_both → read_range_both → check_measures_agree → judge_spread_claim。
    小問数・given・op 列がすべて相異する。

  【params】数値は本文に一切書かない（数はすべて図が与える＝生徒は箱ひげ図を読む）。
  したがって `numbers` は空で、契約側でも「本文に算用数字が1つでもあれば違反」として
  検査される（空にして数値を素通りさせる抜け道にはならない）。
concepts_default: [exam.box_plot_guided_three]
