family: math.g1_l10.knowledge
form: knowledge
source_desc: |
  自然数・整数の集合の用語（Lv1 想起）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 自然数・整数・数の集合の用語を想起する。
       example: 0 や負の整数を含めた、整数全体の集合を何とよぶか答えよ。
  【設計モデル・要検収(Q4)】「説明された数の集まりの名称を答える」単一選択に realize（用語想起
  term_recall_definition・domain=number_set）。concept で correct が変わる（natural_number＝自然数／
  integer＝整数）。distractors は同 domain の他の用語。具体例の正の整数 n を説明文に埋め込み
  surface として dup 分散。op 列[identify_description, name_concept]。答えはテキストの ChoiceAnswer
  ＝数字トークンを含まず G-Q5t 素通り（§7.7）。Lv2（四則が閉じているかの判別）は verify 型ソルバが
  未整備のため本コミットでは Lv1 のみ realize（残タスク）。図は無し。
concepts_default: [number_set.term_recall]
levels:
  "1":
    signature: number_set_term_recall
    recipe: math.term_recall
    params:
      domain: number_set
      concept_set: [natural_number, integer]
      # 具体例の数を広めにとり dup_rate を下げる（2 concept × surface 数で分散）。
      number_domain: {int_range: [1, 99]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [number_set.term_recall]
    cause_tags: []
remedial:
  default_level: 1
