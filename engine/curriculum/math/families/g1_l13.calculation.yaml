family: math.g1_l13.calculation
form: calculation
source_desc: |
  乗法の表し方のきまり（×を省く・数を前に・累乗）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: ×を省き数を前に等の規則で単項の積を表す1手順。
       example: y×x×(-4) を、乗法の表し方のきまりに従って表せ。
  Lv2 desc: 累乗・かっこ・複数文字を含む積を規則に従い簡潔に表す複数手順。
       example: a×a×a×b×(-2)×b を、乗法の表し方のきまりに従って簡潔に表せ。
  答えは簡約した単項式（自由変数を含む SymbolicAnswer）。独立ソルバ simplify_notation が与式
  （× を明示した未簡約の積）を sympy で正準化し、_fmt_monomial_display で「数を前・アルファベット順・
  累乗の上付き」の教材表記にする（double-solve）。Lv1（product_basic）は op 列[apply_product_rule]の
  1手、Lv2（product_powers）は同じ文字の積を累乗にまとめる[apply_product_rule, combine_powers]の
  2手＝level_sep。係数は |k|≥2（±1・0 除外）で必ず見える。文字は撹拌して未簡約の見た目にする。
  式答えの G-Q5t は display 全体一致でのみ検査され、与式は × を含み答えは含まないため部分文字列
  漏洩は構造上ない（recipe に _leaks 保険も）。図は無し。
concepts_default: [notation.product_rule_basic]
levels:
  "1":
    signature: notation_product_basic
    recipe: math.compute_notation
    params:
      # 数×文字×文字（相異なる2文字）。係数 |k|≥2。
      mode: product_basic
      coeff_domain: {int_range: [-9, 9], exclude: [-1, 0, 1]}
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_notation_product_v1}
    hints: [steps_prefix]
    concept_tags: [notation.product_rule_basic]
    cause_tags: []
  "2":
    signature: notation_product_powers
    recipe: math.compute_notation
    params:
      # 数×（相異なる2〜3文字・各指数1〜3で最低1つは累乗）。
      mode: product_powers
      coeff_domain: {int_range: [-9, 9], exclude: [-1, 0, 1]}
      letter_count_domain: [2, 3]
      exponent_domain: {int_range: [1, 3]}
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_notation_product_v1}
    hints: [steps_prefix]
    concept_tags: [notation.product_rule_powers]
    cause_tags: []
remedial:
  default_level: 1
