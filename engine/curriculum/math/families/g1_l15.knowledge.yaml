family: math.g1_l15.knowledge
form: knowledge
source_desc: |
  速さ・道のり・時間の関係（Lv1 規則想起）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 速さ=距離/時間・割合の関係を判別・想起する。
       example: 「速さ」「道のり」「時間」の3つの量の間に成り立つ関係を式で表せ。
  【設計モデル・要検収(Q4)】「求める量に応じた正しい関係式を選ぶ」単一選択に realize（規則想起
  recall_rule_statement・topic=speed_relation）。concept で correct が変わる（speed＝道のり÷時間／
  distance＝速さ×時間／time＝道のり÷速さ）。distractors は同 topic の紛らわしい変形（×÷＋の取り違え）。
  求める量以外の2量の具体的な場面（数値）を surface に埋め込み dup 分散（求める量そのものの数値は
  与えない）。op 列[read_rule_context, recall_correct_rule]。答えは関係式の文字表現で ASCII 数字
  トークンを含まず G-Q5t 素通り（§7.7）。word_problem（立式）は C14 で別途。図は無し。
concepts_default: [speed_relation.rule_recall]
levels:
  "1":
    signature: speed_relation_rule_recall
    recipe: math.recall_rule
    params:
      topic: speed_relation
      concept_set: [speed, distance, time]
      # 具体的な場面の数値（道のり・速さ・時間）を surface に埋め込み dup 分散する。
      number_domain: {int_range: [2, 60]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_rule_recall_v1}
    hints: [steps_prefix]
    concept_tags: [speed_relation.rule_recall]
    cause_tags: []
remedial:
  default_level: 1
