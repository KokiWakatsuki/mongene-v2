family: math.g1_l2.calculation
form: calculation
source_desc: |
  数直線と絶対値、数の大小関係
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 1数の絶対値を求める（1手順）。
       example: |-6| を求めよ。（本エンジンでは絶対値を1問として提示。大小比較は Lv2 の並べ替えで扱う）
  Lv2 desc: 分数小数を含む複数数を大小順に並べる複数手順。
       example: -1.5, -3/4, 0.2, -2 を小さい順に並べよ。
  Lv1 の答えは定数（絶対値・SymbolicAnswer）、Lv2 の答えは並べた順序（SymbolicAnswer・Tuple）。
  独立ソルバ evaluate_numeric_expression（絶対値）/ order_signed_numbers（並べ替え）で再計算。
  Lv1（0 からの距離を読む）/ Lv2（分数小数をそろえ数直線上で大小を比べて並べる）で op 列を変える
  ＝level_sep。定数・順序の答えは問題文の数値がすべて given 由来（whitelist）なので漏洩しない。
concepts_default: [signed_number.absolute_value]
levels:
  "1":
    signature: absolute_value
    recipe: math.compute_signed_arithmetic
    params:
      # |a|。a は整数・分数・小数（符号つき）。
      # **小数を軸に戻した**（教科書は -2.5 を出す）。以前は「答えが分数化して
      # 不自然」という理由で除いていたが、小数で与えたら小数で答えるようにしたので
      # その理由は消えた（D-26）。分数の定義域を教材の大きさに狭めたぶんを、
      # 小数の軸で取り戻す（FIXES.md の原則1）。
      mode: absolute_value
      value_kinds: [int, frac, dec]
      int_domain: {int_range: [-30, 30], exclude: [0]}
      # 中1の絶対値で与える数は小さく素直な数（教科書は -5, -2.5, -1/2）。
      # 分母15までだと「-17/13 の絶対値」になり、単元の狙いから外れる。
      frac_domain: {frac_range: {num: [-12, 12], den: [2, 8]}}
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_calc_abs_v1}
    hints: [steps_prefix]
    dup_rate_max: 0.30
    dup_rate_reason: >-
      中1の絶対値で扱う数は、教科書では小さく素直な数に限られる（-5, -2.5, -1/2 のあたり。整数は30まで、分数は分母8まで、小数は0.1刻みの終端小数）。整数・分数・小数の3つを合わせても180通りほどしかなく、既定の0.20を通すには「-17/13 の絶対値」のような、単元の狙い（0からの距離）から外れた数を作ることになる。数を現実に戻したうえで重複を仕様として宣言する。
    concept_tags: [signed_number.absolute_value]
    cause_tags: []
  "2":
    signature: order_numbers
    recipe: math.compute_signed_arithmetic
    params:
      # 相異する4数（整数・分数・小数の混在）を小さい／大きい順に並べる。
      mode: order_numbers
      count_domain: {int_set: [4]}
      number_kinds: [int, frac, dec, frac]
      int_domain: {int_range: [-9, 9], exclude: [0]}
      frac_domain: {frac_range: {num: [-9, 9], den: [2, 9]}}
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_calc_order_v1}
    hints: [steps_prefix]
    concept_tags: [signed_number.order_numbers]
    cause_tags: []
remedial:
  default_level: 1
