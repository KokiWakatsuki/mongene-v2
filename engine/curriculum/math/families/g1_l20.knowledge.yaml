family: math.g1_l20.knowledge
form: knowledge
source_desc: |
  以上・以下・未満・超に対応する不等号（Lv1 想起）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 4種の不等号と以上/以下/未満/超の意味を判別する。
       example: 「x は5以上である」を不等号を使って表すと x≧5 となる。では「x は5未満である」を
                不等号を使って表せ。
  【設計モデル・要検収(Q4)】「説明された大小の関係を表す不等号を選ぶ」単一選択に realize
  （記号想起型・用語想起 term_recall_definition の domain=inequality を流用）。concept で correct が
  変わる（at_least→≧・at_most→≦・less_than→<・greater_than→>）。distractors は同 domain の他の
  不等号。具体例の正の数 n を説明文に埋め込み surface として dup 分散。op 列[identify_description,
  name_concept]（narration は「不等号を思い出す」に domain 特化）。答えは記号テキストの ChoiceAnswer
  ＝数字トークンを含まず G-Q5t 素通り（§7.7）。図は無し。word_problem（立式）は C14 で別途。
concepts_default: [inequality.term_recall]
levels:
  "1":
    signature: inequality_symbol_recall
    recipe: math.term_recall
    params:
      domain: inequality
      concept_set: [at_least, at_most, less_than, greater_than]
      # 具体例の数を広めにとり dup_rate を下げる（4 concept × surface 数で分散）。
      number_domain: {int_range: [1, 99]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_inequality_symbol_v1}
    hints: [steps_prefix]
    concept_tags: [inequality.term_recall]
    cause_tags: []
remedial:
  default_level: 1
