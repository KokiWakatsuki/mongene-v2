family: math.g1_l24.word_problem
form: word_problem
source_desc: |
  比例式とその解き方の利用＝実場面を比例式にして解く
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 対応する量の比から比例式を立て解く(誘導あり)。
       example: 鉛筆3本の値段が120円のとき、同じ鉛筆7本の値段を、比例式を立てて求めよ。
  Lv3 desc: 連比・複数の比が絡む場面を自分で立式する(誘導ゆるい)。
       example: 赤・青・白の玉の個数の比が 2:3:5 で、全部で60個ある。青の玉の個数を求めよ。
  ---
  recipe は共通の math.word_problem_linear_equation（scenario_kind で場面を選ぶ）。
  g1_l24.calculation と同じ「**表示（a:b = c:x）と solver に渡す式（たすきがけ後の
  線形式）が別物**」の型で、solver は既存の math.solve_linear_equation
  （mode=cross_multiply）＝新 solver ゼロ。
  【level_sep】Lv2 は本文の2量をそのまま比に並べるだけ（誘導あり2小問）。Lv3 は
  比例式に並べる「全体がいくつ分か」（連比の各項の和）が**本文に無く自分でたす**ので、
  立式の手数が1つ増える（prelude_step=sum_ratio_parts）。誘導なし1小問。
  小問数・立式の手数・比に並べる量の出どころがすべて違う＝G6 の構造差。
  【answer-first】Lv2 は単価 u を先に引き p = u·a と答え x = u·b を逆算（割り切れない
  比例式が出ない）。Lv3 は 1つ分の個数 k を先に引き N = k·(r1+r2+r3)、x = k·r2。
  どちらも**答えが本文の数値と一致する組を候補列挙の時点で除く**（定数答えセルの定石。
  given 数値は両符号 whitelist なので G-Q5t では捕まらない＝構成側で自衛する）。
  【検証】G-Q1 が全小問 double-solve。checker は params の「場面文に出ている数値」だけ
  から立式し直し・解き直す（答えは params に入れない）。
concepts_default: [equation.word_problem_proportion_pair]
levels:
  "2":
    signature: word_problem_proportion_pair
    recipe: math.word_problem_linear_equation
    params:
      scenario_kind: proportion_pair
      guided: true
      # (単価, 分かっている個数, 問われている個数) の組は recipe が列挙する。
      unit_price_candidates: [20, 25, 30, 35, 40, 45, 50, 60, 70, 75, 80, 90,
                              110, 120, 130, 140, 150]
      count_candidates: [2, 3, 4, 5, 6, 7, 8, 9, 10, 12]
      item_candidates: [鉛筆|本, ノート|冊, 消しゴム|個, クリップ|個, 画用紙|枚,
                        シール|枚, ボールペン|本, 色紙|枚, 定規|本, ふせん|枚]
    given: [scenario, quantities]
    asked: [formulation, value]
    visual: none
    text: {tier: T1, template: wp_linear_guided_v1}
    hints: [steps_prefix]
    concept_tags: [equation.word_problem_proportion_pair]
    cause_tags: []
  "3":
    signature: word_problem_continued_ratio
    recipe: math.word_problem_linear_equation
    params:
      scenario_kind: continued_ratio
      guided: false
      # (連比3項, 1つ分の個数) の組は recipe が列挙する（全体が範囲内・答えが本文の
      # 数値と衝突しない組だけ）。
      ratio_candidates: [1, 2, 3, 4, 5, 6, 7, 8]
      unit_candidates: [3, 4, 5, 6, 7, 8, 9, 12, 15, 20]
      total_range: [40, 300]
      object_candidates: [玉|個, ビーズ|個, おはじき|個, カード|枚, 折り紙|枚,
                          リボン|本, シール|枚]
      # 並び順を変えることで「問われる色（2番め）」も動く。
      label_triple_candidates: [赤|青|白, 白|赤|青, 青|白|赤, 赤|白|青,
                                青|赤|白, 白|青|赤, 黄|緑|青, 緑|青|黄]
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [equation.word_problem_continued_ratio]
    cause_tags: []
remedial:
  default_level: 2
