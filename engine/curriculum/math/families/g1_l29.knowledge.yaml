family: math.g1_l29.knowledge
form: knowledge
source_desc: |
  比例の意味と式（y=ax）（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 比例・比例定数・y=axの用語と意味を想起する。
       example: 「yはxに比例する」とはどういうことか説明し、y=axのaを何というか、その名称を答えよ。
  【設計モデル・Lv1】用語想起（term_recall_definition・domain=direct_proportion・
  proportion/proportionality_constant）。具体例 y=ax を説明文に埋め込み surface 分散。
  答えは漢字 ChoiceAnswer で digit-free。
  Lv2 desc: 表や関係が比例か判別する・比例定数の意味を適用する。
       example: 次の表はxとyの対応を表している。x=1,2,3,4に対しy=6,12,18,24である。yはxに
                比例するといえるか判別し、いえる場合は比例定数の値を答えよ。
  【設計モデル・Lv2】新規 recipe math.judge_direct_proportion_table。answer-first で
  is_proportional を決め、真なら比例定数から表を作り、偽なら1箇所の y を商がずれるように
  改変する。独立ソルバが x,y の数値列だけから商 y/x の一定性で再判定する（double-solve）。
  答えは「比例するといえる」／「比例するとはいえない」の ChoiceAnswer（digit-free・鉄則①。
  比例定数の値を求めるのは calculation セルの領域のためここでは問わない）。
concepts_default: [direct_proportion.term_recall]
levels:
  "1":
    signature: direct_proportion_term_recall
    recipe: math.term_recall
    params:
      domain: direct_proportion
      concept_set: [proportion, proportionality_constant]
      number_domain: {int_range: [2, 250]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [direct_proportion.term_recall]
    cause_tags: []
  "2":
    signature: judge_direct_proportion_table
    recipe: math.judge_direct_proportion_table
    params:
      # 比例定数 a(≠0)・4つの相異なる非0の x。偽の場合の摂動量 perturb_domain(≠0)。
      slope_domain: {int_range: [2, 9]}
      x_domain: {int_range: [-9, 9], exclude: [0]}
      perturb_domain: {int_range: [1, 5]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: prop_judge_direct_table_v1}
    hints: [steps_prefix]
    concept_tags: [direct_proportion.judge_table]
    cause_tags: []
remedial:
  default_level: 1
