family: math.g1_l30.graph_table
form: graph_table
source_desc: |
  座標の概念と点のとり方（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 座標平面上の点の座標を読む/座標から点をとる1動作。
       example: 座標平面上に点Aがある。点Aのx座標は3、y座標は-2である。点Aの座標を(  ,  )の形で答えよ。
  Lv2 desc: 対称点・図形の頂点など複数の点を条件から座標平面に配置する。
       example: 座標平面上に、点A(2, 3)、原点について点Aと対称な点B、x軸について点Aと対称な点Cを
                とりたい。B、Cの座標をそれぞれ答え、3点を座標平面上に示せ。
  【設計モデル】どちらも問題図は**空の方眼**（答えの点を図に先出ししない＝§6.4
  labeled_answer_point を宣言しない）。生徒は方眼に点をとりながら座標を確かめる。
  Lv1 は座標を読む2手順＋書き出し（read_x_coordinate/read_y_coordinate/write_coordinate）、
  Lv2 は対称移動2手順＋書き出し（reflect_about_origin/reflect_about_x_axis/
  write_reflected_coordinates）で op 列が相異＝level_sep。
concepts_default: [coordinate_plane.read_point_coordinate]
levels:
  "1":
    signature: read_coordinate_from_components
    recipe: math.read_coordinate_on_plane
    params:
      # 組合せは (x0, y0) の2軸のみ。18*18 = 324 通り（実測 dup_rate は check_cell で確認）。
      x_domain: {int_range: [-9, 9], exclude: [0]}
      y_domain: {int_range: [-9, 9], exclude: [0]}
    given: [situation_params]
    asked: [read_point]
    visual: required
    text: {tier: T1, template: propg_read_coordinate_v1, visual_builder: math.linear_graph}
    hints: [steps_prefix]
    concept_tags: [coordinate_plane.read_point_coordinate]
    cause_tags: []
  "2":
    signature: reflect_point_origin_and_x_axis
    recipe: math.reflect_point_on_plane
    params:
      # 組合せは (x0, y0) の2軸のみ。18*18 = 324 通り。
      x_domain: {int_range: [-9, 9], exclude: [0]}
      y_domain: {int_range: [-9, 9], exclude: [0]}
    given: [situation_params]
    asked: [read_point]
    visual: required
    text: {tier: T1, template: propg_reflect_point_v1, visual_builder: math.linear_graph}
    hints: [steps_prefix]
    concept_tags: [coordinate_plane.reflect_point]
    cause_tags: []
remedial:
  default_level: 1
