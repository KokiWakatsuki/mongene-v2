family: math.g1_l40.graph_table
form: graph_table
source_desc: |
  対称移動した図形を読む/対称の軸を指定して折り返してかく
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 対称移動した図形を読む/対称の軸を指定して折り返してかく。
       example: 方眼上に四角形ABCDと直線ℓがかかれている。この四角形を、直線ℓを
                対称の軸として対称移動(折り返し)した図形をかけ。
       【簡略化】四角形ABCDではなく三角形ABCを対象にする（対称移動の技能自体は
       頂点数に依らないため。他の l38/l39/l40 セルとも実装を共通化できる）。
  Lv2 desc: 座標軸などを軸に複数点を正確に対称移動して示す。
       example: 座標平面上に三角形があり、頂点はA(1,2)、B(4,3)、C(2,5)である。
                この三角形をy軸について対称移動したとき、移動後の3頂点の座標を
                それぞれ答え、図示せよ。
  【設計モデル】新設 solver math.reflect_polygon_features（頂点座標・対称の軸
  (x軸/y軸のみ)だけから移動後の座標を再計算・GraphAnswer）。Lv1 は軸に平行でない
  直線ℓではなく x軸/y軸 のどちらかを内部的に採用し、方眼上には数値ラベルなしの
  太線として示す（軸の名前は生徒には見せない＝「直線ℓ」とだけ説明する）。Lv1/Lv2
  は同じ solver を再利用するため、given のキー名を polygon_points(Lv1)／
  polygon_coordinates(Lv2) と分けて level_sep(G-FP)を担保する。
concepts_default: [polygon_transform.reflect]
levels:
  "1":
    signature: reflect_polygon_grid
    recipe: math.reflect_polygon_grid
    params:
      coord_domain: {int_range: [-6, 6]}
      axis_domain: [x_axis, y_axis]
    given: [polygon_points, move_spec]
    asked: [draw_transformed_polygon]
    visual: required
    text: {tier: T1, template: lf_polygon_transform_grid_v1, visual_builder: math.polygon_grid_only}
    hints: [steps_prefix]
    concept_tags: [polygon_transform.reflect]
    cause_tags: []
  "2":
    signature: reflect_polygon_coordinate
    recipe: math.reflect_polygon_coordinate
    params:
      coord_domain: {int_range: [-6, 6]}
      axis_domain: [x_axis, y_axis]
    given: [polygon_coordinates, move_spec]
    asked: [draw_transformed_polygon]
    visual: required
    text: {tier: T1, template: lf_polygon_transform_coordinate_v1, visual_builder: math.polygon_coordinate}
    hints: [steps_prefix]
    concept_tags: [polygon_transform.reflect]
    cause_tags: []
remedial:
  default_level: 1
