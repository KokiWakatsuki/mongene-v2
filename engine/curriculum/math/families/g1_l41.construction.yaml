family: math.g1_l41.construction
form: construction
source_desc: |
  垂直二等分線の作図（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 線分の垂直二等分線を基本手順で作図する。
       example: 下の線分ABが与えられている。定規とコンパスだけを使って、線分ABの
                垂直二等分線を作図せよ。作図に用いた線は消さずに残すこと。
  Lv2 desc: 2点から等距離の点・線分の中点など性質を使った作図に正確に適用する。
       example: 2点A、Bが与えられている。2点A、Bから等しい距離にあり、かつ直線ℓ上に
                ある点Pを、作図によって求めよ。作図に用いた線は残すこと。
  【この form の型】問題文は「与えられた図」＋「何を作図するか」＋「作図に用いた線は
  残すこと」で固定されている。動くのは図（線分の向き・長さ・記号名・点や直線の位置）。
  問題図は与えられたものだけを描き、コンパスの弧と作図線が入った模範解答図は
  GraphAnswer.solution_svg_ref に入れて開示制御の対象にする。
  【level_sep】Lv1 は基本作図そのもの（弧・弧・直線の3手）。Lv2 はそこへ「ひいた
  垂直二等分線と直線ℓの交点をとる」「その点が条件を満たすと確かめる」が積み増され、
  steps の op 列が相異する（5手）。与えられる図も Lv1=線分、Lv2=2点＋直線ℓで違う。
  【検証】answer は GraphAnswer。①recipe は「中点を通り線分に垂直」「2点から等距離
  かつℓ上」という条件そのものを満たすかを確かめ、②G-Q1 が params（点と直線の座標）
  だけから独立ソルバ（math.perpendicular_bisector_of_segment /
  math.equidistant_point_on_line）で作図し直して features を突き合わせる。
  座標はすべて有理数に閉じるように構成しているので、一致は厳密に判定できる。
concepts_default: [construction.perpendicular_bisector_basic]
levels:
  "1":
    signature: construct_perpendicular_bisector_basic
    recipe: math.construct_perpendicular_bisector
    params:
      # 線分の向きベクトル（長さ len_min..len_max の格子ベクトル）× 端点の記号 5 通り。
      # 制約後の総数は約 1600 通り（向きが図の見た目を決めるので、長さと向きの両方を動かす）。
      len_min: 6
      len_max: 12
    given: [construction_conditions]
    asked: [construction_steps]
    visual: required
    text:
      tier: T1
      template: cs_perpendicular_bisector_v1
      visual_builder: math.construction_figure
    hints: [steps_prefix]
    concept_tags: [construction.perpendicular_bisector_basic]
    cause_tags: []
  "2":
    signature: construct_equidistant_point_on_line
    recipe: math.construct_equidistant_point_on_line
    params:
      # (直線ℓの向き 6 通り, 点A, ABベクトル, 記号 3 通り) を全列挙して index を1回引く。
      # 妥当条件: 2点がℓから離れている（距離^2 の 4 倍が offset_min_sq4 以上）／
      # 垂直二等分線がℓと平行でない／交点Pが point_max の枠に収まる。
      box: 8
      offset_min_sq4: 9
      len_min: 5
      len_max: 9
      point_max: 11
    given: [construction_conditions]
    asked: [construction_steps]
    visual: required
    text:
      tier: T1
      template: cs_equidistant_point_on_line_v1
      visual_builder: math.construction_figure
    hints: [steps_prefix]
    concept_tags: [construction.equidistant_point_on_line]
    cause_tags: []
remedial:
  default_level: 1
