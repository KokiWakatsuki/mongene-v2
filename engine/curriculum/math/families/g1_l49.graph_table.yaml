family: math.g1_l49.graph_table
form: graph_table
source_desc: |
  面が動いてできる立体、回転体（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 平面図形を回転/平行移動してできる立体を読む・選ぶ。
       example: 長方形を、その1辺を軸として1回転させてできる立体を、次から選べ。
                ア 円柱 イ 円錐 ウ 球 エ 三角柱。
  Lv2 desc: 回転軸を指定して回転体の見取図をかく。
       example: 直角三角形ABC(∠B=90°、AB=4cm、BC=3cm)を、辺ABを回転の軸として1回転
                させてできる立体の見取図をかき、底面の半径と高さを図中に書き入れよ。
  Lv3 desc: 回転体の断面や見取図を条件から構成して示す。
       example: 直角三角形を、直角をはさむ2辺のうち1辺を軸として回転させると円錐が
                できる。この円錐を、回転の軸を含む平面で切ったときの切り口(断面)は
                どんな図形になるか、その図をかいて示せ。
  ---
  【設計モデル】数学は独立ソルバ solvers/solid_view.py、図は visuals/solid.py
  （`math.solid`）に委ねる。recipe は「どの平面図形をどの辺のまわりに回すか」を
  構成し、問題図と模範解答図の描画パラメータを組むだけ。

  【問題図と模範解答図が別のビューであること】問題図は view="rotation_source"
  （回転させる平面図形＋回転の軸の一点鎖線）で、これは**答えではない**ので常に描く。
  模範解答図は view="sketch"（見取図）/ "section"（断面）で recipe から
  render_solid_solution_svg を直接呼ぶ。visual_plan の element は
  "rotation_source" にしてある——"solid" は frame の _FORBIDDEN_BY_ASKED で
  禁じられており、答えの図を問題図に出さないための仕掛け。

  【frame の拡張】graph_table の asked に `read_solid`（立体を読む・選ぶ）と
  `draw_solid`（見取図・投影図・展開図・断面をかく）を足した。既存の語彙
  （draw_graph/read_point…）はすべて座標平面のグラフを指しており、立体には使えない。

  【level_sep】
    Lv1 = 2手（回転の軸を確かめる → できる立体を答える）。asked=read_solid・
          答えは ChoiceAnswer。元の図形は長方形/直角三角形/半円の3種。
    Lv2 = 3手（軸 → 底面の半径と高さを決める → 見取図をかく）。asked=draw_solid・
          答えは GraphAnswer（立体名・半径・高さ）。
    Lv3 = 3手（切る平面 → 切り口の形を決める → かく）。asked=draw_solid・
          答えは GraphAnswer（切り口の形・横・縦）。
    問う行為・答えの型・op 列がすべて相異する。

  【Lv2/Lv3 で半円を使わない理由】球には「高さ」が無く、切り口も多角形にならない
  ので、Lv2 の「底面の半径と高さを書き入れよ」・Lv3 の「切り口の図をかけ」が
  成り立たない。Lv1（名前を答える）だけ半円を含める。

  【dup（数え上げ）】図形の種類 × 軸にする辺 × もう一方の辺 × 頂点名。
  Lv1 は 3×14×14=588 通り、Lv2/Lv3 は 2×14×14=392 通り（いずれも閾の250超）。
  頂点名は params に残すので dup に効く。

  【退化の封じ方】2辺を相異にする。等しいと「底面の半径と高さが同じ」になり、
  どちらがどちらから決まるかを問えない（Lv2 の要点が消える）。
  Lv3 の切り口の横は**半径の2倍**（軸の両側に現れる）で、ここを半径のままにするのが
  この単元の典型的な誤り。solver が 2r を返すことを property テストで固定する。
