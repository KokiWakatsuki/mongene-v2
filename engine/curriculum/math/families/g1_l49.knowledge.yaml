family: math.g1_l49.knowledge
form: knowledge
source_desc: |
  面が動いてできる立体、回転体（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 回転体・回転の軸・母線の意味を判別する。
       example: 円錐や円柱のように、1つの平面図形を直線を軸として1回転させてできる立体を
                何というか答えよ。また、そのとき軸となる直線を何というか答えよ。
  【設計モデル・Lv1】用語想起ハブ（既存 math.term_recall・_TERM_MAPS の domain
  "rotation_solid_terms"＝回転体/回転の軸/母線）。説明文には回転させる図形の寸法・
  軸となる直線名・円錐の頂点と円周上の点名を埋め込み surface を分散する。
  答えは漢字のみの ChoiceAnswer＝digit-free（G-Q5t 素通り）。
  組合せ数: 回転体・回転の軸 = たて 29 × よこ 29 × 直線名 12 = 10,092 通りずつ、
  母線 = 半径 29 × 高さ 29 × 点名の順列 16×15 = 201,840 通り。
  本ユニットの graph_table（見取図をかく・断面を構成する）は本 family の対象外
  （knowledge form のみをここで realize する）。図は knowledge frame が visual=none。
