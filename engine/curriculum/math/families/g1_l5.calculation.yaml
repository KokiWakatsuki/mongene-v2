family: math.g1_l5.calculation
form: calculation
source_desc: |
  正の数・負の数の加法と減法の混じった計算（項の概念）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: かっこを外し項を並べて加減する（1〜2手順）。
       example: (-6)+4-(-2) を計算せよ。
  Lv2 desc: 分数小数・多数項の加減混合を正負の項の和で処理する複数手順。
       example: -3/4+1.5-(-1/2)-0.25 を計算せよ。
  答えは定数（整数または既約分数・SymbolicAnswer）。独立ソルバ
  evaluate_numeric_expression（sympy で厳密評価）で再計算。Lv1（かっこを外し正負の項を
  符号ごとにまとめる）/ Lv2（分数・小数をそろえてから加減する）で op 列を変える＝level_sep。
  定数答えの G-Q5t は問題文の数値がすべて given 由来（whitelist）なので漏洩しない。
concepts_default: [signed_number.add_sub_terms_basic]
levels:
  "1":
    signature: add_sub_terms
    recipe: math.compute_signed_arithmetic
    params:
      # 3項の加減混合（整数）。各項間の演算子は + / -。結果 0 は再抽選で回避。
      mode: add_sub_terms
      term_kinds: [int, int, int]
      int_domain: {int_range: [-9, 9], exclude: [0]}
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_calc_evaluate_v1}
    hints: [steps_prefix]
    concept_tags: [signed_number.add_sub_terms_basic]
    cause_tags: []
  "2":
    signature: add_sub_terms_rational
    recipe: math.compute_signed_arithmetic
    params:
      # 4項の加減混合（分数・小数・整数の混在）。各項間の演算子は + / -。
      mode: add_sub_terms_rational
      term_kinds: [frac, dec, frac, dec]
      int_domain: {int_range: [-9, 9], exclude: [0]}
      frac_domain: {frac_range: {num: [-9, 9], den: [2, 9]}}
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_calc_evaluate_v1}
    hints: [steps_prefix]
    concept_tags: [signed_number.add_sub_terms_rational]
    cause_tags: []
remedial:
  default_level: 1
