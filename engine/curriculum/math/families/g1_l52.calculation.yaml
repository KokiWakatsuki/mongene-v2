family: math.g1_l52.calculation
form: calculation
source_desc: |
  円柱の体積の公式 V=πr²h に数値を代入して計算する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 体積公式に数値を代入して計算する。
       example: 半径3cm、高さ5cmの円柱の体積を公式 V=πr²h に代入して求めよ(πは
                そのまま)。
  【設計モデル】math.solid_cylinder_volume_substitution（mode=
  l52_cylinder_volume_substitution・solvers/solid_figure.py の共通ソルバ
  math.solid_figure_measure に委譲）。この cell は「公式が既に与えられていて、
  数値を代入して計算するだけ」の純代入（2手: 代入する→計算する）。同じ立体の体積を
  問う g1_l52.find_value Lv1 は「公式は自分で想起し、底面が正方形/長方形の角柱・角錐
  から立体の条件を読み取って求める」役割で、given の型（本セルは expression＝公式ごと
  与える／find_value は condition＝立体の条件のみ）と op 列（本セルは
  substitute_into_volume_formula/evaluate_volume_expression／find_value は
  compute_base_area/apply_volume_formula）の両方を分けて重複を避ける。円柱のみを
  対象にし find_value 側（角柱・角錐）と題材も分離する。
concepts_default: [solid_volume.cylinder_substitution]
levels:
  "1":
    signature: solid_cylinder_volume_substitution
    recipe: math.solid_cylinder_volume_substitution
    params:
      # [2,10]×[2,15]=126通りでは dup=0.30 で閾超過（100seed 実測）。
      # [2,16]×[2,24]=345通りに広げて dup=0.13。
      radius_domain: {int_range: [2, 16]}
      height_domain: {int_range: [2, 24]}
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_solid_cylinder_volume_substitution_v1}
    hints: [steps_prefix]
    concept_tags: [solid_volume.cylinder_substitution]
    cause_tags: []
remedial:
  default_level: 1
