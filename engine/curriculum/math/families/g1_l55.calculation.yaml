family: math.g1_l55.calculation
form: calculation
source_desc: |
  度数÷総度数で相対度数を求める1手順／総度数の異なる集団の相対度数を求め比較のため
  そろえる複数手順（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 度数÷総度数で相対度数を求める1手順。
       example: 40人のうち、ある階級の度数が10人であった。この階級の相対度数を求めよ。
  Lv2 desc: 総度数の異なる集団の相対度数を求め比較のためそろえる複数手順。
       example: A中学は生徒50人、B中学は生徒80人で通学時間を調べた。20分以上25分未満の
                階級の度数がAは12人、Bは20人であった。それぞれの相対度数を求め、この
                階級の割合が大きいのはどちらの中学か答えよ。
  【設計モデル】Lv1=既存 solver math.relative_frequency（probability.py）を再利用する
  新設 recipe math.relative_frequency_stats_single。Lv2=新設 solver
  math.compare_relative_frequency（2集団それぞれの相対度数を求め比較）。op列
  （Lv1: compute_relative_frequency のみ、Lv2: compute_relative_frequency_each→
  compare_relative_frequency の2段）が相異＝level_sep。
concepts_default: [relative_frequency.compute_single]
