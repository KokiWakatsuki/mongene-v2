family: math.g1_l6.calculation
form: calculation
source_desc: |
  正の数・負の数の乗法を計算する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 2数の乗法（符号を決定する）を1手順で計算する。
       example: (-4)×(-7) を計算せよ。
  Lv2 desc: 3数以上・分数小数を含む乗法で符号を判定する複数手順。
       example: (-2/3)×(-6)×(-0.5) を計算せよ。
  答えは定数（整数または既約分数・SymbolicAnswer）。独立ソルバ
  evaluate_numeric_expression（sympy で厳密評価）で再計算。Lv1（積の符号を決めて絶対値をかける）/
  Lv2（負の数の個数で符号を決めて全部かける）で op 列を変える＝level_sep。
  定数答えの G-Q5t は問題文の数値がすべて given 由来（whitelist）なので漏洩しない。
concepts_default: [signed_number.multiply_pair]
levels:
  "1":
    signature: multiplication_pair
    recipe: math.compute_signed_arithmetic
    params:
      # 2数の乗法（整数）。|n|≥2 中心・範囲広めで dup を下げる。
      mode: multiplication_pair
      int_domain: {int_range: [-12, 12], exclude: [-1, 0, 1]}
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_calc_evaluate_v1}
    hints: [steps_prefix]
    concept_tags: [signed_number.multiply_pair]
    cause_tags: []
  "2":
    signature: multiplication_chain
    recipe: math.compute_signed_arithmetic
    params:
      # 3数の乗法（整数・分数・小数の混在）。
      mode: multiplication_chain
      term_kinds: [frac, int, dec]
      int_domain: {int_range: [-9, 9], exclude: [-1, 0, 1]}
      frac_domain: {frac_range: {num: [-9, 9], den: [2, 9]}}
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_calc_evaluate_v1}
    hints: [steps_prefix]
    concept_tags: [signed_number.multiply_chain]
    cause_tags: []
remedial:
  default_level: 1
