family: math.g1_l6.knowledge
form: knowledge
source_desc: |
  負の数の個数で積の符号が決まる規則（Lv1 規則想起）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 負の数の個数で積の符号が決まる規則を判別する。
       example: いくつかの数の積で、負の数が偶数個のとき積の符号はどうなるか答えよ。
  【設計モデル・要検収(Q4)】「積の符号が決まるきまりの正しい記述を選ぶ」単一選択に realize
  （規則想起 recall_rule_statement・topic=product_sign）。concept で correct が変わる
  （even_count＝正／odd_count＝負）。distractors は同 topic のもっともらしい誤り。負の数を偶数個／
  奇数個ふくむ積の具体例を surface に埋め込み dup 分散。op 列[read_rule_context, recall_correct_rule]。
  答えは規則の文で ASCII 数字トークンを含まず G-Q5t 素通り（§7.7）。図は無し。
concepts_default: [product_sign.rule_recall]
levels:
  "1":
    signature: product_sign_rule_recall
    recipe: math.recall_rule
    params:
      topic: product_sign
      concept_set: [even_count, odd_count]
      # 具体例の積の因数の大きさを surface に埋め込み dup 分散する。
      number_domain: {int_range: [2, 40]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_rule_recall_v1}
    hints: [steps_prefix]
    concept_tags: [product_sign.rule_recall]
    cause_tags: []
