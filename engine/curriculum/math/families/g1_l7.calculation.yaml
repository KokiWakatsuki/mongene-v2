family: math.g1_l7.calculation
form: calculation
source_desc: |
  正の数・負の数の累乗（指数）を計算する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 正負の数の累乗を計算する（1手順）。
       example: (-3)² を計算せよ。
  Lv2 desc: (-a)^n と -a^n の違い・かっこと指数の作用範囲を区別して計算する複数手順。
       example: -2² と (-2)² をそれぞれ計算せよ。（本エンジンでは1式ずつ・かっこの有無で作用範囲が変わる形を提示）
  答えは定数（整数または既約分数・SymbolicAnswer）。独立ソルバ evaluate_numeric_expression
  （sympy で厳密評価）で再計算。Lv1（累乗を積に直して符号つきで計算）/ Lv2（指数のかかる範囲＝
  かっこの有無を見分けてから計算・整数底は -a^n 形も出す）で op 列を変える＝level_sep。底は
  整数・分数・小数の3種を surface として dup を分散。上付き指数は extract_numbers 非抽出。
  定数答えの G-Q5t は問題文の数値がすべて given 由来（whitelist）なので漏洩しない。
concepts_default: [signed_number.power_single]
levels:
  "1":
    signature: power_single
    recipe: math.compute_signed_arithmetic
    params:
      # 底は負の整数・分数（正負の累乗）、指数 2〜3。底の種類・分数で dup を分散。
      mode: power_single
      base_kinds: [int, frac, frac, frac, dec]
      int_domain: {int_range: [-15, -2]}
      frac_domain: {frac_range: {num: [-15, 15], den: [2, 12]}}
      exponent_domain: {int_set: [2, 3]}
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_calc_evaluate_v1}
    hints: [steps_prefix]
    concept_tags: [signed_number.power_single]
    cause_tags: []
  "2":
    signature: power_sign_contrast
    recipe: math.compute_signed_arithmetic
    params:
      # 整数底は (-a)^n / -a^n を出し分け（指数の作用範囲）、分数底はかっこつきで dup 分散。
      mode: power_sign_contrast
      base_kinds: [int, frac, frac]
      int_domain: {int_range: [2, 20]}
      frac_domain: {frac_range: {num: [-15, 15], den: [2, 12]}}
      exponent_domain: {int_set: [2, 3]}
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_calc_evaluate_v1}
    hints: [steps_prefix]
    concept_tags: [signed_number.power_sign_contrast]
    cause_tags: []
remedial:
  default_level: 1
