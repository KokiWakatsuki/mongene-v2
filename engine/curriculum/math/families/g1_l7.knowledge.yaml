family: math.g1_l7.knowledge
form: knowledge
source_desc: |
  指数・底・累乗の用語（Lv1 想起）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 指数・底・累乗の用語と意味を想起する。
       example: 2 を3回かけ合わせた 2³ で、右上の小さな 3 の部分を何とよぶか答えよ。
  【設計モデル・要検収(Q4)】「説明された対象の名称を答える」単一選択に realize（用語想起
  term_recall_definition・domain=power）。concept で correct が変わる（exponent＝指数／base＝底／
  power＝累乗）。distractors は同 domain の他の用語。具体例の累乗（底 b・指数 e）を説明文に埋め込み
  surface として dup 分散。op 列[identify_description, name_concept]。答えはテキストの ChoiceAnswer
  ＝数字トークンを含まず G-Q5t 素通り（§7.7）。図は無し。
concepts_default: [power.term_recall]
levels:
  "1":
    signature: power_term_recall
    recipe: math.term_recall
    params:
      domain: power
      concept_set: [exponent, base, power]
      # 具体例の底・指数を広めにとり dup を下げる（3 concept × surface で分散）。
      base_domain: {int_range: [2, 50]}
      exponent_domain: {int_set: [2, 3, 4, 5]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [power.term_recall]
    cause_tags: []
remedial:
  default_level: 1
