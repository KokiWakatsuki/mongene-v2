family: math.g2_l14.calculation
form: calculation
source_desc: |
  いろいろな連立方程式（前処理を伴う）を解く（units.generated.yaml の desc/example を正として転記）。
  Lv2: かっこを展開して整数係数に直してから解く。
       example: 次の連立方程式を解け。 { 3(x − 2) + y = 5, 2x − (y − 1) = 8 }
  Lv3: 小数・分数を払って整数化する前処理を伴う連立。
       example: 次の連立方程式を解け。 { 0.2x + 0.3y = 1.3, (x/2) − (y/3) = 1 }
  答えは解 (x, y)（SymbolicAnswer）。検証は前処理後の整数系に対し g2_l11/l12/l27 と同じ
  intersection_of_two_lines（交点＝連立解）を再利用（新 solver ゼロ＝連立クラスタへの償却横展開）。
  レベル間は前処理 op で構造を変える（Lv2=expand_parentheses／Lv3=clear_denominators）。
  【設計モデル・要検収(Q4)】Lv3 は当面「分数を払う（通分して整数化）」の変種で realize する
  （小数の払いは同一スキル ×10 で、忠実な formatting を要するため後続で追加可能）。preview で検収する。
  図は無し（calculation）。
concepts_default: [simultaneous_equations.solve_with_preprocessing]
levels:
  "2":
    signature: solve_system_expand_parens
    recipe: math.solve_system_preprocessed
    params:
      # eq_a=k(x+s)+m·y=r（k∈{2,3}）、eq_b=a·x−(y+t)=u。展開後は整数系 (k,m,·),(a,−1,·)。
      # |m|,|a|∈{2,3} で |a·m|≥4 > k≤3 → det=−k−a·m≠0 が恒真（非平行）。
      mode: expand_parens
      x_domain: {int_range: [-5, 5]}
      y_domain: {int_range: [-5, 5]}
      sign_domain: {int_set: [-1, 1]}
      outer_coeff_domain: {int_set: [2, 3]}
      offset_domain: {int_set: [-3, -2, -1, 1, 2, 3]}
      mag_domain: {int_set: [2, 3]}
    given: [equation_a, equation_b]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_solve_system_various_v1}
    hints: [steps_prefix]
    concept_tags: [simultaneous_equations.solve_with_preprocessing]
    cause_tags: []
  "3":
    signature: solve_system_clear_fractions
    recipe: math.solve_system_preprocessed
    params:
      # 非退化な整数系（|A1|=3,|A2|=2,|B1|=2,|B2|=3・|A1·B2|=9>|A2·B1|=4 で det≠0 恒真）を作り、
      # 各式を da,db（∈{2,3}）で割った分数係数の見かけで提示する。分母を払うと元の整数系に戻る。
      mode: clear_fractions
      x_domain: {int_range: [-5, 5]}
      y_domain: {int_range: [-5, 5]}
      sign_domain: {int_set: [-1, 1]}
      denom_domain: {int_set: [2, 3]}
    given: [equation_a, equation_b]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_solve_system_various_v1}
    hints: [steps_prefix]
    concept_tags: [simultaneous_equations.solve_with_preprocessing]
    cause_tags: []
remedial:
  default_level: 2
