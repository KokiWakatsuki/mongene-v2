source_desc: |
  変化の割合の意味の想起（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 変化の割合が常に一定で a に等しいことを理解する。
       example: 1次関数 y=ax+b の変化の割合について、正しく説明しているものを次から選び、その
                理由を答えよ。「変化の割合は x の値によって変わる」「変化の割合はつねに a に等しい」
  【設計モデル】原題の「正しい説明を選ぶ」を単一選択（ChoiceAnswer）で realize。正しい説明
  （つねに一定で傾きに等しい）が常に正解＝答え固定型（verify にはならないが、変化の割合の性質の
  理解を問う C5 完成に必要なセル）。Q1 は「1次関数の変化の割合は一定」という規則の想起＝V2。
  無限性(F-3)は具体式 y=ax+b の見かけ a,b（答えに無関係な surface param）で満たす。選択肢の
  「a」は表記を避け「傾き」と述べ、具体式でも整合させる。
