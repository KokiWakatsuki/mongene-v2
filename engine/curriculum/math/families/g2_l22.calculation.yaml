family: math.g2_l22.calculation
form: calculation
source_desc: |
  1次関数のグラフが通る点（整数座標）を代入で求める
  （units.generated.yaml の desc/example を正として転記）。
  desc: 整数座標の通過点を代入で求める。
  example: 1次関数 y=3x−2 のグラフが通る点のうち、x 座標が1である点の座標を求めよ。
  x 座標を式に代入して y を求め、(x, y) の座標として答える。答えの形は座標（coordinate）。
  計算の中核（代入して y を出す）は g2_l19（値を求める）と同じ evaluate_linear_at_x を
  再利用し、座標に組み立てる1手を足しただけ＝部品の再利用で作った横展開セル。
concepts_default: [linear_function.point_on_line]
levels:
  "1":
    signature: point_on_line_by_substitution
    recipe: math.point_on_line
    params:
      # 傾き a(≠0)・切片 b・x 座標 x0(≠0)。答え (x0, a*x0+b) は整数座標。
      # 組合せ 10*19*12=2280 通りで dup_rate に十分な余裕（実測 0.02）。
      slope_domain: {int_range: [-5, 5], exclude: [0]}
      intercept_domain: {int_range: [-9, 9]}
      x_domain: {int_range: [-6, 6], exclude: [0]}
    given: [expression, input_value]
    asked: [coordinate]
    visual: none
    text: {tier: T1, template: lf_point_on_line_v1}
    hints: [steps_prefix]
    concept_tags: [linear_function.point_on_line]
    cause_tags: []
remedial:
  default_level: 1
