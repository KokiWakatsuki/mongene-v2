family: math.g2_l22.graph_table
form: graph_table
source_desc: |
  切片と傾きを使い、1次関数 y=ax+b のグラフ（直線）を1本かく
  （units.generated.yaml の desc/example を正として転記）。
  desc: 切片と傾きを使い直線を1本かく。
  example: 1次関数 y=2x−1 のグラフを、座標平面にかけ。
  答えはグラフ（GraphAnswer）＝傾き・y切片の点の特徴集合で採点（§6.2 V1'）。問題図は
  空の方眼（生徒が描き込む・直線は描かない）、模範解答図は直線つき（solution_svg_ref・
  開示制御対象）。「かく」capability の最初のセル（同 unit g2_l22 の calculation とは別 form）。
concepts_default: [linear_function.draw_graph]
levels:
  "1":
    signature: draw_linear_from_slope_intercept
    recipe: math.draw_linear
    params:
      # 傾き a(≠0)・切片 b。答えは直線そのもの。組合せは (a,b) のみが実DOF なので
      # dup_rate 確保のため域を広めにとる（12*25=300 通り・実測 dup_rate=0.17＜0.20）。grid 範囲は
      # (a,b) から決定論的に定める代表点で決まるため、同じ直線は grid の窓が違っても重複扱い。
      slope_domain: {int_range: [-6, 6], exclude: [0]}
      intercept_domain: {int_range: [-12, 12]}
    given: [expression]
    asked: [draw_graph]
    visual: required
    text: {tier: T1, template: lf_draw_graph_v1, visual_builder: math.linear_graph}
    hints: [steps_prefix]
    concept_tags: [linear_function.draw_graph]
    cause_tags: []
remedial:
  default_level: 1
