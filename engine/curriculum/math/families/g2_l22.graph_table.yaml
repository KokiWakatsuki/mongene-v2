family: math.g2_l22.graph_table
form: graph_table
source_desc: |
  切片と傾きを使い、1次関数 y=ax+b のグラフ（直線）を1本かく
  （units.generated.yaml の desc/example を正として転記）。
  desc: 切片と傾きを使い直線を1本かく。
  example: 1次関数 y=2x−1 のグラフを、座標平面にかけ。
  答えはグラフ（GraphAnswer）＝傾き・y切片の点の特徴集合で採点（§6.2 V1'）。問題図は
  空の方眼（生徒が描き込む・直線は描かない）、模範解答図は直線つき（solution_svg_ref・
  開示制御対象）。「かく」capability の最初のセル（同 unit g2_l22 の calculation とは別 form）。
  ---
  Lv3（応用）desc: 分数の傾き・負の切片など、格子点を選んで正確にかく。
  example: 1次関数 y=−(2/3)x−1 のグラフを、格子点を通るように正確に座標平面にかけ。
  Lv3 は分数の傾き p/q（q≥2・既約・非整数）で、切片 (0,b) と格子点 (q,p+b) を通るようにかく。
  Lv1（整数傾き）と op 列（plot_intercept→apply_slope_denominator→apply_slope_numerator→
  mark_lattice_point→draw_line）を変える＝level_sep。答えは GraphAnswer（傾き・切片・格子点の
  3特徴）。傾き・切片は given の式係数由来で whitelist。
concepts_default: [linear_function.draw_graph]
levels:
  "1":
    signature: draw_linear_from_slope_intercept
    recipe: math.draw_linear
    params:
      # 傾き a(≠0)・切片 b。答えは直線そのもの。組合せは (a,b) のみが実DOF なので
      # dup_rate 確保のため域を広めにとる（12*25=300 通り・実測 dup_rate=0.17＜0.20）。grid 範囲は
      # (a,b) から決定論的に定める代表点で決まるため、同じ直線は grid の窓が違っても重複扱い。
      slope_domain: {int_range: [-6, 6], exclude: [0]}
      intercept_domain: {int_range: [-12, 12]}
    given: [expression]
    asked: [draw_graph]
    visual: required
    text: {tier: T1, template: lf_draw_graph_v1, visual_builder: math.linear_graph}
    hints: [steps_prefix]
    concept_tags: [linear_function.draw_graph]
    cause_tags: []
  "3":
    signature: draw_linear_fraction_slope
    recipe: math.draw_linear_fraction
    params:
      # 分数の傾き p/q（q≥2・既約・非整数を frac_range が保証）と切片 b。
      # 組合せは実質 (p,q,b)。frac_range(num[-6,6]×den[2,4]の既約非整数)×b(25) で十分な多様性。
      slope_domain: {frac_range: {num: [-6, 6], den: [2, 4]}}
      intercept_domain: {int_range: [-6, 6]}
    given: [expression]
    asked: [draw_graph]
    visual: required
    text: {tier: T1, template: lf_draw_graph_fraction_v1, visual_builder: math.linear_graph}
    hints: [steps_prefix]
    concept_tags: [linear_function.draw_graph_fraction]
    cause_tags: []
remedial:
  default_level: 1
