family: math.g2_l23.find_value
form: find_value
source_desc: |
  変域とグラフの端点（units.generated.yaml の desc/example を正として転記）。
  Lv2（標準）: 傾きの正負を判断し端点を代入して y の変域を求める。
    例: 1次関数 y=−2x+5 について、x の変域が −1≦x≦3 のときの y の変域を求めよ。
  Lv3（応用）: 変域が式決定や逆算と絡み、端点の対応を自分で構成して求める。
    例: 1次関数 y=ax+b について、x の変域が 1≦x≦4 のとき y の変域が −2≦y≦7 であった。
        傾き a が正のとき、この1次関数の式を求めよ。
  Lv2=順方向（関数+x変域→y変域・asked=domain_range）、Lv3=逆算（x変域+y変域+符号→式・
  asked=expression）で asked も steps も異なる別構造。
concepts_default: [linear_function.variable_range]
levels:
  "2":
    signature: lf_y_range_forward
    recipe: math.y_range_from_domain
    params:
      slope_domain: {int_range: [-4, 4], exclude: [0]}
      intercept_domain: {int_range: [-6, 6]}
      x_domain: {int_range: [-5, 5], distinct: ["value"]}
    given: [expression, x_domain]
    asked: [domain_range]
    visual: none
    text: {tier: T1, template: lf_y_range_v1}
    hints: [steps_prefix]
    concept_tags: [linear_function.variable_range]
    cause_tags: []
  "3":
    signature: lf_expr_from_range_inverse
    recipe: math.expr_from_range
    params:
      slope_domain: {int_range: [1, 4]}          # 傾き a は正（逆算の前提）
      intercept_domain: {int_range: [-6, 6]}
      x_domain: {int_range: [-4, 6], distinct: ["value"]}
    given: [x_domain, y_range, condition]
    asked: [expression]
    visual: none
    text: {tier: T1, template: lf_expr_from_range_v1}
    hints: [steps_prefix]
    concept_tags: [linear_function.variable_range]
    cause_tags: []
remedial:
  default_level: 2
