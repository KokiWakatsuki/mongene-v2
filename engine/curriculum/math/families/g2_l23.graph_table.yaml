family: math.g2_l23.graph_table
form: graph_table
source_desc: |
  変域つき1次関数を、端点の開閉（ふくむ●/ふくまない○）を区別して線分としてかく
  （units.generated.yaml の desc/example を正として転記）。
  desc: 端点の開閉を区別して線分としてかく・読む。
  example: 1次関数 y=x+2（−1≦x≦2）のグラフを、両端の点をふくむことがわかるように座標平面にかけ。
  答えはグラフ（GraphAnswer＝両端点の特徴集合。開閉は srepr の flag に埋め込むので集合一致で
  開閉まで検証できる）。問題図は空の方眼、模範解答図は端点マーカー（●塗り＝ふくむ／○白抜き＝
  ふくまない・色以外で区別＝N-4 適合）つきの線分。given=expression（式）+x_domain（不等号つき変域）。
  「読む」（変域→端点の包含の判定）は g2_l23 knowledge Lv1 で既出のため、本セルは「かく」一本化。
concepts_default: [linear_function.draw_segment]
levels:
  "2":
    signature: draw_segment_with_endpoints
    recipe: math.draw_segment
    params:
      # 傾き a(≠0)・切片 b・変域端 x_lo<x_hi（相異2整数）・両端の開閉。
      # 組合せ a(8)*b(13)*変域対(55)*開閉(4) で dup_rate 十分（eval/100seed で確認）。
      slope_domain: {int_range: [-4, 4], exclude: [0]}
      intercept_domain: {int_range: [-6, 6]}
      x_domain_endpoints: {int_range: [-5, 5], distinct: [value]}
      closed_domain: [true, false]
    given: [expression, x_domain]
    asked: [draw_segment]
    visual: required
    text: {tier: T1, template: lf_draw_segment_v1, visual_builder: math.linear_graph}
    hints: [steps_prefix]
    concept_tags: [linear_function.draw_segment]
    cause_tags: []
remedial:
  default_level: 2
