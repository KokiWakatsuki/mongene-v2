family: math.g2_l24.find_value
form: find_value
source_desc: |
  傾きと1点を代入し切片を求めて式を決める（例: 傾きが2で、点(1, 5)を通る直線の式を求めよ。）。
  Lv3=切片や平行条件など間接的な情報から式を構成する（例: 点(2, 1)を通り、直線 y=3x-4 に平行な直線の式を求めよ。）。
concepts_default: [linear_function.expression_from_slope_point]
levels:
  "1":
    signature: lf_expr_slope_point_basic
    recipe: math.linear_from_slope_point
    params:
      slope_domain: {int_range: [-5, 5], exclude: [0]}
      point_domain: {lattice: {x: {int_range: [-5, 5]}, y: {int_range: [-8, 8]}}}
    given: [slope, point_a]
    asked: [expression]
    visual: none
    text: {tier: T1, template: lf_expr_slope_point_v1}
    hints: [steps_prefix]
    # remedial G-Q7r の静的前提: error_causes.yaml の lf.confused_with_proportional /
    # lf.substitution_error は remediation={unit: g2_l24, form: find_value, level: 1} で
    # target_concepts=[linear_function.intercept_from_point] を戻す。このレベルの
    # concept_tags は必ず linear_function.intercept_from_point を含むこと。
    concept_tags:
      - linear_function.expression_from_slope_point
      - linear_function.intercept_from_point
    cause_tags: [lf.confused_with_proportional, lf.substitution_error]
  "3":
    signature: lf_expr_parallel_condition
    recipe: math.linear_from_parallel_condition
    params:
      slope_domain: {frac_range: {num: [-5, 5], den: [2, 3]}}
      parallel_intercept_domain: {int_range: [-6, 6]}
      point_domain: {lattice: {x: {int_range: [-6, 6]}, y: {int_range: [-9, 9]}}}
    given: [condition, point_a]
    asked: [expression]
    visual: none
    text: {tier: T1, template: lf_expr_parallel_v1}
    hints: [steps_prefix]
    concept_tags:
      - linear_function.parallel_condition
      - linear_function.expression_from_slope_point
    cause_tags: [lf.confused_with_proportional, lf.substitution_error]
remedial:
  default_level: 1
