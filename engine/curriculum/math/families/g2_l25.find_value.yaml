family: math.g2_l25.find_value
form: find_value
source_desc: |
  2点から傾きを出し、代入で切片を求めて式を決める（例: 2点 (1, 3) と (4, 12) を通る直線の式を求めよ。）。
  Lv3=連立で係数を決める・分数傾きなど非自明な2点から式を構成する（例: 2点 (−2, 5) と (4, 2) を通る直線の式を求めよ。）。
concepts_default: [linear_function.expression_from_two_points]
levels:
  "2":
    signature: lf_expr_two_points_basic
    recipe: math.linear_from_two_points
    params:
      method: slope_then_intercept
      slope_domain: {int_range: [-4, 4], exclude: [0]}
      point_domain: {lattice: {x: {int_range: [-5, 5]}, y: {int_range: [-8, 8]}}, distinct: [x]}
    given: [point_a, point_b]
    asked: [expression]
    visual: none
    text: {tier: T1, template: lf_expr_two_points_v1}
    hints: [steps_prefix]
    concept_tags:
      - linear_function.slope_from_two_points
      - linear_function.intercept_from_point
      - linear_function.expression_from_two_points
    cause_tags: [lf.confused_with_proportional, lf.substitution_error]
  "3":
    signature: lf_expr_two_points_simultaneous
    recipe: math.linear_from_two_points
    params:
      method: simultaneous
      slope_domain: {frac_range: {num: [-5, 5], den: [2, 3]}}
      point_domain: {lattice: {x: {int_range: [-6, 6]}, y: {int_range: [-9, 9]}}, distinct: [x]}
    given: [point_a, point_b]
    asked: [expression]
    visual: none
    text: {tier: T1, template: lf_expr_two_points_v1}
    hints: [steps_prefix]
    concept_tags:
      - linear_function.slope_from_two_points
      - linear_function.intercept_from_point
      - linear_function.expression_from_two_points
    cause_tags: [lf.confused_with_proportional, lf.substitution_error]
remedial:
  default_level: 2
