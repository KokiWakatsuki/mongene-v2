    recipe: math.knowledge_equation_solution_set
    params:
      # 答えは固定（直線）。a,b,c は方程式の見かけ（答えに無関係な surface）で dup を分散。
      coeff_domain: {int_range: [-9, 9], exclude: [0]}
      const_domain: {int_range: [-12, 12]}
