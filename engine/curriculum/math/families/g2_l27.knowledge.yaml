family: math.g2_l27.knowledge
form: knowledge
source_desc: |
  連立方程式の解と2直線の交点の関係の想起（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 連立の解＝2直線の交点であることを想起する。
       example: 連立方程式の解と、それぞれの式が表す2直線との間にはどのような関係があるか答えよ。
  【設計モデル】原題を単一選択（2つの直線の交点／傾き／y軸との交点）で realize。正しい答え
  （交点）が常に正解＝答え固定型（性質の理解を問う C5 完成に必要なセル）。Q1 は「連立の解は
  交点」という規則の想起＝V2。無限性(F-3)は連立の係数（答えに無関係な surface）で満たす。
  選択肢は「2つの直線」形（助数詞「つ」は G-Q5t 除外対象・「2直線」だと "2" が本文と衝突する）。
concepts_default: [linear_function.system_solution_is_intersection]
