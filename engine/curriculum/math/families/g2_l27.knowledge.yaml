    recipe: math.knowledge_system_intersection
    params:
      # 答えは固定（2つの直線の交点）。連立の係数は答えに無関係な surface で dup を分散。
      coeff_domain: {int_range: [-9, 9], exclude: [0]}
      const_domain: {int_range: [-12, 12]}
