family: math.g2_l28.graph_table
form: graph_table
source_desc: |
  対応表（x-y の4組）からグラフ（直線）をかく
  （units.generated.yaml の desc/example を正として転記）。
  desc: 対応表からグラフをかく・読む。
  example: 次の表は、あるろうそくに火をつけてからの時間 x 分と、ろうそくの長さ y cm の関係を
    表したものである。この関係を表すグラフを座標平面にかけ。
    | x（分） | 0 | 2 | 4 | 6 | / | y（cm） | 20 | 17 | 14 | 11 |
  答えはグラフ（GraphAnswer＝直線 y=ax+b の傾き・y切片の点の特徴集合）。検証は既存
  draw_linear_features（g2_l22 と共有）を再利用（新 solver ゼロ＝償却）。問題図は空の方眼。
  ★設計モデル（preview 検収 Q4 に委ねる点）: 具体的な文脈（ろうそく等）は word_problem の領域と
  切り分け、本セルは「x-y の対応表を与えグラフ化」の T1 として一般化する（表の x=0 を含めるので
  切片 b は表に現れ whitelist される・傾きは整数として y を整数に保つ）。刻み幅 d は表の見かけを
  変える surface param（線そのものは不変）。
concepts_default: [linear_function.draw_from_table]
levels:
  "2":
    signature: draw_line_from_correspondence_table
    recipe: math.draw_from_table
    params:
      # answer-first: 傾き a(≠0)・切片 b・x の刻み幅 d を選び x=0,d,2d,3d の4点で表を作る。
      # 組合せ a(10)*b(31)*d(3)=930 通り（dup_rate は eval/100seed で確認）。
      slope_domain: {int_range: [-5, 5], exclude: [0]}
      intercept_domain: {int_range: [-15, 15]}
      step_domain: {int_range: [1, 3]}
    given: [data_table]
    asked: [draw_graph]
    visual: required
    text: {tier: T1, template: lf_draw_from_table_v1, visual_builder: math.linear_graph}
    hints: [steps_prefix]
    concept_tags: [linear_function.draw_from_table]
    cause_tags: []
remedial:
  default_level: 2
