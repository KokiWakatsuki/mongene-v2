family: math.g2_l29.graph_table
form: graph_table
source_desc: |
  動点と面積の変化（1次関数）— グラフをかく
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 区間ごとに折れ線となる面積グラフをかく。
       example: 1辺が5cmの正方形の周上を点PがAを出発して一定の速さで動くとき、
                三角形APDの面積 y cm² と時間 x 秒の関係は、区間ごとに直線となる折れ線で
                表される。この面積のグラフを座標平面にかけ。
  ---
  g3_l38.graph_table Lv3（`math.draw_piecewise_area_graph`・A→B→C の2区間）の3区間版。
  経路を D まで延ばすと面積が減少に転じ、折れ線が台形の形になる＝desc の
  「区間ごとに直線となる折れ線」がはっきり出る（2区間だと「増加→一定」で
  折れ点が1つしかない）。折れ点は既存 solver
  `math.draw_three_interval_area_graph_features` で再計算する。

  図は時間 x 秒と面積 y cm² という**単位の違う2量**のグラフなので、座標平面ではなく
  量-量グラフとして描く（params の grid_mode="quantity"）。問題図は空の方眼で、
  答えの折れ線は先出ししない（生徒が描き込む）。

  【params】図の描画に要る値（1辺・速さ・折れ点の座標 poly_pts）と点名。
  1辺は偶数（面積 s²/2 が整数）、速さは 1辺の約数（折れ点の時刻が整数＝目盛にのる）に
  構成の段階で絞る。
concepts_default: [motion.piecewise_area_graph]
levels:
  "3":
    signature: piecewise_area_graph_three_intervals
    recipe: math.draw_three_interval_area_graph
    params:
