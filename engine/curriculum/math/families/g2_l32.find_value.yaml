family: math.g2_l32.find_value
form: find_value
source_desc: |
  平行線と1つの角関係、または補助線で複数関係を使い角を求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 平行線と1つの角関係で角を求める。
       example: 右の図で、l∥m のとき、同位角の関係を使って ∠x の大きさを求めよ。
                ただし図に示された角は 72° とする。
  Lv2 desc: 折れ線に補助線を引き複数関係で角を求める。
       example: 右の図で、l∥m である。2か所で折れ曲がった線の角がそれぞれ 50°、
                25° であるとき、補助線をひいて ∠x の大きさを求めよ。
  【設計モデル】g2_l31.find_value と同じ solver を共用（math.solve_angle_by_equality_
  relation・math.solve_zigzag_angle_sum）。本セルは平行線特有の同位角/錯角のみに
  relation_set を絞る（対頂角は l31 側で扱う）。
concepts_default: [angle_pair.solve_by_equality]
levels:
  "1":
    signature: angle_equality_g2_l32
    recipe: math.solve_angle_by_equality_relation
    params:
