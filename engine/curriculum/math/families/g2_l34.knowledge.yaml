source_desc: |
  n角形が(n-2)個の三角形に分かれる理由を想起する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: n角形が(n-2)個の三角形に分かれる理由を想起する。
       example: n角形は、1つの頂点からひいた対角線によって、いくつの三角形に
                分けられるか。その個数を n を使って表し、そう分けられる理由を
                説明せよ。
  【設計モデル】規則想起ハブ（既存 math.recall_rule・_RULE_MAPS に topic
  "polygon_interior_sum_reason"（対角線で三角形に分ける方法、単一concept）を追加）。
