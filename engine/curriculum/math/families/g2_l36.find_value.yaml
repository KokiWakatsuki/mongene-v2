source_desc: |
  対応する辺の長さ/角の大きさを読み取り求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 対応する辺の長さ/角の大きさを読み取り求める。
       example: △ABC≡△DEF で、AB=6cm、∠B=50° である。このとき、辺DEの長さと
                ∠E の大きさを求めよ。
  【設計モデル】新設 solver math.congruence_transfer_values（合同な図形は対応する
  辺・角がそれぞれ等しいという恒真の性質から、わかっている辺の長さ・角の大きさを
  そのまま対応する辺・角の値として求める）。答えは Tuple(辺の長さ, 角の大きさ)。
