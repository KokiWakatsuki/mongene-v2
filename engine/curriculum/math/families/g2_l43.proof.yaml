family: math.g2_l43.proof
form: proof
source_desc: |
  正三角形の性質と条件
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・二等辺の重ね合わせ等で正三角形を示す。
  Lv3 desc: 誘導なし・合同や角の関係を組み合わせ正三角形を構成する。
  ---
  【設計モデル】g2_l39.proof と同じ推論器。図は「AB ＝ AC かつ BA ＝ BC」という
  **2つの二等辺三角形の重ね合わせ**として与える（正三角形であることは仮定に入れない
  ——それが示すことだからである）。

  【★性質と条件で図を分ける】Lv2（性質）は3辺の等しさを仮定して角の等しさを示す図、
  Lv3（条件）は**角の等しさだけを仮定して**辺の等しさを示す図。同じ正三角形を描くが
  仮定が違う。最初 Lv3 も `equilateral`（3辺の等しさが仮定）で書いたが、それだと
  結論の AC ＝ BC が仮定から一手（推移律）で出てしまい、問題にならなかった。

  【深さ】Lv2 は底角が等しいことを2回使って3つの角が等しいことを示す（深さ2）。
  Lv3 は角の等しさ →「2つの角が等しい三角形は二等辺三角形」を2回で3辺の等しさに
  たどりつく（深さ2だが op 列が違う: use_isosceles_base_angles 対 conclude_isosceles）。

  【equilateral_points_on_sides は使えなかった】正三角形の辺上に点をとる図
  （BD ＝ CE から合同を示す定番）は、∠BAD が図の質の下限 18°を割って全部落ちた。
  辺上の点を頂角から見込む角は構造的に小さいので、図の取り方から考え直す必要がある。
concepts_default: [equilateral_proof.property_and_condition]
