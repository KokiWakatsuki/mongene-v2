family: math.g2_l45.proof
form: proof
source_desc: |
  直角三角形の合同条件を使った証明
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・斜辺と1辺/1角の合同条件で直接証明する。
  Lv3 desc: 補助線で直角三角形を作る・2段階を要する証明。
  Lv4 desc: 誘導なし・どの直角三角形を合同にするか方針を自分で構成する。
  ---
  【設計モデル】g2_l39.proof と同じ推論器。直角三角形の合同条件（斜辺と1つの鋭角・
  斜辺と他の1辺）は `rules_right_triangle.py` にある。

  【循環していないか】この単元で証明するのは「2つの直角三角形が合同であること」や
  その帰結であって、合同条件そのものではない。だから `exclude_rules` は要らない。

  【深さ】Lv2 は角の二等分線の上の点から2辺に垂線を下ろした図で、直角・斜辺共通・
  二等分された角から直接 RHA（深さ1）。Lv3 は二等辺三角形に**垂線2本を補助線として
  引いた**図で、対頂角をはさんで RHA（深さ2）。Lv4 はそこから対応する辺が等しいと
  結論する（深さ3）——どの直角三角形を合同とみるかを決めてからでないと進めない。

  【定義域】`scratchpad/fit_domain.py` の実測。Lv3/Lv4 の図は合格率が 3 割ほどしか
  ないが、**箱は広いほうがよい**——recipe は 24 回引き直すので rejects は 0 になり、
  dup_rate は箱の広さでしか下がらない（g2_l47 Lv2 で、狭くて合格率の高い箱が
  dup 0.37 で落ちた）。
concepts_default: [right_triangle_proof.hypotenuse_angle]
