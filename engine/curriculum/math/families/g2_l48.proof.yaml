family: math.g2_l48.proof
form: proof
source_desc: |
  平行四辺形になるための条件を使った証明
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・与えられた要素から1条件を示し平行四辺形と結論する。
  Lv3 desc: 合同や補助線で条件を導く2段階の証明。
  Lv4 desc: 誘導なし・どの条件をどう満たすか方針全体を自分で構成する。
  ---
  【設計モデル】g2_l39.proof と同じ推論器。図は平行四辺形ABCDの辺AB、DCの中点を
  M、Nとしたもの（「四角形BMDNは平行四辺形である」を示す、市販問題集の定番）。
  g2_l47（なるための条件そのもの）と違い、ここでは平行四辺形であることを**仮定**に
  持ち、その性質から新しい四角形の条件を作る。

  【★この図は図の質の検査に引っかかっていた】∠ACM のような、**線として描かれて
  いない角**がつぶれているという理由で落ちていた（`figure_quality_problems` が
  3点の組をすべて見ていたため）。描かれていない角はつぶれて見えようがないので、
  検査を「2辺とも描かれている角」に限った。中点連結定理やピラミッド型の図も
  同じ理由で落ちていたので、単元をまたいで効く。

  【深さ】Lv2 は「対辺が等しい → その半分どうしも等しい → 1組の対辺が平行で
  長さが等しい」（深さ3）。Lv3 は同じ図で三角形の合同を示す（深さ3・SSS）。
  Lv4 は合同から対応する辺が等しいと結論する（深さ4）。op 列はいずれも相異する。

  【★偶然の一致の検査も「描かれているもの」に限った】この図は当初、質のフィルタを
  1つも通らなかった。理由は図の質ではなく**偶然の一致**——描かれていない線分
  （AN など）の長さがたまたまそろっている、という判定だった。生徒が図から読み取る
  のは引かれた線とその角だけなので、検査を描かれているものに限った（naturalness.py）。
  これで通過率が 0/48 → 39/48 になり、中点連結定理・ピラミッド型の図も同時に開いた。
