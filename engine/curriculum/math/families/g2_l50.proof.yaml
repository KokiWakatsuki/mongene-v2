family: math.g2_l50.proof
form: proof
source_desc: |
  平行線と面積（等積変形）
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・平行線を根拠に2つの三角形が等積と示す。
  Lv3 desc: 誘導なし・等積変形の連鎖で図形の面積の等しさを構成して示す。
  ---
  【設計モデル】g2_l39.proof と同じ推論器（構成 → 前向き推論 → 結論 → 証明文）。
  面積の等しさは合同と違って**形が違ってよい**ので、述語を分けてある
  （`tri_area_eq`。教科書はどちらも「△ABC ＝ △DBC」と書くが、合同は ≡）。

  【深さ】Lv2 は「AD ∥ BC だから、底辺BCが共通で高さが等しい」の1段（深さ1）。
  Lv3 は「Mは中点だから BM＝MC」→「底辺が等しく高さが等しい」の2段（深さ2）で、
  中線が三角形の面積を2等分することを示す形になる。

  【台帳 desc との差】Lv3 desc の「等積変形の連鎖」（＝面積の等しさを transitive で
  つなぐ形）は、**図として成立させられなかった**。平行線上に頂点を3つ並べる図が要る
  のだが、そうすると頂点を見込む角（∠ABD など）が図の質の下限 18°を割り、
  試した範囲（1872通り）が全部落ちた。連鎖を出すには、図の質のフィルタを通る
  「頂点が並ぶ図」の描き方——たとえば底辺を長くとって上下に振る配置——が先に要る。
  いまは同じ深さ2を中点から取っている（中線と面積・教科書の定番）。

  【循環していないか】この単元で証明するのは「ある2つの三角形の面積が等しいこと」で
  あって、等積変形の定理そのものではない。だから `exclude_rules` は要らない
  （g2_l41 のように定理そのものを示す単元とはここが違う）。
concepts_default: [equal_area_proof.parallel_direct]
levels:
  "2":
    signature: geometry_proof_equal_area_parallel
    recipe: math.geometry_proof
    params:
      construction: trapezoid_diagonals
      topic_set: area
      proof_depth: 1
      prefer: tri_area_eq
      base_domain: {int_range: [26, 42]}
      angle_domain: {int_range: [40, 76]}
      offset_domain: {int_range: [10, 26]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [equal_area_proof.parallel_direct]
    cause_tags: []
  "3":
    signature: geometry_proof_equal_area_chain
    recipe: math.geometry_proof
    params:
      # 中線を引いた図。Lv2 の台形と違って**中点という条件から入る**ので、筋道が
      # 「中点だから底辺が等しい」→「底辺が等しく高さが等しいので面積が等しい」の
      # 2段になる（中線が三角形の面積を2等分する）。
      construction: triangle_median
      topic_set: area
      proof_depth: 2
      prefer: tri_area_eq
      # 定義域は実測で決めた（この箱で 729/756 が質のフィルタを通る）。外すと
      # 「∠BAC と ∠AMB がたまたま等しく見えている」で落ちる割合が跳ね上がる。
      base_domain: {int_range: [44, 49]}
      angle_domain: {int_range: [78, 91]}
      offset_domain: {int_range: [6, 14]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [equal_area_proof.chain]
    cause_tags: []
remedial:
  default_level: 2
