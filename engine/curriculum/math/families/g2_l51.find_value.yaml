family: math.g2_l51.find_value
form: find_value
source_desc: |
  全場合を数え上げ確率を求める／相対度数から確率を推定する・分数で整理する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 全場合を数え上げ確率を求める。
       example: 1から6までの目が出る大小の区別のない1個のさいころを投げるとき、
                偶数の目が出る確率を求めよ。
  Lv2 desc: 相対度数から確率を推定する・分数で整理する。
       example: あるびんのふたを1000回投げたところ、表が向いた回数が250回であった。
                この結果から、このふたを投げたとき表が出る確率を分数で推定せよ。
  【設計モデル】Lv1=新設 solver math.probability_single_die（space_choices=[die6,cards_n]・
  全事象を itertools で列挙し直し該当数÷全体数を計算。cards_n＝「1〜Nの番号カードから
  1枚引く」で同じ数え上げスキルの自由度を広げる・さいころ6面だけではdup_rateが構造的に
  閾値を超えるため鉄則②で導入）。Lv2=math.relative_frequency（g1_l59.calculation と
  同じ solver を再利用。既約分数化）。op列（Lv1: 列挙3手順、Lv2: 除算1手順）が相異＝
  level_sep。
concepts_default: [probability.count_single_space]
levels:
  "1":
    signature: probability_single_die_count
    recipe: math.probability_single_die
    params:
      # die6 は条件の組合せが10通り程度しかなく単独では dup_rate が閾値を超えるため、
      # cards_n（1〜Nの番号カードから引く・同じ数え上げスキルの一般化）の比重を高くして
      # 自由度を確保する（鉄則②。リストの重複要素で一様抽選の重みを付けている）。
      space_choices: [die6, cards_n, cards_n, cards_n, cards_n, cards_n, cards_n, cards_n, cards_n]
      n_domain: {int_range: [6, 60]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_probability_single_die_v1}
    hints: [steps_prefix]
    concept_tags: [probability.count_single_space]
    cause_tags: []
  "2":
    signature: relative_frequency_estimate
    recipe: math.relative_frequency_g2
    params:
      total_domain: {int_range: [200, 2000]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_probability_relative_freq_g2_v1}
    hints: [steps_prefix]
    concept_tags: [probability.relative_frequency_estimate]
    cause_tags: []
remedial:
  default_level: 1
