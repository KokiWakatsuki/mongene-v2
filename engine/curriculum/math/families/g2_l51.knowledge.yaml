family: math.g2_l51.knowledge
form: knowledge
source_desc: |
  確率の意味・0以上1以下・同様に確からしいを想起する／同様に確からしいかを判別し確率の
  意味を適用する（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 確率の意味・0以上1以下・同様に確からしいを想起する。
       example: あることがらの起こる確率がとりうる値の範囲を答えよ。また「同様に確からしい」
                とはどういう意味か説明せよ。
  Lv2 desc: 同様に確からしいかを判別し確率の意味を適用する。
       example: 画びょうを1個投げるとき、上向きと下向きの起こりやすさは「同様に確からしい」
                といえるかどうかを、理由とともに答えよ。
  【設計モデル】Lv1=用語想起ハブ（既存 math.term_recall・_TERM_MAPS の domain
  "probability_terms" を再利用。probability・equally_likely の2用語）。Lv2=新設 solver
  math.judge_equally_likely（answer-first で場面ライブラリから1つ選ぶ・verify型）。
  op列（Lv1: identify_description/name_concept、Lv2: check_symmetry/judge_equally_likely）
  が相異＝level_sep。
concepts_default: [probability_terms.term_recall]
levels:
  "1":
    signature: probability_terms_term_recall_g2
    recipe: math.term_recall
    params:
      domain: probability_terms
      concept_set: [probability, equally_likely]
      number_domain: {int_range: [10, 500]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [probability_terms.term_recall]
    cause_tags: []
  "2":
    signature: judge_equally_likely
    recipe: math.judge_equally_likely
    params: {}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_probability_judge_v1}
    hints: [steps_prefix]
    concept_tags: [probability.judge_equally_likely]
    cause_tags: []
remedial:
  default_level: 1
