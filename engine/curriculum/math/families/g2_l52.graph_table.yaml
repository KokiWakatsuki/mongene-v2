family: math.g2_l52.graph_table
form: graph_table
source_desc: |
  樹形図を使った場合の数の求め方（硬貨・さいころ）— 樹形図に整理する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 起こりうる場合を樹形図/表に整理する。
       example: 2枚の硬貨を同時に投げるとき、表と裏の起こりうる場合をすべて樹形図に表せ。
  ---
  【2セル共通の投資】g2_l52 / g2_l53 の graph_table Lv1 は「起こりうる場合を樹形図に
  整理する」で同じ。frame の asked に `draw_tree_diagram` を足し、
  `visuals/tree_diagram.py`（題材の絵＋2段の樹形図）を1本起こして2セルで共有する。
  違いは**もとに戻すかどうか**だけなので、params の `with_replacement` で分ける。

  【どう採点可能にしたか】作図そのものは engine が採点できないので、**樹形図を読んだ
  結果である「すべての場合の列」**を答えにする（GraphAnswer の features に場合の列と
  総数を持つ）。g2_l52 Lv2 の「樹形図に表せ」→「全部で何通りか」と同じ手を、
  列まで答えさせる形に進めたもの。場合は itertools で列挙し直す（double-solve）。

  【問題図と答えの図】問題図は題材の絵（投げる硬貨）まで。樹形図は答えなので描かない。

  【dup】金種の順序つきの組（5種から2枚＝20通り）× 人名（8）＝160 通り…では
  足りないので、金種は 6 種にして 30×8＝240、さらに枚数を surface に足さず
  **人名を 12 に広げて 360 通り**にしてある（実測 dup_rate で確認する）。
  枚数を増やすと樹形図が 8 通り以上になり、Lv1（基礎）の図として大きすぎる。
concepts_default: [counting.tree_diagram_coins]
levels:
