      face_names: ["表", "裏"]
      coin_candidates: ["1円硬貨", "5円硬貨", "10円硬貨", "50円硬貨", "100円硬貨", "500円硬貨"]
      person_candidates: ["太郎", "花子", "健太", "美咲", "翔太", "由紀", "大輔", "彩", "涼", "陸", "葵", "遥"]
    given: [condition]
    asked: [draw_tree_diagram]
    visual: required
    text: {tier: T1, template: lf_motion_area_v1, visual_builder: math.tree_subject}
    hints: [steps_prefix]
    concept_tags: [counting.tree_diagram_coins]
    cause_tags: []
