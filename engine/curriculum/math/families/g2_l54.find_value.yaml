family: math.g2_l54.find_value
form: find_value
source_desc: |
  起こらない確率=1-pを使って求める／少なくとも1つ起こる確率を余事象で工夫して求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 起こらない確率=1-pを使って求める。
       example: 大小2個のさいころを同時に投げるとき、出た目の和が5になる確率が9分の1で
                ある。出た目の和が5にならない確率を求めよ。
  Lv3 desc: 少なくとも1つ起こる確率を余事象で工夫して求める。
       example: 3枚の硬貨を同時に投げるとき、少なくとも1枚は表が出る確率を、余事象を
                利用して求めよ。
  【設計モデル】Lv2=新設 solver math.probability_complement（確率の値だけから1-pを計算。
  answer-first で2個のさいころの和条件から確率を構成しその余事象を問う）。Lv3=新設
  solver math.probability_at_least_one（独立試行の「一度も起こらない」場合を itertools
  で列挙し直し余事象で計算）。op列（Lv2: 1手順の引き算、Lv3: 列挙+余事象の2手順）が
  相異＝level_sep。
concepts_default: [probability.complement]
levels:
  "2":
    signature: probability_complement
    recipe: math.probability_complement
    params:
      # さいころは6面（20面のさいころは存在しない。D-13 と同じ理由）。
      faces_domain: {int_set: [6]}
    # 確率の答えは約分した分数で書くのが作法で、分母は「同じ確からしさで起こる
    # 場合の数」そのもの。数を小さくする方向では直せない（`engine.eval.answer_size`）。
    answer_size_max: {denominator: 36}
    answer_size_reason: |
      2つのさいころなので分母は 6×6=36 で固定。
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_probability_complement_v1}
    hints: [steps_prefix]
    concept_tags: [probability.complement]
    cause_tags: []
    dup_rate_max: 0.75
    dup_rate_reason: >-
      余事象の答え 1−p は、条件が違っても確率が同じなら同じ値になる。大小2個のさいころ（6面）では34通りしか残らない。面数を30面まで広げれば通るが、存在しないさいころになる（D-13 と同じ）。数を現実に戻したうえで重複を仕様として宣言する。
  "3":
    signature: probability_at_least_one
    recipe: math.probability_at_least_one
    params:
      # 台帳の例は「3枚の硬貨」。以前は 3〜12 回で、しかも
      # 「1から28までの目が出るさいころ」まで作っていた（dup_rate を通すため）。
      # **道具は実在するものに戻し、組み合わせは場面の数で稼ぐ**
      # （`recipes/probability.py` の `_AT_LEAST_ONE_SCENES` が61場面）。
      # 61場面 × 4回 = 244通りで dup_rate 0.15。
      trials_domain: {int_range: [2, 5]}
      # 余事象の分母は（全事象の大きさ）^（回数）。20枚のカードを4回で 160000 に
      # なっていたので、教科書の上限（6⁴=1296）で場面と回数の組を絞る。
      denominator_max: 1296
    # 確率の答えは約分した分数で書くのが作法で、分母は「同じ確からしさで起こる
    # 場合の数」そのもの。数を小さくする方向では直せない（`engine.eval.answer_size`）。
    answer_size_max: {denominator: 1296, numerator: 1296}
    answer_size_reason: |
      独立試行をくり返す余事象なので、分母は（全事象の大きさ）^（回数）。
      recipe 側の `denominator_max` が教科書の上限 6⁴=1296 で候補を絞っている（それを超える組は引かれない）。
      余事象なので分子も同じ大きさになる。
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_probability_complement_v1}
    hints: [steps_prefix]
    concept_tags: [probability.at_least_one_via_complement]
    cause_tags: []
remedial:
  default_level: 2
