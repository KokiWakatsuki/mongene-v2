family: math.g2_l54.word_problem
form: word_problem
source_desc: |
  確率の文章題（units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・余事象を使うと示され確率を求める。
       example: 赤玉3個、白玉2個が入った袋から玉を2個同時に取り出す。少なくとも1個が
                白玉である確率を求めたい。2個とも赤玉である確率を求め、それを利用して
                答えを求めよ。
  Lv3 desc: 誘導なし・直接か余事象かを自分で判断し確率を構成する。
       example: 1から6までの目が出るさいころを2回投げるとき、少なくとも1回は6の目が
                出る確率を求めよ。
  ---
  recipe は math.word_problem_probability（g2_l51/l52/l53/l54 で共有）。数学は既存
  solver（math.probability_combination_selection・math.probability_complement・
  math.probability_at_least_one）に委ねる＝新 solver ゼロ。
  【level_sep】
   Lv2: 余事象を誘導で明示する。(1)2個とも target色である確率
        （math.probability_combination_selection）→(2)それを利用して少なくとも1個が
        other色である確率（math.probability_complement）。誘導あり2小問。
   Lv3: 余事象を自力で選ぶ。さいころを2回投げて少なくとも1回は特定の目
        （math.probability_at_least_one・trials=2＝36通りの空間）。誘導なし1小問。
  「余事象を使うと示されるか、自分で判断するか」で level_sep（同じ余事象の型でも
  誘導の有無と試行構造が変わる）。
  【検証】G-Q1 が全小問 double-solve。checker は params の「場面文に出ている数値」だけ
  から solver を呼び直し、答え（確率）を独立に再計算する（答えは params に入れない）。
concepts_default: [probability.word_problem_two_balls_complement]
levels:
  "2":
    signature: word_problem_two_balls_complement_guided
    recipe: math.word_problem_probability
    params:
      scenario_kind: two_balls_complement
      color_candidates: [赤, 白, 青, 黄, 黒, 緑, 紫, 橙]
      # target色は2個同時に取り出すので>=2必要。other色は>=1。
      count_target_domain: {int_range: [2, 6]}
      count_other_domain: {int_range: [1, 5]}
    given: [scenario]
    asked: [value, value]
    visual: none
    text: {tier: T1, template: wp_probability_guided_v1}
    hints: [steps_prefix]
    concept_tags: [probability.word_problem_two_balls_complement]
    cause_tags: []
  "3":
    signature: word_problem_dice_repeat_at_least_one
    recipe: math.word_problem_probability
    params:
      scenario_kind: dice_repeat_at_least_one
      # dup_key は(faces, target_face)の組。6面だけ・少数面だけだと組合せが少なすぎ
      # dup_rate が構造的に閾値を超えるため、面数の候補プールを広く取る（鉄則②。
      # g2_l54.find_value の probability_at_least_one_recipe と同じ範囲 4〜30）。
      faces_domain: {int_range: [4, 30]}
      trials: 2
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [probability.word_problem_dice_repeat_at_least_one]
    cause_tags: []
remedial:
  default_level: 2
