family: math.g3_l1.calculation
form: calculation
source_desc: |
  単項式×多項式・多項式÷単項式を分配法則で展開する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 単項式×多項式/多項式÷単項式を分配法則で1手順処理。
       example: 3x(2x-5) を展開せよ。
  Lv2 desc: 負の係数・分数係数・複数項が絡む複数手順の整理。
       example: -2a(3a²-4a+1)-a(a²-6a) を計算せよ。
  【設計モデル】独立ソルバ math.expand_expression が sympy.expand で展開後の多項式を導く。
  答えは自由変数を含む式の SymbolicAnswer（G-Q5t は display 全体一致のみ検査＝積の形と
  展開形は構造が違うので漏洩しない）。level_sep は mode 別 op 列で作る:
  Lv1（distribute_mono：単項式をかっこの各項にかける1手順）／Lv2（distribute_mono_combine：
  複数の単項式×多項式を分配してから同類項をまとめる2手順）。dup は構成整数と文字種で分散。
concepts_default: [polynomial.expand_mono_poly]
levels:
  "1":
    signature: expand_distribute_mono
    recipe: math.expand_product
    params:
      mode: distribute_mono
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_expand_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.expand_mono_poly]
    cause_tags: []
  "2":
    signature: expand_distribute_mono_combine
    recipe: math.expand_product
    params:
      mode: distribute_mono_combine
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_expand_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.expand_mono_poly]
    cause_tags: []
remedial:
  default_level: 1
