family: math.g3_l11.calculation
form: calculation
source_desc: |
  いろいろな因数分解（共通因数をくくり出してから公式を使うなど）
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 共通因数をくくり出してから公式を適用する2段構え。
       example: 3x²-27 を因数分解せよ。
  Lv3 desc: 共通部分を置き換えて公式適用・4項の組分けなど工夫。
       example: (x+1)²-9 を因数分解せよ。
  【設計モデル】math.factor_expression が sympy.factor で因数分解。level_sep は mode 別 op 列:
  Lv2（factor_common_then_formula：g(x²-a²) の形を、共通因数をくくり出してから和と差の積で
  因数分解する2手順）／Lv3（factor_substitution：(x+p)²-c² の共通部分を置きかえ公式の逆で
  因数分解しもどす3手順）。Lv3 の given は展開せず (x+p)²-c² の形で提示する。
  dup は係数・定数・文字種で分散。
concepts_default: [polynomial.factor_various]
levels:
  "2":
    signature: factor_common_then_formula
    recipe: math.factor_polynomial
    params:
      mode: factor_common_then_formula
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_factor_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.factor_various]
    cause_tags: []
  "3":
    signature: factor_substitution
    recipe: math.factor_polynomial
    params:
      mode: factor_substitution
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_factor_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.factor_various]
    cause_tags: []
remedial:
  default_level: 2
