source_desc: |
  平方根の意味と根号（ルート）の表し方（units.generated.yaml の desc/example を正）。
  Lv1 desc: 根号のついた数と平方の相互変換を1手順で処理。 example: (√7)² の値を求めよ。
  【設計モデル】ソルバ math.simplify_radical が sympy で (√a)²=a・√(a²)=a を求める。
  単一レベル（square_of_root）。答えは整数の SymbolicAnswer。dup は数と2形式で分散。
