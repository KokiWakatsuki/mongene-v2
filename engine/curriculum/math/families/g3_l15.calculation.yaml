family: math.g3_l15.calculation
form: calculation
source_desc: |
  平方根の大小関係（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 2乗して比較し根号数の大小を判定。
       example: √5 と √8 の大小を、不等号を使って表せ。
  Lv2 desc: 係数付き√や整数と√の混在で変形してから比較。
       example: 3 と √7 と 2√2 を、小さい順に並べよ。
  【設計モデル】新規ソルバ math.compare_radical_values。正の数の範囲では平方根の大小は
  2乗の大小と一致する（sympy の厳密な代数比較・evalf 不使用）ため、a,b,c を squarefree
  の性質を利用して構成すれば同値になる組合せは構造的に排除できる（鉄則⑤）。答えは昇順の
  Tuple の SymbolicAnswer（display は "<" でつないだ不等号チェーン）。level_sep は
  mode 別 op 列: Lv1（compare_pair：2値を2乗して比べる2手順）／Lv2（compare_triplet：
  整数・bare√・係数付き√の3値を2乗した値に直してから並べる2手順）。
concepts_default: [radical.compare_magnitude]
levels:
  "1":
    signature: radical_compare_pair
    recipe: math.compare_radical_values
    params:
      mode: compare_pair
    # 答えは「√11 < √95」＝**与えられた2つを並べ直したもの**。根号の中が大きくても
    # 生徒がすることは中の数を比べるだけで、開く必要も書き写す重さも増えない。
    answer_size_max: {radicand: 200}
    answer_size_reason: |
      大小比較の答えは与式の並べ直しなので、根号の中の大きさが答えの重さにならない
      （√95 を計算する必要がない）。ここを既定の 60 で縛ると比較の題材が
      「√2 と √3」に寄って、根号の中で比べるという狙いが薄くなる。
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_radical_compare_pair_v1}
    hints: [steps_prefix]
    concept_tags: [radical.compare_magnitude]
    cause_tags: []
  "2":
    signature: radical_compare_triplet
    recipe: math.compare_radical_values
    params:
      mode: compare_triplet
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_radical_compare_order_v1}
    hints: [steps_prefix]
    concept_tags: [radical.compare_magnitude]
    cause_tags: []
remedial:
  default_level: 1
