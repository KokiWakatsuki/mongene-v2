family: math.g3_l16.calculation
form: calculation
source_desc: |
  有理数と無理数、循環小数 — 分数⇔循環小数の相互変換
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 分数を小数に直す/循環小数を循環節の表記で書く処理。
       example: 分数 5/11 を小数で表し、循環小数の記号を用いて書け。
  Lv2 desc: 循環小数を分数に直す変形処理。
       example: 循環小数 0.27（27が循環）を分数で表せ。
  【設計モデル】独立ソルバ math.fraction_to_repeating_decimal（Lv1）/
  math.repeating_decimal_to_fraction（Lv2）が整数の余り追跡・Fraction の厳密演算のみで
  変換する（フロート不使用・鉄則⑥）。循環小数の表記規約（新設）: display は循環節の最初と
  最後の数字に結合文字(U+0307)を付す教科書表記、srepr は ASCII-only な正準形
  "0.<非循環部>(<循環節>)"（既存の科学的記数法 srepr="4.8E4" と同型の非 sympy プレーン
  文字列 srepr の前例に倣う）。level_sep は mode（recipe 内で異なる solver を呼ぶ）:
  Lv1（fraction_to_repeating_decimal：長除法の余り追跡→循環節特定の2手順）／
  Lv2（repeating_decimal_to_fraction：桁をずらした式の差を作る→分数に整理の2手順）。
  dup は Lv1 が分母 q・分子 p の組、Lv2 が非循環部・循環節の桁で分散。
concepts_default: [rational_form.fraction_to_decimal]
levels:
  "1":
    signature: fraction_to_repeating_decimal
    recipe: math.convert_rational_decimal_form
    params:
      mode: fraction_to_repeating_decimal
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_fraction_to_decimal_v1}
    hints: [steps_prefix]
    concept_tags: [rational_form.fraction_to_decimal]
    cause_tags: []
  "2":
    signature: repeating_decimal_to_fraction
    recipe: math.convert_rational_decimal_form
    params:
      mode: repeating_decimal_to_fraction
    # 答えの分母・根号の中がこの単元では構造的に大きくなる（`engine.eval.answer_size`）。
    answer_size_max: {denominator: 99}
    answer_size_reason: |
      循環小数を分数に直す問題なので、分母は循環節の桁数で決まる（9・99・90・45 など）。
      0.72̇ は 13/18、0.9̇1̇ は 91/99。分母を12以下にすると、循環節が1桁で
      非循環部のない場合（x/9）しか作れなくなる。
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_decimal_to_fraction_v1}
    hints: [steps_prefix]
    concept_tags: [rational_form.decimal_to_fraction]
    cause_tags: []
remedial:
  default_level: 1
