family: math.g3_l2.calculation
form: calculation
source_desc: |
  多項式どうしの乗法（展開の基本）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: (a+b)(c+d)を分配法則で項ごとに展開し同類項整理。
       example: (x+2)(x+5) を展開せよ。
  Lv2 desc: 項数増・負や分数係数で符号処理と整理が複雑化。
       example: (2x-3)(3x+4) を展開せよ。
  【設計モデル】math.expand_expression が sympy.expand で展開。level_sep は mode 別 op 列:
  Lv1（binomial_product：単項係数の (x+a)(x+b) を分配して整理する2手順）／
  Lv2（binomial_product_coeff：係数つき (px+q)(rx+s) で1次の項を集めてから整理する3手順）。
  dup は定数・係数・文字種で分散。
concepts_default: [polynomial.expand_product]
levels:
  "1":
    signature: expand_binomial_product
    recipe: math.expand_product
    params:
      mode: binomial_product
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_expand_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.expand_product]
    cause_tags: []
  "2":
    signature: expand_binomial_product_coeff
    recipe: math.expand_product
    params:
      mode: binomial_product_coeff
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_expand_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.expand_product]
    cause_tags: []
remedial:
  default_level: 1
