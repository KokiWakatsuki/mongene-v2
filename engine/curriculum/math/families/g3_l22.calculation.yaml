family: math.g3_l22.calculation
form: calculation
source_desc: |
  近似値の計算と式の値（units.generated.yaml の desc/example を正）。
  Lv2 desc: √を含む値を式に代入し展開して式の値を求める。
  example: x=√3+1 のとき、x²-2x の値を求めよ。
  Lv3 desc: 対称式・共役の性質を使い代入前に工夫する式の値。
  example: x=√5+2、y=√5-2 のとき、x²+y² の値を求めよ。
  【設計モデル】math.evaluate_radical_substitution（同一 recipe/solver 名を params.mode
  で分岐・g1_l16 の Lv1/Lv2 が同一 recipe を共有する慣例と同型）が sympy.expand で
  代入・厳密評価。
  Lv2 (substitute_root_quadratic): x=p+√a（p は0でない整数、a は非平方の squarefree）
  を x²-2px に代入すると x²-2px=(p+√a)²-2p(p+√a)=a-p² となり根号が恒等的に消える
  （1次係数を -2p に固定する構成で保証・a 非平方ゆえ a-p²=0 に退化しない）。
  代入して展開・整理する2手順。dup は p・a で分散。
  Lv3 (substitute_conjugate_pair_sum_squares): 共役な組 x=√a+p, y=√a-p を x²+y² に
  代入すると x²+y²=(√a+p)²+(√a-p)²=2a+2p² となり根号が恒等的に消える（p,a の符号に
  関わらず常に成立・a≥2 ゆえ 2a+2p²=0 に退化する余地もない）。共役の組を代入して
  展開・整理する2手順（op名がLv2と異なる＝level_sep）。dup は p・a で分散
  （プールサイズ 864・実測 dup は build_mr で確認）。
concepts_default: [radical.evaluate_expression_value]
levels:
  "2":
    signature: radical_evaluate_expression_value
    recipe: math.evaluate_radical_substitution
    params: {mode: substitute_root_quadratic}
    given: [expression, input_value]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_substitute_value_v1}
    hints: [steps_prefix]
    concept_tags: [radical.evaluate_expression_value]
    cause_tags: []
  "3":
    signature: radical_evaluate_symmetric_pair_value
    recipe: math.evaluate_radical_substitution
    params: {mode: substitute_conjugate_pair_sum_squares}
    given: [expression, input_value]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_substitute_pair_value_v1}
    hints: [steps_prefix]
    concept_tags: [radical.evaluate_symmetric_pair_value]
    cause_tags: []
remedial:
  default_level: 2
