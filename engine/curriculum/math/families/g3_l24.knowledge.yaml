family: math.g3_l24.knowledge
form: knowledge
source_desc: |
  2次方程式の意味とその解（units.generated.yaml の desc/example を正）。
  Lv1 desc: 2次方程式・その解の意味の想起。 example: 2次方程式とは何か、解とは何かを説明せよ。
  【設計モデル】用語想起（term_recall_definition・domain=quadratic_terms・二次方程式/解）。
  具体例の x²+bx+c=0 を surface に埋め込み dup 分散。答えは漢数字「二次方程式」で digit-free。
  Lv2 desc: 与えられた値が解かを判定し解の個数の意味を理解。
       example: x=2 は 2次方程式 x²-x-2=0 の解であるといえるか、理由とともに説明せよ。
  【設計モデル・Lv2】新規 recipe math.verify_quadratic_solution（g1_l21 の
  verify_equation_solution の2次方程式版）。answer-first で整数解 r1,r2 から
  x²+bx+c=0 を構成し、候補値が解かどうか（is_solution）を先に決める。独立ソルバが
  方程式と候補値だけから再判定（double-solve）。
concepts_default: [quadratic_terms.term_recall]
levels:
  "1":
    signature: quadratic_terms_term_recall
    recipe: math.term_recall
    params:
      domain: quadratic_terms
      concept_set: [quadratic_equation, solution]
      number_domain: {int_range: [-9, 9]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic_terms.term_recall]
    cause_tags: []
  "2":
    signature: verify_quadratic_solution
    recipe: math.verify_quadratic_solution
    params: {}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_verify_solution_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic.verify_solution]
    cause_tags: []
remedial:
  default_level: 1
