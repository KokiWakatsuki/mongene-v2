family: math.g3_l27.calculation
form: calculation
source_desc: |
  因数分解による解き方（units.generated.yaml の desc/example を正）。
  Lv1 desc: 因数分解しAB=0の性質で解く。 example: x²+5x+6=0 を因数分解を使って解け。
  Lv2 desc: 整理してから因数分解・共通因数を含むなど複数手順。 example: 2x²-8x=0 を解け。
  【設計モデル】math.solve_quadratic が sympy.solve で解く。answer-first で整数解 r1,r2 から
  x²+bx+c=0 を構成（Lv1）／共通因数 ax²+bx=0 を構成（Lv2）。答えは解を昇順に並べた Tuple。
  level_sep は mode 別 op 列（先頭 op が factor_left_side か factor_out_common かで相異）。
  dup は解・係数で分散。
concepts_default: [quadratic.solve_by_factoring]
levels:
  "1":
    signature: quad_solve_factoring
    recipe: math.solve_quadratic
    params: {mode: solve_factoring}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_quadratic_solve_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic.solve_by_factoring]
    cause_tags: []
  "2":
    signature: quad_solve_factoring_common
    recipe: math.solve_quadratic
    params: {mode: solve_factoring_common}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_quadratic_solve_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic.solve_by_factoring]
    cause_tags: []
remedial:
  default_level: 1
