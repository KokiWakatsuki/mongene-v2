family: math.g3_l28.calculation
form: calculation
source_desc: |
  いろいろな2次方程式の解き方（解き方の選択）（units.generated.yaml の desc/example を正）。
  Lv2 desc: 展開・移項で整理し因数分解/公式のどちらかで解く。 example: (x+2)(x-3)=6 を解け。
  Lv3 desc: 係数の特徴を見て最適な解法を選び効率的に解く工夫。 example: (2x-1)²=3(2x-1) を解け。
  【設計モデル】math.solve_quadratic が sympy.solve で解く。answer-first で最終の整数解から
  (x+A)(x+B)=C の見かけを再構成（Lv2）／(mx+n)²=k(mx+n) の共通因数形を構成（Lv3）。
  答えは解を昇順に並べた Tuple。level_sep は mode 別 op 列（expand_and_rearrange 3手順／
  factor_out_common_binomial 2手順）。dup は解・係数で分散。
concepts_default: [quadratic.solve_by_choice]
levels:
  "2":
    signature: quad_solve_rearrange
    recipe: math.solve_quadratic
    params: {mode: solve_rearrange}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_quadratic_solve_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic.solve_by_choice]
    cause_tags: []
  "3":
    signature: quad_solve_choose
    recipe: math.solve_quadratic
    params: {mode: solve_choose}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_quadratic_solve_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic.solve_by_choice]
    cause_tags: []
remedial:
  default_level: 2
