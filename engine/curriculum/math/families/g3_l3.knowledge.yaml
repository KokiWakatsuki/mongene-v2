source_desc: |
  乗法公式①（(x+a)(x+b)の展開）— 与式がどの乗法公式の形かを識別
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 与式がどの乗法公式の形かを識別。
       example: 次の式のうち、乗法公式 (x+a)(x+b)=x²+(a+b)x+ab がそのまま使える形は
                どれか答えよ。 ア (x+2)(x+5)  イ (x+3)²  ウ (x+4)(x-4)
  【設計モデル】規則想起ハブ（既存 math.recall_rule・letter_expr.py の _RULE_MAPS に
  topic "multiplication_formula_choice" を追加）。concept ごとに (x+a)(x+b) の a,b の
  関係を構成する: general_form(a≠b かつ a≠-b)／perfect_square_form(a=b)／
  diff_of_squares_form(b=-a)。答えは公式の記述文（漢字・記号のみ・digit-free）の
  ChoiceAnswer。既存ハブへの追加のみ＝既存 golden 不変。
