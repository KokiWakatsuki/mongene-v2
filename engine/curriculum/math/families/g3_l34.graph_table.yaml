family: math.g3_l34.graph_table
form: graph_table
source_desc: |
  変域をグラフ上の区間として把握する
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 変域をグラフ上の区間として把握する。
       example: 関数 y=(1/2)x^2 のグラフをかき、x の変域が -2≦x≦4 に対応する部分を
                太くなぞって示し、そのときの y の変域をグラフから読み取って答えよ。
  【設計モデル】新設 solver math.draw_parabola_domain_features。答えは GraphAnswer で、
  特徴は「変域の両端に対応する曲線上の2点」＋「y の変域」の3つ。y の変域の決め方は
  同 unit の find_value（math.y_range_over_quadratic_domain）と同じ規則で、変域が頂点
  （原点）をまたぐときだけ頂点の y 値を候補に加える——**構成時に場合分けを固定せず**、
  引いた x_lo<0<x_hi かどうかで両方の型が自然に現れる（Lv2 のみのセルなので level_sep の
  制約はなく、find_value 側の Lv2/Lv3 の区別をここでは分けない）。
  【図】問題図は空の方眼（かく）。模範解答図は放物線＋変域に対応する部分を太くなぞった
  もの（render_curve_domain_solution_svg・太さのみで区別＝モノクロ印刷可）。
concepts_default: [parabola_graph.domain_on_graph]
levels:
  "2":
    signature: parabola_domain_on_graph
    recipe: math.draw_parabola_domain
    params:
      # 比例定数 a は既約分数 n/d（d∈{1,2,3,4}・n∈[-9,9]\{0}）＝52 候補。変域
      # (x_lo, x_hi) は [-5,5] の相異2整数（55 通り）。|a|·max(|x_lo|,|x_hi|)² ≦ 16 で
      # 絞ると合計 809 通り（数え上げ実測。100seed の期待 dup=0.06）。
      a_den_set: [1, 2, 3, 4]
      a_num_domain: {int_range: [-9, 9]}
      x_domain: {int_range: [-5, 5]}
      value_bound: 16
    given: [expression, x_domain]
    asked: [draw_graph]
    visual: required
    text: {tier: T1, template: lf_parabola_domain_graph_v1, visual_builder: math.curve_graph}
    hints: [steps_prefix]
    concept_tags: [parabola_graph.domain_on_graph]
    cause_tags: []
remedial:
  default_level: 2
