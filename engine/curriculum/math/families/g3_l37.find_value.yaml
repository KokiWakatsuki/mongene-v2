family: math.g3_l37.find_value
form: find_value
source_desc: |
  放物線と直線を連立し交点座標を求める（1定理直接）／交点をもとに線分長・三角形の面積を
  多段で求める／面積を等分する点・逆算で係数決定など非自明な構成
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 放物線と直線を連立し交点座標を求める（1定理直接）。
       example: 放物線 y=x^2 と直線 y=x+2 の交点の座標をすべて求めよ。
  Lv3 desc: 交点をもとに線分長・三角形の面積を多段で求める。
       example: 放物線 y=(1/2)x^2 と直線 y=x+4 が2点 A, B で交わっている。線分 AB の長さと、
                原点 O と2点 A, B を結んでできる三角形 OAB の面積を求めよ。
  Lv4 desc: 面積を等分する点・逆算で係数決定など非自明な構成。
       example: 放物線 y=x^2 と直線 y=2x+3 が2点 A, B で交わっている。原点を O とするとき、
                y 軸上に点 P をとり、三角形 OAB の面積を三角形 PAB の面積が2等分するような
                点 P の座標を求めよ。
  【設計モデル】新設 solver math.intersection_parabola_line。answer-first: 交点の x 座標
  xA,xB（相異・非0の整数）と比例定数 a（非0）を先に決め、直線の傾き m=a(xA+xB)・切片
  b=-a・xA・xB を逆算する。xA≠xB・a≠0 より b は自動的に非0（O,A,B が同一直線上にならない
  ことが構成的に保証される・鉄則⑤）。mode="find_intersection"/"segment_and_area"/
  "bisecting_point" で op 列（交点のみ／+線分長・面積／+面積2等分点）が相異＝level_sep。
concepts_default: [quadratic_function.intersection_with_line]
