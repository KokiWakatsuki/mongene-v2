family: math.g3_l38.find_value
form: find_value
source_desc: |
  指定区間で動点位置の図から面積を立式して求める／区間の境界での場合分けを要する面積を
  構成して求める（units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 指定区間で動点位置の図から面積を立式して求める。
       example: 1辺 6cm の正方形 ABCD の辺 BC 上を点 P が B から C に向かって動く。
                BP=4cm のときの三角形 ABP の面積を求めよ。
  Lv3 desc: 区間の境界での場合分けを要する面積を構成して求める。
       example: 1辺 10cm の正方形 ABCD の周上を、点 P が B を出発して B→C→D の順に
                毎秒 2cm で動く。出発してから 7 秒後の三角形 ABP の面積を求めよ。
  【設計モデル】新設 solver math.solve_quadratic_motion_area（C3 g3_l31.find_value の
  motion.py と同じ「正方形の辺上を動く点」題材だが、P は B を出発し B→C→D の順に動き、
  求める面積は三角形 ABP（APD ではない）という別セル。concept_tags・family id は
  g3_l31/motion.py と混同しない）。正方形を A=(0,0),B=(s,0),C=(s,s),D=(0,s) に固定し、
  P の動いた道のり d だけから shoelace 公式で面積を求める。Lv2 は道のり d を BP の長さ
  として直接与える（mode="single_segment"・1区間のみ）。Lv3 は速さ v・時間 t を与え
  d=v・t とし、d が s 未満か s 以上かで辺 BC/CD のどちらにいるかの場合分けが要る
  （mode="case_split"）。mode ごとに op 列が相異＝level_sep。
concepts_default: [quadratic_function.motion_area]
levels:
  "2":
    signature: quadratic_motion_area_single_segment
    recipe: math.solve_quadratic_motion_area
    params:
      mode: single_segment
      s_domain: {int_range: [6, 60]}
    given: [condition]
    asked: [area]
    visual: none
    text: {tier: T1, template: lf_quadratic_motion_area_v1}
    hints: [steps_prefix]
