family: math.g3_l40.knowledge
form: knowledge
source_desc: |
  三角形の相似条件を想起・判別する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 3つの相似条件の想起。
       example: 三角形の相似条件を3つすべて答えよ。
  Lv2 desc: 図の情報からどの相似条件が成り立つか判別。
       example: 右の図で、三角形 ABC と三角形 ADE について、AB:AD=AC:AE=2:1、
                ∠A が共通であるとき、この2つの三角形が相似であることがいえる。
                用いた相似条件を答えよ。
  【設計モデル】規則想起ハブ（既存 math.recall_rule・_RULE_MAPS に topic
  "similarity_conditions" を追加＝Lv1）／新設 solver
  math.identify_similarity_condition（示されている等しい角・辺の比の組み合わせ
  から3条件(2角相等/2辺比+間の角/3辺比)のどれによるかを判別＝Lv2）。
  【スコープ】Lv2 は例の「頂点Aを共有する2つの三角形」という特殊配置ではなく、
  一般化した「2つの独立な三角形」の条件文(AB:DE=AC:DF=m:n、∠A=∠D 等)で表現する
  （頂点共有配置は drawn な6点が独立であるため表現が矛盾するのを避けるため）。
levels:
  "1":
    signature: similarity_conditions_rule_recall
    recipe: math.recall_rule
    params:
      topic: similarity_conditions
      concept_set: [all_three]
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_rule_recall_v1}
    hints: [steps_prefix]
    concept_tags: [similarity_conditions.rule_recall]
    cause_tags: []
  "2":
    signature: identify_similarity_condition
    recipe: math.identify_similarity_condition
    params:
      ratio_domain: {int_range: [2, 7]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_similarity_condition_statement_v1}
    hints: [steps_prefix]
    concept_tags: [similarity.identify_condition]
    cause_tags: []
remedial:
  default_level: 1
