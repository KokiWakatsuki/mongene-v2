family: math.g3_l42.find_value
form: find_value
source_desc: |
  平行線と線分の比の定理を1回使い長さを求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 平行線と線分の比の定理を1回使い長さ・比を直接求める。
       example: 右の図の三角形 ABC で、辺 AB, AC 上に点 D, E があり、DE//BC で
                ある。AD=4cm, DB=6cm, DE=5cm のとき、辺 BC の長さを求めよ。
  Lv3 desc: 複数の平行線・比の連鎖など多段で長さを求める。
       example: 右の図で、3本の直線 l, m, n が平行である。図の各線分の長さが
                与えられているとき、x の値を求めよ。AB=3, BC=x, DE=4, EF=6。
  【設計モデル】新設 solver math.parallel_segment_ratio_length（DE∥BC のとき
  三角形ADE∽三角形ABCとなりAD:AB=DE:BCが成り立つという恒真の性質から、
  BC=DE*(AD+DB)/ADを求める）。「右の図」は図なしで分点の配置をテキストで直接
  指定する（既存の合同対応セル等と同様）。
  【Lv3設計モデル】台帳の「3本の平行線 l,m,n が2本の直線を切る」を一般化。
  三角形の中の DE∥BC（Lv2）とは異なる定理（3本の平行線が2直線を切る線分の比は
  等しい: AB:BC=DE:EF）を使うため新設 solver math.parallel_lines_transversal_ratio
  （BC=AB*EF/DEを求める）。op列がLv2と異なるためlevel_sepは分離される。
concepts_default: [parallel_segment.ratio_length]
