family: math.g3_l43.proof
form: proof
source_desc: |
  平行線と線分の比の定理の逆と応用
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 比の条件から平行であることを逆で記述証明。
  ---
  【設計モデル】g2_l39.proof と同じ推論器。図は**平行を仮定しない砂時計型**
  （与えられるのは OA：OC ＝ OB：OD という比だけ）。結論が「AB ∥ DC」なので、
  平行を仮定に持つ図では問題にならない——ここが「逆」の単元の図の作り分けである。

  【循環していないか】示すのは「平行であること」であって、定理の逆そのものではない。
  比から平行を出す規則（`conclude_parallel_by_ratio`）は、この単元で**使う**規則。

  【深さ】比（仮定）→ 平行（深さ1）。台帳 desc の「比の条件から平行であることを
  逆で記述証明」がこの形。
concepts_default: [parallel_ratio_proof.converse]
levels:
  "3":
    signature: geometry_proof_parallel_ratio_converse
    recipe: math.geometry_proof
    params:
      construction: ratio_hourglass
      topic_set: similarity
      proof_depth: 1
      prefer: parallel
      base_domain: {int_range: [24, 48]}
      angle_domain: {int_range: [48, 54]}
      offset_domain: {int_range: [18, 24]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [parallel_ratio_proof.converse]
    cause_tags: []
remedial:
  default_level: 3
