family: math.g3_l45.find_value
form: find_value
source_desc: |
  相似比から面積比(2乗)を求め面積を1手順で求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 相似比から面積比(2乗)を求める・面積を1手順で求める。
       example: 相似比が 2:3 である2つの相似な三角形について、面積比を求めよ。
                また、小さいほうの面積が 12cm^2 のとき、大きいほうの面積を求めよ。
  Lv3（一部の面積・比の合成など多段で面積を求める）は多段構成で一般化が難しい
  ため本セルでは扱わない（次段対応）。
  【設計モデル】新設 solver math.similar_area_ratio（面積比が相似比の二乗に
  等しいという恒真の性質から、面積比と、既知の面積から対応する面積を求める）。
  答えは Tuple(面積比の分子, 面積比の分母, もう一方の面積)。
