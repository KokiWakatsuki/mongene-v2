source_desc: |
  証明した相似(円周上の4点)から長さを求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 証明した相似等から長さ・角を求める。
       example: 右の図で、円周上の4点 A, B, C, D について三角形 PAB∽三角形 PDC
                が示されている。弦 AC と弦 BD の交点を P とし、PA=6cm, PB=4cm,
                PD=3cm のとき、線分 PC の長さを求めよ。
  【設計モデル】既存 solver math.similarity_ratio_transfer を再利用する
  （PA:PD を相似比としてそのまま渡し、PB から対応する PC を求める・family を
  またぐ recipe/solver 共有は level_sep に無関係）。recipe は
  math.circle_similar_chord_length（recipes/similarity.py に集約）。
