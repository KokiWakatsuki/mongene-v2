family: math.g3_l53.find_value
form: find_value
source_desc: |
  平面図形への三平方の利用（高さ・面積）
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 直角三角形が既にある図で三平方を1回使い長さを求める。
       example: 直角をはさむ2辺の長さが 5cm, 12cm の直角三角形の斜辺の長さを求めよ。
  Lv3 desc: 補助線(垂線)を引き高さ・面積を多段で求める。
       example: 1辺 6cm の正三角形 ABC について、頂点 A から辺 BC に垂線 AH を引く。
                このとき、高さ AH の長さと三角形 ABC の面積を求めよ。
  Lv4 desc: 特別な直角三角形の比・逆算を組み合わせた非自明な求値。
       example: 三角形 ABC で、∠B=45°、∠C=60°、辺 BC=6cm である。頂点 A から辺 BC に
                垂線 AH を引くとき、線分 AH の長さを求めよ。
  【設計モデル】新 solver ゼロ。既存 solver の合成で解く
  （recipe math.pythagorean_find_value）。
    - Lv2: 斜辺を問う枠と、斜辺と1辺から他方の辺を問う枠の2枠（op 列は同一なので
      1 signature に同居できる）。前者は math.pythagorean_hypotenuse、後者は
      「x²+既知の辺²=斜辺²」を math.solve_quadratic の正の解に委ねる。
    - Lv3: 垂線の足が底辺の中点になることから底辺の半分を出し、math.solve_quadratic で
      高さを求め、面積を合成する（3手）。台帳の正三角形は「等辺=底辺」の場合として含む。
    - Lv4: 底辺の両端の特別な角（30/45/60）から、垂線の足で分けた底辺の二つの部分を
      高さの定数倍で表し、その和＝底辺の方程式を解いて高さを求める（4手）。
  【level_sep】fp は steps の op 列なので Lv2=2手 / Lv3=3手 / Lv4=4手 と段数・op 名を
  変えている（何を文字に置くか・何手で解くかがレベル差そのもの）。
concepts_default: [pythagorean.missing_side_in_right_triangle]
levels:
  "2":
    signature: pythagorean_missing_side_in_right_triangle
    recipe: math.pythagorean_find_value
    params:
      scenario_kind: right_triangle_missing_side
      # dup_key は params（scenario_kind + numbers）で決まる。
      # 斜辺枠 60×60=3600 通り + 直角をはさむ辺枠（斜辺 2..60 × 短い辺 < 斜辺）1770 通り
      # ＝ 5370 通り（閾 0.20 に必要な約250通りを大きく超える）。
      side_domain: {int_range: [1, 60]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_pythagorean_condition_v1}
    hints: [steps_prefix]
    concept_tags: [pythagorean.missing_side_in_right_triangle]
    cause_tags: []
  "3":
    signature: pythagorean_isosceles_height_and_area
    recipe: math.pythagorean_find_value
    params:
      scenario_kind: isosceles_height_area
      # (等辺, 底辺) は 底辺が偶数・底辺 < 等辺×2（三角形が成り立つ）・底辺×2 >= 等辺
      # （針のように細くしない）の組で **552 通り**（列挙して実測）。
      # 頂点名（連続3文字 24 通り）× 垂線の足（7 通り）も params に載るのでさらに広い。
      # 底辺 2 を入れないのは、面積＝底辺×高さ÷2 が高さと同じ値になって
      # 「高さと面積が同じ数」という見た目に紛らわしい問題ができるため。
      equal_side_domain: {int_range: [3, 40]}
      base_domain: {int_range: [4, 60]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_pythagorean_condition_v1}
    hints: [steps_prefix]
    concept_tags: [pythagorean.isosceles_height_and_area]
    cause_tags: []
  "4":
    signature: pythagorean_height_from_special_angles
    recipe: math.pythagorean_find_value
    params:
      scenario_kind: height_from_special_angles
      # 底辺 59 通り × 角の組 3×3=9 通り ＝ 531 通り。頂点名（24）× 垂線の足（7）も
      # params に載るので実際の組合せはさらに広い。
      base_domain: {int_range: [2, 60]}
      angle_domain: {int_set: [30, 45, 60]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_pythagorean_condition_v1}
    hints: [steps_prefix]
    concept_tags: [pythagorean.height_from_special_angles]
    cause_tags: []
remedial:
  default_level: 2
