family: math.g3_l53.knowledge
form: knowledge
source_desc: |
  特別な直角三角形の辺の比の理解
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 特別な直角三角形の辺の比の理解。
       example: 3つの角が 45°, 45°, 90° の直角三角形と、30°, 60°, 90° の直角三角形に
                ついて、それぞれの3辺の長さの比を答えよ。
  【設計モデル簡略化】台帳の例は「2種類の三角形の3辺の比をまとめて答える」形だが、
  それでは問える中身が2通りしかなく、同じ問題ばかり出る（dup_key は params で決まる）。
  そこで「直角の頂点と、もう一つの角の大きさ（30/45/60）を与え、指定した2辺の長さの比を
  答える」形にする。想起する知識は同じ（45-45-90 は 1:1:√2、30-60-90 は 1:√3:2）で、
  どの辺が比のどの値にあたるかまで問える分むしろ厚い。
  【設計モデル】新 solver ゼロ。recipe math.special_right_triangle_ratio が、角の大きさ
  から各頂点に対する辺の表し方（1 / √2 / √3 / 2）を決め、指定された2辺の比を
  ChoiceAnswer で答える。妨害選択肢は同じ特別な直角三角形の中で作れる比から決まった順に
  選ぶ（決定論）。
concepts_default: [pythagorean.special_right_triangle_ratio]
levels:
  "1":
    signature: special_right_triangle_ratio
    recipe: math.special_right_triangle_ratio
    params:
      # dup_key は params（numbers + slots）で決まる。
      # 頂点名（連続3文字）24 × 直角の頂点 3 × もう一つの角の頂点 2 × 角 3 ×
      # 問う辺の順序対 6 ＝ 2592 通り（閾 0.20 に必要な約250通りを大きく超える）。
      acute_angle_domain: {int_set: [30, 45, 60]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_pythagorean_statement_v1}
    hints: [steps_prefix]
    concept_tags: [pythagorean.special_right_triangle_ratio]
    cause_tags: []
remedial:
  default_level: 1
