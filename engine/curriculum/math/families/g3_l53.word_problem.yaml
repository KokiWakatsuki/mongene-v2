family: math.g3_l53.word_problem
form: word_problem
source_desc: |
  平面図形への三平方の利用（高さ・面積）の文章題（units.generated.yaml の desc/example
  を正として転記）。
  Lv3 desc: 誘導あり:図形設定→高さ/面積/長さの小問(求値)が連なる。
       example: 1辺の長さが 8cm のひし形 ABCD があり、対角線 AC の長さは 12cm である。
                次の問いに答えよ。(1) 対角線 BD の長さを求めよ。
                (2) このひし形の面積を求めよ。
  （Lv4「誘導なし:必要な補助線・求める順序を自分で構成する大問」は 2026-08-08 現在
   **未実装のまま**で、平面図形への三平方の残り1セルとして Phase E（端物）にある。
   実装したらこの行を消すこと。）
  ---
  【この form の型】g2_l51〜l54 の確率クラスタで通した骨格（given.scenario＝場面／
  小問文は context_slots／変数の設定 given.quantities を持たない＝(1)(2) とも
  asked=value）をそのまま使う。recipe は math.word_problem_pythagorean 1つで
  g3_l53/l55/l56 の3セルを賄う（C14 の word_problem 横展開）。
  【新 solver ゼロ】三平方の利用で使う計算は「斜辺を求める」と「直角をはさむ辺を
  求める」の2つだけ。前者は既存 math.pythagorean_hypotenuse、後者は中学生が実際に
  書く立式そのまま x²+a²=c² を既存 math.solve_quadratic
  （mode=solve_product_form_positive_root＝長さは正だから正の解を採る。g3_l29/l30 の
  図形立式と同じ経路）に渡す。面積は solver の出力を sympy でそのまま合成する。
  無理数になるので sympy.nsimplify(文字列) は使わない（偽の閉形式を返す既知の罠）。
  【台帳から落とした要素と理由】word_problem の frame の asked_vocab は
  {formulation, value} だけで作図小問を構造的に持てず、visual も付けない。三平方の
  利用は本来「図を読む」題材なので、図の代わりに**文章だけで図形が一意に定まる**
  場面文を書いた: ひし形は「1辺の長さ」と「対角線の一方の長さ」で合同を除いて一意に
  決まる（対角線は互いの中点で垂直に交わる）ので、図が無くても (1)(2) は一意に解ける。
  頂点名は連続文字（ABCD/BCDE…）を引いて場面を分散する。
  【level_sep】本セルは Lv3 単独（Lv4 は未実装）。Lv3 は誘導あり＝
  (1)対角線→(2)面積の2小問で、(1)の結果を使わないと(2)が出せない連なりにしている。
  【answer-first】対角線は偶数（半分が整数）・対角線の半分 < 1辺（退化しない）の組を
  recipe が候補列挙して引く。答えは無理数になってよい（台帳の example 自体が
  8cm/12cm → BD=4√7cm・面積 24√7cm² の無理数）。
  【検証】G-Q1 が全小問 double-solve。checker は params の「場面文に出ている長さ」
  （1辺・与えられた対角線）だけから solver を呼び直し、答えを独立に再計算する
  （答えは params に入れない。頂点名は params.slots 側＝numbers は数値専用）。
concepts_default: [pythagorean.word_problem_rhombus_diagonal_area]
levels:
  "3":
    signature: word_problem_rhombus_diagonal_area_guided
    recipe: math.word_problem_pythagorean
    params:
      scenario_kind: rhombus_diagonal_area
      # 1辺の長さの範囲。対角線の半分より大きい組だけを recipe が残す。
      side_range: [4, 20]
      # 与える対角線の範囲（偶数のみ採用＝半分が整数になる）。
      diagonal_range: [4, 24]
    given: [scenario]
    asked: [value, value]
    visual: none
    text: {tier: T1, template: wp_probability_guided_v1}
    hints: [steps_prefix]
    concept_tags: [pythagorean.word_problem_rhombus_diagonal_area]
    cause_tags: []
remedial:
  default_level: 3
