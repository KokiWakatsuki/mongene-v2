family: math.g3_l54.find_value
form: find_value
source_desc: |
  座標平面上の2点間の距離
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 2点の座標差を辺とし三平方で距離を直接求める。
       example: 座標平面上の2点 A(1, 2), B(4, 6) の間の距離 AB を求めよ。
  Lv3 desc: 距離の条件から座標・図形(二等辺/直角)を逆算して求める。
       example: 座標平面上に2点 A(1, 3), B(5, 1) がある。x 軸上に点 P をとり、
                PA=PB となるようにするとき、点 P の座標を求めよ。
  【設計モデル】新 solver ゼロ（recipe math.pythagorean_find_value）。
    - Lv2: x 座標の差・y 座標の差を直角をはさむ2辺とみて math.pythagorean_hypotenuse
      で距離を求める（2手）。座標軸に平行な線分（差の一方が 0）は直角三角形が
      できないので構成時に除く。
    - Lv3: 点の x 座標を文字でおき「(x−a)²+b²=(x−c)²+d²」を立てる。両辺を展開すると
      x² が消えて一次方程式になるので math.solve_linear_equation に委ねる（3手）。
      解が整数になる (a,b,c,d) だけを候補に列挙する。
  【level_sep】Lv2 は「座標の差→距離」の2手、Lv3 は「文字でおく→方程式→解く」の3手で
  op 列が異なる（何を文字に置くかがレベル差そのもの）。asked も value / coordinate と
  変わる。
concepts_default: [pythagorean.coordinate_distance]
levels:
  "2":
    signature: pythagorean_coordinate_distance
    recipe: math.pythagorean_find_value
    params:
      scenario_kind: coordinate_distance
      # 座標 4 軸 × 17 値 ＝ 83521 通りから、x・y の差がともに 0 でないものを採る
      # （約 73000 通り。閾 0.20 に必要な約250通りを大きく超える）。
      coord_domain: {int_range: [-8, 8]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_pythagorean_condition_v1}
    hints: [steps_prefix]
    concept_tags: [pythagorean.coordinate_distance]
    cause_tags: []
  "3":
    signature: pythagorean_equidistant_point_on_x_axis
    recipe: math.pythagorean_find_value
    params:
      scenario_kind: equidistant_point_on_x_axis
      # -6..6 の 13 値 4 軸（28561 通り）のうち、x1≠x2・y1²≠y2²（答えが2点の x 座標の
      # 中点に潰れない）・求める x 座標が整数、を満たすものを列挙して等確率で引く
      # ＝ **6336 通り**（列挙して実測）。
      coord_domain: {int_range: [-6, 6]}
    given: [condition]
    asked: [coordinate]
    visual: none
    text: {tier: T1, template: lf_pythagorean_condition_v1}
    hints: [steps_prefix]
    concept_tags: [pythagorean.equidistant_point_on_x_axis]
    cause_tags: []
remedial:
  default_level: 2
