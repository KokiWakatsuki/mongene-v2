family: math.g3_l54.graph_table
form: graph_table
source_desc: |
  座標平面上の2点間の距離 — 図
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 座標平面に2点をとり直角三角形を把握する。
       example: 座標平面上に2点 A(-2, 1), B(3, 4) をとり、線分 AB を斜辺とする直角
                三角形を、直角をはさむ2辺が座標軸に平行になるようにかき込め。
                また、その2辺の長さを答えよ。
  ---
  【find_value Lv2 との関係】題材は同じ2点だが、問うものが「距離という長さ」ではなく
  **どの直角三角形に落とすか**である。g3_l55 の find_value（対角線の長さ）と
  graph_table（断面を抜き出してかく）の関係とまったく同じ形。

  【設計モデル】新設 solver math.coordinate_right_triangle_legs（2点の座標だけから
  直角の頂点・横の辺・縦の辺を出す）。直角の頂点は (x2, y1)＝一方の x 座標と
  もう一方の y 座標で、**描画側で組み立て直さず solver の値をそのまま渡す**
  （対応表を2か所に持たない——立体の投影図で食い違いを踏んだときの教訓）。

  【問題図と答えの図】問題図は方眼＋与えられた2点まで（直角三角形は生徒がかき込む
  答えなので描かない）。visual_plan の element は "point_given"。答えの図では
  三角形と直角の記号を足す（`render_coordinate_triangle_solution_svg`）。

  【退化の封じ方】x の差・y の差がともに 0 でない2点だけを引く（軸に平行に並ぶと
  三角形にならない）。有界リトライで構成する。

  【dup】座標 4 軸 × 17 値（-8..8）から軸平行を除いた約 73000 通り × 点名 25 通り。
