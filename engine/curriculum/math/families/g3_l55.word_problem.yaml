family: math.g3_l55.word_problem
form: word_problem
source_desc: |
  空間図形への三平方の利用（対角線・錐体の高さと体積）の文章題
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 誘導あり:切断など設定→断面積/表面積/体積の小問が連なる。
       example: 1辺 6cm の立方体 ABCD-EFGH を、3点 A, C, F を通る平面で切る。
                次の問いに答えよ。(1) 切り口の三角形 ACF の3辺の長さを求めよ。
                (2) 三角形 ACF の面積を求めよ。
  （Lv4「誘導なし:方針・立体分割を自分で構成する融合」は本コミットの担当外。）
  ---
  【この form の型】g2_l51〜l54 の確率クラスタで通した骨格（given.scenario＝場面／
  小問文は context_slots／(1)(2) とも asked=value）をそのまま使う。recipe は
  math.word_problem_pythagorean 1つで g3_l53/l55/l56 の3セルを賄う。
  【新 solver ゼロ】底面の対角線は既存 math.pythagorean_hypotenuse（正方形のとなり
  合う2辺を直角をはさむ2辺とみる）、高さは立式 x²+(対角線の半分)²=(側辺)² を既存
  math.solve_quadratic（mode=solve_product_form_positive_root）に渡す。体積は
  底面積×高さ÷3 を sympy でそのまま合成する。無理数になるので
  sympy.nsimplify(文字列) は使わない（偽の閉形式を返す既知の罠）。
  【台帳の題材から外した判断と理由】台帳 example は「立方体を3点 A,C,F を通る平面で
  切る」だが、本セルは(a) word_problem の frame が作図小問を持てず visual も付けない
  ため切断面の位置関係を文章だけで一意に伝える負担が大きいこと、(b) レッスン表題が
  「空間図形への利用（対角線、錐体の高さと体積など）」であり find_value Lv3 の
  example（正四角錐の高さと体積）が同じ題材群の代表であることから、**正四角錐の
  高さ・体積**を採った。desc の「切断など設定→…体積の小問が連なる」の「など」の
  範囲で、誘導つき2小問（高さ→体積）という骨格は台帳どおりに保っている。
  図の代わりに、正四角錐は「底面の正方形の1辺」と「底面以外の辺（側辺）の長さ」で
  一意に決まることを場面文で明示している（頂点から底面に下ろした垂線の足は底面の
  対角線の交点）。頂点名は連続文字＋頂点1文字を引いて場面を分散する。
  【level_sep】本セルは Lv3 単独（Lv4 は未実装）。Lv3 は誘導あり＝(1)高さ→(2)体積の
  2小問で、(1)の結果を使わないと(2)が出せない連なりにしている。
  【answer-first】底面の1辺は偶数（対角線の半分の二乗が整数になる）・
  (側辺)²−(1辺)²/2 が下限以上（つぶれた錐にしない）の組を recipe が候補列挙して引く。
  【検証】G-Q1 が全小問 double-solve。checker は params の「場面文に出ている長さ」
  （底面の1辺・側辺）だけから solver を呼び直し、答えを独立に再計算する
  （答えは params に入れない。頂点名は params.slots 側＝numbers は数値専用）。
concepts_default: [pythagorean.word_problem_square_pyramid_volume]
levels:
  "3":
    signature: word_problem_square_pyramid_height_volume_guided
    recipe: math.word_problem_pythagorean
    params:
      scenario_kind: square_pyramid_height_volume
      # 底面の1辺の範囲（偶数のみ採用＝対角線の半分の二乗が整数になる）。
      base_edge_range: [4, 16]
      # 側辺（底面以外の辺）の範囲。
      lateral_edge_range: [4, 22]
      # 高さの二乗の下限（つぶれた錐＝高さがほぼ 0 の退化を避ける）。
      min_height_squared: 4
      # 頂点の名前の候補（底面の連続4文字と重ならないものだけを recipe が残す）。
      apex_candidates: [O, P, T, V, W, X]
    given: [scenario]
    asked: [value, value]
    visual: none
    text: {tier: T1, template: wp_probability_guided_v1}
    hints: [steps_prefix]
    concept_tags: [pythagorean.word_problem_square_pyramid_volume]
    cause_tags: []
remedial:
  default_level: 3
