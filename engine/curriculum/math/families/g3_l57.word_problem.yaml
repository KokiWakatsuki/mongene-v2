family: math.g3_l57.word_problem
form: word_problem
source_desc: |
  標本調査の方法と集め方（units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 現実場面を読みどの調査方法が適切か判断する。
       example: ある工場で作られる缶詰の品質を調べたい。すべての缶詰を開けて調べる
                ことはできない。この調査を全数調査と標本調査のどちらで行うのが適切か、
                理由とともに答えよ。
  ---
  【新 solver ゼロ】判定は既存の `math.judge_appropriate_survey_method`（同じ単元の
  knowledge Lv2 と共有）をそのまま呼ぶ。recipe は場面文を組むだけ。

  【knowledge Lv2 との違い】knowledge は用語の文脈（statement/term_context）を与えて
  判別させる形で、こちらは**現実の場面文**（given.scenario）を読ませる。given の型が
  違うので fp が分離し、form も違うので家族ごと別になる。

  【「理由とともに答えよ」をどう採点可能にしたか】結論を選択（ChoiceAnswer）で
  答えさせ、理由の組み立ては solution_steps が担う（C11 の他の記述セルと同じ手）。

  【dup（数え上げ）】場面16通り × 母集団の大きさ46通り＝736通り。
  **場面の種類だけだと16通りしかなく、100seed で dup 0.98 になった**（実測）。
  母集団の大きさは判断（全部調べられるか）を変えないので、第2の軸として安全に足せる。
  この数値は本文に出るので `numbers` に載せる（word_problem の params 忠実性契約）。

  【退化の封じ方】全数調査が適切な場面と標本調査が適切な場面を**両方**候補に入れる
  （片方だけだと答えが固定され、場面を読まずに当てられる）。
concepts_default: [sample_survey.judge_method_word_problem]
levels:
  "2":
    signature: sample_survey_judge_method_word_problem
    recipe: math.statistics_inquiry
    params:
      mode: judge_survey_method
      # 母集団の大きさ（答えを変えない・dup の第2軸）。場面16通り × 46 = 736 通り。
      population_range: [60, 510, 10]
      # "場面|sample（標本調査が適切）または census（全数調査が適切）"
      scene_set:
        - "ある工場で作られる缶詰の品質を調べたい。すべての缶詰を開けて調べることはできない。|sample|個"
        - "ある中学校で、生徒全員の視力を記録して健康の記録に残したい。|census|人"
        - "ある会社が作った電球が、どのくらいの時間で切れるかを調べたい。|sample|個"
        - "あるクラスで、文化祭の出し物を決めるために全員の希望を集めたい。|census|人"
        - "ある市の有権者が、選挙でどの候補者に投票したかの傾向を投票日の夜に知りたい。|sample|人"
        - "ある部活動で、部員全員の身長を記録して名簿に載せたい。|census|人"
        - "ある湖にすむ魚のおよその数を調べたい。|sample|匹"
        - "ある学校で、卒業アルバムに載せるため三年生全員の名前を確かめたい。|census|人"
        - "ある農園でとれたみかんの糖度の傾向を調べたい。すべてを切って調べることはできない。|sample|個"
        - "ある会社で、社員全員に配る制服の大きさを決めるため一人ずつの体格を調べたい。|census|人"
        - "ある県の中学生が一日にどのくらい読書をしているかの傾向を知りたい。|sample|人"
        - "ある学級で、給食の残りが出ないよう全員の好ききらいを確かめたい。|census|人"
        - "ある工場で作られたねじが、どのくらいの力で折れるかを調べたい。|sample|個"
        - "ある中学校で、修学旅行の部屋割りのため生徒全員の希望を集めたい。|census|人"
        - "ある放送局が、番組がどのくらい見られているかの傾向を知りたい。|sample|世帯"
        - "ある図書館で、蔵書がすべてそろっているかを確かめたい。|census|冊"
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [sample_survey.judge_method_word_problem]
    cause_tags: []
remedial:
  default_level: 2
