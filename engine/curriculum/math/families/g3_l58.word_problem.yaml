family: math.g3_l58.word_problem
form: word_problem
source_desc: |
  標本の取り出し方と無作為抽出（units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 場面から偏りのない抽出方法を判断する。
       example: ある市の住民全体の意見を標本調査で調べたい。次の方法のうち、偏りが
                生じにくい抽出方法はどれか。理由とともに1つ選べ。
                (ア)図書館の利用者に聞く (イ)住民全体から乱数表を使って選ぶ
                (ウ)平日の昼間に商店街で聞く
  ---
  【設計モデル】並んだ3つの方法から、母集団のすべてが同じ機会で選ばれるものを1つ選ぶ。
  solver（`math.choose_unbiased_sampling_method`）は**条件を満たす選択肢が
  ちょうど1つ**であることを確かめてから選ぶ——0個や2個の構成を黙って通さないための検算。

  【knowledge Lv2 との違い】knowledge は1つの方法について偏りの有無を判別させる形
  （`math.judge_sampling_bias`）で、こちらは**並んだ方法から選ばせる**。
  台帳 example の形をそのまま実装している。

  【dup（数え上げ）】場面10通り × 母集団の大きさ46通り＝460通り。
  **場面の種類だけだと10通りしかなく、100seed で dup 0.90 になった**（実測）。
  母集団の大きさは「同じ機会で選ばれるか」という判断を変えないので安全に足せる。

  【退化の封じ方】誤りの2つは必ず「一部の人だけが選ばれる」形にする（場所を限る／
  時間帯を限る／属性を限る）。正しい選択肢は必ず母集団全体から無作為に選ぶ方法にする。
concepts_default: [sample_survey.choose_unbiased_word_problem]
levels:
  "2":
    signature: sample_survey_choose_unbiased_word_problem
    recipe: math.statistics_inquiry
    params:
      mode: choose_unbiased
      # 母集団の大きさ（答えを変えない・dup の第2軸）。
      population_range: [60, 510, 10]
      # "場面|偏りが生じにくい方法|誤り1|誤り2"
      scene_set:
        - "ある市の住民全体の意見を標本調査で調べたい。|住民全体の名簿から乱数表を使って選ぶ|図書館の利用者に聞く|平日の昼間に商店街で聞く"
        - "ある中学校の生徒全体の読書時間を標本調査で調べたい。|全校の名簿から乱数表を使って選ぶ|図書委員に聞く|昼休みに図書室にいた生徒に聞く"
        - "ある町の住民の通勤時間を標本調査で調べたい。|住民全体の名簿から乱数表を使って選ぶ|駅前で朝に聞く|自動車を持っている家庭にだけ聞く"
        - "ある学校の生徒の睡眠時間を標本調査で調べたい。|全校の名簿から乱数表を使って選ぶ|運動部の生徒に聞く|朝いちばんに登校した生徒に聞く"
        - "ある市の家庭のごみの量を標本調査で調べたい。|市内の全世帯の名簿から乱数表を使って選ぶ|ごみ収集所に来た人に聞く|集合住宅の住民にだけ聞く"
        - "ある県の中学生のスマートフォンの使用時間を標本調査で調べたい。|県内の中学生の名簿から乱数表を使って選ぶ|携帯電話の店に来た中学生に聞く|放課後に残っていた生徒に聞く"
        - "ある学校の生徒の朝食の様子を標本調査で調べたい。|全校の名簿から乱数表を使って選ぶ|保健委員に聞く|遅刻した生徒に聞く"
        - "ある市の住民のスポーツをする時間を標本調査で調べたい。|住民全体の名簿から乱数表を使って選ぶ|体育館の利用者に聞く|休日の公園にいた人に聞く"
        - "ある中学校の生徒の通学方法を標本調査で調べたい。|全校の名簿から乱数表を使って選ぶ|自転車置き場にいた生徒に聞く|バス停で待っていた生徒に聞く"
        - "ある町の住民の買い物の様子を標本調査で調べたい。|住民全体の名簿から乱数表を使って選ぶ|商店街の来店者に聞く|平日の昼間に家にいた人に聞く"
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [sample_survey.choose_unbiased_word_problem]
    cause_tags: []
remedial:
  default_level: 2
