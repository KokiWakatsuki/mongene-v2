family: math.g3_l59.word_problem
form: word_problem
source_desc: |
  標本比率と母比率の推定（units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり:標本比率→比例式で母集団の数量を推定。
       example: ある池にいる魚の総数を調べるため、無作為に200匹の魚を調べたところ、
                そのうち印のついた魚が8匹いた。この池にはあらかじめ印をつけた魚が
                50匹放してある。(1)標本での印つきの魚の割合を求めよ。
                (2)この池の魚のおよその総数を求めよ。
  Lv3 desc: 誘導なし:何を比率とみて推定するか自分で構成。
       example: ある工場で1日に作られる大量の製品から無作為に150個を取り出したところ、
                不良品が6個含まれていた。この日に作られた製品が5000個であるとき、
                その中に含まれる不良品はおよそ何個と推定できるか求めよ。
  ---
  【この form の型】word_problem_linear.py / word_problem_system.py と同じ骨格
  （given.scenario＝場面／given.quantities＝変数の設定／小問文は context_slots）。
  数学は既存 solver math.sample_ratio_estimate / math.sample_ratio_solve_population
  （g3_l59.calculation Lv1 / g3_l60.calculation Lv2 が使っているものと同一）に委ねる
  ＝新 solver ゼロ。recipe は math.word_problem_sample_survey 1つで4セル
  （g3_l59/l60 の word_problem 全体）を賄う。params の scenario_kind が
  「場面の抽選」と「どちらの solver を呼ぶか」の対を選ぶ。
  【level_sep】Lv2 は誘導あり＝(1)標本比率→(2)母集団の2小問。あらかじめ放した印つき
  の魚の総数（既知）から母集団を math.sample_ratio_solve_population で推定する。
  Lv3 は誘導なし＝1小問。母集団の大きさ（既知）から母集団中の不良品数を
  math.sample_ratio_estimate で推定する。Lv2 と Lv3 は「場面文に出ている量／
  solver に渡す量」が入れ替わっている＝G6 の構造差（呼ぶ solver 自体が違う）。
  【answer-first】標本の大きさ・標本内の該当個数・既知個数（または母集団）の3値を
  候補列挙し、除法が割り切れる（推定値が整数になる）組だけを残して引く。
  【検証】G-Q1 が全小問 double-solve。checker は params の「場面文に出ている数値」
  だけから solver を呼び直すので、本文の数値の読み違えを検出する。答えは params に
  入れない。
concepts_default: [sample_survey.word_problem_mark_recapture]
levels:
  "2":
    signature: word_problem_sample_mark_recapture_guided
    recipe: math.word_problem_sample_survey
    params:
      scenario_kind: mark_recapture_pond
      guided: true
      # 標本の大きさ（再捕獲した数）・標本内の印つき数・あらかじめ放した印つきの
      # 総数（既知）。母集団 x = known×size/count が整数になる組だけを候補として残す
      # （recipe 側の候補列挙で除法の割り切れを保証）。
      sample_size_candidates: [120, 150, 180, 200, 220, 240, 260, 280, 300]
      sample_count_candidates: [4, 5, 6, 7, 8, 9, 10, 12, 15, 16, 18, 20]
      known_estimate_candidates: [20, 25, 30, 35, 40, 45, 50, 55, 60, 70, 80, 90, 100]
    given: [scenario, quantities]
    asked: [formulation, value]
    visual: none
    text: {tier: T1, template: wp_linear_guided_v1}
    hints: [steps_prefix]
    concept_tags: [sample_survey.word_problem_mark_recapture]
    cause_tags: []
  "3":
    signature: word_problem_sample_defect_estimate_solo
    recipe: math.word_problem_sample_survey
    params:
      scenario_kind: factory_defect_estimate
      guided: false
      # 標本の大きさ・標本内の不良品数・母集団の大きさ（既知）。推定値 =
      # population×count/size が整数になる組だけを候補として残す。
      sample_size_candidates: [100, 120, 150, 180, 200, 220, 250]
      sample_count_candidates: [3, 4, 5, 6, 7, 8, 9, 10, 12, 15, 18, 20]
      population_size_candidates: [1000, 1500, 2000, 2500, 3000, 3500, 4000, 5000, 6000, 7000, 8000]
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [sample_survey.word_problem_defect_estimate]
    cause_tags: []
remedial:
  default_level: 2
