family: math.g3_l6.calculation
form: calculation
source_desc: |
  いろいろな式の展開（置き換えや式の混じった計算）
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 複数の乗法公式を続けて使い同類項を整理する多手順。
       example: (x+3)²-(x+2)(x-5) を計算せよ。
  Lv3 desc: 共通部分を1文字に置き換えて公式適用する工夫。
       example: (a+b-3)(a+b+4) を展開せよ。
  【設計モデル】math.expand_expression が sympy.expand で展開。level_sep は mode 別 op 列:
  Lv2（expand_multi：平方と積の2つのかっこをそれぞれ展開してから同類項をまとめる2手順）／
  Lv3（expand_substitution：共通部分を1文字に置きかえ公式適用しもどす3手順）。
  dup は定数の組・文字種で分散。
concepts_default: [polynomial.expand_various]
levels:
  "2":
    signature: expand_multi
    recipe: math.expand_product
    params:
      mode: expand_multi
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_expand_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.expand_various]
    cause_tags: []
  "3":
    signature: expand_substitution
    recipe: math.expand_product
    params:
      mode: expand_substitution
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_expand_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.expand_various]
    cause_tags: []
remedial:
  default_level: 2
