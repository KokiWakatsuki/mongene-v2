family: math.g3_l9.calculation
form: calculation
source_desc: |
  乗法公式を利用した因数分解②（平方の公式の逆）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: a^2±2ab+b^2型を判別し(a±b)^2に因数分解（単段）。
       example: x²+10x+25 を因数分解せよ。
  【設計モデル】math.factor_expression が sympy.factor で (x+a)² に因数分解。answer-first で
  (x+a)² を構成し展開して given にする。単一レベル（factor_perfect_square：平方の形を確かめて
  1次式の平方で表す2手順）。dup 確保のため a を広域[-30,30]でとる。
concepts_default: [polynomial.factor_perfect_square]
levels:
  "1":
    signature: factor_perfect_square
    recipe: math.factor_polynomial
    params:
      mode: factor_perfect_square
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_factor_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.factor_perfect_square]
    cause_tags: []
remedial:
  default_level: 1
