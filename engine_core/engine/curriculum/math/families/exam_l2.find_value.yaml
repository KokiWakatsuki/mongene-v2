family: math.exam_l2.find_value
form: find_value
source_desc: |
  放物線と直線の融合（二次関数×一次関数）— 値を求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 放物線と直線を連立し交点・面積を多段で求める。
       example: 放物線 y=x² と直線 y=2x+3 の2つの交点をA、Bとする。2点A、Bの座標を
                求め、線分ABの長さと三角形OABの面積を求めよ。
  Lv4 desc: 相似・面積条件から係数や点を逆算して求める。
       example: 放物線 y=ax² と直線 y=x+4 が2点A、Bで交わり、Aの x座標が-2である。
                このとき a の値を求め、さらに三角形OABの面積を求めよ。
  ---
  【Lv3 は既存 recipe の共有】台帳 example の内容が g3_l37.find_value Lv3
  （`math.intersection_parabola_line` の mode="segment_and_area"＝交点・線分 AB の長さ・
  三角形 OAB の面積）と実質同じである。単元が違う（あちらは二次関数、こちらは入試融合）
  だけで数学は同一なので、同じ問題を二重に書き起こして食い違いを作るより、同じ資産を
  共有するほうがよいと判断した。

  【Lv4 は新設】交点の x 座標から係数 a を**逆算**する向きで、Lv3 の順方向とは
  進み方が逆になる。新設 solver `math.parabola_coefficient_from_intersection`
  （交点は直線の上にもある → yA=m·xA+b → a=yA/xA² → もう一方の交点 → 面積）。
  面積は既存の shoelace 公式（`_shoelace_area`）で求める＝新しい幾何ロジックは足さない。
  answer-first: 先に a と2交点 xA・xB を決め、直線を m=a(xA+xB)、b=−a·xA·xB で
  逆算する（実行時の判定ではなく構成時に整数を保証する）。

  【level_sep】
    Lv3 = 順方向。op 列は set_up_equation → solve_for_x → compute_y →
          compute_segment_length → compute_triangle_area。
    Lv4 = 逆方向。op 列は compute_point_on_line → solve_for_coefficient →
          find_other_intersection → compute_triangle_area。
    op 列が相異する。

  【params】Lv4 は本文に出ている数だけ（直線の傾き・切片・A の x 座標）。
  答え（a・面積）は置かない。答えが本文の数値と一致する組は構成の段階で外す。
concepts_default: [quadratic_function.intersection_with_line]
levels:
  "3":
    signature: exam_parabola_intersection_segment_area
    recipe: math.intersection_parabola_line
    params:
      mode: segment_and_area
      a_domain: {int_range: [-4, 4], exclude: [0]}
      x_domain: {int_range: [-6, 6], exclude: [0]}
    # 答えの分母・根号の中がこの単元では構造的に大きくなる（`engine.eval.answer_size`）。
    answer_size_max: {radicand: 65}
    answer_size_reason: |
      線分ABの長さは |xB − xA|・√(1 + 傾き²) なので、根号の中は 1+傾き² の形にしか
      ならない（傾き8で 65）。g3_l37.find_value.Lv3 と同じ理由。
    given: [condition]
    asked: [area]
    visual: none
    text: {tier: T1, template: lf_quadratic_intersection_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic_function.intersection_with_line]
    cause_tags: []
  "4":
    signature: exam_parabola_coefficient_from_intersection
    recipe: math.exam_parabola_coefficient_from_intersection
    params:
      a_domain: {int_range: [-4, 4], exclude: [0]}
      x_domain: {int_range: [-6, 6], exclude: [0]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_exam_linear_figure_v1}
    hints: [steps_prefix]
    concept_tags: [exam.parabola_coefficient_from_intersection]
    cause_tags: []
