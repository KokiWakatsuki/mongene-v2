family: math.exam_l2.graph_table
form: graph_table
source_desc: |
  放物線と直線の融合（二次関数×一次関数）— グラフ
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 放物線と直線が囲む図形をグラフ上で把握する。
       example: 放物線 y=x² と直線 y=x+6 が2点で交わっている。この放物線と直線を
                グラフにかき、放物線と直線が囲む部分をグラフ上で示せ。
  ---
  【既存 recipe の共有】台帳 example の内容が g3_l37.graph_table Lv2
  （`math.draw_parabola_and_line`＝放物線と直線をかき、囲まれた部分を斜線で示す）と
  同一である。同じ図を別々に書き起こすと必ず食い違うので、同じ資産を共有する。
concepts_default: [parabola_graph.enclosed_region]
levels:
  "2":
    signature: exam_parabola_line_enclosed_region
    recipe: math.draw_parabola_and_line
    params:
      a_domain: {int_range: [-10, 10], exclude: [0]}
      x_domain: {int_range: [-6, 6], exclude: [0]}
      value_bound: 16
    dup_rate_max: 0.65
    dup_rate_reason: |
      100 seed で相異 42 問（実測）。中身の軸は 交点 26 通り。
      放物線と直線の交点を扱う問題で、**交点の座標が整数になる** (係数, 交点の x) の
      組しか使えない。係数 ±1〜10・x ±1〜6 を全部当たっての実測。
      係数を ±6 から ±10 に広げたら 0.52 → 0.58 と**かえって上がった**——広げた分だけ
      条件に落ちる組が増え、通る組に集中するため。
      以前は点名・人名・使う文字を dup_key に算入していたので閾を通っていたが、
      **名前が違うだけの問題は別の問題ではない**。増やすには題材そのものを追加する。
    given: [expression, line_a, situation_params]
    asked: [draw_graph]
    visual: required
    text: {tier: T1, template: lf_parabola_line_region_v1, visual_builder: math.curve_graph}
    hints: [steps_prefix]
    concept_tags: [parabola_graph.enclosed_region]
    cause_tags: []
remedial:
  default_level: 2
