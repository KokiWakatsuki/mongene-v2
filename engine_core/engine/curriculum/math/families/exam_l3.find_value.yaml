family: math.exam_l3.find_value
form: find_value
source_desc: |
  動点と面積変化（一次関数・二次関数の利用）— 値を求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 指定区間で動点位置の図から面積を立式して求める。
       example: 1辺が10cmの正方形ABCDの辺上を、点Pが頂点Aから毎秒2cmでBを通ってCまで
                動く。点Pが辺BC上にある区間で、出発から x秒後の三角形APDの面積 y を
                x の式で表し、x=6 のときの面積を求めよ。
  Lv4 desc: 境界の場合分けを要する面積・逆算を構成して求める。
       example: 1辺が12cmの正方形の辺上を点Pが毎秒3cmで動く。三角形の面積が36cm²に
                なる時刻を、動点がどの辺上にあるかで場合分けして考え、そのような時刻
                x の値をすべて求めよ。
  ---
  【台帳 example との差と、その判断】example の経路 A→B→C だと、三角形 APD の面積は
  「辺AB上で増加 → 辺BC上で一定」の2区間しかない。すると
    Lv3: 「辺BC上の区間で y を x の式で表せ」の答えが y=（定数）になり、立式が
         成立しない（x が出てこない）。
    Lv4: 与えられた面積になる時刻が必ず1つしか立たず、「場合分けして考え」「すべて
         求めよ」が効かない（＝ゲートが素通りする退化）。
  そこで既存セル（g3_l31.word_problem Lv4）と同じく経路を A→B→C→D に延ばす。
  面積が減少に転じるので、Lv3 は辺CD上の区間で y=(s/2)(3s−vx) という x の1次式に
  なり、Lv4 は答えが2つ立って区間の見落としが失点になる。
  なお g2_l29.word_problem Lv4 の台帳 example も A→B→C→D の経路である。

  【資産の再利用】面積はすべて既存の shoelace 公式（solvers/motion.py）で求める。
  Lv4 は g3_l31.word_problem Lv4 の solver `math.solve_moving_point_area_all_times`
  をそのまま呼ぶ（form が違う＝ここでは場面文ではなく condition で与える）。
  Lv3 のみ新設 solver `math.express_interval_area_and_value`（どの辺の上にいるかを
  時刻から判定 → その区間の式 → 代入、の3段）。

  【level_sep】
    Lv3 = 区間が1つ（辺CD上）に指定されている。asked=value（式と値の組）。
          op 列は determine_which_segment → express_area_in_x → substitute_time。
    Lv4 = 区間の指定が無く、自分で場合分けする。op 列は identify_intervals →
          増加区間で解く → 一定区間に解が無いことを確かめる → 減少区間で解く →
          時刻を並べる。op 列が相異する。

  【params】`numbers` は本文に出ている数だけ（1辺・速さ・時刻／1辺・速さ・面積）。
  答え（式の係数・面積・時刻）は置かない。

  【漏洩の封じ方】答えの値が本文の数値や "cm²" 由来の 2 と一致する組は構成の段階で
  外す（G-Q5t の whitelist は given 由来）。
