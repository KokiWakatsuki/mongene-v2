      speed_candidates: [1, 2, 3, 4, 5, 6]
    dup_rate_max: 0.75
    dup_rate_reason: |
      100 seed で相異 30 問（実測）。中身の軸は (1辺, 速さ) 30 通り。
      動点が正方形の周を動く問題で、**折れ点と読み取る点が方眼の交点に乗る**
      (1辺, 速さ) の組しか使えない（目盛の間にある点は読めない）。1辺 6〜40cm・
      速さ 1〜6cm/s を全部当たっての実測。
      以前は点名・人名・使う文字を dup_key に算入していたので閾を通っていたが、
      **名前が違うだけの問題は別の問題ではない**。増やすには題材そのものを追加する。
