family: math.exam_l3.word_problem
form: word_problem
source_desc: |
  動点と面積変化（一次関数・二次関数の利用）— 文章題
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 誘導あり:区間ごとの面積を立式する小問が連なる融合。
       example: 1辺が6cmの正方形ABCDがある。点Pは頂点Aを出発し、毎秒2cmの速さで辺上を
                B、Cを通ってDまで動く。点Pが出発してから x秒後の三角形APDの面積を
                y cm²とする。(1)点Pが辺AB上にあるとき(0≦x≦3)、y を x の式で表せ。
                (2)点Pが辺BC上にあるとき(3≦x≦6)、y を x の式で表せ。
                (3)y=12 となる x の値をすべて求めよ。
  Lv4 desc: 誘導なし:場合分けとグラフ構成・逆算を自分で行う融合。
       example: 1辺が8cmの正方形ABCDの辺上を、点Pが頂点Aから毎秒1cmでB、C、Dの順に
                動く。点Pが出発してから x秒後の三角形APDの面積を y cm²とするとき、
                三角形APDの面積が正方形ABCDの面積の4分の1になるときの x の値を
                すべて求めよ。
  ---
  【Lv3 の (2) について】台帳 example のとおり、点が辺BC上にある区間では底辺も高さも
  変わらないので y は**x を含まない定数**（s²/2）になる。「x の式で表せ」に対して
  x が消えることを見抜けるかどうかがこの小問の眼目で、(1) と同じつもりで1次式を
  書くと落とす。新設 solver `math.express_constant_interval_area` はこの区間の
  内側3点で shoelace 再計算が同じ値になることを確かめてから定数を返す
  ＝「一定である」ことを主張ではなく検算で裏づける。

  【資産の再利用】(1) は g2_l29.word_problem Lv3 と同じ
  `math.express_single_interval_area`、(3) と Lv4 は g3_l31.word_problem Lv4 と同じ
  `math.solve_moving_point_area_all_times`。新しい幾何ロジックは足していない。

  【Lv4 が誘導なしである所以】求める面積が本文に**数として書かれていない**
  （「正方形の面積の4分の1」）。生徒は正方形の面積 s² を自分で求め、その4分の1を
  目標にしてから区間で場合分けする。副産物として、答えの面積が本文に出ないので
  G-Q5t の面積漏洩がそもそも起こらない。

  【level_sep】
    Lv3 = 誘導あり3小問。context_slots に (1)(2)(3) の問いを置く。
          asked=(formulation, formulation, value)。
    Lv4 = 誘導なし1小問。asked=(value) のみ。求める面積が本文に無い。
    小問数・asked・op 列がすべて相異する。

  【params】`numbers` は本文に出ている数だけ（Lv3=1辺・速さ・面積／Lv4=1辺・速さ）。
  Lv4 は面積を本文に書かないので `numbers` に置かず、checker が 1辺から s²/4 を
  組み直してから解く。

  【漏洩の封じ方】Lv4 では答えの時刻が本文の数（1辺・速さ・「4分の1」の 4 と 1・
  "cm²" 由来の 2）と一致する組を構成の段階で外す。
concepts_default: [exam.motion_guided_three_intervals]
