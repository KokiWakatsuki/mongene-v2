family: math.exam_l4.find_value
form: find_value
source_desc: |
  三平方の定理と空間図形（対角線・高さ・最短距離）— 求値
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 断面/展開に落とし三平方で対角線・高さ・体積を求める。
       example: 縦3cm、横4cm、高さ12cmの直方体ABCD-EFGHがある。対角線AGの長さを、
                断面の直角三角形に三平方の定理を用いて求めよ。
  Lv4 desc: 非自明な断面/開き方の構想を要する最短距離・体積。
       example: 底面が1辺6cmの正方形、高さが4cmの正四角錐がある。この正四角錐の
                側面上を、底面のある頂点から出発して側面をひとまわりし元の頂点に
                もどる最短の道のりを、展開図を用いて求めよ。
  ---
  【所在】recipe は `recipes/word_problem_pythagorean.py`（g3_l53〜l56 の三平方資産と
  同じモジュール。scenario_kind を足すだけ）。exam_fusion.py には置かない
  ——exam_l3=motion.py・exam_l5=word_problem_probability.py・
  exam_l6=similarity_scale_ratio.py と同じ判断。

  【find_value なのに word_problem の recipe を使う理由】中身は「場面を読んで三平方に
  落とす」で word_problem と同じで、違うのは問い文をどこに置くかだけ。frame の
  given 語彙が form で違う（find_value は scenario を許さない）ので、recipe に
  `given_key` を持たせて family が condition/scenario を選ぶ形にした。

  【Lv3 設計モデル】新 solver ゼロ。底面の対角線 √(a²+b²) を出し、それと高さを
  直角をはさむ2辺とする断面の直角三角形にもう一度あてる——**三平方の2段の適用**が
  中身。答えが整数に落ちる3辺の組（3,4,12→13 等）だけを候補にして読みやすくし、
  「立体の対角線の二乗＝3辺の二乗の和」で別経路の検算もしている。

  【Lv4 の中身と、台帳 example との差】台帳 example は正四角錐の側面を一周する
  最短の道のりだが、これは展開図の中心角が一般に無理数角になり、中学の範囲で
  閉じた形の答えにならない（成立する数値がごく限られる）。ここでは同じ
  「**非自明な開き方の構想を要する最短距離**」という desc の要件を、直方体の表面上の
  最短距離で満たす——となり合う2面の開き方は3通りあり、どれが最短かを自分で決めて
  から三平方をあてる（既存 `box_shortest_path_choose` の再利用）。3辺は相異にして
  最短が一意に決まるようにしてある。

  【level_sep】op 列が相異する。
    Lv3 = compute_base_diagonal → identify_section_right_triangle → apply_pythagorean_theorem
    Lv4 = enumerate_unfoldings → compare_three_paths → compute_shortest_path

  【dup】Lv3 = 対角線が整数になる3辺の組（2〜20 で数十通り）× 頂点名（連続8文字・19通り）。
        Lv4 = 3辺（相異）× 頂点名。既存 g3_l56 Lv4 と同じ定義域。
