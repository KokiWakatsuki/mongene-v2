family: math.exam_l4.graph_table
form: graph_table
source_desc: |
  三平方の定理と空間図形（対角線・高さ・最短距離）— 図を読む／かく
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 見取図・断面・展開図を読んで平面に落とす。
       example: 1辺が5cmの立方体の見取図が与えられている。頂点AとGを結ぶ対角線AGを
                含む断面を考えるとき、その断面に現れる直角三角形を平面上にかき出し、
                各辺の長さを示せ。
  ---
  【所在】recipe は既存の `math.box_view`（g3_l55/l56.graph_table Lv2 と同じ）に
  mode="cube_section" を足しただけ。図は `visuals/solid.py` の view="section"
  （長方形＋対角線）をそのまま使う——**exam で図の資産を要求する唯一のセル**だが、
  Phase B で作った断面ビューで足りた。

  【g3_l55 Lv2 との違い】あちらは3辺が相異なる直方体で、断面の長方形の寸法を答える。
  こちらは台帳 example のとおり**立方体**で、答えは「直角三角形の各辺の長さ」＝
  1辺・1辺の√2倍・1辺の√3倍の3つ。1つの長さから3つの無理数が並ぶところが、
  入試の空間図形で最初に身につける形になっている。

  【立方体で退化しない理由】断面の長方形は 横＝底面の対角線（1辺の√2倍）・
  縦＝1辺 なので**正方形にはならない**。「横は底面の対角線」という要点は残る。

  【問題図が立体であること】与えられた見取図を見て断面をかくセルなので、問題図
  そのものが立方体の見取図になる。visual_plan の element は "solid_given"
  （＝答えではない、与えられた図）で宣言する。frame が禁じているのは "solid"＝
  **答えの図**であって、立体を描くこと自体ではない。

  【dup】1辺（2〜20 の19通り）× 頂点名8つ（`_draw_distinct_points`）。
concepts_default: [exam.cube_section_right_triangle]
levels:
  "2":
    signature: exam_cube_section
    recipe: math.box_view
    params:
      mode: cube_section
      length_range: [2, 20]
      unit: cm
    given: [condition]
    asked: [draw_solid]
    visual: required
    text: {tier: T1, template: lf_motion_area_v1, visual_builder: math.solid}
    hints: [steps_prefix]
    concept_tags: [exam.cube_section_right_triangle]
    cause_tags: []
remedial:
  default_level: 2
