family: math.exam_l6.find_value
form: find_value
source_desc: |
  相似と面積比・体積比の融合 — 求値
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 相似比から面積比/体積比・実際の量を多段で求める。
       example: 相似な2つの立体があり、その相似比が2:3である。小さい方の立体の体積が
                16cm³であるとき、大きい方の立体の体積を、相似比から体積比を求めて計算せよ。
  Lv4 desc: 比の合成・逆算を要する非自明な量を構成して求める。
       example: 円錐を底面に平行な平面で切り、高さを上から1:2に分けた。上側の小さい
                円錐と下側の円錐台について、それぞれの体積の比を求めよ。
  ---
  【所在】recipe は `recipes/similarity_scale_ratio.py`（g3_l45/l46 の相似比資産と
  同じモジュール）。中身が既存資産の再利用なので exam_fusion.py には置かない
  ——exam_l3 を motion.py、exam_l5 を word_problem_probability.py に置いたのと同じ判断。

  【Lv3 設計モデル】新 solver ゼロ。体積比そのものは既存
  `math.similar_solid_surface_volume_ratio`（相似比の三乗）が出し、そこに
  「既知の体積からもう一方の体積を求める」1段を合成する。大きいほうの体積が
  整数になるよう、小さいほうの体積を相似比の分子の三乗の倍数として構成する。

  【Lv4 設計モデル】新 solver ゼロ。切り口から上の小円錐はもとの円錐と相似で、
  相似比は高さの比。体積比はその三乗で、円錐台は**もとの円錐から小円錐を除いた
  残り**——という引き算の合成が Lv4 の眼目（Lv3 は比をそのまま使うだけ）。
  底面の半径と高さは答えに効かない surface で、同じ比でも問題文が変わるように置く
  （dup の自由度を上げるための既知の手）。高さは分けた比で割り切れる値にする。

  【level_sep】op 列が相異する。
    Lv3 = cube_ratio_for_volume → apply_volume_ratio
    Lv4 = identify_similar_cone → cube_ratio_for_volume → subtract_for_frustum

  【dup】Lv3 = 相似比(既約・分母6まで≒11) × 体積の倍率(12) × 立体の題材(8) ≒ 1000 通り。
        Lv4 = 上下の比(3×3) × 高さの倍率(7) × 底面の半径(11) ≒ 690 通り
        （半径 2..9・高さ倍率 2..6 の 360 通りでは実測 dup_rate 0.18 と
          閾値 0.20 に近すぎたので広げた）。
concepts_default: [exam.similar_solid_volume_from_ratio]
levels:
  "3":
    signature: exam_similar_solid_volume
    recipe: math.exam_similar_solid_volume
    params:
      ratio_domain: {int_range: [1, 9]}
      scale_domain: {int_range: [1, 20]}
      # 体積が整数として自然に与えられる立体だけを並べる（球・正四面体は1辺から
      # 整数体積にならず、場面文の数値が不自然になる）。
      solid_candidates: [立体, 円柱, 円錐, 三角柱, 四角錐, 直方体, 容器, 模型]
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_similarity_scale_ratio_condition_v1}
    hints: [steps_prefix]
    concept_tags: [exam.similar_solid_volume_from_ratio]
    cause_tags: []
  "4":
    signature: exam_cone_split_volume_ratio
    recipe: math.exam_cone_split_volume_ratio
    params:
      # 分ける比は入試で実際に出る簡単な比に絞る（6:5 などは答えの比が
      # 216:1115 のように読めない大きさになり、比の問題として意味を失う）。
      upper_domain: {int_range: [1, 3]}
      lower_domain: {int_range: [1, 3]}
      height_unit_domain: {int_range: [2, 8]}
      radius_domain: {int_range: [2, 12]}
    given: [condition]
    asked: [value]
    visual: required
    text: {tier: T1, template: lf_similarity_scale_ratio_condition_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [exam.cone_split_volume_ratio]
    cause_tags: []
remedial:
  default_level: 3
