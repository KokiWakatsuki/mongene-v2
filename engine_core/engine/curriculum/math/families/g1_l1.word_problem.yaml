family: math.g1_l1.word_problem
form: word_problem
source_desc: |
  符号のついた数（0より小さい数、正・負の符号）の文章題
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 基準が明示された場面で1量を正負で表す(誘導あり)。
       example: 地点Aを基準(0m)とする。Aより120m高いB、80m低いCの高さを符号を使って表せ。
       market_ref: 教科書の活用例(気温・標高・収支)。
  ---
  【この form の型】g2_l51〜l54（確率）と同じ骨格（given.scenario＝場面のみ）。
  誘導ありで (1)(2) とも asked=value（正の向きの量・反対の向きの量を1つずつ）。
  recipe は math.word_problem_sqrt_misc（C14 の「平方根の利用＋取りこぼし」クラスタ）
  が賄う。数学は既存 solver math.represent_opposite_quantity に委ねる＝新 solver ゼロ。
  solver は「正で表すと約束した向き」「問われている量の向き」「大きさ」だけから
  符号を決める（同じ向きなら＋・反対の向きなら−）。
  【level_sep】台帳どおり1段のみ（notes:「word_problemは基準決めの1動作のみで構造的に1段」）。
  【台帳からの逸脱と理由】example の題材は標高（高い/低い）だが、向きの組は solver
  math.represent_opposite_quantity が定数表 _OPPOSITE_PAIRS で持っており、そこへ
  「高い/低い」を足すと同じ表から idx を引いている g1_l1.knowledge Lv2 の抽選列が
  ずれて既存 golden の再承認が必要になる（Open-Closed 違反）。そのため market_ref が
  挙げる活用例のうち**収支**（収入/支出）を筆頭に、既存の6組（収支・得失点・値上がり
  /値下がり・人口の増減・北/南・東/西）で場面を作り、いずれも「基準（0）を明示し、
  反対向きの2量を符号で表す」という example と同じ構造にした。
  【検証】G-Q1 が両小問 double-solve。checker は params の「場面文に出ている数値」
  （2つの量の大きさ）と向きの名前だけから solver を呼び直す（符号つきの答えは
  params に入れない）。答えの絶対値は given に現れ両符号 whitelist されるため
  G-Q5t 安全。
concepts_default: [number.word_problem_signed_reference]
levels:
  "1":
    signature: word_problem_signed_reference
    recipe: math.word_problem_sqrt_misc
    params:
      # 向きの組・量の大きさは recipe が持つ定数表から引く（大きさの候補は単位ごとに
      # 分ける＝「3000点」のような不自然な量を作らないため）。
      scenario_kind: signed_reference
    given: [scenario]
    asked: [value, value]
    visual: none
    text: {tier: T1, template: wp_probability_guided_v1}
    hints: [steps_prefix]
    concept_tags: [number.word_problem_signed_reference]
    cause_tags: []
remedial:
  default_level: 1
