family: math.g1_l10.knowledge
form: knowledge
source_desc: |
  自然数・整数の集合の用語（Lv1 想起）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 自然数・整数・数の集合の用語を想起する。
       example: 0 や負の整数を含めた、整数全体の集合を何とよぶか答えよ。
  Lv2 desc: 各集合で四則が可能か(閉じているか)を判別・例示する。
       example: 自然数の集合は、除法について閉じているといえるか。閉じていない場合はその例を1つ
                挙げて説明せよ。
  【設計モデル・要検収(Q4)】Lv1 は「説明された数の集まりの名称を答える」用語想起（term_recall_
  definition・domain=number_set・natural_number＝自然数/integer＝整数）。Lv2 は「集合が演算について
  閉じているか」を真偽表で判別する verify（judge_set_closure・自然数は減法/除法で閉じず、整数は
  除法で閉じない）。答えは「閉じている／閉じていない」の2択で数字トークンなし＝G-Q5t 素通り。
  Lv1(op=identify_description/name_concept)と Lv2(op=check_operation_result/judge_closure)は op 列が
  相異＝level_sep。dup は具体例（集合の要素の列挙）を surface に埋め込み分散。
  【§10 sanction】Lv2 example の「閉じていない場合の例を挙げよ」は単一選択では判別(閉/非閉)に畳んで
  realize した（例示は解説側で担保）。図は無し。
concepts_default: [number_set.term_recall]
levels:
  "1":
    signature: number_set_term_recall
    recipe: math.term_recall
    params:
      domain: number_set
      concept_set: [natural_number, integer]
      # 具体例の数を広めにとり dup_rate を下げる（2 concept × surface 数で分散）。
      number_domain: {int_range: [1, 99]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [number_set.term_recall]
    cause_tags: []
  "2":
    signature: number_set_closure
    recipe: math.judge_set_closure
    params:
      set_domain: [natural, integer]
      op_domain: [add, sub, mul, div]
      # 集合の要素例（正整数）を surface に埋め込み dup 分散する。
      number_domain: {int_range: [1, 99]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_set_closure_v1}
    hints: [steps_prefix]
    concept_tags: [number_set.closure]
    cause_tags: []
remedial:
  default_level: 1
