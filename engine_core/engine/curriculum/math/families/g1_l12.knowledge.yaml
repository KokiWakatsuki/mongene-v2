family: math.g1_l12.knowledge
form: knowledge
source_desc: |
  文字を使って数量を表すことの意味・利点（Lv1 規則想起）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 文字で数量を表す意味・約束を想起する。
       example: 1個 a 円の品物を b 個買ったときの代金を式で表すと ab 円となる。文字を使って数量を
                表すことの利点を1つ答えよ。
  【設計モデル・要検収(Q4)】「文字を使う利点の正しい説明を選ぶ」単一選択に realize（規則想起
  recall_rule_statement・topic=letter_meaning・単一 concept=benefit）。distractors は「計算せず答えが
  出る」「図だけで表せる」「文字は整数だけ」など、もっともらしい誤り。具体例（1本 price 円の品物を
  x 本買う場面）を surface に埋め込み dup 分散。op 列[read_rule_context, recall_correct_rule]。
  答えは説明の文で ASCII 数字トークンを含まず G-Q5t 素通り（§7.7）。Lv2（式の意味の解釈）は、
  「1個 x 円の item_a を a 個、1個 y 円の item_b を b 個買った」場面と式 a·x+b·y を構成し、その式が
  表す数量の意味を選ばせる（interpret_expression）。答えは品名で記述する ChoiceAnswer（ASCII 数字なし）
  ＝G-Q5t 素通り。誤選択肢は「単価の和(x+y)」「個数の和」「代金の差」の混同。品名・個数を surface として
  dup 分散。op 列[read_each_term_meaning, combine_term_meanings]＝Lv1 と相異で level_sep。図は無し。
concepts_default: [letter_meaning.rule_recall]
levels:
  "1":
    signature: letter_meaning_rule_recall
    recipe: math.recall_rule
    params:
      topic: letter_meaning
      concept_set: [benefit]
      # 具体例の代金の場面（price 円）を surface に埋め込み dup 分散する。
      # **具体例の単価は 10円刻みで 30〜300円**（1本270円のえん筆・1枚280円の
      # シールが出ていた）。用語の説明に添える例なので、実物の値段にする。
      number_domain: {int_set: [30, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130,
                                140, 150, 160, 180, 200, 220, 250, 280, 300]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_rule_recall_v1}
    hints: [steps_prefix]
    concept_tags: [letter_meaning.rule_recall]
    cause_tags: []
  "2":
    signature: letter_meaning_interpret
    recipe: math.interpret_expression
    params: {}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_interpret_expr_v1}
    hints: [steps_prefix]
    concept_tags: [letter_meaning.interpret_expression]
    cause_tags: []
remedial:
  default_level: 1
