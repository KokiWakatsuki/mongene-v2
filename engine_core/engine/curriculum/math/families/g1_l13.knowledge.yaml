family: math.g1_l13.knowledge
form: knowledge
source_desc: |
  乗法の記法規則（×省略・累乗）の判別（Lv1 規則想起）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 乗法の記法規則(×省略・係数・累乗)を判別する。
       example: 3×a×b を記号を省いて表すとき、数と文字はどのような順序・書き方にするか答えよ。
  【設計モデル・要検収(Q4)】「乗法の記法規則の正しい記述を選ぶ」単一選択に realize（規則想起
  recall_rule_statement・topic=notation_product_rule）。concept で correct が変わる（omit_times＝
  ×を省き数を文字の前に／power＝同じ文字の積は累乗で）。distractors は同 topic のもっともらしい誤り。
  数と文字の積／同じ文字の積の具体例を surface に埋め込み dup 分散。op 列[read_rule_context,
  recall_correct_rule]。答えは規則の文で ASCII 数字トークンを含まず G-Q5t 素通り（§7.7）。
  計算そのもの（簡約表示）は l13.calculation で別途。図は無し。
concepts_default: [notation_product_rule.rule_recall]
levels:
  "1":
    signature: notation_product_rule_recall
    recipe: math.recall_rule
    params:
      topic: notation_product_rule
      concept_set: [omit_times, power]
      # 具体例の係数を surface に埋め込み dup 分散する。
      number_domain: {int_range: [2, 40]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_rule_recall_v1}
    hints: [steps_prefix]
    concept_tags: [notation_product_rule.rule_recall]
    cause_tags: []
remedial:
  default_level: 1
