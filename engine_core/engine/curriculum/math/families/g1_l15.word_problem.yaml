family: math.g1_l15.word_problem
form: word_problem
source_desc: |
  数量の表し方（割合・速さなど）＝数量を文字式で表す(units.generated.yaml の desc/
  example を正として転記)。
  Lv1 desc: 速さ・割合など1関係の数量を文字式で表す(誘導あり)。
       example: 時速4kmでx時間歩いたときに進む道のりを、xを使った式で表せ。
  Lv2 desc: 割合の増減・単位変換など複数関係を組合せて文字式で表す。
       example: 分速60mでa分間歩いた道のりは何kmか、aを使った式で表せ。
  Lv3 desc: 複数量が絡む場面をゴールから自分で構成して文字式で表す(誘導なし)。
       example: ある商品をx個仕入れ、1個あたりy円で全部売った。仕入れ総額がz円である
                とき、全体の利益をx, y, zを使った式で表せ。
  ---
  【この form の型】g1_l12.word_problem と同じ骨格（1小問・誘導なし・asked=
  formulation・答えは式）。recipe は math.word_problem_expression（g1_l12/l15 共通・
  scenario_kind で場面を選ぶ）。数学は既存 solver に委ねる＝新 solver ゼロ:
    Lv1: math.simplify_notation の product_basic（速さ×時間の単項式）。
    Lv2: math.compute_monomial_expression の mul_div_chain（÷1000を逆数の乗法に
         直して約分する乗除混在の単項式）。
    Lv3: math.evaluate_letter_expression の combine_linear（xy − z の double-solve
         検証。ただし xy と z は同類項ではないので、MR に乗せる steps は「売上→利益」
         という場面の言葉を recipe が自分で書く。solver の steps はそのまま使わない）。
  【level_sep】Lv1 単項式（速さ×時間）→ Lv2 単位変換で分数係数（÷1000）→ Lv3 多文字の
  差（x·y − z、同類項でない2項の構成）。「何を文字に置くか」ではなく式の構造で段を作る。
  【dup】Lv3 は場面文に数値が一切現れない（x, y, z の3文字と品名だけ）ため、dup の軸が
  品名と文字の選び方しかない。letter_expr.py の `_NOTATION_LETTERS`（10文字）から
  相異なる3つを引くことで variety を確保する（x, y, z 固定ではなく毎回引き直す）。
  【G-Q5t】答え表示が場面文に部分文字列で現れないことを有界リトライで確認する
  （letter_expr.py の `_leaks` を再利用）。
  【検証】G-Q1 が1小問を double-solve。答えは params に入れない。
concepts_default: [letter_expr.word_problem_distance_letter]
levels:
  "1":
    signature: word_problem_expression_distance
    recipe: math.word_problem_expression
    params:
      scenario_kind: distance_letter
      # 速さの軸だけ（数十通り）では狭すぎる（dup_rate が閾を超える）ため、文字の
      # 選び方（x/t/n/m）も広く振って combos を確保する（brief §dup: 数値の軸が
      # 少ないセルは文字の選び方を振る）。動詞は現実的な速さの範囲を大きく外れない
      # よう「進む」中心の緩い言い回しに揃える。
      # **動作と速さは1つのトークンで持つ**（`動作|下限|上限`・時速km）。
      # 前は別々に引いていて「時速9kmで歩く」「時速39kmで走る」が出ていた。
      motion_candidates: [歩く|3|6, 走る|8|15, 自転車で進む|12|20,
                          自動車で進む|30|60, ジョギングで進む|7|11]
      letter_candidates: [x, t, n, m, a, b, k, p]
    given: [scenario]
    asked: [formulation]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [letter_expr.word_problem_distance_letter]
    cause_tags: []
  "2":
    signature: word_problem_expression_unit_convert
    recipe: math.word_problem_expression
    params:
      scenario_kind: unit_convert
      # 定義域は狭めない。答えの分母（1000/gcd(速さ,1000)）が50を超える速さだけを
      # recipe が落とす（EVALUATION D-31。分速106m で `53a/500 km` になっていた）。
      # 同上（分速m）。歩く＝分速50〜100m（時速3〜6km）、走る＝分速150〜250m。
      motion_candidates: [歩く|50|110, 走る|140|260, 自転車で進む|180|320,
                          ジョギングで進む|120|180]
      # 分母を絞ったぶんの組み合わせを、文字の選び方で取り戻す（Lv1 と同じ手）。
      letter_candidates: [a, t, n, m, b, k, p, y]
    given: [scenario]
    asked: [formulation]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [letter_expr.word_problem_unit_convert]
    cause_tags: []
  "3":
    signature: word_problem_expression_profit_multi_letter
    recipe: math.word_problem_expression
    params:
      scenario_kind: profit_multi_letter
      item_candidates: [ノート, 消しゴム, えん筆, ボールペン, かさ, タオル, マグカップ,
                        ぬいぐるみ, 文房具, 雑貨, 貯金箱, コップ]
    given: [scenario]
    asked: [formulation]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [letter_expr.word_problem_profit_multi_letter]
    cause_tags: []
remedial:
  default_level: 1
