family: math.g1_l16.calculation
form: calculation
source_desc: |
  代入と式の値（式に数を代入して式の値を求める）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 正の数を1文字に代入して式の値を求める1手順。
       example: x=4 のとき、3x-5 の値を求めよ。
  Lv2 desc: 負の数・分数・累乗・複数文字を代入し符号に注意して求める複数手順。
       example: x=-3 のとき、-x²+2x の値を求めよ。
  答えは数値（整数・SymbolicAnswer）。独立ソルバ evaluate_substitution（sympy で代入・厳密評価）
  で再計算する（double-solve）。Lv1（正の数を代入して計算する2手）/ Lv2（負の数をかっこつきで
  代入し累乗を符号に注意して計算する3手）で op 列を変える＝level_sep。
  設計注記: 例は整数代入。desc の「分数・複数文字」は Lv2 の代表題材（負の数×累乗の符号処理＝
  最も差がつく技能。market_ref）に畳んで実装し、忠実性は preview 検収に委ねる（§10 の sanction 手順）。
  定数答えの G-Q5t は問題文の数値がすべて given 由来（whitelist・両符号）なので漏洩しない。図は無し。
concepts_default: [letter_expr.substitute_positive]
levels:
  "1":
    signature: substitute_positive
    recipe: math.compute_substitution
    params:
      # a·x + b に正の整数を代入する（1次式・正の値）。
      mode: substitute_positive
      coeff_domain: {int_range: [-9, 9], exclude: [0]}
      const_domain: {int_range: [-9, 9], exclude: [0]}
      value_domain: {int_range: [2, 9]}
    given: [expression, input_value]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_substitute_value_v1}
    hints: [steps_prefix]
    concept_tags: [letter_expr.substitute_positive]
    cause_tags: []
  "2":
    signature: substitute_signed
    recipe: math.compute_substitution
    params:
      # c2·x² + c1·x に負の整数を代入する（累乗・符号処理）。
      mode: substitute_signed
      coeff_domain: {int_range: [-4, 4], exclude: [0]}
      const_domain: {int_range: [-9, 9], exclude: [0]}
      value_domain: {int_range: [-9, -2]}
    given: [expression, input_value]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_substitute_value_v1}
    hints: [steps_prefix]
    concept_tags: [letter_expr.substitute_signed]
    cause_tags: []
remedial:
  default_level: 1
