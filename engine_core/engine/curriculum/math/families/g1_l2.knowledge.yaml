family: math.g1_l2.knowledge
form: knowledge
source_desc: |
  絶対値・数直線の用語（Lv1 想起）と、負の数を含む2数の大小判別（Lv2 verify）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 絶対値・数直線の用語と意味を想起する。
       example: 「絶対値」とは数直線上で何を表すか、言葉で答えよ。
  Lv2 desc: 負の数を含む大小関係(絶対値が大きいほど小さい等)を判別・適用する。
       example: -3 と -8 ではどちらが大きいか。理由も一言で述べよ。
  【設計モデル・要検収(Q4)】Lv1 は「説明された対象の名称を答える」用語想起（汎用ソルバ
  term_recall_definition・domain=number・絶対値/数直線/原点/符号）。具体例の正の数 n を説明文に
  埋め込み surface として dup 分散。Lv2 は2数の大小を判別する verify（大きいほうを選ぶ・大小は
  数直線の右左で決まる）。Lv1(op=identify_description/name_concept)と Lv2(op=
  compare_on_number_line/judge_larger)は op 列が異なり level_sep を満たす。答えはテキスト/数の
  ChoiceAnswer。Lv2 の答えは given の2数のいずれか＝両符号 whitelist で G-Q5t 素通り。図は無し。
concepts_default: [number.term_recall]
levels:
  "1":
    signature: number_term_recall
    recipe: math.term_recall
    params:
      domain: number
      concept_set: [absolute_value, number_line, origin, sign]
      # 具体例の数を広めにとり dup_rate を下げる（4 concept × surface 数で分散）。
      number_domain: {int_range: [1, 99]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [number.term_recall]
    cause_tags: []
  "2":
    signature: number_compare_magnitude
    recipe: math.compare_signed_numbers
    params:
      # 負の数を含む2数（少なくとも一方は負）。答えは大きいほうの数。
      number_domain: {int_range: [-12, 12]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_compare_numbers_v1}
    hints: [steps_prefix]
    concept_tags: [number.compare_magnitude]
    cause_tags: []
remedial:
  default_level: 1
