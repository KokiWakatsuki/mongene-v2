family: math.g1_l20.word_problem
form: word_problem
source_desc: |
  不等式の作り方（不等号の種類と意味）＝数量関係を不等式で表す
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 『以上・以下・未満』を不等号に対応させ単純な関係を表す(誘導あり)。
       example: 1個 x 円の品物を5個買ったときの代金が、1000 円以下であった。この関係を不等式で表せ。
  Lv2 desc: 複数量・境界の含み方に注意して不等式で立式する。
       example: ある数 x を4倍して3を引いた数が、20 より大きく、かつ x に15を加えた数未満である。この関係を不等式で表せ。
  ---
  【この form の型】g1_l19.word_problem（math.word_problem_relation）の不等式版。
  scenario_kind を変えるだけで同じ recipe を使う（Eq → Le/Gt/Lt）。asked=formulation
  のみ（値を求めない）。
  【level_sep】Lv1 は片辺が定数（count·x ≦ total）。Lv2 は両辺に文字＋2つの不等式
  （bound < mult·x − sub かつ mult·x − sub < x + add）。答えの機械表現は
  Tuple(Gt, Lt)（本文の記述順）。sympy の Eq/Le と同様 srepr は決定的なので
  G-Q1 の double-solve はそのまま通る（実験で確認済み・core 変更なし）。
  【検証】G-Q1 が唯一の小問を double-solve。答え（式）は自由変数 x を含むため、
  G-Q5t は display 全体の部分文字列一致だけを見る。
concepts_default: [inequality.word_problem_simple]
levels:
  "1":
    signature: word_problem_inequality_price_count
    recipe: math.word_problem_relation
    params:
      scenario_kind: inequality_price_count
      count_domain: {int_range: [2, 20]}
      # **予算は品物の相場 × 個数を 100円単位に切り上げて作る**（recipe が計算する）。
      # 前は 100〜3000 の整数を個数と無関係に引いていて「代金が1153円以下であった」
      # （端数）や「おにぎりを8個買った代金が400円以下」（1個50円のおにぎり）が
      # 出ていた。品名トークンの `|下限|上限` が相場（10円刻み）。
      item_candidates:
        [パン|個|100|250, ノート|冊|100|250, りんご|個|100|300, ボールペン|本|80|250,
         おにぎり|個|100|200, 消しゴム|個|50|200, ドーナツ|個|100|250,
         キャンディ|個|20|80, ジュース|本|100|200, 牛乳|本|100|250,
         鉛筆|本|50|150, シール|枚|10|100]
    given: [scenario]
    asked: [formulation]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [inequality.word_problem_simple]
    cause_tags: []
  "2":
    signature: word_problem_inequality_both_sides
    recipe: math.word_problem_relation
    params:
      scenario_kind: inequality_both_sides
      # mult=1 は「1倍して」が不自然なので除外（2以上）。
      mult_domain: {int_range: [2, 9]}
      sub_domain: {int_range: [1, 20]}
      bound_domain: {int_range: [5, 60]}
      add_domain: {int_range: [1, 30]}
    given: [scenario]
    asked: [formulation]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [inequality.word_problem_both_sides]
    cause_tags: []
remedial:
  default_level: 1
