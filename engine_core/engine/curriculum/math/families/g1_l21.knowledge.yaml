family: math.g1_l21.knowledge
form: knowledge
source_desc: |
  方程式・解の用語（Lv1 想起）と、ある値が解かの判別（Lv2 verify）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 方程式・解・等式の性質の用語を想起する。
       example: 方程式を成り立たせる文字の値のことを何とよぶか答えよ。
  Lv2 desc: ある値が解か判別する・等式の性質のどれを使うか判別する。
       example: x=3 は方程式 2x-1=5 の解であるかどうか、代入して確かめて答えよ。
  【設計モデル・要検収(Q4)】Lv1 は「説明された対象の名称を答える」用語想起（domain=equation・
  concept_set=[equation, solution]・distractors に紛らわしい係数/項を混ぜる）。Lv2 は候補値を
  代入して両辺一致で判定する verify 型（値で答えが変わる）。Lv1(op=identify_description/
  name_concept)と Lv2(op=substitute_candidate/judge_solution)は op 列が異なり level_sep を満たす。
  answer-first で真の解 x0 から方程式を組み、is_solution=偽は x0 とずらした候補を出す。答えは
  テキストの ChoiceAnswer＝G-Q5t 素通り（§7.7）。図は無し。
concepts_default: [equation.term_recall]
levels:
  "1":
    signature: equation_term_recall
    recipe: math.term_recall
    params:
      domain: equation
      concept_set: [equation, solution]
      coeff_domain: {int_range: [-9, 9]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [equation.term_recall]
    cause_tags: []
  "2":
    signature: equation_verify_solution
    recipe: math.verify_equation_solution
    params:
      coeff_domain: {int_range: [-9, 9]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_verify_solution_v1}
    hints: [steps_prefix]
    concept_tags: [equation.verify_solution]
    cause_tags: []
remedial:
  default_level: 1
