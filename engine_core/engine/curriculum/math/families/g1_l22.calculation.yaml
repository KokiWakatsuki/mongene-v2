family: math.g1_l22.calculation
form: calculation
source_desc: |
  移項による方程式の解き方（移項を使って一次方程式を解く）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 1回の移項で解ける方程式1手順。
       example: 移項を使って x-6=10 を解け。
  Lv2 desc: 両辺に文字・複数回移項を要する方程式の複数手順。
       example: 7x-4=2x+11 を解け。
  答えは解 x=定数（整数・SymbolicAnswer）。独立ソルバ solve_linear_equation（sympy.solve）で
  解き直す（double-solve）。Lv1（x+b=c を数の項を移項して解く2手）/ Lv2（ax+b=cx+d を
  文字は左辺・数は右辺に移項→整理してわる2手）で op 列を変える＝level_sep（transpose_constant
  vs transpose_both）。定数答えの G-Q5t は問題文の数値がすべて given 由来（whitelist・両符号）
  なので漏洩しない。図は無し。
concepts_default: [equation.solve_by_transpose]
levels:
  "1":
    signature: transpose_constant
    recipe: math.compute_linear_equation
    params:
      # x + b = c（answer-first: c=x0+b）。移項（数の項を反対の辺へ）。
      # 域を広めにとり dup_rate を下げる（組合せが x0×b の2自由度のみのため）。
      mode: transpose_constant
      solution_domain: {int_range: [-12, 12], exclude: [0]}
      const_domain: {int_range: [-12, 12], exclude: [0]}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_solve_equation_transpose_v1}
    hints: [steps_prefix]
    concept_tags: [equation.solve_by_transpose]
    cause_tags: []
  "2":
    signature: transpose_both
    recipe: math.compute_linear_equation
    params:
      # a·x + b = c·x + d（両辺に文字・a≠c・answer-first: d=(a-c)·x0+b）。移項を複数回。
      mode: transpose_both
      solution_domain: {int_range: [-6, 6], exclude: [0]}
      coeff_domain: {int_range: [2, 7]}
      rhs_coeff_domain: {int_range: [1, 6]}
      const_domain: {int_range: [-9, 9], exclude: [0]}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_solve_equation_v1}
    hints: [steps_prefix]
    concept_tags: [equation.solve_by_transpose_both_sides]
    cause_tags: []
remedial:
  default_level: 1
