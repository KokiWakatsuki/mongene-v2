family: math.g1_l23.calculation
form: calculation
source_desc: |
  かっこや小数・分数を含む方程式（かっこを展開して解く）
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: かっこを展開して解く一次方程式の複数手順。
       example: 3(x-2)=x+4 を解け。
  Lv3 desc: 分母を払う・小数を整数化する係数変換を伴い解く(前処理段)。
       example: (x-1)/2 - (2x-3)/5 = 1 を解け。
  答えは解 x=定数（整数・SymbolicAnswer）。独立ソルバ solve_linear_equation（sympy.solve）で
  解き直す（double-solve）。Lv2 は answer-first で q=(a-c)·x0+a·p を逆算（a≠c で非退化）・op 列
  ＝[expand_parentheses, transpose_and_solve]。Lv3 は (x+p)/d1 ±(m·x+s)/d2 = c を answer-first で
  構成（各項が x0 で整数値 kp/ks になるよう p≡-x0 mod d1・s≡-m·x0 mod d2 で逆算し c=kp±ks・
  分母を払った後の x 係数 d2±m·d1≠0 で非退化）・op 列＝[clear_denominators, expand_and_transpose, solve]。
  定数答えの G-Q5t は given 数値が whitelist（両符号）されるため漏洩しない。図は無し。
concepts_default: [equation.solve_by_expand_parens]
levels:
  "2":
    signature: expand_parens
    recipe: math.compute_linear_equation
    params:
      # a(x + p) = c·x + q（a は |a|≥2・c≠a で非退化）。
      mode: expand_parens
      solution_domain: {int_range: [-9, 9], exclude: [0]}
      coeff_domain: {int_range: [2, 9]}
      rhs_coeff_domain: {int_range: [1, 9]}
      const_domain: {int_range: [-9, 9], exclude: [0]}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_solve_equation_v1}
    hints: [steps_prefix]
    concept_tags: [equation.solve_by_expand_parens]
    cause_tags: []
  "3":
    signature: clear_denominators_two
    recipe: math.compute_linear_equation
    params:
      # (x + p)/d1 ± (m·x + s)/d2 = c（かっこ＋分数）。分子の定数は小さく保ちつつ各項が
      # x0 で整数値になる（割り切れる）ものだけ引く。
      mode: clear_denominators_two
      solution_domain: {int_range: [-9, 9], exclude: [0]}
      denominator_set: [2, 3, 4, 5]
      num_coeff_domain: [1, 2]
      num_const_domain: {int_range: [-9, 9], exclude: [0]}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_solve_equation_v1}
    hints: [steps_prefix]
    concept_tags: [equation.solve_by_clear_denominators]
    cause_tags: []
remedial:
  default_level: 2
