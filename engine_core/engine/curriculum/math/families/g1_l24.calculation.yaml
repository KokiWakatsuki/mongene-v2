family: math.g1_l24.calculation
form: calculation
source_desc: |
  比例式とその解き方（比の性質で比例式を解く）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: a:b=c:x の形をたすきがけで解く1手順。
       example: 比例式 3:4 = 9:x を解け。
  Lv2 desc: 文字を含む項・分数を含む比例式を整理して解く複数手順。
       example: 比例式 (x+1):6 = 5:3 を解け。
  答えは解 x=定数（整数・SymbolicAnswer）。独立ソルバ solve_linear_equation（sympy.solve）で
  解き直す（double-solve）。★表示（比例式 a:b=c:x）と solver 用の式（クロス乗算した線形式）は
  別物なので、recipe が params に両方を持たせ _build_eq を使う。Lv1（cross_multiply）は
  answer-first で a,b,t から c=a·t・x0=b·t を構成し a·x=b·c を渡す・op 列＝[cross_multiply,
  solve_proportion]。Lv2（cross_multiply_expand）は (x+p):b=c:d を x0+p=c·t・b=t·d で構成し
  d·(x+p)=b·c を渡す・op 列＝[cross_multiply, expand_parentheses, transpose_and_solve]（op 列相異＝
  level_sep）。定数答えの G-Q5t は given 数値が whitelist（両符号）されるため漏洩しない
  （加えて答え x0 が表示中の整数と一致しないよう構成でガード）。文章題（立式）は C14（T3・M1）。図は無し。
concepts_default: [equation.solve_proportion]
levels:
  "1":
    signature: proportion_cross_multiply
    recipe: math.compute_linear_equation
    params:
      # a : b = c : x（たすきがけ a·x=b·c）。answer-first: c=a·t・x0=b·t（a≠b・t≥2）。
      mode: cross_multiply
      ratio_domain: {int_range: [2, 9]}
      scale_domain: {int_range: [2, 6]}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_solve_proportion_v1}
    hints: [steps_prefix]
    concept_tags: [equation.solve_proportion]
    cause_tags: []
  "2":
    signature: proportion_cross_multiply_expand
    recipe: math.compute_linear_equation
    params:
      # (x + p) : b = c : d（文字を含む項）。answer-first: x0 と小さな p から N=x0+p を作り、
      # 左辺分母 b と N の既約比を右比 c:d とする（分子定数 p を小さく保つ）。
      mode: cross_multiply_expand
      solution_domain: {int_range: [-9, 9], exclude: [0]}
      num_const_domain: {int_range: [-9, 9], exclude: [0]}
      denom_domain: {int_range: [2, 9]}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_solve_proportion_v1}
    hints: [steps_prefix]
    concept_tags: [equation.solve_proportion_linear]
    cause_tags: []
remedial:
  default_level: 1
