family: math.g1_l26.calculation
form: calculation
source_desc: |
  方程式の利用（過不足の問題）＝立式後の方程式を解く
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 過不足で得た一次方程式を解く。
       example: 過不足の問題から得た方程式 4x+7=5x-3 を解け。
  答えは解 x=定数（人数・整数・SymbolicAnswer）。過不足の方程式は「両辺に文字」型なので
  既存の transpose_both 構成（a·x+b=c·x+d・answer-first で d=(a-c)·x0+b）をそのまま流用し、
  signature を shortage_equation として大域一意にする（solver/recipe のコード変更なし＝
  capability 償却の実例）。op 列＝[transpose_terms, combine_and_divide]。文章題（立式）は
  C14（T3・M1）で、本セルは「立式後の方程式を解く1動作」。定数答えの G-Q5t は given 数値が
  whitelist されるため漏洩しない。図は無し。
concepts_default: [equation.solve_shortage]
levels:
  "1":
    signature: shortage_equation
    recipe: math.compute_linear_equation
    params:
      # a·x + b = c·x + d（過不足＝両辺に文字・正の係数・人数 x0 は正）。transpose_both を流用。
      mode: transpose_both
      solution_domain: {int_range: [4, 15]}
      coeff_domain: {int_range: [2, 7]}
      rhs_coeff_domain: {int_range: [2, 7]}
      const_domain: {int_range: [-9, 9], exclude: [0]}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_solve_equation_v1}
    hints: [steps_prefix]
    concept_tags: [equation.solve_shortage]
    cause_tags: []
remedial:
  default_level: 1
