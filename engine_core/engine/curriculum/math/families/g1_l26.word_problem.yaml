family: math.g1_l26.word_problem
form: word_problem
source_desc: |
  方程式の利用（過不足の問題）＝同じ総数を2通りに表して立式する
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 同一の総数を2通りに表して等式を立て解く(誘導あり)。
       example: 何人かの子どもに画用紙を配る。1人に4枚ずつ配ると7枚余り、1人に5枚ずつ配ると
                3枚足りない。子どもの人数を求めよ。
  Lv3 desc: 条件が複雑な過不足・場合分けを要する設定を自分で構成する(誘導ゆるい)。
       example: 長いすに生徒を座らせる。1脚に5人ずつ座ると10人が座れず、1脚に6人ずつ座ると
                最後の1脚だけ3人になり、いすはちょうど埋まった。生徒の人数を求めよ。
  ---
  recipe は共通の math.word_problem_linear_equation（scenario_kind で場面を選ぶ）。
  【level_sep】Lv2 は誘導あり2小問・式は a·x+s = b·x−t（両辺に文字＝mode transpose_both）。
  Lv3 は誘導なし1小問・式は a·x+r = b·(x−1)+q（かっこを含む＝mode word_linear）で、
  さらに**文字と問われる量が違う**（x は「いすの脚数」だが問われるのは「生徒の人数」）。
  op 列・小問数・答えの量がすべて違う＝G6 の構造差。
  【answer-first と非退化】
   Lv2: 人数 x0・1人分 a・b=a+step（step≥1 なので a<b＝x が消えない）・余り s を引き、
        足りない数 t=(b−a)·x0−s を逆算する。surplus_domain の上限(4) <
        people_domain の下限(5) ≦ (b−a)·x0 なので t≥1 が構成時に保証される。
   Lv3: 脚数 x0・1脚 a 人・b=a+1・最後の1脚の q 人（1≦q≦a）を引き、あふれる人数
        r=x0−a−1+q を逆算する。seat_domain の下限(8) > per_domain の上限(6) なので r≥1。
  【求める量が x と違う場合】scene が answer_coeff=(m,n) を宣言し、答えは m·x+n。
  Lv3 は (a, r)＝生徒数 = a·（脚数）+ r。checker も同じ係数で最後の一手まで再計算する
  ので、この合成も独立に検証される（G-Q1）。
concepts_default: [equation.word_problem_surplus_shortage]
levels:
  "2":
    signature: word_problem_surplus_shortage
    recipe: math.word_problem_linear_equation
    params:
      scenario_kind: surplus_shortage
      guided: true
      people_domain: {int_range: [5, 15]}
      per_domain: {int_range: [3, 6]}
      # step は 1〜2（3 だと足りない枚数が数十枚になり場面が不自然になる）。
      step_domain: {int_range: [1, 2]}
      # t≥1 の保証（上のコメント）: surplus の上限は people の下限より小さく取る。
      surplus_domain: {int_range: [1, 4]}
      person_candidates: [子ども|人, 生徒|人, 部員|人, 児童|人]
      object_candidates: [画用紙|枚, 色紙|枚, カード|枚, シール|枚, 折り紙|枚]
    given: [scenario, quantities]
    asked: [formulation, value]
    visual: none
    text: {tier: T1, template: wp_linear_guided_v1}
    hints: [steps_prefix]
    concept_tags: [equation.word_problem_surplus_shortage]
    cause_tags: []
  "3":
    signature: word_problem_seat_shortage_exact
    recipe: math.word_problem_linear_equation
    params:
      scenario_kind: seat_shortage
      guided: false
      # r≥1 の保証（上のコメント）: seat の下限は per の上限より大きく取る。
      seat_domain: {int_range: [8, 16]}
      per_domain: {int_range: [4, 6]}
      person_candidates: [生徒|人, 部員|人, 参加者|人, 見学者|人]
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [equation.word_problem_seat_shortage]
    cause_tags: []
remedial:
  default_level: 2
