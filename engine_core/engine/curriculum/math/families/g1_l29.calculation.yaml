family: math.g1_l29.calculation
form: calculation
source_desc: |
  比例の意味と式（y=ax）（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: y=axにxを代入しyを求める1手順。
       example: y=3xについて、x=5のときのyの値を求めよ。
  Lv2 desc: 負・分数の比例定数で対応する値を求める複数手順。
       example: y=-3/4 x について、x=8のときのyの値を求めよ。
  【設計モデル】新規 solver math.evaluate_direct_proportion(a, x0, mode)。mode="basic"
  （Lv1・正整数の比例定数）は代入→計算の2手順、mode="signed"（Lv2・負や分数の比例定数）は
  符号確認→代入→計算の3手順で op 列が相異する（level_sep・鉄則④）。linear.py の
  evaluate_linear_at_x（b=0相当）と概念的に同型だが、比例・比例定数という独立概念の
  専用 solver として新設する（narrationも「比例定数」の語で統一）。
concepts_default: [direct_proportion.evaluate_at_x]
levels:
  "1":
    signature: direct_proportion_evaluate_basic
    recipe: math.evaluate_direct_proportion
    params:
      # 比例定数 a(≠0・正の整数)・代入する x0(≠0)。組合せ 19*20=380 通り。
      mode: basic
      slope_domain: {int_range: [1, 19]}
      x_domain: {int_range: [-10, 10], exclude: [0]}
    given: [expression, input_value]
    asked: [value]
    visual: none
    text: {tier: T1, template: prop_evaluate_direct_v1}
    hints: [steps_prefix]
    concept_tags: [direct_proportion.evaluate_at_x]
    cause_tags: []
  "2":
    signature: direct_proportion_evaluate_signed
    recipe: math.evaluate_direct_proportion
    params:
      # 比例定数 a(≠0・負の整数または分数)・代入する x0(≠0)。
      mode: signed
      slope_domain: {frac_range: {num: [-9, 9], den: [2, 4]}, exclude: [0]}
      x_domain: {int_range: [-9, 9], exclude: [0]}
    given: [expression, input_value]
    asked: [value]
    visual: none
    text: {tier: T1, template: prop_evaluate_direct_v1}
    hints: [steps_prefix]
    concept_tags: [direct_proportion.evaluate_at_x]
    cause_tags: []
remedial:
  default_level: 1
