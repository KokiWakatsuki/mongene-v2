family: math.g1_l29.word_problem
form: word_problem
source_desc: |
  比例の意味と式（y=ax）の利用＝場面を比例の式にして値を求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 比例する2量の場面を式にし値を求める(誘導あり)。
       example: 1mの重さが4gの針金がある。この針金x mの重さをy gとする。
                (1) yをxの式で表せ。(2) この針金15mの重さは何gか求めよ。
  Lv3 desc: 複数量・単位変換を含む比例場面を自分で立式する(誘導ゆるい)。
       example: 分速80mで歩く人がいる。歩いた時間と進んだ道のりは比例する。
                この人が20分で歩く道のりは何kmか。式を立てて求めよ。
  ---
  【この form の型】word_problem_linear/system と同じ骨格（given.scenario＝場面／
  given.quantities＝変数の設定・誘導ありのみ／小問文は context_slots）を使うが、
  答えは方程式を「解く」のではなく比例の式 y=ax を「決めて目標のxを代入する」
  2段構成になる（word_problem_proportion.py 参照）。数学は既存 solver
  math.solve_direct_proportion_from_point（「1mあたりag」はx0=1の点(1,a)そのもの）
  と math.evaluate_direct_proportion（xにあてはめてyを求める）に委ねる＝新 solver
  ゼロ。recipe は math.word_problem_proportion 1つで g1_l29・g1_l33 の4セルを賄う。
  【level_sep】Lv2 は誘導あり＝(1)yをxの式で表せ→(2)値の2小問。Lv3 は誘導なし＝
  1小問（値のみ・自分で立式）で、さらに道のり(m)をkmに直す最後の一手
  （convert_unit）が増える＝小問数と steps の op 列がどちらも違う。
  【answer-first】比例定数a（1mあたりの重さ・分速）と目標値（長さ・時間）を先に引き、
  Lv3 は a×時間が1000の倍数になる組だけを候補に残す（km に直しても端数が出ない）。
  【検証】G-Q1 が全小問 double-solve。checker は params の数値だけから a を求め直し・
  値を求め直す。答えは params に入れない。誘導ありセルの目標値（15m等）は本文の
  数値ではなく (2) の小問文（context_slots.ask_value）に現れる——x はあくまで一般
  の変数（y=4x は15に依存しない）で、g1_l24.word_problem の quantities に目標値を
  置く型と同じく、テンプレの3ブロックのどこかに数値がある、という契約を保つ。
concepts_default: [direct_proportion.word_problem_rate]
levels:
  "2":
    signature: word_problem_direct_proportion_rate
    recipe: math.word_problem_proportion
    params:
      scenario_kind: direct_rate
      guided: true
      # (1mあたりの重さ, 求める長さ) の組合せは 12(rate) × 24(length 2..25) ×
      # 8(item) = 2304 通りで十分に広い。
      rate_candidates: [2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 14, 15]
      length_range: [2, 25]
      item_candidates: [針金, ロープ, 銅線, 番線, たこ糸, ビニールひも, 電線, 毛糸]
    given: [scenario, quantities]
    asked: [formulation, value]
    visual: none
    text: {tier: T1, template: wp_linear_guided_v1}
    hints: [steps_prefix]
    concept_tags: [direct_proportion.word_problem_rate]
    cause_tags: []
  "3":
    signature: word_problem_direct_proportion_unit_convert
    recipe: math.word_problem_proportion
    params:
      scenario_kind: direct_unit_convert
      guided: false
      # (分速, 歩いた時間) は「道のり(m)が1000の倍数」という制約で絞り込む
      # （recipe が候補列挙する）。分速の候補と時間域を広く取って組合せを確保する。
      # **人が歩く速さは分速50〜100m（時速3〜6km）。** 前は 250 まで許していて
      # 「分速250mで歩く生徒」＝時速15kmになっていた（人は歩けない）。
      # 道のりが km で割り切れる組は、時間の幅で確保する。
      speed_candidates: [50, 60, 75, 80, 100]
      minutes_range: [5, 120]
      km_max: 12
      person_candidates: [人, 生徒, 男の子, 女の子, 中学生, 先生]
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [direct_proportion.word_problem_unit_convert]
    cause_tags: []
remedial:
  default_level: 2
