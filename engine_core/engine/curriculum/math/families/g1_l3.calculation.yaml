family: math.g1_l3.calculation
form: calculation
source_desc: |
  正の数・負の数の加法を計算する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 2数の加法（同符号・異符号）を1手順で計算する。
       example: (-7)+(-5) を計算せよ。
  Lv2 desc: 3項以上・分数小数を含む加法を複数手順で計算する。
       example: (-2/3)+0.5+(-1/6) を計算せよ。
  答えは定数（整数または既約分数・SymbolicAnswer）。独立ソルバ
  evaluate_numeric_expression（sympy で厳密評価）で再計算。Lv1（符号を決めて絶対値を計算）/
  Lv2（符号のついた項の和にまとめて計算）で op 列を変える＝level_sep。
  定数答えの G-Q5t は問題文の数値がすべて given 由来（whitelist）なので漏洩しない。
concepts_default: [signed_number.add_pair]
levels:
  "1":
    signature: addition_pair
    recipe: math.compute_signed_arithmetic
    params:
      # 2数の加法（整数）。和が 0 に退化しないよう構成で保証。範囲を広めにとり dup を下げる。
      mode: addition_pair
      int_domain: {int_range: [-13, 13], exclude: [0]}
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_calc_evaluate_v1}
    hints: [steps_prefix]
    concept_tags: [signed_number.add_pair]
    cause_tags: []
  "2":
    signature: addition_terms
    recipe: math.compute_signed_arithmetic
    params:
      # 3項の加法（分数・小数・整数の混在）。和が 0 に退化しないよう最後の項を絞る。
      mode: addition_terms
      term_kinds: [frac, dec, int]
      int_domain: {int_range: [-9, 9], exclude: [0]}
      frac_domain: {frac_range: {num: [-9, 9], den: [2, 9]}}
      # 答えの分母に上限（定義域は狭めない）。分数と小数を各項で独立に引くので、
      # 分母 9 と 7 の最小公倍数 63 に小数の 10 と 5 が掛かって 614/315 が出ていた。
      answer_denominator_max: 12
    given: [expression]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_calc_evaluate_v1}
    hints: [steps_prefix]
    concept_tags: [signed_number.add_terms]
    cause_tags: []
remedial:
  default_level: 1
