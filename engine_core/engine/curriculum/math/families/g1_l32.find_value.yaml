    recipe: math.solve_direct_proportion_from_point
    params:
      mode: fraction
      x_fraction_domain: {int_range: [2, 12]}
      multiplier_domain: {int_range: [-9, 9]}
    given: [condition]
    asked: [expression]
    visual: none
    text: {tier: T1, template: prop_solve_direct_from_point_v1}
    hints: [steps_prefix]
    concept_tags: [direct_proportion.solve_from_point]
