family: math.g1_l33.word_problem
form: word_problem
source_desc: |
  反比例の意味と式（y=a/x）の利用＝場面を反比例の式にして値を求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 反比例する2量の場面を式にし値を求める(誘導あり)。
       example: 面積が24cm²の長方形の縦をx cm、横をy cmとする。
                (1) yをxの式で表せ。(2) 縦が8cmのとき横は何cmか求めよ。
  Lv3 desc: 複数条件の反比例場面を自分で立式する(誘導ゆるい)。
       example: ある仕事を4人ですると6日かかる。この仕事をする人数x人と、
                かかる日数y日は反比例する。この仕事を8人でするとき、何日で
                終わるか。式を立てて求めよ。
  ---
  【この form の型】word_problem_proportion.py の共通骨格（g1_l29 と同じ recipe・
  同じ2段構成: aを決める→式y=a/x→目標のxをあてはめて値を求める）を使う。数学は
  既存 solver math.solve_inverse_proportion_from_point（Lv3・具体的な1組の対応
  から a=x0*y0 を求める）と math.evaluate_inverse_proportion（mode=forward・
  aとxからyを求める）に委ねる＝新 solver ゼロ。
  【level_sep】Lv2 は面積という「積そのもの」が a として本文に直接与えられるので、
  点の代入を経ずに y=a/x を直接組み立てる（solver 不要・sympy 直書き）。Lv3 は
  「4人で6日」という具体的な1組の対応から a を求める一手（solve_inverse_
  proportion_from_point の substitute_point）が余分に入る＝「a を直接与えるか、
  点から求めるか」が構造差（G6）。加えて Lv2 は誘導あり2小問・Lv3 は誘導なし
  1小問。小問数・a の決め方・steps の op 列がすべて違う。
  【answer-first】Lv2 は面積 a と縦の長さ（横=a/縦も整数・かつ縦≠横で「長方形」の
  題材と矛盾しない）の組だけを候補に残す。Lv3 は人数×日数=a が変えたあとの人数で
  割り切れる組だけを候補に残す（answer-first・端数が出ない）。
  【検証】G-Q1 が全小問 double-solve。checker は params の数値だけから a を求め直し・
  値を求め直す。答えは params に入れない。誘導ありセルの目標値（縦8cm）は本文の
  数値ではなく (2) の小問文（context_slots.ask_value）に現れる——g1_l29 と同じ
  「x は一般の変数」の理由（詳細は g1_l29.word_problem の source_desc 参照）。
concepts_default: [inverse_proportion.word_problem_area]
levels:
  "2":
    signature: word_problem_inverse_proportion_area
    recipe: math.word_problem_proportion
    params:
      scenario_kind: inverse_area
      guided: true
      # (面積, 縦の長さ) は「面積を縦で割り切れる・縦≠横・横も範囲内」で絞り込む
      # （recipe が候補列挙する）。area 139通り × side 39通りの掛け合わせから
      # 条件を満たす組を残すので、実効の組合せ数は十分広い（check_cell.py で実測）。
      # **面積は約数の多い数だけ・縦横の比は6倍まで。** 前はこの2つが無く、
      # 「面積が77cm²の長方形」（7×11 の1通りしかない）や「面積72cm²・縦36cm→横2cm」
      # （18倍の細長い帯）が出ていた。実物の面積は 24・36・48・60 のような数。
      area_range: [12, 360]
      side_range: [2, 60]
      area_min_divisors: 6
      ratio_max: 6
    given: [scenario, quantities]
    asked: [formulation, value]
    visual: none
    text: {tier: T1, template: wp_linear_guided_v1}
    hints: [steps_prefix]
    concept_tags: [inverse_proportion.word_problem_area]
    cause_tags: []
  "3":
    signature: word_problem_inverse_proportion_worker_days
    recipe: math.word_problem_proportion
    params:
      scenario_kind: inverse_worker_days
      guided: false
      # (最初の人数, 最初の日数, 変えたあとの人数) は「人数を変える・割り切れる・
      # 答えが本文の数値と衝突しない」で絞り込む（recipe が候補列挙する）。
      # **人数×日数（のべ人日）は 40 まで**（recipe が絞る）。前は独立に引いて
      # いたので「草むしりを3人ですると24日」＝のべ72人日という、
      # 場面として成り立たない仕事量になっていた。
      workers_candidates: [2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20, 24, 25, 30, 36, 40]
      days_candidates: [2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 18, 20, 24, 25, 30, 36]
      person_days_max: 40
      job_candidates: [仕事, 作業, 工事, 引っ越し作業, 草むしり, 資料の印刷]
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [inverse_proportion.word_problem_worker_days]
    cause_tags: []
remedial:
  default_level: 2
