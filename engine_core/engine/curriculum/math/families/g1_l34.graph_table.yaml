family: math.g1_l34.graph_table
form: graph_table
source_desc: |
  反比例のグラフの書き方と特徴（双曲線）（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 双曲線のグラフから対応する値を読む。
       example: 反比例y=6/xのグラフ(双曲線)がある。このグラフ上でx=2のときのyの値を、
                グラフから読み取って答えよ。
  Lv2 desc: 表で対応値を求め点をとり双曲線を2つの枝で正確にかく。
       example: y=8/x について、x=1,2,4,8および-1,-2,-4,-8に対応するyの値を表にまとめ、
                それらの点を座標平面上にとって双曲線を2つの枝でかけ。
  Lv3 desc: 複数の双曲線を比較し定数の正負大小・条件から特定する。
       example: 同じ座標平面上に、y=4/x、y=12/x、y=-6/x の3本の双曲線がある。ア〜ウのグラフの
                うち、第2・第4象限にあるものと、原点から最も離れて位置するものをそれぞれ選べ。
  【設計モデル】曲線描画は visual 層の curve_kind="hyperbola" 経路（math.curve_graph）を使う。
  Lv1 は「読む」（図に双曲線を描く・答えは y の値）、Lv2 は「かく」（問題図は空の方眼・答えは
  GraphAnswer・模範解答図は双曲線つき）、Lv3 は「比べる」（問題図は空の方眼・答えは比例定数の
  組）で asked と op 列がどれも相異＝level_sep。
concepts_default: [inverse_proportion.read_value_from_graph]
levels:
  "1":
    signature: read_value_on_hyperbola_graph
    recipe: math.read_hyperbola_graph_value
    params:
      # 組合せは格子点 (x0, y0) の2軸（a = x0*y0）。全列挙して一様に引く。制約後の総数は 376 通り。
      x_abs_max: 12
      y_abs_max: 12
      coeff_abs_max: 48
      coeff_abs_min: 6
    given: [expression, situation_params]
    asked: [read_point]
    visual: required
    text: {tier: T1, template: propg_read_hyperbola_value_v1, visual_builder: math.curve_graph}
    hints: [steps_prefix]
    concept_tags: [inverse_proportion.read_value_from_graph]
    cause_tags: []
  "2":
    signature: draw_hyperbola_from_table
    recipe: math.draw_hyperbola_from_table
    params:
      # 組合せは (比例定数 a, 表に並べる x の集合)。coeff_domain は「16 以下の約数を
      # 4つ以上もち、対応する y も 16 以下」になる値だけを列挙してある（方眼に収まる）。
      # 表のサイズ 3/4 と合わせて 620 通り。
      coeff_domain:
        int_set: [6, 8, 10, 12, 14, 15, 16, 18, 20, 24, 28, 30, 32, 36, 40, 42, 45, 48,
                  56, 60, 70, 72, 80, 84, 90, 96, 112, 120,
                  -6, -8, -10, -12, -14, -15, -16, -18, -20, -24, -28, -30, -32, -36,
                  -40, -42, -45, -48, -56, -60, -70, -72, -80, -84, -90, -96, -112, -120]
      table_size_domain: {int_set: [3, 4]}
      table_abs_max: 16
    given: [expression, data_table]
    asked: [draw_graph]
    visual: required
    text: {tier: T1, template: propg_draw_hyperbola_v1, visual_builder: math.curve_graph}
    hints: [steps_prefix]
    concept_tags: [inverse_proportion.draw_hyperbola]
    cause_tags: []
  "3":
    signature: compare_three_hyperbolas
    recipe: math.compare_hyperbolas
    params:
      # 比例定数の大きさの候補。負1本・絶対値最大は正1本、を全列挙して構成する。
      a_domain: {int_set: [2, 3, 4, 6, 8, 9, 10, 12]}
    given: [expression]
    asked: [read_slope_intercept]
    visual: required
    text: {tier: T1, template: propg_compare_hyperbolas_v1, visual_builder: math.linear_graph}
    hints: [steps_prefix]
    concept_tags: [inverse_proportion.compare_hyperbolas]
    cause_tags: []
remedial:
  default_level: 1
