family: math.g1_l34.knowledge
form: knowledge
source_desc: |
  双曲線は2つの枝・軸に交わらない・aの符号で象限が決まる特徴を判別する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 双曲線は2つの枝・軸に交わらない・aの符号で象限が決まる特徴を判別する。
       example: 反比例y=a/xのグラフである双曲線について、次の文の正誤を答えよ。
                「a>0のとき、双曲線は第1象限と第3象限にある。」また、双曲線はx軸・y軸と
                交わるかどうか答えよ。
  【設計モデル】新設 solver math.judge_hyperbola_quadrants（is_a_positive bool だけから、
  双曲線がどの象限にあるかを判別。2つの枝からなり軸に交わらないことは符号によらない
  不変の事実として correct 文に含める）。
concepts_default: [inverse_proportion.judge_hyperbola_quadrants]
levels:
  "1":
    signature: judge_hyperbola_quadrants
    recipe: math.judge_hyperbola_quadrants
    params:
      # **比例定数は教材にありうる大きさに戻した**（前は -500〜500 で、
      # 「反比例 y=263/x」が出ていた。中1の反比例で扱う比例定数ではない）。
      # 答えは a の符号だけで決まるので、値を広げても問題の中身は1つも増えない
      # ——広げていたのは dup_rate を通すためだけだった。
      a_domain: {int_range: [-60, 60]}
    # 問題空間は符号2通り×比例定数120通りしかない（答えは符号だけで決まる）。
    # 数を現実に戻すほうが先なので、重複は仕様として宣言する。
    dup_rate_max: 0.40
    dup_rate_reason: |
      双曲線がどちらの部分にあるかは比例定数の符号だけで決まるので、問いの中身は
      2通りしかない。残りの多様性は比例定数の値（±1〜60）だけで、これを広げると
      「y=263/x」のような中1で扱わない式になる。
    # 実装した問いは spec の example（「次の文の正誤を答えよ。『a>0のとき、双曲線は
    # 第1象限と第3象限にある。』」）と文が違う。理由は2つ:
    #   ① example のままだと**問いと答えが食い違う**（正誤を問うているのに、答えは
    #      「右上と左下の部分にある」という場所の記述で、正/誤ではない）
    #   ② 「象限」は中学の教科書に無い用語（高校で扱う）
    # desc の「aの符号で象限が決まる特徴を判別する」は、2つの場所のどちらかを選ばせる
    # 形で満たしている。戻すときは①②の両方を解くこと。
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: prop_judge_hyperbola_quadrants_v1}
    hints: [steps_prefix]
    concept_tags: [inverse_proportion.judge_hyperbola_quadrants]
    cause_tags: []
remedial:
  default_level: 1
