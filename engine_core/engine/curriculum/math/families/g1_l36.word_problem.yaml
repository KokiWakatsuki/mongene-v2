family: math.g1_l36.word_problem
form: word_problem
source_desc: |
  比例・反比例を利用して身のまわりの問題を解く（units.generated.yaml の desc/example
  を正として転記）。
  Lv2 desc: 比例/反比例のどちらかを見抜き式を立て解く(誘導あり)。
       example: 毎分3Lずつ水を入れると満水まで20分かかる水そうがある。毎分x Lずつ
                入れるとき満水までy分かかるとする。(1) yはxに比例するか反比例するか
                答え、yをxの式で表せ。(2) 毎分5Lずつ入れると何分で満水になるか求めよ。
  Lv3 desc: 複数量・グラフと絡む場面を自分で立式・場合分けして解く(誘導ゆるい)。
       example: 妹は分速60mで家を出発した。その5分後、姉が分速90mで同じ道を追いかけた。
                姉が出発してからx分後の、姉と妹それぞれの家からの道のりを考え、姉が妹に
                追いつくのは姉が出発してから何分後か求めよ。
  ---
  【この form の型】word_problem_linear/system/proportion と同じ骨格
  （given.scenario＝場面／given.quantities＝変数の設定・誘導ありのみ／小問文は
  context_slots）を使う。recipe は math.word_problem_proportion_frequency 1つで
  g1_l36・g1_l59 の4セルを賄う（C14 の word_problem 横展開）。数学は既存 solver
  （math.solve_inverse_proportion_from_point / math.evaluate_inverse_proportion /
  math.solve_direct_proportion_from_point / math.evaluate_direct_proportion /
  math.intersection_of_two_lines）に委ねる＝新 solver ゼロ。
  【level_sep】
   Lv2: 1つの関係。**比例か反比例かが seed ごとに変わる**（variant=inverse/direct）
        ので「見ぬく」が実際に働く（数値の大小ではなく関係の型が動く）。誘導あり
        2小問＝(1)立式（asked=formulation）→(2)値（asked=value）。
   Lv3: **2つの関係を同時に**扱う。1つの場面から「割合と時間は反比例」「量と時間は
        比例」の**両方**を自分で立てて、2つの量を答える。1小問・誘導なし。
        ★もとは「追いかけて追いつく」場面で、遅い側の道のりが y = vs·x + vs·h ＝
        **中2「1次関数」**だった（2026-08-19 の外部評価で指摘。台帳 example 自体が
        中2 の内容）。desc「複数量・自分で立式」は中1 の2つの関係でも満たせるので、
        desc を残して場面を差し替えた。
  「何を文字に置くか」（場面が与える x,y ↔ 自分で置く「追いかけた側の経過時間」）と
  「関係の本数」（1本 ↔ 2本の比較）がどちらも動く。
  【g1_l27.word_problem Lv3 との違い】同じ追いつき場面だが、あちらは
  math.solve_linear_equation で1本の方程式を解く経路。こちらは g1_l36 の題材
  （「複数の関係を1つのグラフ上で比較し交点等を読む」）に合わせ、2つの関係を直線と
  みて交点を求める経路にした（steps の op 列も form_expression →
  equate_expressions → read_x_coordinate で別物）。
  【台帳から外した点】Lv2 (1) の台帳文は「比例するか反比例するか答え、**かつ** 式で
  表せ」の2問合成だが、word_problem の asked_vocab は {formulation, value} のみで
  「判別」を独立の小問として持てない。判別は (1) の答えの表示に含める
  （display="反比例する、y = 60/x"／機械表現 srepr は式そのもので G-Q1 は式で
  突き合わせる）ことで題材を落とさずに収めた。
  【answer-first】比例定数と目標値を先に引き、答えが整数になり、かつ**答えが本文の
  どの数値とも一致しない**組だけを候補に残す（G-Q5t の漏洩誤検出を構成時に潰す）。
  【検証】G-Q1 が全小問 double-solve。checker は params の「本文に出ている数値」だけ
  から solver を呼び直し、式と値を独立に再計算する（答えは params に入れない）。
concepts_default: [proportion.word_problem_judge_and_use]
levels:
  "2":
    signature: word_problem_proportion_judge_and_use
    recipe: math.word_problem_proportion_frequency
    params:
      scenario_kind: judge_and_use
      # 反比例側は「容量 r0*m0 が r1 で割り切れる」、比例側は「r0*m1 が本文の数値と
      # 一致しない」で recipe が候補列挙する。どちらの variant も同じ候補域を使う。
      rate_candidates: [2, 3, 4, 5, 6, 8, 9, 10, 12, 15]
      minutes_range: [4, 30]
    given: [scenario, quantities]
    asked: [formulation, value]
    visual: none
    text: {tier: T1, template: wp_linear_guided_v1}
    hints: [steps_prefix]
    concept_tags: [proportion.word_problem_judge_and_use]
    cause_tags: []
  "3":
    signature: word_problem_proportion_meet_two_motions
    recipe: math.word_problem_proportion_frequency
    params:
      scenario_kind: meet_two_motions
      # 満水の量 rate0*minutes0 が rate1 で割り切れ、答え（時間・水の量）が
      # 本文のどの数値とも一致しない組だけを recipe が残す。
      rate_candidates: [2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20, 24]
      minutes_range: [4, 30]
      # ★**容器の語が満水の量を決める。** 満水量は rate0×minutes0 で最大720L。
      # 「空のプールに毎分8Lで27分で満水」＝216L のプールは成り立たない（浴槽以下）。
      # G-WK の読み手が見つけた。数の範囲は中1の比例として正しいので、
      # **この大きさで成り立つ容器だけ**にする（プール・ため池は桁が違う）。
      vessel_candidates: [水そう, タンク, 貯水そう, 水タンク, コンテナ, 給水タンク]
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [proportion.word_problem_meet_two_motions]
    cause_tags: []
  "4":
    # ★台帳 Lv4 example は「1辺12cmの正方形の周上を点Pが動く…面積が最大になるときと、
    # 面積が18cm²になるときのxの値をすべて求めよ」＝**動点と区分線形**で、これは
    # 中2「1次関数の利用」の内容だった（2026-08-19 の外部評価で指摘。ほぼ同型の問題が
    # g2_l29 と入試対策 第3回にも載っている）。中1 の比例・反比例では扱えない。
    # 台帳が問うている形（式を立てる＋「どの範囲にあるとき」を答える）を保ったまま、
    # **反比例の変域**に差し替えた。反比例は減少する関係なので変域の端が入れかわり、
    # そこが中1 の山場になる。
    signature: word_problem_max_area_and_times
    recipe: math.word_problem_max_area_and_times
    params:
      # 面積は約数の多い数（変域の両端で横が整数になる組を作るため）。
      area_candidates: [24, 36, 48, 60, 72, 84, 96, 108, 120, 144, 168, 180, 240]
      side_candidates: [2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20, 24]
      shape_candidates: [長方形, 長方形の花だん, 長方形の畑, 長方形の紙, 長方形の板,
                         長方形の敷物, 長方形の看板, 長方形の花壇]
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [proportion.word_problem_max_area_and_times]
    cause_tags: []
remedial:
  default_level: 2
