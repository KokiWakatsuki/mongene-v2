family: math.g1_l37.graph_table
form: graph_table
source_desc: |
  直線・線分・半直線と角、点と直線の距離 — 図を読む
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 図から線分・角・点と直線の距離を読み取る。
       example: 点Pと直線ℓをかいた図がある。点Pから直線ℓへ垂線を引いたとき、その
                垂線の足をHとする。図の中で「点Pと直線ℓとの距離」を表している線分は
                どれか答えよ。
  ---
  【3セル共通の投資】g1_l37 / g2_l32 / g2_l44 の graph_table Lv1 は単元がばらばらだが
  問い方が同じ（図を見て、その中の要素を記号で選ぶ）。frame の asked に
  `read_figure_element` を足し、`visuals/plane_figure.py`（素の平面図）を1本起こして
  3セルで共有する。solver も `solvers/figure_reading.py` にまとめてある。

  【答えを図に描かない】距離を表す線分に印をつけない。描いてよいのは**与えられた条件**
  である直角の記号だけ（問題文が「垂線を引いたときの足を H とする」と言っている）。

  【選択肢の作り】妨害はすべて図に描かれている線分（点と直線上の他の点を結ぶ2本、
  直線上の2点を結ぶ1本）にする。図に無いものを混ぜると消去法で解けてしまう。

  【dup】点名4つ（26文字から相異に引く＝35万通り超）× 直線名3 × 垂線の足の位置 ×
  点の高さ。
concepts_default: [line_angle_terms.read_point_line_distance]
levels:
  "1":
    signature: identify_distance_segment
    recipe: math.identify_distance_segment
    params:
      line_name_candidates: ["ℓ", "m", "n"]
      # 垂線の足の横位置（%）と点の高さ（px）。答えに効かない surface。
      foot_percent_domain: {int_range: [30, 65]}
      height_domain: {int_range: [80, 140]}
    given: [condition]
    asked: [read_figure_element]
    visual: required
    text: {tier: T1, template: lf_motion_area_v1, visual_builder: math.point_and_line}
    hints: [steps_prefix]
    concept_tags: [line_angle_terms.read_point_line_distance]
    cause_tags: []
remedial:
  default_level: 1
