family: math.g1_l39.graph_table
form: graph_table
source_desc: |
  回転移動した図形を読む/中心と角を指定して回転させてかく
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 回転移動した図形を読む/中心と角を指定して回転させてかく。
       example: 方眼上に三角形ABCがあり、点Oが定められている。この三角形を、
                点Oを中心として時計の針と反対回りに90°回転移動した図形をかけ。
  Lv2 desc: 90°180°など特定角で複数点を正確に回転させて示す。
       example: 座標平面上に三角形があり、頂点はA(2,1)、B(5,1)、C(2,3)である。
                この三角形を、原点を中心として180°回転移動したとき、移動後の
                3頂点の座標をそれぞれ答え、図示せよ。
  Lv3（回転の中心や角を条件から特定して構成する・作図）は本セルでは扱わない
  （逆問題＝構成が別種で工数が重いため次段対応）。
  【設計モデル】新設 solver math.rotate_polygon_features（頂点座標・回転の中心・
  回転角(反時計回り・90/180/270°のみ)だけから移動後の座標を再計算・GraphAnswer）。
  Lv1/Lv2 は同じ solver を再利用するため、given のキー名を polygon_points(Lv1)／
  polygon_coordinates(Lv2) と分けて level_sep(G-FP)を担保する。
concepts_default: [polygon_transform.rotate]
levels:
  "1":
    signature: rotate_polygon_grid
    recipe: math.rotate_polygon_grid
    params:
      coord_domain: {int_range: [-6, 6]}
      center_domain: {int_range: [-4, 4]}
      angle_domain: [90, 180, 270]
    given: [polygon_points, move_spec]
    asked: [draw_transformed_polygon]
    visual: required
    text: {tier: T1, template: lf_polygon_transform_grid_v1, visual_builder: math.polygon_grid_only}
    hints: [steps_prefix]
    concept_tags: [polygon_transform.rotate]
    cause_tags: []
  "2":
    signature: rotate_polygon_coordinate
    recipe: math.rotate_polygon_coordinate
    params:
      coord_domain: {int_range: [-6, 6]}
      center_domain: {int_range: [-4, 4]}
      angle_domain: [90, 180, 270]
    given: [polygon_coordinates, move_spec]
    asked: [draw_transformed_polygon]
    visual: required
    text: {tier: T1, template: lf_polygon_transform_coordinate_v1, visual_builder: math.polygon_coordinate}
    hints: [steps_prefix]
    concept_tags: [polygon_transform.rotate]
    cause_tags: []
  "3":
    signature: find_rotation_center
    recipe: math.find_rotation_center
    params:
      coord_domain: {int_range: [-6, 6]}
      center_domain: {int_range: [-4, 4]}
      angle_domain: [90, 180, 270]
    given: [polygon_coordinates, move_spec]
    asked: [read_point]
    visual: required
    text: {tier: T1, template: lf_polygon_find_center_coordinate_v1, visual_builder: math.polygon_pair_coordinate}
    hints: [steps_prefix]
    concept_tags: [polygon_transform.find_rotation_center]
    cause_tags: []
remedial:
  default_level: 1
