family: math.g1_l39.knowledge
form: knowledge
source_desc: |
  回転移動の意味と性質(中心からの距離・回転角一定)を判別する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 回転移動の意味と性質(中心からの距離・回転角一定)を判別する。
       example: 回転移動について、次の文の正誤を答えよ。「対応する点は、回転の
                中心からの距離がすべて等しい。」また、対応する点と回転の中心を
                結んでできる角を何というか答えよ。
  【設計モデル】新設 solver math.judge_transformation_invariant（topic="rotation"固定・
  回転移動で対応する点と回転の中心との距離は等しいという恒真の性質を判別。具体的な
  回転の中心・角度は surface で dup 分散、性質そのものには無関係）。
concepts_default: [transformation_invariant.rotation]
levels:
  "1":
    signature: judge_transformation_invariant_rotation
    recipe: math.judge_transformation_invariant
    params:
      topic: rotation
      # **回転の角は教材に出る角だけ。** 前は 1〜359 から引いていて
      # 「点Hを中心として254°回転移動した」が出ていた（実物は 90°・180°）。
      # 角の値は答え（対応する点と中心からの距離の関係）に一切関係しない。
      angle_domain: {int_set: [30, 45, 60, 90, 120, 135, 150, 180, 210, 240, 270, 300]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_judge_transformation_invariant_v1}
    hints: [steps_prefix]
    concept_tags: [transformation_invariant.rotation]
    cause_tags: []
remedial:
  default_level: 1
