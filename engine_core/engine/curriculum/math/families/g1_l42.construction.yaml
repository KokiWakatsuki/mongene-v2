family: math.g1_l42.construction
form: construction
source_desc: |
  角の二等分線の作図（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 角の二等分線を基本手順で作図する。
       example: 下の図に∠AOBが与えられている。定規とコンパスだけを使って、∠AOBの
                二等分線を作図せよ。作図に用いた線は残すこと。
  Lv2 desc: 2辺から等距離の点・角の二等分の性質を使った作図に正確に適用する。
       example: ∠XOYの内部に点があるとする。角の2辺OX、OYから等しい距離にある点が
                並ぶ線を、作図によって求めよ。作図に用いた線は残すこと。
  【台帳からの読み替え】Lv2 の example は「2辺から等距離の点が並ぶ線」＝二等分線
  そのものを問うており、Lv1 と作図手順が同一になってしまう（op 列が分離しない）。
  そこで desc の「2辺から等距離の点」を主にとり、**二等分線と、2辺の端を結ぶ線分との
  交点として点Pを求める**形にした（標準問題集で最も多い出題形でもある）。
  【この form の型】問題文は固定、動くのは図（角の大きさ・2辺の長さ・記号名）。
  問題図は与えられた角だけ。弧と二等分線が入った模範解答図は solution_svg_ref に置く。
  【level_sep】Lv1 は基本作図の3手（頂点中心の弧・2辺上の点からの弧・二等分線）。
  Lv2 はそこへ「線分との交点をとる」「角の二等分線の性質で確かめる」が積み増される。
  【検証】answer は GraphAnswer。①recipe は「その向きが2辺のなす角を二等分するか」を
  cos の等式（分母を払った整数式）で確かめ、点Pは「二等分線上」かつ「線分の内側」で
  確かめる。②G-Q1 が params（頂点と2辺の方向ベクトル）だけから独立ソルバ
  （math.angle_bisector_of_angle / math.equidistant_point_from_two_sides）で解き直す。
  【厳密性】二等分線の向きは u/|u|+v/|v| で一般に無理数になるため、2辺の方向は
  **長さが整数の格子ベクトル**（(3,4) など）からだけ引く。すると向きは u|v|+v|u| と
  いう整数ベクトルになり、交点も有理点に閉じる。
concepts_default: [construction.angle_bisector_basic]
