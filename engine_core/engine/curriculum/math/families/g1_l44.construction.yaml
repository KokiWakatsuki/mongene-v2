family: math.g1_l44.construction
form: construction
source_desc: |
  作図の利用（units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 1つの基本作図で条件を満たす点/線を作図する(誘導あり)。
       example: 2点A、Bが与えられている。2点A、Bから等しい距離にある点の集まりを、
                基本作図を1つ使って作図せよ。作図に用いた線は残すこと。
  Lv3 desc: 2つの基本作図の交点として条件を満たす点を作図する(組合せ)。
       example: 3点A、B、Cが与えられている。3点A、B、Cから等しい距離にある点Pを、
                作図によって求めよ。作図に用いた線は残すこと。
  Lv4 desc: どの作図を使うか方針から自分で構成する(誘導なし)。
       example: 三角形ABCが与えられている。辺BC上にあり、2辺AB、ACから等しい距離に
                ある点Pを、作図によって求めよ。どの基本作図を使うかは自分で判断すること。
                作図に用いた線は残すこと。
  【この form の型】問題文は固定、動くのは図（点の配置・三角形の形・記号名）。
  問題図は与えられた点/三角形だけ。弧と作図線の入った模範解答図は solution_svg_ref。
  【level_sep】台帳の3段がそのまま手数の差になる。Lv2 は「どの基本作図か決める」1手＋
  垂直二等分線の3手（計4手）。Lv3 は垂直二等分線を2本ひいて交点をとる8手。Lv4 は
  誘導が無いので「方針を立てる」1手が先頭に立ち、角の二等分線3手＋対辺との交点2手の
  計6手になる。op 列は3レベルで相異する。
  【検証】answer は GraphAnswer。①recipe は条件そのもの——Lv2「中点を通り線分に垂直」、
  Lv3「3点からの距離がすべて等しい」、Lv4「角を二等分し、辺BCの内側にある」——で
  確かめる。②G-Q1 が params（点の座標と記号）だけから独立ソルバ
  （math.locus_equidistant_two_points / math.circumcenter_of_three_points /
  math.point_on_side_equidistant_from_two_sides）で解き直して features を突き合わせる。
  【退化の排除】Lv3 は3点が同一直線上に並ばないよう外積の大きさに下限を置き、外心が
  枠外へ飛ばないようにしてある。Lv4 は2辺の長さを相異にして、点Pが辺BCの中点に
  潰れないようにしている（中点だと垂直二等分線でも当たってしまい題材が壊れる）。
concepts_default: [construction.locus_equidistant_two_points]
levels:
  "2":
    signature: construct_locus_equidistant_two_points
    recipe: math.construct_locus_equidistant_two_points
    params:
      # 2点を結ぶベクトル（長さ len_min..len_max）× 記号 6 通り。約 1900 通り。
      len_min: 6
      len_max: 12
    given: [construction_conditions]
    asked: [construction_steps]
    visual: required
    text:
      tier: T1
      template: cs_locus_equidistant_two_points_v1
      visual_builder: math.construction_figure
    hints: [steps_prefix]
    concept_tags: [construction.locus_equidistant_two_points]
    cause_tags: []
  "3":
    signature: construct_equidistant_point_three
    recipe: math.construct_equidistant_point_three
    params:
      # (ABベクトル, ACベクトル, 記号 3 通り) を全列挙。外積の大きさが cross_min 以上
      # （3点が一直線に近くならない）／外心が point_max の枠に収まる、で絞る。
      len_min: 5
      len_max: 9
      cross_min: 24
      point_max: 12
    given: [construction_conditions]
    asked: [construction_steps]
    visual: required
    text:
      tier: T1
      template: cs_equidistant_point_three_v1
      visual_builder: math.construction_figure
    hints: [steps_prefix]
    concept_tags: [construction.circumcenter_three_points]
    cause_tags: []
  "4":
    signature: construct_point_on_side_equidistant
    recipe: math.construct_point_on_side_equidistant
    params:
      # 2辺の方向は長さが整数の格子ベクトル（角の二等分線を有理数に閉じるため）。
      # 2辺の長さは相異（点Pが辺BCの中点に潰れない）。
      side_min: 5
      side_max: 15
      angle_min: 35
      angle_max: 115
    given: [construction_conditions]
    asked: [construction_steps]
    visual: required
    text:
      tier: T1
      template: cs_point_on_side_equidistant_v1
      visual_builder: math.construction_figure
    hints: [steps_prefix]
    concept_tags: [construction.point_on_side_equidistant_two_sides]
    cause_tags: []
remedial:
  default_level: 2
