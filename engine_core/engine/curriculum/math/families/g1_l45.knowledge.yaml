family: math.g1_l45.knowledge
form: knowledge
source_desc: |
  円・半径・弦・弧・おうぎ形・中心角の用語を想起し、弧と中心角の対応・接線と半径の
  関係などの性質を判別する（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 円・半径・弦・弧・おうぎ形・中心角の用語を想起する。
       example: 円について、中心と円周上の点を結んだ線分を何というか、また円周上の
                2点を結んだ線分を何というか、それぞれ答えよ。
  Lv2 desc: 弧と中心角の対応・接線と半径の関係など性質を判別する。
       example: 1つの円で、次の文の正誤を答えよ。「中心角が2倍になると、それに対する
                弧の長さも2倍になる。」また、円の接線と、接点を通る半径がつくる角の
                大きさを答えよ。
  【設計モデル】Lv1: 用語想起ハブ（既存 math.term_recall・_TERM_MAPS に domain
  "circle_terms"（半径/弦/弧/おうぎ形/中心角）を追加）。Lv2: 新設 solver
  math.judge_circle_property（concept で「弧と中心角は比例する(正しい)」「接線と
  半径は垂直」のどちらかを判別。接線と半径の角度は"90°"でなく digit-free の
  "垂直"で答える）。
concepts_default: [circle_terms.term_recall]
levels:
  "1":
    signature: circle_terms_term_recall
    recipe: math.term_recall
    params:
      domain: circle_terms
      concept_set: [radius, chord, arc, sector, central_angle]
    dup_rate_max: 0.35
    dup_rate_reason: |
      ★**点名の無作為さで通していた。** もとは 24 文字から点名を無作為に引いていて、
      「三角形BJQ」「四角形GEFP」のような実物の教材に出てこない名前が出ていた
      （2026-08-19 の外部評価で「三角形の頂点名 69 種類」と指摘）。点名を実物どおり
      連続した文字にそろえたところ、このセルの**中身の狭さ**が現れた。
      中身の軸は実測 71 通り。教材として正しい名前を優先し、狭さをここに宣言する
      （原則: 場面が成り立つことを dup より優先する。表層で水増しして閾を通さない）。
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [circle_terms.term_recall]
    cause_tags: []
  "2":
    signature: judge_circle_property
    recipe: math.judge_circle_property
    params:
      concept_set: [arc_central_angle_proportional, tangent_perpendicular]
      number_domain: {int_range: [2, 30]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_judge_circle_property_v1}
    hints: [steps_prefix]
    concept_tags: [circle_property.judge]
    cause_tags: []
remedial:
  default_level: 1
