family: math.g1_l50.graph_table
form: graph_table
source_desc: |
  立体の見方と投影図（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 投影図から立体を読む・立体から見た図を選ぶ。
       example: ある立体の投影図がある。立面図が長方形、平面図が円である立体は何か、
                次から選べ。ア 三角柱 イ 円柱 ウ 円錐 エ 四角錐。
  Lv2 desc: 立体の立面図・平面図を正確にかく。
       example: 底面が1辺3cmの正方形、高さ4cmの正四角柱がある。この立体の投影図
                (立面図と平面図)を、長さがわかるようにかけ。
  Lv3 desc: 投影図の一部から立体を特定し他の図を構成する。
       example: ある立体の投影図のうち、平面図が正三角形であることだけがわかっている。
                立面図が長方形になる立体は何か特定し、その立面図をかいて示せ。
  ---
  【設計モデル】立体 →(立面図, 平面図) の対応表は **solver 側が唯一の出典**
  （solvers/solid_view.projection_shapes）。描画側（visuals/solid.py）はそれを引く。
  表を2か所に持つと、片方だけ直したときに図と答えが食い違う（実装中に一度ずれた）。

  【この単元の要点】(立面図, 平面図) の組で立体が**一意に決まる**こと。7種の立体で
  組はすべて相異なる（テストで固定）。Lv1 は両方の図から、Lv3 は片方＋条件から
  その一意性を使って立体を特定する。

  【level_sep】
    Lv1 = 2手（二つの図の形を読む → 立体を答える）。asked=read_solid・ChoiceAnswer。
          問題図は投影図の両方（shown_view="both"）。
    Lv2 = 3手（立面図を決める → 平面図を決める → 並べてかく）。asked=draw_solid。
          立体は本文で与え、問題図には投影図を出さない（shown_view="none"＝答えの先出し）。
    Lv3 = 3手（与えられた図を読む → 立体を一つに絞る → もう一方をかく）。asked=draw_solid。
          問題図は平面図だけ（shown_view="plan"）。
    問う行為・答えの型・op 列・問題図に見せるビューがすべて相異する。

  【dup（数え上げ）】立体7種 × 底面の長さ × 高さ（相異）。既定（2〜15）で
  7×14×13=1274 通り（閾の250を大きく超える）。

  【退化の封じ方】底面の長さと高さを相異にする（等しいと正四角柱と立方体が図の上で
  区別できなくなる）。
concepts_default: [solid_projection.read]
