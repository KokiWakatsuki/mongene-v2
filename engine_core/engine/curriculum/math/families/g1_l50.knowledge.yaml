family: math.g1_l50.knowledge
form: knowledge
source_desc: |
  立体の見方と投影図（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 投影図・立面図・平面図の用語と対応を判別する。
       example: 立体を真正面から見た図を立面図、真上から見た図を平面図という。
                この立面図と平面図を合わせたものを何というか答えよ。
  【設計モデル・Lv1】用語想起ハブ（既存 math.term_recall・_TERM_MAPS の domain
  "projection_terms"＝投影図/立面図/平面図）。「どの向きから見てかいた図か」を説明文に
  述べ、その図の名称を答えさせる（example の対応関係をそのまま問う）。具体例の立体
  （正四角柱・円柱・円錐・正三角柱・正四角錐）と寸法を埋め込み surface を分散する。
  答えは漢字のみの ChoiceAnswer＝digit-free（G-Q5t 素通り）。
  組合せ数 = 立体 5 × 寸法a 29 × 寸法b 29 = 4,205 通りずつ（3 concept で 12,615 通り）。
  本ユニットの graph_table（立面図・平面図をかく・一部から立体を特定する）は本 family の
  対象外。図は knowledge frame が visual=none のため無し（用語想起なので図は不要）。
concepts_default: [projection_terms.term_recall]
levels:
  "1":
    signature: projection_terms_term_recall
    recipe: math.term_recall
    params:
      domain: projection_terms
      concept_set: [projection, front_view, top_view]
      length_domain: {int_range: [2, 30]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [projection_terms.term_recall]
    cause_tags: []
remedial:
  default_level: 1
