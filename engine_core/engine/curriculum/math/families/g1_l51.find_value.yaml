family: math.g1_l51.find_value
form: find_value
source_desc: |
  柱体・錐体の表面積を、展開図の各面の面積を合成して求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 角柱・円柱の側面と底面の面積を合成して表面積を求める(直接)。
       example: 底面が1辺4cmの正方形、高さ6cmの正四角柱がある。この立体の表面積を
                求めよ。
  Lv2 desc: 円錐の側面(おうぎ形)の中心角を求める等の多段で表面積を求める。
       example: 底面の半径3cm、母線の長さ9cmの円錐がある。この円錐の側面(おうぎ形)の
                中心角を求め、表面積を求めよ。ただし円周率はπとする。
  Lv3 desc: 複合立体や逆算(表面積から半径)など非自明な合成で求める。
       example: 半径3cmの半球と、それと底面の半径が等しく高さ4cmの円柱をぴったり
                貼り合わせた立体がある。この立体の表面積を求めよ。ただし円周率はπと
                する。
  【設計モデル】C8・g1_l51/l52/l53 の9セルを1つの汎用ソルバ math.solid_figure_measure
  （mode で立体の種類と問う量を切り替える）に集約する（solvers/solid_figure.py）。
  recipe は mode ごとに1つ登録する（H5: checker 名は provenance.recipe から解決される
  ため、signature ごとに recipe の登録名を分ける必要がある）。
  Lv1（math.solid_surface_direct・mode=l51_direct_surface）: 底面が正方形/長方形の
  角柱、または円柱を等確率で選び、側面積(周×高さ、円柱は2πrh)＋底面2つ分を合成する
  （3手: compute_base_area/compute_lateral_area/sum_surface_area）。
  Lv2（math.solid_cone_surface_central_angle・mode=l51_cone_central_angle）: 半径 r・
  中心角 a(360の約数)から母線 l=360r/l が整数かつ l>r になる組合せだけを有界リトライで
  採用し（sector_solve_central_angle と同型）、側面のおうぎ形の面積 πrl と底面積を
  合成する（4手: 中心角の比→側面積→底面積→合計、Lv1より1手多い）。
  Lv3（math.solid_composite_or_reverse_surface・mode=l51_composite_or_reverse_surface）:
  variant を3通りからランダムに選ぶ。hemisphere_cylinder(半球+円柱)・
  cylinder_cone(円柱+円錐)は重なる面を除いて合成する(3手・「除いて合成」という
  Lv1/Lv2と異なる op 列)。reverse_cylinder_radius は高さ h と表面積の係数
  k=2r²+2rh を先に r,h から組み立て（k は本文に出す「表面積」という与えられた数値
  そのもの・導出値ではない）、方程式 2r²+2rh=k の判別式 h²+2k=(h+2r)² が恒真に
  完全平方になる構成で double-solve する（2手: 方程式化→解く）。
  【π の扱い】厳密値のまま保持し sympy.pi で計算、_fmt_pi で "nπ" 表記に整形する。
  narration には数字を書かない。答えは cm² 単位つきの SymbolicAnswer。
concepts_default: [solid_surface.direct]
levels:
  "1":
    signature: solid_surface_direct
    recipe: math.solid_surface_direct
    params:
      shape_set: [square_prism, rect_prism, cylinder]
      edge_domain: {int_range: [3, 16]}
      rect_domain: {int_range: [3, 14]}
      radius_domain: {int_range: [2, 11]}
      height_domain: {int_range: [3, 16]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_solid_surface_direct_v1}
    hints: [steps_prefix]
    concept_tags: [solid_surface.direct]
    cause_tags: []
  "2":
    signature: solid_cone_surface_central_angle
    recipe: math.solid_cone_surface_central_angle
    params:
      # 中心角 a=360r/l が整数になる (r,l) を直接引く。候補角17個に縛る旧構成は
      # 成立ペアが94通りしかなく dup=0.42 で閾超過だった（100seed 実測）。
      radius_domain: {int_range: [2, 18]}
      slant_domain: {int_range: [3, 90]}
      angle_min: 20
      angle_max: 340
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_solid_cone_surface_central_angle_v1}
    hints: [steps_prefix]
    concept_tags: [solid_surface.cone_central_angle]
    cause_tags: []
  "3":
    signature: solid_composite_or_reverse_surface
    recipe: math.solid_composite_or_reverse_surface
    params:
      # reverse_cylinder_radius（表面積から半径を逆算）は op 列が2手で、複合立体の3手と
      # 異なるため、同一 signature の中で fingerprint が seed により揺れて G-FP が
      # 120seed 中35件を拒否していた。1レベル＝1 signature＝1 op 列という規律に反するので
      # variant_set から外す（台帳 Lv3 の example も半球+円柱の複合立体）。
      # recipe 側の分岐は将来 逆算を独立セルに切り出すときのために残してある。
      variant_set: [hemisphere_cylinder, cylinder_cone]
      radius_domain: {int_range: [2, 10]}
      height_domain: {int_range: [2, 12]}
      slant_domain: {int_range: [3, 20]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_solid_composite_or_reverse_surface_v1}
    hints: [steps_prefix]
    concept_tags: [solid_surface.composite_or_reverse]
    cause_tags: []
remedial:
  default_level: 1
