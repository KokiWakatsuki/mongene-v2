family: math.g1_l51.graph_table
form: graph_table
source_desc: |
  柱体・錐体の表面積（展開図の利用）— 展開図をかく
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 立体の展開図をかき各面を対応させる。
       example: 底面が1辺3cmの正三角形、高さ5cmの正三角柱がある。この立体の展開図を
                かき、側面の長方形の縦と横の長さを書き入れよ。
  Lv3 desc: 複合立体の展開図を構成して面積計算につなぐ。
       example: 底面の半径2cm、高さ5cmの円柱の上に、底面の半径が等しく高さ3cmの円錐を
                のせた立体がある。この立体の側面部分の展開図をかき、面積計算に必要な
                長さ(円柱側面の縦横・円錐側面のおうぎ形の半径と弧の長さ)を書き入れよ。
  ---
  【設計モデル】数学は solvers/solid_view.py、図は visuals/solid.py（view="net"）。
  同じ単元の find_value（表面積を求める）とは、問うものが「面積」ではなく
  「展開したときにどの長さがどこに来るか」である点が違う。

  【この単元の典型的な誤り】側面の長方形の横は**底面の周の長さ**（正n角柱なら
  n×1辺）で、1辺そのものではない。solver が n×1辺 を返すことを property テストで
  固定する。

  【Lv3 の母線】円錐側面のおうぎ形の半径は母線 √(r²+h²)。これが整数になる
  (半径, 円錐の高さ) の組だけを構成の段階で列挙して引く（無理数を答えさせない）。
  おうぎ形の中心角は 360°×(底面の半径/母線) で、図の形も答えと合わせる。

  【level_sep】
    Lv2 = 3手（側面を切り開く → 側面の長方形の縦横を求める → 展開図をかく）。
          底面は正三〜六角形。
    Lv3 = 4手（側面を二つに分ける → 円柱側面を開く → 円錐側面を開く → かく）。
          答えの成分が4つ（縦・横・おうぎ形の半径・弧の長さ）。
    手数・答えの成分数・題材（単一立体／複合立体）が相異する。

  【dup（数え上げ）】Lv2 は 面の数4種 × 1辺 × 高さ（相異）＝4×14×13=728 通り。
  Lv3 は母線が整数になる (半径, 円錐の高さ) の組 22（範囲 2〜24）× 円柱の高さ 29
  ＝638 通り。**この組は範囲に強く依存する**（≦15 だと10組しかなく、円柱の高さ14と
  かけても140通りで dup 0.27＝閾超えになる。実測して広げた）。

  【退化の封じ方】Lv2 は1辺と高さを相異にする（等しいと側面の正方形と底面が
  見分けにくく、縦と横の区別を問えない）。
concepts_default: [solid_net.prism]
levels:
  "2":
    signature: solid_net_prism
    recipe: math.solid_net
    params:
      mode: prism
      face_count_set: [3, 4, 5, 6]
      length_range: [2, 15]
      unit: cm
    given: [condition]
    asked: [draw_solid]
    visual: required
    text: {tier: T1, template: lf_motion_area_v1, visual_builder: math.solid}
    hints: [steps_prefix]
    concept_tags: [solid_net.prism]
    cause_tags: []
  "3":
    signature: solid_net_composite
    recipe: math.solid_net
    params:
      mode: composite
      length_range: [2, 15]
      # 母線が整数になる (半径, 円錐の高さ) の組は範囲で決まる: ≦15 で10組・≦24 で22組。
      # ≦15（10組×14）だと dup 0.27 で閾を超えたので、円錐側を ≦24 に広げ、
      # 円柱の高さも別レンジで広くとる（22×29=638 通り）。
      cone_length_range: [2, 24]
      cylinder_height_range: [2, 30]
      unit: cm
    given: [condition]
    asked: [draw_solid]
    visual: required
    text: {tier: T1, template: lf_motion_area_v1, visual_builder: math.solid}
    hints: [steps_prefix]
    concept_tags: [solid_net.composite]
    cause_tags: []
remedial:
  default_level: 2
