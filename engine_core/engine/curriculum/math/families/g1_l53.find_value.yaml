family: math.g1_l53.find_value
form: find_value
source_desc: |
  球の表面積と体積（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 半径から球の表面積4πr²・体積4/3πr³を直接求める。
       example: 半径3cmの球がある。この球の表面積と体積をそれぞれ求めよ。
                ただし円周率はπとする。
  Lv2 desc: 半球や球を含む複合立体・逆算(表面積から半径)を多段で求める。
       example: 半径6cmの球を中心を通る平面で半分に切った半球がある。この半球の
                表面積を求めよ。ただし円周率はπとする。
  ---
  【設計モデル】共通ソルバ math.solid_figure_measure（solvers/solid_figure.py）に
  mode で委譲する（g1_l51/g1_l52.find_value と同じ設計）。solver と recipe は
  以前のセッションで実装済みで、family だけが無く台帳に載っていなかった。

  【★params が半径ひとつだと dup が原理的に通らない】dup_key は signature + params
  なので、100seed で dup≤0.20 を満たすには約250通り要る（BRIEF の表）。半径だけでは
  どう広げても自然な範囲（数十通り）に収まらない。そこで軸を3つにした:
    ・半径（radius_domain）
    ・半径で与えるか直径で与えるか（given_as_set・2通り）
    ・長さの単位（unit_set・3通り）
  ⇒ Lv1 は 59×2×3 = 354通り、Lv2 も同じ。
  **与え方を足しても op 列は変わらない**——solver の第1手
  `read_radius_from_statement` が variant 中立（「直径なら半分にする」まで含めて1手）
  なので、どちらの与え方でも同じ手順になる＝G-FP は安定する
  （BRIEF「追加した軸が op 列を変えるなら G-FP に引っかかる」への対処）。

  【Lv2 で逆算 variant を混ぜない理由】台帳 desc は「半球や複合立体・逆算(表面積から
  半径)」の両方を挙げるが、逆算は op 列が2手で半球の4手と相異する。同じレベルに
  混ぜると 1レベル＝1 signature＝1 op 列が崩れて G-FP が不安定になる
  （BRIEF 失敗パターン1・実際に g1_l51/g1_l52 の Lv3 で起きた事故）。
  台帳 example そのものである半球を採る。

  【level_sep】Lv1 は公式に代入する3手（読み取り→表面積→体積）。Lv2 は半球の面を
  分けて足す4手（読み取り→面の内訳→曲面と切り口→合計）。求めるもの（表面積と体積の
  組／表面積だけ）も手数も相異する。

  【narration に数字を書かない】"4πr²" と書くと ² が答え表示の "cm²" 由来のトークン
  '2' と衝突し、G-Q5t が誤検出する（BRIEF 失敗パターン2・実際に120seed中114件が
  拒否された）。公式は言葉で述べる。
concepts_default: [sphere_measure.direct]
levels:
  "1":
    signature: sphere_measure_direct
    recipe: math.solid_sphere_direct
    params:
      # 半径は教科書の大きさに。組み合わせは場面（_SPHERE_SCENES）の軸で稼ぐ。
      radius_domain: {int_range: [2, 15]}
      given_as_set: [radius, diameter]
    given: [condition]
    asked: [value]
    visual: required
    text: {tier: T1, template: lf_solid_sphere_direct_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [sphere_measure.direct]
    cause_tags: []
  "2":
    signature: sphere_measure_hemisphere
    recipe: math.solid_hemisphere_or_reverse
    params:
      # 半径は教科書の大きさに。組み合わせは場面（_SPHERE_SCENES）の軸で稼ぐ。
      radius_domain: {int_range: [2, 15]}
      # **切れる物だけ**（風船を「中心を通る平面で半分に切る」場面は成り立たない）。
      cuttable_scene_only: true
      given_as_set: [radius, diameter]
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_solid_hemisphere_or_reverse_v1}
    hints: [steps_prefix]
    concept_tags: [sphere_measure.hemisphere_or_reverse]
    cause_tags: []
remedial:
  default_level: 1
