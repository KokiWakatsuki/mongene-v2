family: math.g1_l53.knowledge
form: knowledge
source_desc: |
  球の表面積と体積（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 球の表面積・体積の公式を想起する。
       example: 半径rの球の表面積を求める公式と、体積を求める公式を、それぞれrとπを
                使って書け。
  【設計モデル・Lv1】規則想起ハブ（既存 math.recall_rule・_RULE_MAPS の topic
  "sphere_formula"＝表面積/体積）。原題は「式を書け」だが knowledge frame は
  asked=choice なので、公式を**言葉で述べた記述**を選ぶ形に realize した。
  記述は漢数字のみで書き ASCII 数字を含まない（「半径の二乗に四とπをかけたもの」）。
  これは BRIEF の失敗パターン2 対策でもある: 答えに "4πr²" のような表記を使うと
  NFKC 正規化で "²"→"2" となり、本文・ヒント側の数値と衝突して G-Q5t が誤検出する。
  distractors は指数や係数を取り違えた、もっともらしい誤りの記述。
  具体例の球（中心の点名・半径）を説明文に埋め込み surface を分散する。
  組合せ数 = 中心の点名 16 × 半径 29 = 464 通りずつ（2 concept で 928 通り）。
  本ユニットの find_value（半径から表面積・体積を求める／半球）は本 family の対象外。
  図は knowledge frame が visual=none のため無し。
concepts_default: [sphere_formula.rule_recall]
levels:
  "1":
    signature: sphere_formula_rule_recall
    recipe: math.recall_rule
    params:
      topic: sphere_formula
      concept_set: [surface_area, volume]
      length_domain: {int_range: [2, 30]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: sp_sphere_formula_v1}
    hints: [steps_prefix]
    concept_tags: [sphere_formula.rule_recall]
    cause_tags: []
remedial:
  default_level: 1
