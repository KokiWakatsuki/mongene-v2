family: math.g1_l55.graph_table
form: graph_table
source_desc: |
  相対度数と度数折れ線（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 度数折れ線や相対度数分布を読む。
       example: あるクラスの数学のテストの得点を表した度数折れ線がある。度数が最も多い階級を
                答えよ。また、60点以上70点未満の階級の度数を読み取って答えよ。
  Lv2 desc: 相対度数を求め度数折れ線を正確にかく。
       example: 次の度数分布表の各階級の相対度数を求めて表を完成させ、その相対度数の分布を
                表す度数折れ線をかけ。〔150〜155cm…2人、…〕（総度数20人）
  Lv3 desc: 総度数の異なる分布を相対度数で重ねて比較する。
       example: 1年生120人と3年生80人の50m走の記録を、それぞれ相対度数の度数折れ線にして
                同じグラフに重ねてかき、学年による記録の分布のちがいを読み取って説明せよ。
  【設計モデル】描画は土台 distribution_chart.py（chart_kind="polygon"）に委ねる。
  Lv2 は desc の「相対度数を求め **度数折れ線を** 正確にかく」をそのまま実装する:
  答え（GraphAnswer の特徴）に各階級の相対度数と度数折れ線の頂点の両方を持たせ、
  図は度数の折れ線でかく。相対度数そのものを縦軸にしないのは、土台の縦軸が度数の
  目盛（整数の切りのよい刻み）で、0〜1 の値だと目盛が3本しか立たず読めないため。
  Lv3 も同じ理由で図は度数の折れ線とし、「相対度数に直して比べる」という**問い**の
  側で総度数のちがいを扱う（solver は既存 math.compare_relative_frequency を再利用）。
  【level_sep】op 列が相異する:
    Lv1 読む   given=[situation_params] asked=[read_table]
               op=(read_class_frequency, find_modal_class)
    Lv2 かく   given=[data_table]       asked=[draw_graph]
               op=(compute_total_frequency, divide_each_by_total, draw_frequency_polygon)
    Lv3 比べる given=[condition]        asked=[read_table]
               op=(compute_relative_frequency_each, compare_relative_frequency)
  【退化の封じ方】Lv1 は最頻の階級を一意にし問う階級をそこから外す。Lv2 は各階級の
  度数を 1 以上にして相対度数が 0 や 1 に潰れないようにし、度数が全部同じ（折れ線が
  水平に潰れる）ことも避ける。Lv3 は総度数と対象階級の相対度数がどちらも相異なる
  ようになるまで B 側の**対象外**の階級を1ずつ増やす（狭義単調なので3回以内に必ず両立）。
concepts_default: [frequency_polygon.read_chart]
levels:
  "1":
    signature: read_frequency_polygon_and_modal_class
    recipe: math.read_distribution_chart
    params:
      # 【組合せ数】params = (class_lo, class_width, frequencies, target_index, unit, chart_kind)。
      #   (class_lo, class_width, unit) 24通り × frequencies（山以外4階級が 1..9 で 9^4=6561）
      #   × 山の位置5 × 持ち上げ幅3 × target_index 4 ⇒ 約 8.7×10^6 通り。
      n_classes: 5
      frequency_domain: {int_range: [1, 9]}
      peak_bonus_domain: {int_range: [1, 3]}
      chart_kind: polygon
    # 問題文の数が、この単元では単位の上限を超えるのが正しい
    # （`engine.eval.statement_size`）。
    statement_size_max: {cm: 300}
    statement_size_reason: |
      体育の記録（立ち幅とび・身長）は 100cm を超えるのが当たり前で、階級の区切りも
      その値になる。図形の寸法ではないので、長さの上限では測れない。
    given: [situation_params]
    asked: [read_table]
    visual: required
    text: {tier: T1, template: df_situation_v1, visual_builder: math.frequency_chart}
    hints: [steps_prefix]
    concept_tags: [frequency_polygon.read_chart]
    cause_tags: []
  "2":
    signature: relative_frequency_table_and_polygon
    recipe: math.relative_frequency_polygon
    params:
      # 【組合せ数】params = (class_lo, class_width, frequencies, unit, chart_kind)。
      #   (class_lo, class_width, unit) 24通り × frequencies（5階級 × 2..12 の11通り = 11^5
      #   = 161051）⇒ 約 3.5×10^6 通り。
      n_classes: 5
      frequency_domain: {int_range: [2, 12]}
      chart_kind: polygon
    # 問題文の数が、この単元では単位の上限を超えるのが正しい
    # （`engine.eval.statement_size`）。
    statement_size_max: {cm: 300}
    statement_size_reason: |
      体育の記録（立ち幅とび・身長）は 100cm を超えるのが当たり前で、階級の区切りも
      その値になる。図形の寸法ではないので、長さの上限では測れない。
    given: [data_table]
    asked: [draw_graph]
    visual: required
    text: {tier: T1, template: df_data_table_v1, visual_builder: math.frequency_chart}
    hints: [steps_prefix]
    concept_tags: [frequency_polygon.draw_relative_frequency]
    cause_tags: []
  "3":
    signature: compare_groups_by_relative_frequency_chart
    recipe: math.compare_relative_frequency_chart
    params:
      # 【組合せ数】params = (class_lo, class_width, frequencies, frequencies_b,
      #   target_index, unit, chart_kind)。(class_lo, class_width, unit) 24 × frequencies 8^5=32768
      #   × frequencies_b 8^5 × target_index 5 ⇒ 10^10 通り超。
      n_classes: 5
      frequency_domain: {int_range: [2, 9]}
      chart_kind: polygon
    # 問題文の数が、この単元では単位の上限を超えるのが正しい
    # （`engine.eval.statement_size`）。
    statement_size_max: {cm: 300}
    statement_size_reason: |
      体育の記録（立ち幅とび・身長）は 100cm を超えるのが当たり前で、階級の区切りも
      その値になる。図形の寸法ではないので、長さの上限では測れない。
    given: [condition]
    asked: [read_table]
    visual: required
    text: {tier: T1, template: df_condition_v1, visual_builder: math.frequency_chart}
    hints: [steps_prefix]
    concept_tags: [frequency_polygon.compare_groups_by_relative_frequency]
    cause_tags: []
remedial:
  default_level: 1
