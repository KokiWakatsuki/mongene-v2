family: math.g1_l57.calculation
form: calculation
source_desc: |
  生データから平均値・中央値・最頻値を求める1手順／度数分布表から階級値を用いて
  平均値等を求める複数手順（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 生データから平均値・中央値・最頻値をそれぞれ求める1手順。
       example: 次の8個のデータの平均値・中央値・最頻値をそれぞれ求めよ。
                〔4, 7, 5, 8, 5, 6, 9, 5〕
  Lv2 desc: 度数分布表から階級値を用いて平均値を求める複数手順。
       example: 次の度数分布表について、各階級の階級値を用いて平均値を求めよ。
                〔階級と度数：0〜10点…2人、10〜20点…8人、20〜30点…8人、30〜40点…5人〕
  【設計モデル】Lv1=新設 solver math.representative_values_raw（生データ列から
  平均値・中央値・最頻値。一意な最頻値を answer-first で保証する構成）。Lv2=新設 solver
  math.mean_from_grouped_table（階級値×度数の重み付き平均）。op列（Lv1:
  compute_mean/compute_median/compute_mode の3段、Lv2: weight_by_class_value→
  divide_by_total の2段）が相異＝level_sep。
concepts_default: [representative_value.compute_raw]
levels:
  "1":
    signature: representative_values_raw
    recipe: math.representative_values_raw
    params:
      n_domain: {int_range: [6, 9]}
      value_domain: {int_range: [1, 50]}
    given: [expressions]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_representative_values_raw_v1}
    hints: [steps_prefix]
    concept_tags: [representative_value.compute_raw]
    cause_tags: []
  "2":
    signature: mean_from_grouped_table
    recipe: math.mean_from_grouped_table
    params:
      # **階級の幅は候補から引き、下端はその幅の倍数にする。**
      # 前は幅 5〜10・下端 0〜20 を独立に引いていたので「3分以上13分未満」
      # （幅10なのに3から始まる）や幅9（階級値が 77/2 の分数）が出ていた。
      # 実物は 0・10・20…から始まり、幅は 5・10・20 のどれか。
      # 度数は recipe 側で単峰に並べ替える（3・12・2・8 のギザギザを避ける）。
      class_width_candidates: [5, 10, 20]
      class_start_max: 40
      frequency_domain: {int_range: [1, 15]}
    given: [expressions]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_mean_from_grouped_table_v1}
    hints: [steps_prefix]
    concept_tags: [representative_value.compute_grouped_mean]
    cause_tags: []
remedial:
  default_level: 1
