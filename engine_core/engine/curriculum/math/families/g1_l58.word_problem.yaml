family: math.g1_l58.word_problem
form: word_problem
source_desc: |
  データの比較と統計的探究プロセス（units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 与えられた指標で2つの分布を比較し結論を述べる(誘導あり)。
       example: AさんとBさんの過去10回の小テスト（10点満点）の得点が表にまとめられている。
                (1) それぞれの平均値を求めよ。(2) それぞれの得点の範囲（最大値−最小値）を
                求めよ。(3) (1)(2)をもとに、成績が安定しているのはどちらといえるか、
                理由を書いて答えよ。〔A：7,8,6,7,8,7,6,8,7,6／B：10,4,9,3,10,5,9,4,10,6〕
  Lv3 desc: どの代表値・指標で比べるか自分で選び根拠づけて比較する(誘導ゆるい)。
       example: 1組と2組の50m走の記録が度数分布表で与えられている。どちらの組の方が
                「速い生徒が多い」といえるか、あなたが着目した代表値または指標を自分で選び、
                その値を求めたうえで根拠を示して結論を述べよ。
  Lv4 desc: 問いの設定からデータ収集方針・結論まで探究プロセスを自分で構成する(誘導なし)。
       example: 「この学校の生徒は、学年が上がるほど1日の読書時間が長くなるといえるか」
                という問いを調べたい。どのようなデータをどう集め、どの指標やグラフを使って
                比較し、どのような結論を導くか、統計的な探究の進め方を自分で構成して説明せよ。
  ---
  【「理由を書いて答えよ」をどう採点可能にしたか】記述そのものを engine が採点する
  ことはできないので、**結論を選択（ChoiceAnswer）で答えさせ、根拠の組み立ては
  solution_steps が担う**。箱ひげ図の記述セル（g2_l57.word_problem）・作問セル
  （g1_l27 Lv4）と同じ手にそろえた。台帳 example の「理由を書いて」からは離れる。

  【Lv3「自分で選び」をどう成立させたか】指標を engine が固定すると desc から離れる。
  そこで**どの代表値で比べても同じ結論になるデータだけを構成する**（A のすべての値が
  B のすべての値より小さくなるよう帯を分ける）。こうすると平均値・中央値・最頻値の
  どれを選んでも同じ側を指すので「自分で選んでよい」がそのまま成り立ち、答えは一意。
  solver は3つの指標が一致することを検算し、一致しなければ例外にする。
  台帳 example の「度数分布表で与えられている」は、階級に丸めると代表値の一致を
  構成で保証できないため、記録そのものを与える形にした。

  【Lv4 は探究の進め方を選ばせる形にした】「説明せよ」は答えの型に落ちないので、
  調べ方を3つ示して問いに答えられるものを1つ選ばせる。誤りの2つは
  「比べる相手がそろわない（1つの学年しか調べない）」「偏りが入る（一部の人にしか
  聞かない）」で、統計的探究で押さえるべき2点をそのまま外した形にしてある。

  【level_sep】
    Lv2 = 誘導あり3小問（平均値 → 範囲 → 安定しているのはどちら）。
    Lv3 = 誘導ゆるい1小問（指標を自分で選ぶ・4手）。
    Lv4 = 誘導なし1小問（探究の進め方を選ぶ・4手）。given も題材も相異。

  【params】データ列は `data_a`/`data_b` に置き、`numbers` は空にする
  （`numbers` は「本文に出ている数値がすべて」を検査する契約なので、列そのものは
  その形に合わない。空なら本文に算用数字が無いことを併せて検査される——Lv2/Lv3 は
  データ列が本文に出るので、この検査を満たすようデータは numbers に載せない）。

  【dup（数え上げ）】
    Lv2: 個数3 × 平均5 × 狭い幅3 × 広い幅（狭い幅より大きいもの）× 人物8 × 題材6
         ⇒ 千通り超。
    Lv3: 個数3 × 基準値 × 差3 × 幅3 × 題材5 ⇒ 数百通り。
    Lv4: 問いの場面8通り × 全校生徒の人数46通り＝368通り。
         **場面だけだと8通りしかなく 100seed で dup 0.92 になった**（実測）。

  【退化の封じ方】Lv2 は平均を等しく・範囲を相異にする（「平均は同じなのに散らばりが
  違う」がこの設問の見せ場で、範囲が等しいと安定しているほうを決められない）。
  Lv3 は帯を分けて3指標の一致を構成で保証する。
concepts_default: [data_inquiry.compare_mean_and_range]
levels:
  "2":
    signature: data_inquiry_compare_mean_and_range
    recipe: math.statistics_inquiry
    params:
      mode: compare_mean_range
      size_set: [8, 10, 12]
      # **平均は 10〜15**（20点満点と書くのにデータが 2〜12 に収まっていて、
      # 満点の設定と記録が噛み合っていなかった）。散らばりは最大5なので
      # データは 5〜20 に収まる。
      mean_range: [10, 15]
      narrow_set: [1, 2]
      wide_set: [3, 4, 5]
      # 敬称は本文側で付けるので候補には含めない（「Aさんさん」になる事故を防ぐ）。
      person_pair_set: [A|B, あきら|ひろし, さくら|みなみ, けんた|しょう,
                        ゆうか|なつみ, たける|そうた, りく|はると, あおい|ひなた]
      # 「一週間の読書時間」だと値が12個あることと合わない（EVALUATION D-14）。
      # 記録の個数を決めつけない言い方にする。
      # **満点を書き、データがその中に収まるようにする。** 前は「漢字テストの得点」
      # としか書いていなかったので、Aの最高が10点・Bに12点という、同じテストの
      # 記録として食い違う組が出ていた（この構成のとりうる最大は 9+5=14）。
      # 「日ごとの学習時間（十分）」も、十分＝10分単位という単位の取り方が
      # 教材に無い書き方だったので落とした。
      subject_set: [小テスト（20点満点）の得点, 漢字テスト（20点満点）の得点,
                    計算テスト（20点満点）の得点, 英単語テスト（20点満点）の得点,
                    週ごとの読書時間（時間）, 月ごとに読んだ本の冊数（冊）]
    given: [scenario]
    asked: [value, value, value]
    visual: none
    text: {tier: T1, template: wp_guided_three_v1}
    hints: [steps_prefix]
    concept_tags: [data_inquiry.compare_mean_and_range]
    cause_tags: []
  "3":
    signature: data_inquiry_choose_statistic
    recipe: math.statistics_inquiry
    params:
      mode: choose_statistic
      size_set: [8, 10, 12]
      gap_set: [4, 5, 6]
      spread_set: [2, 3, 4]
      smaller_is_better: true
      goal_phrase: 速い生徒が多い
      # 種目と、その種目で実際にありうる値の幅は recipe の `_TIMED_EVENTS` が持つ
      # （1つの base_range を使い回すと「100m走が9.1秒」になる）。
      # 「ハードル走」は "ドル" を含み G-STY（通貨表記の禁止）に当たるので使わない。
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [data_inquiry.choose_statistic]
    cause_tags: []
  "4":
    signature: data_inquiry_design_plan
    recipe: math.statistics_inquiry
    params:
      mode: design_plan
      # "問い|正しい調べ方|誤り（比べる相手がそろわない）|誤り（偏りが入る）|母集団の lo,hi,step"
      # 母集団の大きさは答えを変えない（dup の第2軸）が、**幅は場面ごとに持つ**
      # （EVALUATION D-29。全場面で 60〜510 から引いていたので「この市の中学生…
      # 全部で190人」のように、集団の呼び方と人数が合っていなかった）。
      question_set:
        - "この学校の生徒は、学年が上がるほど一日の読書時間が長くなるといえるか|各学年から無作為に選んだ生徒に読書時間を記録してもらい、学年ごとの中央値を比べる|三年生だけに読書時間を記録してもらい、その平均値を求める|図書委員だけに読書時間を記録してもらい、学年ごとに比べる|150,600,10"
        - "この中学校では、部活動をしている生徒のほうが睡眠時間が短いといえるか|全校から無作為に選んだ生徒に部活動の有無と睡眠時間を答えてもらい、二つの群で中央値を比べる|運動部の生徒だけに睡眠時間を答えてもらい、その平均値を求める|朝いちばんに登校した生徒だけに答えてもらい、二つの群で比べる|150,600,10"
        - "この学校の生徒は、通学距離が長いほど朝食を食べない割合が高いといえるか|全校から無作為に選んだ生徒に通学距離と朝食の有無を答えてもらい、距離の階級ごとに割合を比べる|自転車通学の生徒だけに朝食の有無を答えてもらい、その割合を求める|遅刻した生徒だけに答えてもらい、距離の階級ごとに比べる|150,600,10"
        - "この市の中学生は、休日のほうが平日より運動する時間が長いといえるか|市内から無作為に選んだ中学生に平日と休日の運動時間を記録してもらい、二つの平均値を比べる|休日の運動時間だけを記録してもらい、その平均値を求める|運動部の大会に来た中学生だけに答えてもらい、二つを比べる|3000,20000,400"
        - "この学校の生徒は、朝食を食べる生徒のほうが登校時刻が早いといえるか|全校から無作為に選んだ生徒に朝食の有無と登校時刻を答えてもらい、二つの群で中央値を比べる|朝食を食べる生徒だけに登校時刻を答えてもらい、その平均値を求める|生徒会の役員だけに答えてもらい、二つの群で比べる|150,600,10"
        - "この学校の生徒は、学年が上がるほど一日にスマートフォンを使う時間が長くなるといえるか|各学年から無作為に選んだ生徒に使用時間を記録してもらい、学年ごとの中央値を比べる|一年生だけに使用時間を記録してもらい、その平均値を求める|放課後に残っていた生徒だけに記録してもらい、学年ごとに比べる|150,600,10"
        - "この中学校では、朝練習をする生徒のほうが授業中に眠くなりにくいといえるか|全校から無作為に選んだ生徒に朝練習の有無と眠さの度合いを答えてもらい、二つの群で比べる|朝練習をする生徒だけに眠さの度合いを答えてもらい、その平均値を求める|保健室に来た生徒だけに答えてもらい、二つの群で比べる|150,600,10"
        - "この学校の生徒は、テレビを見る時間が長い生徒ほど睡眠時間が短いといえるか|全校から無作為に選んだ生徒にテレビの時間と睡眠時間を記録してもらい、テレビの時間の階級ごとに睡眠時間の中央値を比べる|睡眠時間が短い生徒だけにテレビの時間を答えてもらい、その平均値を求める|休み時間に廊下にいた生徒だけに記録してもらい、階級ごとに比べる|150,600,10"
    dup_rate_max: 0.55
    dup_rate_reason: |
      100 seed で相異 50 問（実測）。中身の軸は 50 通り。
      答えが整数になる組しか使えないため、定義域を広げても通る組はこの程度にとどまる。
      以前は点名・人名・使う文字を dup_key に算入していたので閾を通っていたが、
      **名前が違うだけの問題は別の問題ではない**。増やすには題材そのものを追加する。
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [data_inquiry.design_plan]
    cause_tags: []
remedial:
  default_level: 2
