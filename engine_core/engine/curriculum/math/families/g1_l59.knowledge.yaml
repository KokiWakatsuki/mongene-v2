family: math.g1_l59.knowledge
form: knowledge
source_desc: |
  確率・試行・相対度数が一定値に近づくことの意味を想起する／試行回数が増えると相対度数が
  確率に近づくことを判別・解釈する（units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 確率・試行・相対度数が一定値に近づくことの意味を想起する。
       example: 同じ条件で何回もくり返すことができる実験や観察を何というか答えよ。また、
                あることがらの起こりやすさの程度を表す数を何というか答えよ。
  Lv2 desc: 試行回数が増えると相対度数が確率に近づくことを判別・解釈する。
       example: びんのふたを何回も投げて表が出た相対度数を調べたところ、投げる回数を
                増やすにつれてその値がしだいに一定の値に近づいた。この一定の値は何を
                表していると考えられるか、理由とともに説明せよ。
  【設計モデル】Lv1=用語想起ハブ（既存 math.term_recall・_TERM_MAPS に domain
  "probability_terms" を追加。試行・確率の2用語）。Lv2=新設 solver
  math.interpret_relative_frequency_limit（説明対象が固定＝恒真の解釈型。ChoiceAnswer）。
  op列（Lv1: identify_description/name_concept、Lv2: recall_relative_frequency_limitのみ）
  が相異＝level_sep。
concepts_default: [probability_terms.term_recall]
levels:
  "1":
    signature: probability_terms_term_recall
    recipe: math.term_recall
    params:
      domain: probability_terms
      concept_set: [trial, probability]
      # 装飾の数は教材の粒度に合わせる（答えには一切関係しない）。
      # 実験の回数は 100・500 のようなきりのよい回数（教科書の書き方）。
      number_domain: {int_set: [50, 100, 150, 200, 300, 400, 500, 600, 800, 1000]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [probability_terms.term_recall]
    cause_tags: []
  "2":
    signature: interpret_relative_frequency_limit
    recipe: math.interpret_relative_frequency_limit
    params:
      # 装飾の数は教材の粒度に合わせる（答えには一切関係しない）。
      # 実験の回数は 100・500 のようなきりのよい回数（教科書の書き方）。
      number_domain: {int_set: [50, 100, 150, 200, 300, 400, 500, 600, 800, 1000]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_probability_judge_v1}
    hints: [steps_prefix]
    concept_tags: [probability.interpret_relative_frequency_limit]
    cause_tags: []
remedial:
  default_level: 1
