family: math.g2_l1.calculation
form: calculation
source_desc: |
  1変数の単項式・多項式の次数を答える
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 1変数の単項式・多項式の次数を直接答える。
       example: 単項式 −4x³ の次数を答えよ。また、多項式 2x² − 5x + 1 の次数を答えよ。
  各インスタンスは単項式または多項式のいずれか1つの式を提示し、その次数を答える
  （form=monomial/polynomial を surface として振る＝同じ技能を単一小問で問う。当時の G-Q1 が
  sub_questions[0] のみ double-solve だったため単一小問に集約した・§2-#7。G-Q1 はその後
  全小問 double-solve に拡張済みだが、この題材は単一小問のままが自然）。答えは次数（小整数・
  SymbolicAnswer の整数）。独立ソルバ degree_of_expression（sympy.degree, x について）で再計算。
  次数域は 1〜3。単一レベルのため level_sep は signature 相異のみ（fp 衝突は起きない）。
concepts_default: [polynomial.degree_of_expression]
levels:
  "1":
    signature: degree_of_expression
    recipe: math.degree_of_expression
    params:
      # 単項式 c·x^d（d∈1..3）または 多項式（leading c·x^d, d∈2..3, 定数項あり）。係数 nonzero。
      form_set: [monomial, polynomial]
      coeff_domain: {int_range: [-12, 12], exclude: [0]}
      monomial_degree_domain: {int_set: [1, 2, 3]}
      polynomial_degree_domain: {int_set: [2, 3]}
    given: [expression]
    asked: [degree]
    visual: none
    text: {tier: T1, template: lf_degree_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.degree_of_expression]
    cause_tags: []
remedial:
  default_level: 1
