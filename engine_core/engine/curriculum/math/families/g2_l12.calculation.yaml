family: math.g2_l12.calculation
form: calculation
source_desc: |
  連立方程式を加減法（係数をそろえる）で解く（units.generated.yaml の desc/example を正として転記）。
  Lv2: 片方の式を整数倍して係数をそろえ消去する。
       example: 次の連立方程式を加減法で解け。 { 2x + y = 8, 3x − 2y = 5 }
  Lv3: 両式を別々の数で倍して最小公倍数にそろえる消去。
       example: 次の連立方程式を加減法で解け。 { 3x + 4y = 10, 5x + 6y = 16 }
  答えは解 (x, y)（SymbolicAnswer）。検証は g2_l11/g2_l27 と同じ intersection_of_two_lines
  （method=elimination・交点＝連立解）を再利用（新 solver ゼロ＝連立クラスタへの償却横展開）。
  レベル間は steps の先頭 op で構造を変える（Lv2=scale_one_equation／Lv3=scale_both_equations）。
  g2_l11（係数の絶対値が等しく倍する手が要らない）との差は「そろえる倍の手」が入る点。
  図は無し（calculation）。
concepts_default: [simultaneous_equations.solve_by_elimination_scaled]
levels:
  "2":
    signature: solve_system_elim_scale_one
    recipe: math.solve_system_elim_scaled
    params:
      # answer-first: 解 (x0,y0) を先に選ぶ。y 係数を (1, b2)（|b2|∈{2,3}）にし y は「片方を倍す」
      # だけで消去（intended path）。x 係数は互いに素な大きさ (2,3)（recipe が |a2|=5−|a1|）で
      # 「両方倍す」が要る＝x では消しにくく、係数が偶然そろって倍不要（g2_l11 相当）へ退化しない。
      # |a1·b2|≥4 > |a2|≤3 で det=a1·b2−a2≠0 が恒真。
      mode: scale_one
      x_domain: {int_range: [-6, 6]}
      y_domain: {int_range: [-6, 6]}
      sign_domain: {int_set: [-1, 1]}
      x_coeff_mag_domain: {int_set: [2, 3]}
      eqb_y_coeff_mag_domain: {int_set: [2, 3]}
    given: [equation_a, equation_b]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_solve_system_elim_v1}
    hints: [steps_prefix]
    concept_tags: [simultaneous_equations.solve_by_elimination_scaled]
    cause_tags: []
  "3":
    signature: solve_system_elim_scale_both
    recipe: math.solve_system_elim_scaled
    params:
      # x 係数 (|3|,|2|)・y 係数 (|2|,|3|) いずれも互いに素で大きさ≥2＝どちらの変数も「両方倍す」
      # が要る（真の Lv3）。符号のみ抽選し magnitude は recipe が固定。|a1·b2|=9 > |a2·b1|=4 で
      # det=a1·b2−a2·b1≠0 が恒真。片方を倍すだけ（Lv2）や倍不要（l11）へは退化しない。
      mode: scale_both
      x_domain: {int_range: [-6, 6]}
      y_domain: {int_range: [-6, 6]}
      sign_domain: {int_set: [-1, 1]}
    given: [equation_a, equation_b]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_solve_system_elim_v1}
    hints: [steps_prefix]
    concept_tags: [simultaneous_equations.solve_by_elimination_scaled]
    cause_tags: []
remedial:
  default_level: 2
