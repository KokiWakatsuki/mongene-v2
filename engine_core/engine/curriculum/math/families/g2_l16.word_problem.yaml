family: math.g2_l16.word_problem
form: word_problem
source_desc: |
  個数と代金の場面を連立方程式に立式して解く（誘導あり・2段小問）
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・2量2式を素直に立式して解く。
       example: 1個90円のりんごと1個60円のみかんを合わせて10個買ったところ、代金の合計は
                720円だった。(1) りんごの個数を x 個、みかんの個数を y 個として、個数と
                代金の関係を表す2つの式をつくれ。(2) りんごとみかんをそれぞれ何個買ったか
                求めよ。
  【この family の位置づけ】form=word_problem の**初回縦串**。台帳は word_problem 100 セルを
  「T3 翻訳基盤（I2）待ち」として凍結していたが、場面文は T1 テンプレートで決定論的に
  書ける（既存 g3_l31.graph_table の given.condition が既に動点の場面文を出している）。
  実際の障壁は「誘導つき多段小問を検証できない」ことだけで、G-Q1 を全小問 double-solve
  に拡張して解消した。以後の word_problem セルは「場面文と小問文を書く」作業に落ちる。
  【設計モデル】買った個数 (a,b) と単価 (pa,pb) を先に引き、総数 a+b・合計代金 pa·a+pb·b を
  逆算する answer-first（端数の出ない綺麗な設定になる）。単価は相異に引く: pa=pb だと
  代金の式が個数の式の定数倍になり解が定まらない（det = pb − pa = 0）。答え (a,b) は既存
  solver math.intersection_of_two_lines で連立を解き直して一致を確認する＝新 solver ゼロ。
  【小問と検証】(1) asked=formulation（個数の式と代金の式の組）・(2) asked=value（個数の組）。
  checker は list[Solution] を返し、G-Q1 が両方を突き合わせる。params に置くのは係数の行
  （line_count / line_cost = 場面文の数値そのもの）だけで答えは置かないため、
  「場面文の数値 → 立式 → 解」の連鎖が recipe とは別経路で再現される。
  【given】scenario（場面）と quantities（変数の設定＝誘導の第一段）に分ける。小問文は
  テンプレ側が context_slots の品名から組む（core の prompts 自動生成は既存 golden に
  影響するため変更しない）。
  ---
  Lv3 desc: 誘導なし・単位や条件の読替を経て自分で立式する。
       example: ノートを何冊かとえん筆を何本か買った。ノート1冊は120円、えん筆1本は80円で、
                買った本数はノートよりえん筆の方が3本多く、代金の合計は1000円だった。
                ノートとえん筆をそれぞれ何本買ったか求めよ。
  【Lv3 の設計モデル】C14 の横展開で追加。recipe は Lv2 の専用 recipe
  （math.word_problem_price_count）ではなく、g2_l17/l18 と共有の
  math.word_problem_system_equations に scenario_kind=price_count_diff として足す
  （Lv2 の recipe を触ると RNG 消費順が変わり既存 golden の再承認が要るため・Open-Closed）。
  数学は既存 solver math.intersection_of_two_lines＝新 solver ゼロ。
  【level_sep】Lv2 は「合計個数」が与えられ x + y = N と代金の式を**素直に**立てる
  （誘導あり・(1)立式 →(2)値）。Lv3 は合計個数が与えられず「一方が d 個多い」という
  **差**の読替から y − x = d を自分で立てる（誘導なし・小問1つに立式から解までが
  つながる）。「何を式にするか」（和 → 差）と誘導の有無がどちらも変わる。
  【Lv3 の検証】params が持つのは場面文の数値（単価2つ・個数の差・合計代金）だけで、
  答え（個数）は入っていない。checker は同じ FORMULATION_BUILDERS で立て直し、
  solver で解き直す。答えの個数は given に現れないか現れても両符号 whitelist の
  範囲内で、ask 文には数値を置かない（G-Q5t）。
concepts_default: [simultaneous_equations.word_problem_price_count]
levels:
  "2":
    signature: word_problem_system_price_count
    recipe: math.word_problem_price_count
    params:
      # 個数 a,b（答え）と単価 pa≠pb（10円刻み）。総数・合計代金は逆算する。
      # 個数 8×8 × 単価の順序対 P(10,2)=90 × 品名の順序対 P(8,2)=56 で
      # dup_rate 0.0（eval/100seed で実測）。
      count_domain: {int_range: [2, 9]}
      price_domain: {int_set: [50, 60, 70, 80, 90, 110, 120, 130, 140, 150], distinct: [value]}
      # ぶどうは房で売るので「1個いくら」で数えない。
      item_candidates: [りんご, みかん, なし, もも, かき, レモン, オレンジ,
                        キウイ, グレープフルーツ, パン, おにぎり, ドーナツ]
    given: [scenario, quantities]
    asked: [formulation, value]
    visual: none
    text: {tier: T1, template: wp_system_price_count_v1}
    hints: [steps_prefix]
    concept_tags: [simultaneous_equations.word_problem_price_count]
    cause_tags: []
  "3":
    signature: word_problem_system_price_count_diff
    recipe: math.word_problem_system_equations
    params:
      scenario_kind: price_count_diff
      guided: false
      # 少ないほうの個数 a と差 d（答え）と単価 pa≠pb を引き、合計代金を逆算する。
      count_domain: {int_range: [2, 9]}
      diff_domain: {int_range: [1, 5]}
      price_domain: {int_set: [50, 60, 70, 80, 90, 110, 120, 130, 140, 150], distinct: [value]}
      # "品名A|助数詞A|品名B|助数詞B"（助数詞は品ごとに変わるので組で持つ）。
      # **単価が 50〜150円の帯なので、その帯に収まる品だけにする。**
      # 「まんが1冊は140円」「画用紙1枚は150円」「シール1枚は140円」が出ていた
      # （まんがは400円台、画用紙とシールは数十円）。
      item_pair_candidates:
        - ノート|冊|えん筆|本
        - 消しゴム|個|下じき|枚
        - ボールペン|本|クリアファイル|枚
        - コップ|個|皿|枚
        - おかし|個|ジュース|本
        - パン|個|牛乳|本
        - おにぎり|個|お茶|本
        - ドーナツ|個|プリン|個
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [simultaneous_equations.word_problem_price_count_diff]
    cause_tags: []
remedial:
  default_level: 2
