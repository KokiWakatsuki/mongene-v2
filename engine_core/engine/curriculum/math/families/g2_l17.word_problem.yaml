family: math.g2_l17.word_problem
form: word_problem
source_desc: |
  連立方程式の利用：速さ・時間・道のりの問題
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・道のり/時間の2式を素直に立てて解く。
       example: A町からB町を通ってC町まで行った。A町からB町までは時速4kmで歩き、
                B町からC町までは時速12kmで走ったところ、全体で18km進むのに2時間かかった。
                (1) 歩いた道のりを x km、走った道のりを y km として、道のりと時間の関係を
                    表す2つの式をつくれ。(2) 歩いた道のりと走った道のりをそれぞれ求めよ。
       ※台帳の example は後半を「走った」にしているが、時速12km以上で1時間以上走る場面は
         文章として成り立たない（区間の道のりに上限をかけると走る区間が常に1時間に固定され、
         合計時間の構造が動かなくなる）。後半を自転車に替える——立式（x + y = D,
         x/a + y/b = T）は台帳と同一で、速さの範囲だけが自然になる。
  Lv3 desc: 往復・区間分けなど場合分けや単位変換を伴う複数立式。
       example: 家から駅まで行くのに、初めは分速60mで歩き、途中から分速180mで走ったところ、
                家から駅まで2100mの道のりを20分で着いた。歩いた道のりと走った道のりは
                それぞれ何mか求めよ。
  Lv4 desc: 誘導なし・出会い/追いつき等の関係を自分で構成し融合的に解く。
       example: 1周1200mの池のまわりを、AさんとBさんが同じ地点から同時に出発する。
                反対向きに進むと6分後に出会い、同じ向きに進むとAさんがBさんに30分後に
                追いつく。AさんとBさんの速さはそれぞれ分速何mか求めよ。
  ---
  【この form の型】g2_l16 / g1_l25-l27 で通した骨格（given.scenario＝場面／
  given.quantities＝変数の設定／小問文は context_slots）をそのまま使う。テンプレも
  既存の wp_linear_guided_v1 / wp_linear_solo_v1 を再利用（文言は recipe が
  context_slots に載せるので、場面が増えてもテンプレは増えない）。
  recipe は math.word_problem_system_equations 1つで6セル（g2_l17/g2_l18 × Lv2/3/4）。
  数学は既存 solver math.intersection_of_two_lines に委ねる＝新 solver ゼロ
  （2元1次の連立は「2直線の交点」と同じ計算）。
  【level_sep】**何を文字に置くか**がレベルで動く。
   Lv2: 文字＝道のり → 時間の式が分数係数（x/a + y/b = T）。誘導あり2小問。単位は km/時。
   Lv3: 文字＝時間 → 道のりの式が整数係数（a·x + b·y = D）。しかも問われるのは道のりで、
        解いた x, y から a·x, b·y を作る最後の一手が要る（answer_map）。誘導なし1小問。
        単位は m/分（Lv2 から単位系が変わる＝台帳 desc の「単位変換を伴う」）。
   Lv4: 文字＝速さ → 和と差の2式（t1(x+y)=L, t2(x−y)=L）。出会いと追いつきという
        2つの場面をどちらも自分で式に翻訳する。誘導なし1小問。
  小問数・立式の形・答えまでの手数がすべて違う＝G6 の構造差。
  【answer-first】Lv2/Lv3 は「区間ごとの時間」を先に引いて道のり・合計を逆算する
  （こうすると合計時間が自動で整数になり、分数係数でも端数が出ない）。Lv4 は
  (速い人, 遅い人, 1周) の組を列挙してから引く（t1 = L/(x+y), t2 = L/(x−y) が
  どちらも整数かつ自然な範囲に入る組だけを残す。g3_l31 と同じ列挙パターン）。
  【検証】G-Q1 が全小問 double-solve。checker は params の「場面文に出ている数値」だけ
  から立式し直し・解き直す（答えは params に入れない）。
concepts_default: [simultaneous_equations.word_problem_distance_time]
levels:
  "2":
    signature: word_problem_distance_time_guided
    recipe: math.word_problem_system_equations
    params:
      scenario_kind: distance_time
      guided: true
      # 歩き / 自転車を別の候補列から引く＝a ≠ b が常に成り立つ（det = 1/b − 1/a ≠ 0）。
      # **歩く＝時速3〜5km、自転車＝時速10〜15km。** 前は歩き6km・自転車18kmまで
      # 許していて「時速6kmで歩き、時速18kmの自転車で進んだ」が出ていた
      # （時速6kmは競歩、時速18kmは自転車の巡航上限）。
      walk_speed_candidates: [3, 4, 5, 6]
      bike_speed_candidates: [10, 12, 15, 16, 18, 20]
      # 区間ごとの所要時間（時間）。道のり = 速さ×時間 なので合計 T は常に整数。
      # ★2026-08-18: 1..6 に広げたら「家から駅まで時速4kmで12km（3時間）歩く」が出た。
      hours_range: [1, 3]
      # 区間ごとの道のりの上限（「歩いて30km」のような場面を作らない）。
      walk_distance_max: 8
      # 歩き＋自転車の1回の移動なので、自転車の道のりも 24km まで
      # （前は40kmで「全体で44km進む」という場面になっていた）。
      bike_distance_max: 16
      # 自転車で通れる道でつなぐ場所（登山道のような場面は入れない）。
      place_triple_candidates: [A町|B町|C町, P町|Q町|R町, X町|Y町|Z町,
                                学校|公園|図書館, 家|駅|港, 家|バス停|海岸,
                                駅|市役所|美術館, 家|商店街|球場]
    dup_rate_max: 0.8
    dup_rate_reason: |
      100 seed で相異 24 問（実測）。歩きと自転車で2地点を移動する場面で、
      **歩く道のりが 8km 以内・所要が 3 時間以内**に収まる組しか使えない
      （広げたら「家から駅まで時速4kmで12km を3時間歩く」が出た）。
    given: [scenario, quantities]
    asked: [formulation, value]
    visual: none
    text: {tier: T1, template: wp_linear_guided_v1}
    hints: [steps_prefix]
    concept_tags: [simultaneous_equations.word_problem_distance_time]
    cause_tags: []
  "3":
    signature: word_problem_time_split_solo
    recipe: math.word_problem_system_equations
    params:
      scenario_kind: time_split
      guided: false
      # 分速（m/分）。歩き < 走り は候補列の分離で保証（det = b − a ≠ 0）。
      walk_speed_candidates: [50, 60, 70, 75, 80]
      run_speed_candidates: [150, 160, 180, 200]
      # 歩きと走りで範囲を分ける（走る区間が歩く区間より長いと通学の場面に読めない）。
      walk_minutes_domain: {int_range: [5, 18]}
      run_minutes_domain: {int_range: [3, 8]}
      place_candidates: [家|駅, 学校|図書館, 家|公園, 駅|港, 家|体育館,
                         宿|展望台, 家|工場, 学校|市民館]
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [simultaneous_equations.word_problem_time_split]
    cause_tags: []
  "4":
    signature: word_problem_lap_meet_catch_up
    recipe: math.word_problem_system_equations
    params:
      scenario_kind: lap_meet_catch_up
      guided: false
      # (速い人, 遅い人, 1周) の組は recipe が列挙する（t1・t2 が整数になる組だけ）。
      speed_candidates: [50, 60, 70, 75, 80, 90, 100, 110, 120, 125, 130, 140, 150, 160,
                         175, 180, 200]
      lap_candidates: [600, 720, 800, 900, 1000, 1080, 1200, 1350, 1400, 1440, 1500,
                       1600, 1800, 2000, 2100, 2400, 2700, 3000]
      meet_time_range: [2, 20]
      catch_up_time_range: [10, 60]
      person_pair_candidates: [Aさん|Bさん, 兄|弟, 姉|妹, Bさん|Aさん,
                               ゆうとさん|あおいさん, りくさん|ひなさん,
                               そうたさん|めいさん, はるとさん|ゆいさん]
    dup_rate_max: 0.32
    dup_rate_reason: |
      100 seed で相異 75 問（実測）。中身の軸は 75 通り。
      答えが整数になる組しか使えないため、定義域を広げても通る組はこの程度にとどまる。
      以前は点名・人名・使う文字を dup_key に算入していたので閾を通っていたが、
      **名前が違うだけの問題は別の問題ではない**。増やすには題材そのものを追加する。
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [simultaneous_equations.word_problem_lap_meet_catch_up]
    cause_tags: []
remedial:
  default_level: 2
