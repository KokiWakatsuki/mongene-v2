    params:
      # 傾き a(≠0)・切片 b・代入する x0(≠0) を選ぶ。答え y=a*x0+b は1つの数値。
      # 組合せ 10*19*12=2280 通りで dup_rate に十分な余裕。|y|≤5*6+9=39 に有界。
      slope_domain: {int_range: [-5, 5], exclude: [0]}
      intercept_domain: {int_range: [-9, 9]}
      x_domain: {int_range: [-6, 6], exclude: [0]}
    given: [expression, input_value]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_evaluate_at_x_v1}
    hints: [steps_prefix]
    concept_tags: [linear_function.evaluate_at_x]
    cause_tags: []
remedial:
