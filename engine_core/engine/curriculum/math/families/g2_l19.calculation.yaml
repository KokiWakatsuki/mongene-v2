source_desc: |
  1次関数 y=ax+b に x の値を代入して y を求める
  （units.generated.yaml の desc/example を正として転記）。
  desc: y=ax+b に x を代入して y を求める。
  example: 1次関数 y=2x+3 について、x=4 のときの y の値を求めよ。
  教科書例題レベルの代入計算。x の値を式に代入し、計算して y の値を1つ求める。
concepts_default: [linear_function.evaluate_at_x]
