family: math.g2_l20.find_value
form: find_value
source_desc: |
  2点の座標から一次関数の変化の割合（＝傾き）を求める（例: 2点 (1, 3) と (4, 12) を
  通る1次関数の変化の割合を求めよ。答え 3）。変化の割合 = (y の増加量)/(x の増加量)。
  g2_l25「2点→式」の前段で、答えは式でなく変化の割合そのもの（asked=rate_of_change）。
