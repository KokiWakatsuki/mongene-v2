family: math.g2_l28.word_problem
form: word_problem
source_desc: |
  1次関数の利用（ばね・水そう）＝場面を1次関数として立式し、値や時刻を求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・比例的変化から式を立て値を求める。
       example: あるばねに10gのおもりをつるすと全体の長さが14cm、30gのおもりをつるすと
                18cmになった。ばねの長さycmはおもりの重さxgの1次関数であるとする。
                (1) yをxの式で表せ。(2) 50gのおもりをつるしたときのばねの長さを求めよ。
  Lv3 desc: 区間で式が変わる・複数量を扱うなど複数立式を要する。
       example: 空の水そうに水を入れ始める。初めの10分間は毎分3Lで入れ、その後は
                毎分5Lで入れる。水を入れ始めてからx分後の水の量をyLとする。
                (1) 0≦x≦10のときのyをxの式で表せ。(2) x≧10のときのyをxの式で表せ。
                (3) 水の量が70Lになるのは水を入れ始めてから何分後か求めよ。
  ---
  【この form の型】word_problem_linear.py/word_problem_system.py と同じ骨格
  （given.scenario＝場面／given.quantities＝変数の設定／小問文は context_slots）。
  recipe は math.word_problem_linear_function（engine/packs/math/recipes/
  word_problem_linear_function.py）1つで g2_l28 Lv2/Lv3・g2_l30 Lv3 の3セルを賄う。
  数学は既存 solver math.linear_expr_from_two_points / math.linear_expr_from_slope_point /
  math.evaluate_linear_at_x / math.solve_linear_equation に委ねる＝新 solver ゼロ。
  【level_sep】Lv2（scenario_kind=spring_two_point）は2点から式を1本決めて代入する
  1直線。Lv3（scenario_kind=tank_piecewise）は区間で式が変わる折れ線で、
  (1)(2)の2つの式＋(3)目標の量になる時刻、の3小問（小問数・式の本数が変わる＝
  G6 の構造差）。
  【answer-first】
    Lv2: 傾き num/den（既約分数）と重さの単位 k・den・unit(=5g刻み) を先に決め、
    x=k・den・unit と置くことで y=(num/den)x+b が常に整数になることを構成で保証する
    （brief §「傾きが整数または扱いやすい分数になるよう重さの差が長さの差を割り切る
    組を保証」に対応）。答え y0 が given の数値と一致する組は弾く。
    Lv3: 目標の量になる時刻 x0 を t1（第1区間の長さ）より後（=t1+extra分後）に先に
    決め、target の量をそこから逆算する。これにより target は必ず第2区間に入る
    （brief §「70Lが2つ目の区間に入る組だけ許す」に対応、鉄則⑤）。
  【検証】G-Q1 が全小問 double-solve。checker（engine/packs/math/checkers/
  word_problem_linear_function.py）は params の「場面文に出ている数値」だけから
  recipe と同じ solve_spring / solve_tank 関数を呼んで解き直す。答えは params に
  入れない。
concepts_default: [linear_function.word_problem_two_point_eval]
levels:
  "2":
    signature: word_problem_linear_two_point_eval
    recipe: math.word_problem_linear_function
    params:
      scenario_kind: spring_two_point
      # 傾き num/den（既約分数のみ・gcd フィルタは recipe 側）。
      slope_den_candidates: [1, 2, 4, 5]
      slope_num_candidates: [1, 2, 3]
      # x = k・den・weight_unit_gram と置くことで y が常に整数になる。
      weight_unit_gram: 5
      weight_k_range: [1, 7]
      intercept_domain: {int_range: [5, 12]}
      object_candidates: [ばね, ゴムひも, つる巻きばね]
    # 問題文の数が、この単元では単位の上限を超えるのが正しい
    # （`engine.eval.statement_size`）。
    statement_size_max: {cm: 300, L: 500}
    statement_size_reason: |
      ばね・ゴムひもの伸びと水そうの容量が題材。ばねは 1m を超えることがあり、
      水そうは 100L 以上が普通（家庭の浴槽で 200L）。図形の寸法ではない。
    given: [scenario, quantities]
    asked: [formulation, value]
    visual: none
    text: {tier: T1, template: wp_linear_guided_v1}
    hints: [steps_prefix]
    concept_tags: [linear_function.word_problem_two_point_eval]
    cause_tags: []
  "3":
    signature: word_problem_linear_piecewise_tank
    recipe: math.word_problem_linear_function
    params:
      scenario_kind: tank_piecewise
      t1_range: [6, 15]
      rate_range: [2, 8]
      extra_minutes_range: [3, 15]
      # 「容器|液体」の対（容器と液体の組合せが不自然にならないよう対で引く）。
      container_liquid_candidates: [水そう|水, タンク|水, 浴槽|お湯]
    # 問題文の数が、この単元では単位の上限を超えるのが正しい
    # （`engine.eval.statement_size`）。
    statement_size_max: {cm: 300, L: 500}
    statement_size_reason: |
      ばね・ゴムひもの伸びと水そうの容量が題材。ばねは 1m を超えることがあり、
      水そうは 100L 以上が普通（家庭の浴槽で 200L）。図形の寸法ではない。
    given: [scenario, quantities]
    asked: [formulation, formulation, value]
    visual: none
    text: {tier: T1, template: wp_linear_guided3_v1}
    hints: [steps_prefix]
    concept_tags: [linear_function.word_problem_piecewise_tank]
    cause_tags: []
  "4":
    # 台帳 Lv4 example（満水 40L を 8 分で空にする水そうと、毎分 3L 入れる水そう）を
    # そのまま実装。減る側 y=C−(C/m)x と増える側 y=r·x の2直線の交点なので、
    # 既存の `math.intersection_of_two_lines` に乗る＝新しい数学は要らない。
    # 誘導なし1小問で、等しくなる時刻とそのときの量の2つを自分で順に出す。
    signature: word_problem_tank_race
    recipe: math.word_problem_linear_function
    params:
      scenario_kind: tank_race
      # (容量, 空になるまでの分, 入れる割合) は recipe が列挙する
      # （時刻と量がともに整数・答えが本文の数値と一致しない組だけ）。
      capacity_candidates: [24, 30, 36, 40, 45, 48, 54, 60, 72, 80, 90, 96, 108, 120]
      minutes_candidates: [4, 5, 6, 8, 9, 10, 12, 15, 18, 20]
      rate_candidates: [2, 3, 4, 5, 6, 7, 8, 9, 10, 12]
      person_pair_candidates: [A|B, あきら|ゆうこ, けんた|みさき, たかし|なおみ,
                               ひろし|さくら, まさと|あやか, りく|ひなた, そうた|めい]
    # 問題文の数が、この単元では単位の上限を超えるのが正しい
    # （`engine.eval.statement_size`）。
    statement_size_max: {cm: 300, L: 500}
    statement_size_reason: |
      ばね・ゴムひもの伸びと水そうの容量が題材。ばねは 1m を超えることがあり、
      水そうは 100L 以上が普通（家庭の浴槽で 200L）。図形の寸法ではない。
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [linear_function.word_problem_tank_race]
    cause_tags: []
remedial:
  default_level: 2
