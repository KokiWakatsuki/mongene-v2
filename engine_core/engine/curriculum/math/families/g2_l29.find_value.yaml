family: math.g2_l29.find_value
form: find_value
source_desc: |
  動点の面積の式（比例 y=ax）から、目標の面積となる時刻 x を逆算する
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 面積の式から値や逆算で時刻を求める。
       example: 動点Pが辺上を動くとき、三角形の面積 y cm² が時間 x 秒について y=2x で表される
                区間があり、この区間は 0≦x≦4 である。この区間で面積が12cm²となる時刻 x を求めよ。
  答えは時刻 x（SymbolicAnswer）。a·x=y_target を解く（solve_time_from_area・新 solver）。
  ★設計モデル（preview 検収 Q4）: 面積の式 y=ax は既知として与え、目標の面積から時刻を逆算する
  技能のみを問う T1 セル（面積の式そのものの立式は word_problem g2_l29）。answer-first で y_target を
  区間内に構成するので、答えの時刻は必ず区間 0≦x≦x_max 内にある（矛盾しない）。
concepts_default: [linear_function.solve_time_from_area]
levels:
  "3":
    signature: solve_time_from_area
    recipe: math.solve_time_from_area
    params:
      # 比例定数 a(>0)・答えの時刻 x_ans(区間内)・区間上端までの余白 margin(>0)。
      # y_target=a*x_ans は区間内で到達する面積。組合せ a(9)*x_ans(12)*margin(6)=648 で
      # dup_rate に十分な余裕（狭域だと衝突が跳ねるため広めにとる）。
      # **比例定数 1 は除く。** y = x だと「面積が12cm²となる時刻」の答えが
      # そのまま 12 になり、問いが答えを言っているのと変わらない。
      slope_domain: {int_range: [2, 9]}
      x_answer_domain: {int_range: [1, 12]}
      margin_domain: {int_range: [1, 6]}
    given: [expression, x_domain, condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_solve_time_from_area_v1}
    hints: [steps_prefix]
    concept_tags: [linear_function.solve_time_from_area]
    cause_tags: []
remedial:
  default_level: 3
