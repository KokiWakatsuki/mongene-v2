family: math.g2_l3.calculation
form: calculation
source_desc: |
  多項式の加減 (A)±(B) をかっこを外して整理する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: かっこのない多項式の素直な加減。
       example: 次の計算をせよ。　(3x + 2y) + (5x − 4y)
  Lv2 desc: 減法でのかっこ展開の符号処理・縦書き計算を要する加減。
       example: 次の計算をせよ。　(4a − 3b + 2) − (a − 5b − 6)
  答えは整理した式（SymbolicAnswer）。独立ソルバ add_or_subtract_polynomials（sympy.expand）で再計算。
  Lv1（加法・そのままかっこを外す）と Lv2（減法・うしろのかっこの符号を変えて外す）で op 列を変える
  ＝level_sep。各項の係数は nonzero で構成し、答えが完全に消える場合のみ bounded_retry で再構成。
concepts_default: [polynomial.add_polynomials]
levels:
  "1":
    signature: add_polynomials
    recipe: math.add_or_subtract_polynomials
    params:
      # (x,y の1項ずつ)+(x,y の1項ずつ)。係数は nonzero。組合せ 12^4 で dup_rate に十分。
      mode: add
      coeff_domain: {int_range: [-6, 6]}
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_add_subtract_polynomials_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.add_polynomials]
    cause_tags: []
  "2":
    signature: subtract_polynomials
    recipe: math.add_or_subtract_polynomials
    params:
      # (a,b,定数)-(a,b,定数)。うしろのかっこの符号処理が必須。係数は nonzero。組合せ 12^6。
      mode: subtract
      coeff_domain: {int_range: [-6, 6]}
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_add_subtract_polynomials_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.subtract_polynomials]
    cause_tags: []
remedial:
  default_level: 1
