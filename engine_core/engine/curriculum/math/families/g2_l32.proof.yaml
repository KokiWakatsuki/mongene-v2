      proof_depth: 1
      prefer: parallel
      base_domain: {int_range: [28, 46]}
      angle_domain: {int_range: [40, 85]}
      offset_domain: {int_range: [10, 26]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [parallel_lines.judge_from_angle]
    cause_tags: []
