family: math.g2_l32.proof
form: proof
source_desc: |
  平行線の性質と平行になるための条件
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・錯角等が等しいことから平行を1段で示す。
  Lv3 desc: 誘導なし・補助線や複数角の関係を自分で構成して平行を示す。
  ---
  【設計モデル】g2_l39.proof と同じ推論器（構成 → 前向き推論 → 結論 → 証明文）。

  【★平行であることは仮定に入れない】この単元で示すのは「2直線が平行であること」
  なので、構成が平行を持っていたら問題にならない。Lv2 は錯角が等しいことだけを
  与える図、Lv3 は**角の等しさ自体を導く**図（X字型で合同から対応する角を出す）。

  【規則の所属を直した】「錯角が等しければ平行」は `rules_similarity.py` に置いて
  あるが、**これは2年の定理**である。topics に similarity が入っていたせいで、
  2年の単元（topic_set: congruence）からこの定理が使えなかった。topics を
  parallel だけにした。

  【深さ】Lv2 は仮定 → 平行（深さ1）。Lv3 は中点 → 対頂角 → SAS 合同 →
  対応する角が等しい → 平行（深さ4）。op 列は当然に相異する。
concepts_default: [parallel_lines.judge_from_angle]
