family: math.g2_l33.find_value
form: find_value
source_desc: |
  内角の和180°を使い、三角形の残りの角を求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 内角の和/外角=隣り2内角の和を1回使い角を求める。
       example: 右の三角形ABCで、∠A=50°、∠B=60° のとき、∠C の大きさを求めよ。
  Lv2 desc: 補助線や複数三角形にまたがり多段で角を求める。
       example: 右の図で、2つの三角形が組み合わさっている。∠A=30°、∠B=40°、∠D=25°
                のとき、補助線や外角の性質を使って ∠x の大きさを求めよ。
  【設計モデル】新設 solver math.triangle_third_angle（2つの内角だけから
  c=180-a-b を計算・恒真）。

  【Lv2 設計モデル】新設 solver math.arrowhead_angle。三角形ABCの内部に点Dをとり
  BD・CD を結ぶ、いわゆる**ブーメラン型**で ∠BDC = ∠BAC + ∠ABD + ∠ACD。
  AD をのばす補助線を1本引くと図が2つの三角形に分かれ、それぞれで外角の性質を
  使った結果を合わせる——「補助線を引いて複数の三角形にまたがる」という desc の
  要件が、そのまま op 列になる。

  【図を使わずに成立させた理由】台帳 example は「右の図で」と図を前提にしているが、
  この構成は**どの点をどう結ぶかを文で述べれば図が一意に決まる**（三角形ABCの内部の
  点D、BとD・CとDを結ぶ）。角の大小に関わらず関係式は同じなので、図が無くても
  問題として成立する。Lv1 と同じく visual: none。

  【退化の封じ方】3つの角の和が平角以上だと内部に点をとった図として成立しない
  （∠BDC が平角を超える）。和が 180 未満になるまで有界リトライする。

  【level_sep】Lv1 = identify_two_interior_angles → subtract_from_sum の2手。
  Lv2 = draw_auxiliary_line → apply_exterior_angle_first →
  apply_exterior_angle_second → sum_two_exterior_angles の4手。op 列が相異する。

  【dup】3つの角（1〜178・和が180未満）で数万通り。
concepts_default: [triangle_angle.third_angle]
levels:
  "1":
    signature: triangle_third_angle
    recipe: math.triangle_third_angle
    params:
      # **三角形の内角は 20〜130°。** 前は 1〜178 で「∠B=11°」のような
      # 紙に描けない細い三角形が出ていた。
      angle_domain: {int_range: [20, 130]}
      third_angle_min: 20
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_triangle_third_angle_v1}
    hints: [steps_prefix]
    concept_tags: [triangle_angle.third_angle]
    cause_tags: []
  "2":
    signature: arrowhead_angle
    recipe: math.arrowhead_angle
    params:
      # 20 未満だと「∠BAC=10°」のような紙に描けない図になる。
      angle_domain: {int_range: [20, 110]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_triangle_third_angle_v1}
    hints: [steps_prefix]
    concept_tags: [triangle_angle.arrowhead_multi_step]
    cause_tags: []
remedial:
  default_level: 1
