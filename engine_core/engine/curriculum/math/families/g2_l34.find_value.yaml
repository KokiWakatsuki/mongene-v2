family: math.g2_l34.find_value
form: find_value
source_desc: |
  180×(n-2)で内角の和や1つの内角を直接求める・内角の和から辺の数を逆算する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 180×(n-2)で内角の和や1つの内角を直接求める。
       example: 正八角形の内角の和を求めよ。また、正八角形の1つの内角の大きさを
                求めよ。
  Lv2 desc: 内角の和を逆算して辺の数を出す・複合図形に適用する。
       example: 内角の和が1440°である多角形は何角形か求めよ。
  【設計モデル】新設 solver math.polygon_interior_sum_and_angle（Lv1・辺の数 n だけ
  から内角の和と1つの内角を計算・Tuple答え）、math.polygon_sides_from_interior_sum
  （Lv2・内角の和から辺の数を逆算）。
concepts_default: [polygon_angle.interior_sum_and_angle]
levels:
  "1":
    signature: polygon_interior_sum_and_angle
    recipe: math.polygon_interior_sum_and_angle
    params:
      # **20角形まで。** 前は 24・30・36 まで引いていて「正30角形の内角の和」
      # 「1つの内角が170°である正多角形」（正36角形）が出ていた。実物の教材が
      # 扱う正多角形は正二十角形あたりまで。名前は漢数字で書く。
      sides_domain: {int_set: [3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_polygon_interior_sum_and_angle_v1}
    hints: [steps_prefix]
    concept_tags: [polygon_angle.interior_sum_and_angle]
    cause_tags: []
    dup_rate_max: 0.90
    dup_rate_reason: >-
      教材にありうる正多角形は三角形〜正三十六角形あたりまでで、問題空間が本質的に14通りしかない。既定の0.20を通すには「正348角形」「1つの内角が4860/29°」を作ることになり、教材にならない。数を現実に戻したうえで重複を仕様として宣言する。
