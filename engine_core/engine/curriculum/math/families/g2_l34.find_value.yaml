      # 扱う正多角形は正二十角形あたりまで。名前は漢数字で書く。
      sides_domain: {int_set: [3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_polygon_sides_from_interior_sum_v1}
    hints: [steps_prefix]
    concept_tags: [polygon_angle.sides_from_interior_sum]
    cause_tags: []
    dup_rate_max: 0.90
    dup_rate_reason: >-
      教材にありうる正多角形は三角形〜正三十六角形あたりまでで、問題空間が本質的に14通りしかない。既定の0.20を通すには「正348角形」「1つの内角が4860/29°」を作ることになり、教材にならない。数を現実に戻したうえで重複を仕様として宣言する。
