family: math.g2_l36.find_value
form: find_value
source_desc: |
  対応する辺の長さ/角の大きさを読み取り求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 対応する辺の長さ/角の大きさを読み取り求める。
       example: △ABC≡△DEF で、AB=6cm、∠B=50° である。このとき、辺DEの長さと
                ∠E の大きさを求めよ。
  【設計モデル】新設 solver math.congruence_transfer_values（合同な図形は対応する
  辺・角がそれぞれ等しいという恒真の性質から、わかっている辺の長さ・角の大きさを
  そのまま対応する辺・角の値として求める）。答えは Tuple(辺の長さ, 角の大きさ)。
concepts_default: [congruence.transfer_values]
levels:
  "1":
    signature: congruence_transfer_values
    recipe: math.congruence_transfer_values
    params:
      # **紙の図形の辺の長さ（3〜30cm）。** 前は 1〜300（1〜500）で
      # 「1辺84cmの正三角形」「辺AB=96cm」のような、教材には出てこない
      # 大きさが出ていた。実物の図形問題の辺は 3〜20cm あたり。
      side_domain: {int_range: [3, 30]}
      # **合同な三角形の角は 25〜150°。** 前は 1〜178 で「∠R=157°」が出ていた。
      angle_domain: {int_range: [25, 150]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_congruence_transfer_values_v1}
    hints: [steps_prefix]
    concept_tags: [congruence.transfer_values]
    cause_tags: []
remedial:
  default_level: 1
