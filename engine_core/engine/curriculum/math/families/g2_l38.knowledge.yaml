family: math.g2_l38.knowledge
form: knowledge
source_desc: |
  仮定・結論・反例の用語を想起する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 仮定・結論・逆・反例の用語を想起する。
       example: 「2つの角が等しい三角形は二等辺三角形である」という文について、
                仮定と結論をそれぞれ答えよ。また、あることがらが成り立たないことを
                示すための具体例を何というか答えよ。
  Lv2 desc: 命題から仮定/結論を取り出し、逆や反例を判別・提示する。
       example: 「a>0、b>0 ならば a+b>0 である」という命題について、（1）仮定と結論を
                答えよ。（2）この命題の逆を述べよ。（3）その逆が正しくないことを示す
                反例を1つ挙げよ。
  【設計モデル】用語想起ハブ（既存 math.term_recall・_TERM_MAPS に domain
  "proof_logic_terms"（仮定/結論/反例の3 concept）を追加）。

  【Lv2 設計モデル】新設 solver 2本（math.proposition_converse_choice /
  math.proposition_counterexample_choice）。台帳 example の (1) 仮定と結論・
  (2) 逆を述べよ・(3) 反例を挙げよ のうち、**記述になる (2)(3) を選択に畳む**
  （「逆を述べよ」「反例を挙げよ」は engine が採点できないが、候補から選ばせれば
  判別も提示も同じ操作でできる）。(1) は (2) の解法手順の第1手
  extract_hypothesis_and_conclusion がそのまま担う。

  【選択肢の作り】(1) の妨害は 裏・対偶・もとの命題（似た形の3つと区別できるか）。
  (2) の妨害は「逆の仮定も結論も満たす例」（反例になっていない＝いちばん多い誤り）と
  「逆の仮定を満たさない例」。どれが反例かは solver が数の性質で実際に判定して決める
  （日本語の見た目で決めない）。

  【dup】**命題を数個カタログに並べるだけでは組合せ数が足りない**（既知の罠）ので、
  数値をパラメータに持つ3つの型（倍数・大小・和の符号）×数値×変数名で変種を作る。

  【退化の封じ方】どの型も「もとの命題は正しく、逆は正しくない」ようにパラメータを
  縛る（そうでないと (2) の反例が存在しない）。solver 側でも、選んだ反例が
  逆の仮定を満たし逆の結論を満たさないことを実際に判定して確かめる。

  【level_sep】Lv1 = 用語想起の1小問（asked=choice・op は recall 系）。
  Lv2 = 2小問で、op 列は extract_hypothesis_and_conclusion → swap_for_converse ／
  state_counterexample_condition → pick_counterexample。小問数と op 列が相異する。
concepts_default: [proof_logic_terms.term_recall]
levels:
  "1":
    signature: proof_logic_terms_term_recall
    recipe: math.term_recall
    params:
      domain: proof_logic_terms
      concept_set: [assumption, conclusion, counterexample]
      number_domain: {int_range: [1, 500]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [proof_logic_terms.term_recall]
    cause_tags: []
  "2":
    signature: proposition_converse
    recipe: math.proposition_converse
    params:
      variable_candidates: ["n", "m", "k", "x", "y", "a"]
      # multiple 型: a = b·k（b の倍数が a の倍数とは限らない）
      base_domain: {int_range: [2, 9]}
      factor_domain: {int_range: [2, 5]}
      # greater 型: a = b + gap（a > b）／positive 型: a・b は反例の作り方に使う
      value_domain: {int_range: [1, 30]}
      gap_domain: {int_range: [1, 12]}
    given: [statement]
    asked: [choice, choice]
    visual: none
    # lf_term_recall_v1 は「…を何といいますか。」を付け足すので使えない（問いは
    # 命題の文が自前で持つ）。given.statement をそのまま出すテンプレートを使う。
    text: {tier: T1, template: lf_statement_only_v1}
    hints: [steps_prefix]
    concept_tags: [proof_logic_terms.converse_and_counterexample]
    cause_tags: []
remedial:
  default_level: 1
