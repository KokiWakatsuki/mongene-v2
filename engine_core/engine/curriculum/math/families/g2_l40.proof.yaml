family: math.g2_l40.proof
form: proof
source_desc: |
  合同な図形の性質を利用した辺や角の証明
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・合同を示し対応辺/角が等しいと1段で結論する。
  Lv3 desc: 補助線や2段階(合同→性質)を要する証明。
  ---
  【設計モデル】g2_l39.proof と同じ推論器（docs/proof_engine_design_2026-08-08.md）。
  違うのは**結論の深さ**だけで、ここは「合同を示す」の先にある「対応する辺・角が
  等しい」を結論にする（深さ2）。

  **Lv と深さの対応は単元ごとに違う**——「合同を直接示す」g2_l39 の Lv2 は深さ1だが、
  「合同を示してから対応する辺が等しいと結論する」この単元の Lv2 は最初から深さ2に
  なる。だから family が `proof_depth` で明示する。

  【dup】たこ形の長さ・角のパラメータで変わる。結論は同じ筋道でも、図が変わる。

  【Lv4】台帳「誘導なし・複数三角形の合同を組み合わせ方針を自分で構成する」。
  同じたこ形に**対角線をもう1本**引いて交点Pをとるだけで、証明の性質が変わる
  ——1つ目の合同から出た角を材料に2つ目の合同を示す形になり、深さが 2 → 4 になる。
  **点を足すのではなく、同じ図で結論の深さをずらす**という、この機構でいちばん
  素直に Lv 差が出る作り方である。
concepts_default: [congruence_proof.corresponding_parts]
levels:
  "2":
    signature: geometry_proof_corresponding_parts
    recipe: math.geometry_proof
    params:
      construction: kite
      proof_depth: 2
      base_domain: {int_range: [24, 38]}
      angle_domain: {int_range: [62, 96]}
      offset_domain: {int_range: [28, 46]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [congruence_proof.corresponding_parts]
    cause_tags: []
  "3":
    signature: geometry_proof_parts_two_step
    recipe: math.geometry_proof
    params:
      # X字型。中点の展開 → 対頂角 → SAS で合同を示し、**その先の**対応する辺に
      # 進む（深さ3）。Lv2 のたこ形が「合同→性質」の1段だったのに対し、ここは
      # 合同を示すまでに2手かかるので、示す順序を自分で組み立てることになる。
      construction: x_shape
      proof_depth: 3
      # 結論を辺の等式に固定する（角の等式も深さ3で出るが、辺のほうが
      # 「合同→対応する辺」の型がはっきりする）。
      prefer: seg_eq
      base_domain: {int_range: [22, 34]}
      angle_domain: {int_range: [48, 84]}
      offset_domain: {int_range: [22, 36]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [congruence_proof.corresponding_parts]
    cause_tags: []
  "4":
    signature: geometry_proof_parts_two_congruences
    recipe: math.geometry_proof
    params:
      # たこ形に**対角線を2本とも**引いて交点をPとした図。Lv3 の X字型が
      # 「1つの合同を示すまでに2手」だったのに対し、ここは
      #   △ABC ≡ △ADC（深さ1）→ 対応する角（深さ2）
      #   → △ABP ≡ △ADP（深さ3・**1つ目の合同から出た角が材料**）→ BP ＝ DP（深さ4）
      # と**合同を2回使う**。台帳 Lv4 の「複数三角形の合同を組み合わせ方針を自分で
      # 構成する」がこの形で、op 列も Lv3 と相異する（8手・合同条件が2つ並ぶ）。
      construction: kite_diagonals
      proof_depth: 4
      prefer: seg_eq
      # fit_domain の実測: 粗格子 636/1540（41%）。recipe は 24 回引き直すので
      # この合格率でも rejects は出ない（0.59^24 ≒ 4e-6）。**狭く絞らない**——
      # dup_rate は箱の広さでしか下がらないので、合格率より広さを取る。
      base_domain: {int_range: [24, 56]}
      angle_domain: {int_range: [40, 118]}
      offset_domain: {int_range: [20, 48]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [congruence_proof.corresponding_parts]
    cause_tags: []
remedial:
  default_level: 2
