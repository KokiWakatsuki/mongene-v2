family: math.g2_l41.proof
form: proof
source_desc: |
  二等辺三角形の性質とその証明
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・底角が等しい等の性質を合同で1段で証明する。
  Lv3 desc: 頂角の二等分線など補助線を引く2段階の証明。
  ---
  【設計モデル】g2_l39.proof と同じ推論器。図は二等辺三角形に底辺の中点を結んだもの。

  【★証明したい定理を規則から外す】この単元は「二等辺三角形の性質」を**証明する**のが
  目的なので、規則カタログの「二等辺三角形の底角は等しい」を使えてしまうと1手で
  終わってしまう（循環）。family の `exclude_rules` でその規則を外して探索する。
  **単元ごとに「これから示すこと」を外す**、というのがこの form の設計の要点。

  【深さ】合同を示す（深さ2・中点の展開を含む）→ 対応する角が等しい（深さ3）。
  台帳の desc「性質を合同で1段で証明する」がこの形にあたる。

  【Lv4 だけ exclude_rules を置かない】台帳 Lv4 は「誘導なし・**性質を組み合わせ**
  方針を自分で構成する」。Lv2/Lv3 が底角の性質を**証明する**回なので規則から外すの
  に対し、Lv4 はその性質を**使う**回である。ここを取り違えて外すと、Lv4 の図
  （辺の上に BD ＝ CE となる点をとった図）から証明が1つも出なくなる。
concepts_default: [isosceles_proof.property_by_congruence]
levels:
  "2":
    signature: geometry_proof_isosceles_property
    recipe: math.geometry_proof
    params:
      construction: isosceles_median
      proof_depth: 3
      exclude_rules: [use_isosceles_base_angles]
      base_domain: {int_range: [30, 44]}
      angle_domain: {int_range: [55, 88]}
      offset_domain: {int_range: [18, 34]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [isosceles_proof.property_by_congruence]
    cause_tags: []
  "3":
    signature: geometry_proof_isosceles_bisector
    recipe: math.geometry_proof
    params:
      # 頂角の二等分線を引いた図。Lv2 の「中点を結んだ図」と点の位置は同じだが、
      # **与える条件が違う**ので筋道が変わる（SSS ではなく SAS）。結論は
      # 「二等分線が底辺を2等分する」——補助線を引いてから合同を経由する2段階。
      construction: isosceles_bisector
      proof_depth: 2
      prefer: seg_eq
      exclude_rules: [use_isosceles_base_angles]
      base_domain: {int_range: [30, 44]}
      angle_domain: {int_range: [55, 88]}
      offset_domain: {int_range: [18, 34]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [isosceles_proof.property_by_congruence]
    cause_tags: []
  "4":
    signature: geometry_proof_isosceles_combine
    recipe: math.geometry_proof
    params:
      # 辺AB、AC上に BD ＝ CE となる点をとった図。**Lv2/Lv3 と違って
      # `exclude_rules` を置かない**——ここは底角の性質を「証明する」回ではなく
      # 「道具として使う」回だからである（台帳 Lv4「性質を組み合わせ」）。
      #   底角 ∠DBC ＝ ∠ECB（深さ1）→ △DBC ≡ △ECB（深さ2）→ DC ＝ EB（深さ3）
      # op 列は Lv2（合同→対応する角）とも Lv3（補助線→合同→中点）とも相異する。
      construction: isosceles_equal_segments
      proof_depth: 3
      prefer: seg_eq
      base_domain: {int_range: [26, 54]}
      angle_domain: {int_range: [44, 110]}
      offset_domain: {int_range: [16, 44]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [isosceles_proof.property_by_congruence]
    cause_tags: []
remedial:
  default_level: 2
