family: math.g2_l46.find_value
form: find_value
source_desc: |
  平行四辺形の対辺の長さ・対角の大きさを求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 対辺/対角の性質から辺の長さ・角を求める。
       example: 平行四辺形ABCDで、AB=5cm、∠B=110° であるとき、辺CDの長さと
                ∠D の大きさを求めよ。
  【設計モデル】新設 solver math.parallelogram_opposite_properties（平行四辺形は
  対辺の長さ・対角の大きさがそれぞれ等しいという恒真の性質から、わかっている辺・角
  の値をそのまま対辺・対角の値として求める）。答えは Tuple(辺の長さ, 角の大きさ)。
concepts_default: [parallelogram.opposite_properties]
levels:
  "1":
    signature: parallelogram_opposite_properties
    recipe: math.parallelogram_opposite_properties
    params:
      # **紙の図形の辺の長さ（3〜30cm）。** 前は 1〜300（1〜500）で
      # 「1辺84cmの正三角形」「辺AB=96cm」のような、教材には出てこない
      # 大きさが出ていた。実物の図形問題の辺は 3〜20cm あたり。
      side_domain: {int_range: [3, 30]}
      # **平行四辺形の内角は 35〜145°。** 前は 1〜178 で「∠K=157°」
      # （となりの角が23°のつぶれた平行四辺形）が出ていた。
      angle_domain: {int_range: [35, 145]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_quadrilateral_condition_v1}
    hints: [steps_prefix]
    concept_tags: [parallelogram.opposite_properties]
    cause_tags: []
remedial:
  default_level: 1
