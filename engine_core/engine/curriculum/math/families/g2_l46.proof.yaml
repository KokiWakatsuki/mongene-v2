family: math.g2_l46.proof
form: proof
source_desc: |
  平行四辺形の性質とその証明
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・対辺/対角/対角線の性質を合同で1段で証明する。
  Lv3 desc: 対角線を補助線に使う2段階の証明。
  Lv4 desc: 誘導なし・複数性質を組み合わせ方針を自分で構成する証明。
  ---
  【設計モデル】g2_l39.proof と同じ推論器（構成 → 前向き推論 → 結論 → 証明文）。

  【★証明したい定理を規則から外す】この単元は平行四辺形の性質を**証明する**単元
  なので、規則カタログの `use_parallelogram_*`（対辺が等しい・対角が等しい・
  対角線がそれぞれの中点で交わる）を使えると1手で終わる（循環）。
  Lv2/Lv3 では4つとも外し、**定義（2組の対辺が平行）だけ**から出発させる。
  Lv4 は「対角線がそれぞれの中点で交わる」を示す回なので、そこだけを外す——
  教科書も、先に証明した「対辺が等しい」を使って対角線の性質を証明する。

  【深さ】錯角×2＋共通の辺 → ASA で合同（深さ2）→ 対応する辺が等しい（深さ3）。
  台帳 desc の「合同で1段」が深さ2、「2段階」が深さ3にあたる。

  【定義域】`scratchpad/fit_domain.py` の実測で決めた（この箱で 94% が質のフィルタを
  通る。箱の中の整数の組は 343 通り）。広げると「∠BAC と ∠ABD がたまたま等しく
  見えている」で落ちる割合が跳ね上がる。
concepts_default: [parallelogram_proof.property_opposite_sides]
levels:
  "2":
    signature: geometry_proof_pgram_property_congruence
    recipe: math.geometry_proof
    params:
      construction: pgram_definition_diagonal
      topic_set: parallelogram
      proof_depth: 2
      prefer: tri_cong
      exclude_rules:
        - use_parallelogram_parallel
        - use_parallelogram_opposite_sides
        - use_parallelogram_opposite_angles
        - use_parallelogram_diagonals
      base_domain: {int_range: [39, 45]}
      angle_domain: {int_range: [78, 84]}
      offset_domain: {int_range: [24, 30]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [parallelogram_proof.property_opposite_sides]
    cause_tags: []
  "3":
    signature: geometry_proof_pgram_property_parts
    recipe: math.geometry_proof
    params:
      # Lv2 と同じ図だが、結論を1段先（合同 → 対応する辺が等しい）に取る。
      # op 列は Lv2 の末尾に use_congruent_parts が付いた形になり、相異する。
      construction: pgram_definition_diagonal
      topic_set: parallelogram
      proof_depth: 3
      prefer: seg_eq
      exclude_rules:
        - use_parallelogram_parallel
        - use_parallelogram_opposite_sides
        - use_parallelogram_opposite_angles
        - use_parallelogram_diagonals
      base_domain: {int_range: [39, 45]}
      angle_domain: {int_range: [78, 84]}
      offset_domain: {int_range: [24, 30]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [parallelogram_proof.property_opposite_sides]
    cause_tags: []
  "4":
    signature: geometry_proof_pgram_property_diagonals
    recipe: math.geometry_proof
    params:
      # 対角線を2本引いた図で、「対角線がそれぞれの中点で交わる」を示す回。
      # ここでは **その性質だけ**を規則から外す——教科書も、先に証明した
      # 「対辺が等しい」を使ってこの性質を証明する（だから他の3つは残す）。
      construction: pgram_diagonals_crossing
      topic_set: parallelogram
      proof_depth: 3
      prefer: seg_eq
      exclude_rules: [use_parallelogram_diagonals]
      base_domain: {int_range: [33, 48]}
      angle_domain: {int_range: [45, 66]}
      offset_domain: {int_range: [21, 32]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [parallelogram_proof.property_diagonals]
    cause_tags: []
remedial:
  default_level: 2
