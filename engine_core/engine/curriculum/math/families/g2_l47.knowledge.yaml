family: math.g2_l47.knowledge
form: knowledge
source_desc: |
  平行四辺形になるための条件を想起・判別する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 平行四辺形になるための条件(5つ)を想起する。
       example: 四角形が平行四辺形になるための条件を、すべて答えよ。
  Lv2 desc: 図の条件からどの条件で平行四辺形といえるか判別する。
       example: 四角形ABCDで、AB=DC かつ AB∥DC が成り立っているとき、この四角形が
                平行四辺形といえるのはどの条件によるか答えよ。
  【設計モデル】規則想起ハブ（既存 math.recall_rule・_RULE_MAPS に topic
  "parallelogram_conditions" を追加＝Lv1）／新設 solver
  math.identify_parallelogram_condition（5条件のうちどれによるかを判別＝Lv2）。
levels:
  "1":
    signature: parallelogram_conditions_rule_recall
    recipe: math.recall_rule
    params:
      topic: parallelogram_conditions
      concept_set: [all_five]
    dup_rate_max: 0.85
    dup_rate_reason: |
      ★**点名の無作為さで通していた。** もとは 24 文字から点名を無作為に引いていて、
      「三角形BJQ」「四角形GEFP」のような実物の教材に出てこない名前が出ていた
      （2026-08-19 の外部評価の指摘）。点名を実物どおり連続した文字にそろえたところ、
      このセルの**中身の狭さ**が現れた。中身の軸は実測 21 通り。
      教材として正しい名前を優先し、狭さをここに宣言する。
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_rule_recall_v1}
    hints: [steps_prefix]
    concept_tags: [parallelogram_conditions.rule_recall]
    cause_tags: []
  "2":
    signature: identify_parallelogram_condition
    recipe: math.identify_parallelogram_condition
    params: {}
    # 頂点名をアルファベット順（実物の書き方）に直したぶん、名前の組合せが減った。
    # 数と名前を現実に戻すのが先で、狭さは仕様として宣言する。
    dup_rate_max: 0.5
    dup_rate_reason: |
      平行四辺形になるための条件は**5つしかない**（教科書がそう定めている）。
      変えられるのは「どの条件を出すか」5通り × 頂点名（連続した文字＝21通り）で、
      100 seed では実測 0.36 が重なる。頂点名を無作為にすれば下がるが、
      「四角形NKRF」は実物の教材に出てこない書き方なので、そちらは戻さない。
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_quadrilateral_statement_v1}
    hints: [steps_prefix]
    concept_tags: [parallelogram.identify_condition]
    cause_tags: []
remedial:
  default_level: 1
