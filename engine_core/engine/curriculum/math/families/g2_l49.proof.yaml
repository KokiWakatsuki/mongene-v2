family: math.g2_l49.proof
form: proof
source_desc: |
  長方形・ひし形・正方形の性質と条件
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・対角線等の条件を示し長方形/ひし形と結論する。
  Lv3 desc: 誘導なし・満たす条件を自分で選び構成して示す。
  ---
  【設計モデル】g2_l39.proof と同じ推論器。平行四辺形であることは**仮定**として与え、
  そこから長方形・ひし形であることを示す（この単元で証明するのは「特別な平行四辺形に
  なるための条件」であって、平行四辺形の性質そのものではない）。

  【循環していないか】Lv2 は「対角線の長さが等しい平行四辺形は長方形」を**使う**回
  なので、その規則は外さない。示すのは「四角形ABCDが長方形であること」であって、
  条件そのものではない。Lv3 も同じ（ひし形になるための条件を使う）。

  【深さ】Lv2 は仮定2つ → 長方形（深さ1）。Lv3 は「2つの角が等しい → 二等辺」を
  はさむので深さ2になり、**op 列が相異する**
  （Lv2: conclude_rectangle_by_diagonals / Lv3: conclude_isosceles →
  conclude_rhombus_by_sides）。

  【定義域】`scratchpad/fit_domain.py` の実測（Lv2 は 94%・Lv3 は 100% が通る）。
concepts_default: [special_quad_proof.condition_given]
levels:
  "2":
    signature: geometry_proof_rectangle_by_diagonals
    recipe: math.geometry_proof
    params:
      construction: pgram_equal_diagonals
      topic_set: parallelogram
      proof_depth: 1
      prefer: rectangle
      base_domain: {int_range: [27, 48]}
      angle_domain: {int_range: [30, 90]}
      offset_domain: {int_range: [15, 30]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [special_quad_proof.condition_given]
    cause_tags: []
  "3":
    signature: geometry_proof_rhombus_by_isosceles
    recipe: math.geometry_proof
    params:
      # 対角線ACについて ∠BAC ＝ ∠BCA である平行四辺形。2角が等しいことから
      # となり合う辺が等しいことを出し、そこからひし形と結論する2段。
      construction: pgram_isosceles_diagonal
      topic_set: parallelogram
      proof_depth: 2
      prefer: rhombus
      base_domain: {int_range: [24, 48]}
      angle_domain: {int_range: [66, 84]}
      offset_domain: {int_range: [6, 30]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [special_quad_proof.condition_choose]
    cause_tags: []
remedial:
  default_level: 2
