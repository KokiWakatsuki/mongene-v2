family: math.g2_l5.calculation
form: calculation
source_desc: |
  分配法則 k(A)（乗法）/ (A)÷d（除法）をかっこを外して計算する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 整数を多項式に分配する展開。
       example: 次の計算をせよ。　3(2x − 5y)
  Lv2 desc: 分数・負の数の分配、除法を乗法に直す処理。
       example: 次の計算をせよ。　(9x − 6y) ÷ (−3)
  答えは展開・整理した式（SymbolicAnswer）。独立ソルバ distribute_or_divide（sympy.expand）で再計算。
  Lv1（分配・乗法）と Lv2（除法→逆数の乗法に直して分配）で op 列を変える＝level_sep。
  Lv2 は answer-first で割り切れる被除数を逆算し、答えが整数係数になるよう構成する。
concepts_default: [polynomial.distribute_multiply]
levels:
  "1":
    signature: distribute_multiply
    recipe: math.distribute_or_divide
    params:
      # k(px+qy)。k は ≠0,±1（非自明な分配）。px,qy は nonzero。
      mode: multiply
      multiplier_domain: {int_range: [-6, 6], exclude: [-1, 0, 1]}
      coeff_domain: {int_range: [-8, 8]}
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_add_subtract_polynomials_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.distribute_multiply]
    cause_tags: []
  "2":
    signature: divide_polynomial
    recipe: math.distribute_or_divide
    params:
      # (rx·d x + ry·d y)÷d。除数 d は |d|≥2（負も含む）。rx,ry(結果係数)は nonzero。
      mode: divide
      divisor_domain: {int_set: [-6, -5, -4, -3, -2, 2, 3, 4, 5, 6]}
      coeff_domain: {int_range: [-6, 6]}
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_add_subtract_polynomials_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.divide_polynomial]
    cause_tags: []
remedial:
  default_level: 1
