family: math.g2_l50.find_value
form: find_value
source_desc: |
  等積変形で面積を移し値を求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 等積変形で面積を移し値を求める。
       example: 四角形ABCDで、頂点Dを通り対角線ACに平行な直線と、辺BCの延長との
                交点をEとする。四角形ABCDと面積の等しい三角形ABEをつくったとき、
                四角形ABCDの面積が20cm²ならば△ABEの面積を求めよ。
  Lv3 desc: 面積を2等分する直線を引くなど逆算・作図的に求める。
       example: 四角形ABCDの頂点Aを通り、四角形の面積を2等分する直線を1本引くことを
                考える。その直線が辺BCと交わる点をPとするとき、点Pの位置を面積の
                関係から求めよ。
  【設計モデル】新設 solver math.equal_area_transform_value（等積変形は面積を
  変えない、という恒真の性質から、もとの図形の面積をそのまま変形後の三角形の面積
  として求める）。

  【Lv3 設計モデル】新設 solver math.area_bisecting_point_on_side。
  「作図的な逆算」を採点可能にするため、四角形を**座標で与える**。P は辺BC 上の点
  なので P = B + t(C−B) とおけ、三角形ABP の面積は三角形ABC の t 倍だから
  t =（全体の面積の半分）÷（三角形ABC の面積）で決まる。求めた P で三角形ABP を
  組み直すと全体のちょうど半分に戻ることを、構成時に別経路で確かめている。

  【level_sep】Lv2 = 等積変形は面積を変えない、を1手で使う（asked=value）。
  Lv3 = 面積を求める → 半分になる条件を式にする → 点の位置について解く の3手で、
  asked も coordinate に変わる。op 列・asked・小問の中身がすべて相異する。
concepts_default: [equal_area.transform_value]
levels:
  "2":
    signature: equal_area_transform_value
    recipe: math.equal_area_transform_value
    params:
      # **面積は 10cm² 刻み。** 前は 1〜500 の整数で「四角形の面積が1cm²」
      # 「291cm²」のような端数が出ていた。実物の等積変形の面積は
      # 20・36・48cm² のような数。狭めたぶんは頂点名の軸で戻す（params に載せる）。
      area_domain: {int_set: [12, 16, 18, 20, 24, 28, 30, 32, 36, 40, 42, 45, 48, 50,
                              54, 56, 60, 64, 66, 70, 72, 75, 80, 84, 88, 90, 96, 100,
                              108, 110, 120, 126, 132, 140, 144, 150, 160, 168, 180,
                              192, 200, 210, 216, 224, 240, 252, 264, 270, 280, 288]}
    dup_rate_max: 0.6
    dup_rate_reason: |
      100 seed で相異 46 問（実測）。中身の軸は 面積 46 通り。等積変形の答えはもとの面積そのものなので、面積だけが軸。
      答えが整数になる組しか使えないため、定義域を広げても通る組はこの程度にとどまる。
      以前は点名・人名・使う文字を dup_key に算入していたので閾を通っていたが、
      **名前が違うだけの問題は別の問題ではない**。増やすには題材そのものを追加する。
    given: [condition]
    asked: [value]
    visual: required
    text: {tier: T1, template: lf_quadrilateral_condition_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [equal_area.transform_value]
    cause_tags: []
  "3":
    signature: area_bisecting_point
    recipe: math.area_bisecting_point
    params:
      # B=(0,0)・C=(c,0) に固定し、A・D の座標を動かす。recipe が
      # 「凸四角形」「Pのx座標が整数」「0<Px<c」を満たす組だけを列挙して等確率で引く
      # （既定の上限で 3940 通り＝閾 0.20 に必要な約250通りを大きく超える）。
      c_max: 12
      ax_max: 8
      ay_max: 9
      dx_max: 14
      dy_max: 9
    given: [condition]
    asked: [coordinate]
    visual: none
    text: {tier: T1, template: lf_quadrilateral_condition_v1}
    hints: [steps_prefix]
    concept_tags: [equal_area.bisecting_line_point]
    cause_tags: []
remedial:
  default_level: 2
