family: math.g2_l53.graph_table
form: graph_table
source_desc: |
  樹形図を使った場合の数の求め方（カード・玉・くじ）— 樹形図に整理する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 取り出しの場合を樹形図に整理する。
       example: 赤玉1個、青玉1個、白玉1個が入った袋から玉を1個ずつ続けて2個取り出す
                とき、取り出し方をすべて樹形図に表せ。
  ---
  【2セル共通の投資】g2_l52.graph_table Lv1 の source_desc を参照
  （frame の `draw_tree_diagram` ＋ `visuals/tree_diagram.py` を共有する）。

  【g2_l52 との違い】**もとに戻さない**。1回目に取り出した玉は2回目には無いので、
  枝の分かれ方が 3→2 になる（硬貨は 2→2）。この1点が樹形図の形の違いそのもの
  なので、params の `with_replacement` を false にするだけで分かれる。

  【dup】色3つの順序つきの組（6色から3色＝120通り）× 入れ物と品物（4）＝480 通り。

  【退化の封じ方】もとに戻さないので、取り出す回数は品物の数以下であること
  （solver 側でも検査する）。
concepts_default: [counting.tree_diagram_draws]
levels:
  "1":
    signature: tree_diagram_draws
    recipe: math.tree_diagram
    params:
      with_replacement: false
      draws: 2
      item_count: 3
      color_candidates: ["赤", "青", "白", "黒", "黄色", "茶色"]
      container_candidates: ["袋|玉|個", "箱|カード|枚", "袋|おはじき|個", "箱|ボール|個"]
    given: [condition]
    asked: [draw_tree_diagram]
    visual: required
    text: {tier: T1, template: lf_motion_area_v1, visual_builder: math.tree_subject}
    hints: [steps_prefix]
    concept_tags: [counting.tree_diagram_draws]
    cause_tags: []
remedial:
  default_level: 1
