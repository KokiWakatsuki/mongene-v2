source_desc: |
  箱・ひげ・中央線が表す量を想起する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 箱・ひげ・中央線が表す量を想起する。
       example: 箱ひげ図の「箱」の左端・中央の線・右端、および両側の「ひげ」の先端が、
                それぞれ何の値を表すかを答えよ。
  【設計モデル】用語想起ハブ（既存 math.term_recall・_TERM_MAPS に domain
  "box_plot_terms" を追加。箱の左端/中央線/右端・両ひげの先端の5用語。答えは漢数字＝
  digit-free）。
