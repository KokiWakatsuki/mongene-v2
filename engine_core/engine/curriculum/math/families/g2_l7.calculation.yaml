family: math.g2_l7.calculation
form: calculation
source_desc: |
  文字式を使った数の性質①（偶数・奇数・連続する整数など）— 式を立てて整理する
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 2n・2n+1 などの式を立て整理する。
       example: 整数を n とするとき、連続する2つの偶数 2n と 2n+2 の和を、
                文字を使った1つの式で表し、簡単にせよ。
  各インスタンスは変数文字・数の性質（偶数/奇数/整数/3の倍数/5の倍数）・個数（2〜5）を
  surface として振り、それらの連続数の和を1つの式にまとめる（答え＝自由変数を含む
  SymbolicAnswer）。独立ソルバ express_number_property（sympy.expand）で再計算。
  答えの種類は少数（property_type ごとに固定形）なので、dup_rate は変数文字・種類・個数を
  広くとって分散させる（§7.7 F-3。answer に無関係な surface を広く引く）。単一レベルのため
  level_sep は signature 相異のみ。
concepts_default: [polynomial.consecutive_number_sum]
levels:
  "1":
    signature: consecutive_number_sum
    recipe: math.express_number_property
    params:
      # 変数文字（曖昧な e/i/o/l と大文字は避ける）×性質×個数を surface として広くとる。
      # ★整数を表す文字は m・n・k（と、4文字要る型のための p・q）に限る
      # （教科書の書き方。2026-08-19 の外部評価で
      # 「p = 8n、w = 4u」のような組が出ていると指摘された）。文字の種類は
      # dup_key に入っていない（表層の水増しをやめたときに外してある）ので、
      # ここを狭めても重複率は動かない。
      letter_pool: [m, n, k, p, q]
      type_set: [even, odd, int, mult3, mult5]
      count_domain: {int_set: [2, 3, 4, 5]}
    dup_rate_max: 0.45
    dup_rate_reason: |
      ★**点名の無作為さで通していた。** もとは 24 文字から点名を無作為に引いていて、
      「三角形BJQ」「四角形GEFP」のような実物の教材に出てこない名前が出ていた
      （2026-08-19 の外部評価で「三角形の頂点名 69 種類」と指摘）。点名を実物どおり
      連続した文字にそろえたところ、このセルの**中身の狭さ**が現れた。
      中身の軸は実測 63 通り。教材として正しい名前を優先し、狭さをここに宣言する
      （原則: 場面が成り立つことを dup より優先する。表層で水増しして閾を通さない）。
    given: [expressions]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_number_property_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.consecutive_number_sum]
    cause_tags: []
remedial:
  default_level: 1
