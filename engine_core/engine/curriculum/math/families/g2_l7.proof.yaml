family: math.g2_l7.proof
form: proof
source_desc: |
  文字式を使った数の性質の説明①（偶数・奇数・連続する整数）
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・偶数/連続整数の1つの型を文字でおいて直接説明。
       example: 連続する2つの奇数の和は4の倍数になる。このことを、次の書き出しに
                続けて説明せよ。「整数を n とすると、連続する2つの奇数は 2n−1, 2n+1 と
                表される。この2数の和は……」
  Lv3 desc: 誘導なし・どう文字でおくかとゴールを自分で構成する説明。
       example: 連続する3つの整数の和は3の倍数になる。このことを、文字を使って説明せよ。
  ---
  【設計モデル】図形の証明（math.geometry_proof）とは別機構。命題は
  `solvers/number_proof.py` の「型＋パラメータ」で持ち、式変形と
  **示すべき性質そのもの**を sympy に導かせる（`derive_goal`）。
  この単元が使う型は
    consecutive_sum … 連続する c 個の整数/偶数/奇数/k の倍数の和
    parity_pair_op  … 2つの偶数・奇数の和／差／積
  の2つ。命題文（「連続する3つの整数の和は3の倍数になる」）はコード中に
  文字列として書かれていない——展開した式の係数の最大公約数から導いている。

  【Lv 差】誘導の有無。**op 列が変わる**（Lv2 は4手・Lv3 は文字のおき方と
  表し方の2手が先頭に付いて6手）。given のキーも変わる（Lv2 は premises+conclusion・
  Lv3 は conclusion のみ）。ここを揃えると level_sep が落ちる。

  【dup_rate】型 × 軸（性質・個数・どの数を基準に置くか・和/差/積）× 文字。
  consecutive_sum だけで 48 通り、parity_pair_op は 12 通り、これに文字（1文字は18通り・
  2文字は辞書順の組で153通り）が掛かる。
concepts_default: [polynomial.proof_consecutive_integers]
levels:
  "2":
    signature: number_proof_consecutive_guided
    recipe: math.number_property_proof
    params:
      guided: true
      proposition_set: [consecutive_sum, parity_pair_op]
      # ★整数を表す文字は m・n・k（と、4文字要る型のための p・q）に限る
      # （教科書の書き方。2026-08-19 の外部評価で
      # 「p = 8n、w = 4u」のような組が出ていると指摘された）。文字の種類は
      # dup_key に入っていない（表層の水増しをやめたときに外してある）ので、
      # ここを狭めても重複率は動かない。
      letter_pool: [m, n, k, p, q]
    dup_rate_max: 0.65
    dup_rate_reason: |
      命題は consecutive_sum（連続する整数の和）と parity_pair_op（偶数・奇数の和/積）の**2つ**。
      個数・演算の取り方と合わせて実測 24 通り。以前は使う文字を dup_key に算入していた。
    given: [premises, conclusion]
    asked: [proof_text]
    visual: none
    text: {tier: T1, template: pf_number_property_guided_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.proof_consecutive_integers, polynomial.proof_parity_operation]
    cause_tags: []
  "3":
    signature: number_proof_consecutive_open
    recipe: math.number_property_proof
    params:
      guided: false
      proposition_set: [consecutive_sum, parity_pair_op]
      # ★整数を表す文字は m・n・k（と、4文字要る型のための p・q）に限る
      # （教科書の書き方。2026-08-19 の外部評価で
      # 「p = 8n、w = 4u」のような組が出ていると指摘された）。文字の種類は
      # dup_key に入っていない（表層の水増しをやめたときに外してある）ので、
      # ここを狭めても重複率は動かない。
      letter_pool: [m, n, k, p, q]
    dup_rate_max: 0.65
    dup_rate_reason: |
      Lv2 と同じ2命題（誘導が無いだけ）。実測 22 通り。
    given: [conclusion]
    asked: [proof_text]
    visual: none
    text: {tier: T1, template: pf_number_property_open_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.proof_consecutive_integers, polynomial.proof_parity_operation]
    cause_tags: []
remedial:
  default_level: 2
