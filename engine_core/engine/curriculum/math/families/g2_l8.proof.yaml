family: math.g2_l8.proof
form: proof
source_desc: |
  文字式を使った数の性質の説明②（2けたの自然数など）
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・10a+b 等の型を与えられ説明を完成させる。
       example: 2けたの自然数と、その十の位と一の位を入れかえてできる数の和は
                11の倍数になる。次の書き出しに続けて説明せよ。「もとの数の十の位を a、
                一の位を b とすると、もとの数は 10a+b、入れかえた数は 10b+a と
                表される。この2数の和は……」
  Lv3 desc: 誘導なし・位取りの文字化と入れ替え/差の構成を自分で行う説明。
       example: 2けたの自然数から、その十の位と一の位を入れかえてできる数をひいた差は
                9の倍数になる。このことを、文字を使って説明せよ。
  ---
  【設計モデル】g2_l7.proof と同じ機構（solvers/number_proof.py）。この単元が使う型は
    digit_swap           … 2けた/3けたの自然数と、位を入れかえた数の和・差
    digit_minus_digitsum … 自然数から各位の数の和をひいた差
  の2つ。11 の倍数・9 の倍数・99 の倍数という結論は書いていない——位取りの式を
  組んで展開し、係数の最大公約数から導いている。3けたの「和」は倍数にならない
  （101a+20b+101c）ので、型の側で差だけに正規化している。

  【Lv 差】誘導の有無で op 列が変わる（4手 / 6手）。given のキーも変わる。

  【dup_rate】型 × けた数 × 演算 × 文字。2文字は辞書順の組で153通り、
  3文字は816通りあり、これが型・けた数と掛かる。
concepts_default: [polynomial.proof_two_digit_swap]
levels:
  "2":
    signature: number_proof_digit_guided
    recipe: math.number_property_proof
    params:
      guided: true
      proposition_set: [digit_swap, digit_minus_digitsum]
      # ★整数を表す文字は m・n・k（と、4文字要る型のための p・q）に限る
      # （教科書の書き方。2026-08-19 の外部評価で
      # 「p = 8n、w = 4u」のような組が出ていると指摘された）。文字の種類は
      # dup_key に入っていない（表層の水増しをやめたときに外してある）ので、
      # ここを狭めても重複率は動かない。
      letter_pool: [m, n, k, p, q]
    dup_rate_max: 0.96
    dup_rate_reason: |
      証明する命題そのものが軸で、この単元が持つのは digit_swap（2けたの数と入れかえた数の和/差）と
      digit_minus_digitsum（2けたの数から各位の和をひく）の**2つだけ**。桁の取り方と合わせても
      実測 5 通り。以前は使う文字（letter_pool 18種）を dup_key に算入していたので閾を通っていたが、
      **文字が a か g かで問題が変わるわけではない**。増やすには命題を新しく設計する（教材の中身の追加）。
    given: [premises, conclusion]
    asked: [proof_text]
    visual: none
    text: {tier: T1, template: pf_number_property_guided_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.proof_two_digit_swap, polynomial.proof_digit_sum_relation]
    cause_tags: []
  "3":
    signature: number_proof_digit_open
    recipe: math.number_property_proof
    params:
      guided: false
      proposition_set: [digit_swap, digit_minus_digitsum]
      # ★整数を表す文字は m・n・k（と、4文字要る型のための p・q）に限る
      # （教科書の書き方。2026-08-19 の外部評価で
      # 「p = 8n、w = 4u」のような組が出ていると指摘された）。文字の種類は
      # dup_key に入っていない（表層の水増しをやめたときに外してある）ので、
      # ここを狭めても重複率は動かない。
      letter_pool: [m, n, k, p, q]
    dup_rate_max: 0.96
    dup_rate_reason: |
      Lv2 と同じ2命題（誘導が無いだけ）。実測 5 通り。文字の違いは問題の違いではない。
    given: [conclusion]
    asked: [proof_text]
    visual: none
    text: {tier: T1, template: pf_number_property_open_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.proof_two_digit_swap, polynomial.proof_digit_sum_relation]
    cause_tags: []
remedial:
  default_level: 2
