family: math.g3_l14.knowledge
form: knowledge
source_desc: |
  平方根の意味と根号の表し方（units.generated.yaml の desc/example を正）。
  Lv1 desc: 平方根・根号の意味の想起。 example: 9 の平方根をすべて答えよ。また平方根とは何かを説明せよ。
  【設計モデル】用語想起（汎用ソルバ term_recall_definition・domain=square_root・平方根/根号）。
  具体例の正の数 n を説明文に埋め込み surface として dup 分散。答えは漢字の ChoiceAnswer で
  digit-free（G-Q5t 素通り）。
  Lv2 desc: √a²=|a|等の意味理解・具体例への適用と判別。
       example: √25 と、25 の平方根の違いを説明せよ。
  【設計モデル・Lv2】規則想起ハブ（既存 math.recall_rule・_RULE_MAPS に topic
  "sqrt_square_meaning" を追加・単一concept "abs_value_rule"）。負の数を含む具体例 n を
  埋め込み、√(n²)=|n| の意味（n が負なら -n になる）を選ぶ。既存ハブへの追加のみ。
concepts_default: [square_root.term_recall]
levels:
  "1":
    signature: square_root_term_recall
    recipe: math.term_recall
    params:
      domain: square_root
      concept_set: [square_root, radical_sign]
      number_domain: {int_range: [2, 200]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [square_root.term_recall]
    cause_tags: []
  "2":
    signature: sqrt_square_meaning_rule_recall
    recipe: math.recall_rule
    params:
      topic: sqrt_square_meaning
      concept_set: [abs_value_rule]
      number_domain: {int_range: [-150, 150]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_rule_recall_v1}
    hints: [steps_prefix]
    concept_tags: [sqrt_square_meaning.rule_recall]
    cause_tags: []
remedial:
  default_level: 1
