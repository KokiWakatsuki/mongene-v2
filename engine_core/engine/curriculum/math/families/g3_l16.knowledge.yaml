family: math.g3_l16.knowledge
form: knowledge
source_desc: |
  有理数と無理数、循環小数（units.generated.yaml の desc/example を正）。
  Lv1 desc: 有理数・無理数・循環小数の意味の想起。 example: 有理数・無理数・循環小数とは何かを説明せよ。
  【設計モデル】用語想起（term_recall_definition・domain=real_numbers・有理数/無理数/循環小数）。
  具体例（分数・平方数でない数）を説明文に埋め込み surface 分散。答えは漢字 ChoiceAnswer で digit-free。
  Lv2 desc: 与えられた数を有理数/無理数に分類・判別し具体例に適用。
       example: 次の数を有理数と無理数に分類せよ。 √4、√5、0.3、π、-2/7
  【設計モデル・Lv2】新規 recipe math.classify_rational_irrational。answer-first で
  kind（有理数/無理数）を決め、その kind に属する具体的な数の形（分数／小数／平方数の
  根号 or 非平方数の根号／π）を1つ構成する。独立ソルバが sympy の is_rational で
  再判定（double-solve）。
concepts_default: [real_numbers.term_recall]
levels:
  "1":
    signature: real_numbers_term_recall
    recipe: math.term_recall
    params:
      domain: real_numbers
      concept_set: [rational, irrational, repeating_decimal]
      number_domain: {int_range: [2, 99]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [real_numbers.term_recall]
    cause_tags: []
  "2":
    signature: classify_rational_irrational
    recipe: math.classify_rational_irrational
    params:
      kind_set: [rational, irrational]
      number_domain: {int_range: [1, 80]}
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_classify_rational_v1}
    hints: [steps_prefix]
    concept_tags: [real_numbers.classify_instance]
    cause_tags: []
remedial:
  default_level: 1
