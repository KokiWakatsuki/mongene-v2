family: math.g3_l17.calculation
form: calculation
source_desc: |
  平方根の乗法と除法（units.generated.yaml の desc/example を正）。
  Lv1 desc: √a×√b=√(ab)、√a÷√bを1手順で処理。 example: √3 × √6 を計算せよ。
  Lv2 desc: 係数付き・結果を簡単な形に直すなど複数手順。 example: 2√6 × √3 ÷ √8 を計算せよ。
  【設計モデル】math.simplify_radical が sympy.simplify で乗除を正準化。level_sep は mode 別 op 列:
  Lv1（root_mult：1つの根号にまとめて簡単にする2手順）／Lv2（root_mult_div：わり算を
  かけ算に直し係数と根号をまとめてから簡単にする3手順）。dup は根号の中の数・係数で分散。
concepts_default: [radical.multiply_divide]
levels:
  "1":
    signature: radical_root_mult
    recipe: math.simplify_radical
    params: {mode: root_mult}
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_radical_calc_v1}
    hints: [steps_prefix]
    concept_tags: [radical.multiply_divide]
    cause_tags: []
  "2":
    signature: radical_root_mult_div
    recipe: math.simplify_radical
    params: {mode: root_mult_div}
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_radical_calc_v1}
    hints: [steps_prefix]
    concept_tags: [radical.multiply_divide]
    cause_tags: []
remedial:
  default_level: 1
