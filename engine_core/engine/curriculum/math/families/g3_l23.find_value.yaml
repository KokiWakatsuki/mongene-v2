form: find_value
source_desc: |
  平方根の利用（図形や実生活への応用）— 面積等の条件から一辺の長さ等を√で求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 面積等の条件から一辺の長さ等を√で1〜2手順で求める。
       example: 面積が 45cm² の正方形の1辺の長さを、根号を使って表せ。
  【設計モデル】新規 recipe math.find_side_from_area。answer-first で squarefree な
  a（>1）と整数 k から面積 area=k²a を決める（1辺は k√a）。独立ソルバ
  math.simplify_radical（mode=find_side_from_area）が area だけから平方因数を
  見つけて簡約し直す（double-solve）。frame は既存 find_value の condition/value を
  流用（frame 変更なし）。
