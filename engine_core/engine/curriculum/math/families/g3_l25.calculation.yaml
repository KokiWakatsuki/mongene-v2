family: math.g3_l25.calculation
form: calculation
source_desc: |
  平方根の考え方による解き方（x²=k, (x+a)²=kの形）（units.generated.yaml の desc/example を正）。
  Lv1 desc: x²=k・(x+a)²=kを平方根の考えで直接解く。 example: (x-2)²=9 を解け。
  Lv2 desc: x²+px+q=0を平方完成し(x+a)²=kに直して解く。 example: x²+6x+2=0 を平方完成して解け。
  【設計モデル】math.solve_quadratic が sympy.solve で解く。答えは解を昇順に並べた Tuple。
  level_sep は mode 別 op 列: Lv1（solve_square_form：平方根をとって2つの場合に分ける2手順）／
  Lv2（solve_complete_square：平方完成→平方根→2つの場合の3手順・pは偶数で判別式非平方＝無理数解）。
  dup は a・k・p・q で分散。
concepts_default: [quadratic.solve_by_square_root]
levels:
  "1":
    signature: quad_solve_square_form
    recipe: math.solve_quadratic
    params: {mode: solve_square_form}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_quadratic_solve_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic.solve_by_square_root]
    cause_tags: []
  "2":
    signature: quad_solve_complete_square
    recipe: math.solve_quadratic
    params: {mode: solve_complete_square}
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_quadratic_solve_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic.solve_by_square_root]
    cause_tags: []
remedial:
  default_level: 1
