family: math.g3_l29.calculation
form: calculation
source_desc: |
  2次方程式の利用（数に関する問題）— 立式した2次方程式の求解処理
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 立式した2次方程式の求解処理。
       example: x(x+1)=56 を解け。
  【設計モデル】既存 math.solve_quadratic を再利用（g3_l24〜l28 と同型）。mode
  "solve_product_form"（新設）: answer-first で正の整数解 x0 と c を決め、
  k=x0(x0+c) から x(x+c)=k を構成する。展開→移項→因数分解→積=0 の性質で解く
  （op列は既存 solve_rearrange と同型だが、x(x+c) 形に特化した構成のため別 mode）。
  答えは解を昇順に並べた Tuple（両方の解を報告・word_problem のような解の吟味は
  別セル C14 送り）。dup は x0・c の組で分散。
concepts_default: [quadratic.solve_from_word_setup]
levels:
  "2":
    signature: quad_solve_product_form
    recipe: math.solve_quadratic
    params:
      mode: solve_product_form
    given: [equation]
    asked: [solution]
    visual: none
    text: {tier: T1, template: lf_quadratic_solve_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic.solve_from_word_setup]
    cause_tags: []
remedial:
  default_level: 2
