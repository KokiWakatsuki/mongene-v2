family: math.g3_l3.calculation
form: calculation
source_desc: |
  乗法公式①（(x+a)(x+b)の展開）
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: (x+a)(x+b)の公式に当てはめて直接展開。
       example: (x+3)(x+4) を乗法公式を使って展開せよ。
  Lv2 desc: 係数付き・分数/負の定数で和と積の計算が複雑化。
       example: (x-6)(x+2) を展開せよ。
  【設計モデル】math.expand_expression が sympy.expand で展開。乗法公式
  (x+a)(x+b)=x²+(a+b)x+ab の直接適用として op 列を組む。level_sep は mode 別 op 列:
  Lv1（formula_sum_product：正の定数で和と積を求めて書く2手順）／
  Lv2（formula_sum_product_signed：負の定数を含み符号を確かめてから和と積を求める3手順）。
  dup は定数の組と文字種で分散。
concepts_default: [polynomial.expand_formula_sum_product]
levels:
  "1":
    signature: expand_formula_sum_product
    recipe: math.expand_product
    params:
      mode: formula_sum_product
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_expand_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.expand_formula_sum_product]
    cause_tags: []
  "2":
    signature: expand_formula_sum_product_signed
    recipe: math.expand_product
    params:
      mode: formula_sum_product_signed
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_expand_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.expand_formula_sum_product]
    cause_tags: []
remedial:
  default_level: 1
