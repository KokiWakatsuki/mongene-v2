family: math.g3_l30.word_problem
form: word_problem
source_desc: |
  2次方程式の利用（図形に関する問題）
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり:図形設定→面積等の関係を立式し解を吟味
       example: 横が縦より4cm長い長方形がある。その面積が 45cm² であるとき、次の問いに
                答えよ。 (1) 縦の長さを x cm として、方程式をつくれ。 (2) 縦の長さを
                求めよ。
  Lv3 desc: 誘導なし:未知量の設定と立式を自分で構成し不適解除外
       example: 1辺が 10cm の正方形がある。縦を x cm 短くし、横を x cm 長くして
                長方形をつくったところ、面積が 84cm² になった。x の値を求めよ。
  ---
  【この form の型】g3_l29.word_problem と同じ recipe math.word_problem_quadratic
  （scenario_kind で場面を切替）。テンプレは既存の wp_linear_guided_v1 /
  wp_linear_solo_v1 を再利用。数学は既存 solver math.solve_quadratic
  （mode=solve_product_form_positive_root）に委ねる＝新 solver ゼロ。このモードは
  g3_l30.find_value と共有（同じ「図形条件から正の解のみを採用」構造）。
  【level_sep】Lv2 は誘導あり＝(1)立式→(2)値の2小問・式は x(x+d)=k（縦 x・横 x+d・
  面積 k。d は場面ごとに変わる＝ g3_l29 Lv2 の c=1 固定と違う）。答えは縦の長さ
  （x そのもの・合成なし）。Lv3 は誘導なし＝1小問・式は (s−x)(s+x)=k（差の平方＝
  他の3セルと式の系統が違う。1辺 s の正方形を縦 x 短く・横 x 長くする）。答えは x
  そのもの。小問数・立式の形がすべて違う＝G6 の構造差。
  【answer-first】Lv2 は縦の長さ x0 と横−縦の差 d を先に引き、面積 k=x0(x0+d) を
  逆算する（2解の積 −k<0 で常にちょうど1つの正の解）。Lv3 は1辺 s と短く/長くする
  量 x0（<s）を先に引き、面積 k=s²−x0² を逆算する（x0<s の範囲に絞ることで
  縦の長さ s−x0 が正であることを保証＝非退化。2解の積 −x0²<0 で常にちょうど1つの
  正の解）。
  【dup 分散】Lv2 は (縦 x0, 差 d) の2軸、Lv3 は (1辺 s, 増減量 x0) の2軸で分散する。
  【検証】G-Q1 が全小問 double-solve。checker は params の「場面文に出ている数値」だけ
  から立式し直し・解き直す（答えは params に入れない）。
concepts_default: [quadratic.word_problem_rectangle_area]
levels:
  "2":
    signature: word_problem_quadratic_rectangle_area
    recipe: math.word_problem_quadratic
    params:
      scenario_kind: rectangle_area
      guided: true
      # 縦 x0（3〜40cm）・横−縦の差 d（1〜15cm）。面積 k=x0(x0+d) は本文の数値。
      # 縦・差は教科書の大きさに（面積2200cm²の長方形は教材にならない）。
      # 狭めたぶんは題材（_RECTANGLE_SCENES）の軸で稼ぐ。
      height_domain: {int_range: [3, 32]}
      diff_domain: {int_range: [1, 20]}
    given: [scenario, quantities]
    asked: [formulation, value]
    visual: none
    text: {tier: T1, template: wp_linear_guided_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic.word_problem_rectangle_area]
    cause_tags: []
  "3":
    signature: word_problem_quadratic_square_cut
    recipe: math.word_problem_quadratic
    params:
      scenario_kind: square_cut
      guided: false
      # 1辺 s（8〜60cm）・短く/長くする量 x0（1〜12cm、s>x0 を保証するため範囲を分離）。
      # **正方形の1辺は 2cm 刻みのきりのいい数**（1辺37cm・44cm・23cm という
      # 半端な正方形が出ていた）。実物の図形問題は 10cm・12cm・20cm。
      side_set: [8, 10, 12, 14, 15, 16, 18, 20, 24, 25, 28, 30, 32, 35, 36, 40,
                 42, 45, 48, 50, 54, 56, 60, 64, 70, 72, 75, 80]
      shrink_range: [1, 20]
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic.word_problem_square_cut]
    cause_tags: []
remedial:
  default_level: 2
