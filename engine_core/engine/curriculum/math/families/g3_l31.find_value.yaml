family: math.g3_l31.find_value
form: find_value
source_desc: |
  2次方程式の利用（動点などその他の応用）— 指定時刻での動点の位置から長さ・面積を求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 指定時刻での動点の位置から長さ・面積を立式して求める。
       example: 1辺が6cmの正方形ABCDで、点PはAを出発し辺AB上を毎秒1cmで動く。出発してから
                4秒後の線分APの長さと、三角形APDの面積を求めよ。
  Lv3 desc: 場合分けを要する区間での面積を図から構成して求める。
       example: 1辺が10cmの正方形ABCDの辺上を、点PがA→B→Cの順に毎秒2cmで動く。出発
                してから8秒後の三角形APDの面積を求めよ。
  【設計モデル】新規モジュール solvers/recipes/motion.py。正方形を A=(0,0), B=(s,0),
  C=(s,s), D=(0,s) に固定し、点 P の位置を経過距離 d=v・t の区分で決める（visual不要・
  座標幾何の数式のみで完結）。三角形 APD の面積は shoelace 公式で独立検証（.equals(0)）。
  Lv2（single_segment：P が辺AB上・面積=AP長×s÷2）／Lv3（two_segment：P がA→B→Cの
  2区間目・辺BC上に確実に入るよう構成時にt/s/vを保証。この区間では面積は s²÷2 で
  一定になる）。面積が整数になるよう s を偶数に限定して構成する。
