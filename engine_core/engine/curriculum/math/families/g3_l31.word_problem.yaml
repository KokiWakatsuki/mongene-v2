family: math.g3_l31.word_problem
form: word_problem
source_desc: |
  2次方程式の利用（動点などその他の応用）— 文章題
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 誘導あり:動点設定→各段階の量を立式し2次方程式を解く。
       example: 1辺が 8cm の正方形 ABCD で、点 P は A を出発して辺 AB 上を B まで毎秒
                1cm で動き、点 Q は同時に A を出発して辺 AD 上を D まで毎秒1cm で動く。
                P、Q が出発してから x 秒後について、次の問いに答えよ。
                (1) 三角形 APQ の面積を x を使って表せ。
                (2) 三角形 APQ の面積が 18cm² になるのは何秒後か求めよ。
  Lv4 desc: 誘導なし:場合分け(位置による式変化)を含め方針を構成。
       example: 1辺が 12cm の正方形 ABCD の辺上を、点 P が A→B→C の順に毎秒2cm で動く。
                P が出発してから x 秒後の三角形 APD の面積が 60cm² になるのは何秒後か、
                すべて求めよ。
  ---
  【なぜ Lv3 は2点が動くのか】三角形 APD（P だけが動く）は底辺 AD が固定なので面積は
  時間の**1次式**にしかならず、「2次方程式の利用」にならない。台帳 example のとおり
  P を辺 AB 上・Q を辺 AD 上に同時に走らせると、直角をはさむ2辺がともに v·x になり
  面積が (v²/2)x² ＝ x の2次式になる。同じ g3_l31 の find_value（Lv2/Lv3）は
  三角形 APD の1次式の題材なので、Lv3 は題材そのものが違う＝level_sep が構造で立つ。

  【Lv4 で台帳 example から離れた点と、その理由】example の経路は A→B→C だが、
  この経路だと三角形 APD の面積は「辺AB上で増加 → 辺BC上で一定」の2区間しかなく、
  与えられた面積になる時刻は**必ず1つ**になる。つまり場合分けをしてもしなくても
  答えが変わらない＝ゲートが素通りする退化そのもの（BRIEF「ゲートは答えが 0 や 1 に
  潰れる退化を素通りする」）。そこで経路を A→B→C→D に延ばした。辺CD上では面積が
  減少に転じるので同じ面積になる時刻が**2つ**あり、「すべて求めよ」が意味を持ち、
  第3区間を見落とすと答えを落とす。desc の「場合分け(位置による式変化)を含め方針を
  構成」はこの形で満たす。なお g2_l29.word_problem Lv4 の台帳 example も
  A→B→C→D の経路である。

  【level_sep】
    Lv3 = 誘導あり2小問。(1) locate_points_pq → express_area_in_x（asked=formulation）
          (2) set_up_quadratic_equation → solve_quadratic_equation（asked=value）。
          given は scenario＋quantities（変数の設定を与える）。
    Lv4 = 誘導なし1小問4手＋まとめ。identify_intervals →
          solve_on_increasing_interval → check_constant_interval →
          solve_on_decreasing_interval → collect_all_times（asked=value）。
          given は scenario だけ（変数の設定も小問の分割も与えない）。
    小問数・given・op 列がすべて相異する。

  【params に何を置いたか】word_problem の params 忠実性契約に従い、`numbers` には
  **本文に現れる数**（正方形の1辺・速さ・与えられた面積）だけを置く。答え（時刻・
  面積の式）も導出値（区間の境界 s/v・2s/v・3s/v）も置かない。checker は numbers
  だけから solver を呼び直すので、解き直しが答えの読み直しにならない。
  点名（正方形の4頂点＋動点）は dup の自由度なので params["labels"] に残す。

  【dup（数え上げ）】
    Lv3: (速さ4通り × 答えの時刻9通り) のうち積が偶数の組が約26通り × 1辺20通り
         ＝約520通り（≫250）。点名6文字ぶんの自由度がさらに乗る。
    Lv4: (1辺, 速さ, 面積) の組を列挙してから引く。1辺10通り × 速さが 3s と s の
         約数 × 第1区間内の時刻、で数百通り。点名5文字ぶんが乗る。

  【退化の防止】
    - Lv3 は 1辺 > 速さ×答えの時刻 を構成で保証（t0 の時点で P・Q がまだ辺の上に
      いる）。答えの時刻が本文の数値（1辺・面積）と一致する組は候補から外す。
    - Lv4 は面積 < s²/2 を構成で保証（一定区間より下＝増減する2区間に必ず解が立つ）。
      答えが2つになることを recipe が assert する。
concepts_default: [motion.word_problem_two_points_area]
