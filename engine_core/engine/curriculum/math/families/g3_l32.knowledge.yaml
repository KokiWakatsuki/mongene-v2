family: math.g3_l32.knowledge
form: knowledge
source_desc: |
  y=ax^2・2乗に比例の意味の想起／対応表や具体例からy=ax^2の関係を判別し比例定数を捉える
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: y=ax^2・2乗に比例の意味の想起。
       example: yがxの2乗に比例するとき、y=ax^2 の a を何というか答えよ。
  Lv2 desc: 対応表や具体例からy=ax^2の関係を判別し比例定数を捉える。
       example: 次のうち、yがxの2乗に比例するものをすべて選び、それぞれの比例定数を答えよ。
                ア y=3x  イ y=2x^2  ウ y=x^2+1  エ y=-4x^2
  【設計モデル】Lv1=用語想起ハブ（既存 math.term_recall・_TERM_MAPS に domain
  "quadratic_function_terms" を追加。比例定数・頂点・軸の3用語で distractor を確保）。
  Lv2=規則想起ハブ（既存 math.recall_rule・_RULE_MAPS に topic "quadratic_function_form" を
  追加。「すべて選ぶ」列挙形式ではなく、y=ax² の形の判別基準そのものを問う単一選択に
  realize＝鉄則③ asked=choice のみ）。op列（Lv1: identify_description/name_concept、
  Lv2: read_rule_context/recall_correct_rule）が相異＝level_sep。
concepts_default: [quadratic_function_terms.term_recall]
levels:
  "1":
    signature: quadratic_function_terms_term_recall
    recipe: math.term_recall
    params:
      domain: quadratic_function_terms
      concept_set: [proportionality_constant]
      number_domain: {int_range: [-500, 500]}
    dup_rate_max: 0.70
    dup_rate_reason: |
      y=ax² の用語も、例に使う比例定数だけが動く。題材（図形・場面）の軸も足したうえで実測 0.65。
      **前はここが通っていたが、それは例に使う数を広く取っていたから**で、
      「y = -382x²」「a、b が 367 より大きい数ならば」「x の値が 195 以上」のような、
      実物の教材には出ない例が並んでいた。広さのために教材でない数を使うのはやめ、
      狭さのほうを宣言する（用語想起は、実物でも例が数通りしかない型）。
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_term_recall_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic_function_terms.term_recall]
    cause_tags: []
  "2":
    signature: quadratic_function_form_rule_recall
    recipe: math.recall_rule
    params:
      topic: quadratic_function_form
      concept_set: [form_criterion]
      number_domain: {int_range: [-500, 500]}
    dup_rate_max: 0.70
    dup_rate_reason: |
      y=ax² の形の判別基準 を問う問題で変えられるのは**比例定数だけ**で、実物も同じ
      （教科書の例は y=2x²・y=-3x²・y=(1/2)x²）。実物に出る 18 通り×符号＝36 通りを
      並べて実測 0.64。
      **前はここが通っていたが、それは比例定数を 2〜250 から引いていたから**で、
      「y = -382x² のグラフは上と下のどちらに開くか」という、実物には無い問題が
      出ていた。広さのために教材でない数を使うのはやめ、狭さのほうを宣言する。
    given: [statement]
    asked: [choice]
    visual: none
    text: {tier: T1, template: lf_rule_recall_v1}
    hints: [steps_prefix]
    concept_tags: [quadratic_function_form.rule_recall]
    cause_tags: []
remedial:
  default_level: 1
