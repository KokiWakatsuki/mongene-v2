family: math.g3_l33.graph_table
form: graph_table
source_desc: |
  放物線のグラフを読み・特徴（開き方/頂点）を捉える／対応表から座標をとり放物線を
  正確にかく・a符号大小で比較
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 放物線のグラフを読み・特徴（開き方/頂点）を捉える。
       example: 右の図は関数 y=ax^2 のグラフである。このグラフの頂点の座標を答え、
                グラフが上下どちらに開いているかを答えよ。
  Lv2 desc: 対応表から座標をとり放物線を正確にかく・a符号大小で比較。
       example: 関数 y=(1/2)x^2 について、x=-2,-1,0,1,2 のときの y の値を求めて対応表を
                作り、その値を座標としてとって放物線をかけ。また、同じ座標軸に y=2x^2 の
                グラフをかき、開き方の違いを比べよ。
  【スコープ】Lv1 の example が問う「頂点の座標」は y=ax² では a によらず**つねに原点**で、
  答えが1点に潰れる（退化）。「開いている向き」も上下の2値にしかならない。どちらも
  採点対象としては情報量がなく、しかも図に放物線が描かれている以上ゲートは素通りする。
  そこで Lv1 は同じ「図から読む」構造のまま、**グラフ上の2点の座標を読み取る**に置き換える
  （頂点・軸・開く向き・開き方の広さという性質そのものは、同 unit の knowledge Lv1＝
  topic "parabola_property" が3概念で受け持つ）。
  【設計モデル】Lv1 は既存 solver math.read_two_lattice_points をそのまま再利用（新 solver
  ゼロ）。given に式を出さない（出すと「グラフから読む」題材が計算で解けてしまう・
  g2_l25.graph_table と同じ設計判断）。Lv2 は新設 solver math.draw_two_parabolas_features
  （対応表の点＋2本の放物線＋開き方の比較）。op 列は Lv1(read_point×2) と
  Lv2(build_correspondence_table→plot_table_points→draw_first_parabola→
  draw_second_parabola→compare_opening)で相異＝level_sep。
  【図】Lv1 の問題図は放物線つき（読む対象）。Lv2 の問題図は空の方眼（かく）で、模範解答図
  （solution_svg_ref）に2本の放物線を実線・破線で描き分ける（色に情報を載せない）。
concepts_default: [parabola_graph.read_points]
levels:
  "1":
    signature: parabola_read_two_points
    recipe: math.read_two_points_on_parabola
    params:
      # 数学的な組合せ: |a·x²| ≦ 16 を満たす (a, x1, x2) が 100 通り
      # （a: ±1..±8、x: ±1..±5 の相異2つ）。点名2つ（16 個から順に選ぶ＝240 通り）を
      # 掛けて params 総組合せ 24000 通り＝dup_rate ほぼ 0（実測 100seed）。
      # **座標平面は縦横が等スケール**なので、|a| が大きいと放物線が細くなりすぎ、
      # 読み取る点が枠の隅に潰れる（|a|=4 で x=±2 が枠の下端に達していた）。
      # 教科書が y=x²・y=2x²・y=(1/2)x² を使うのはこのため。
      a_domain: {int_set: [-5, -4, -3, -2, -1, 1, 2, 3, 4, 5]}
      x_domain: {int_range: [-7, 7], exclude: [0]}
      value_bound: 16
    given: [situation_params]
    asked: [read_point]
    visual: required
    text: {tier: T1, template: lf_parabola_read_points_v1, visual_builder: math.curve_graph}
    hints: [steps_prefix]
    concept_tags: [parabola_graph.read_points]
    cause_tags: []
  "2":
    signature: parabola_draw_pair_from_table
    recipe: math.draw_two_parabolas
    params:
      # 比例定数 a は既約分数 n/d（d∈{1,2,3}・n∈[-8,8]\{0}）＝36 候補。対応表の範囲
      # (x_lo, x_hi) は 3×3=9 通り。|a|·max(|x_lo|,|x_hi|)² ≦ 12 で絞った上で
      # 相異2つを引くと、順序つきで合計 3366 通り（数え上げ実測・期待 dup=0.015）。
      # **比例定数は |a| ≦ 4**（-7/2・-5/2 は教科書の放物線に出てこない）。
      # **対応表は5点以上**（x=-1、0、1 の3点だけでは放物線をかけない）。
      a_den_set: [1, 2, 3]
      a_num_domain: {int_range: [-6, 6]}
      a_abs_max: 4
      table_lo_domain: {int_set: [-3, -2]}
      table_hi_domain: {int_set: [2, 3]}
      value_bound: 16
    given: [expression, situation_params]
    asked: [draw_graph]
    visual: required
    text: {tier: T1, template: lf_parabola_draw_pair_v1, visual_builder: math.curve_graph}
    hints: [steps_prefix]
    concept_tags: [parabola_graph.draw_from_table]
    cause_tags: []
remedial:
  default_level: 1
