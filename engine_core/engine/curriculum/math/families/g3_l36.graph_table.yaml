family: math.g3_l36.graph_table
form: graph_table
source_desc: |
  現象の対応を表・グラフに整理して把握
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 現象の対応を表・グラフに整理して把握。
       example: 振り子が1往復する時間 y 秒は、糸の長さ x m の関数として次の表のように
                なった。表の値を座標としてとってグラフをかき、そのようすを読み取って
                答えよ。x:0,1,2,3,4  y:0,2,2.8,3.5,4
  【スコープ】台帳 example の「振り子」は周期が糸の長さの**平方根**に比例する現象で
  （表の 0,2,2.8,3.5,4 も √ の並び）、本 unit の「2乗に比例する関係」ではない。
  desc（現象の対応を表・グラフに整理して把握）に沿いつつ unit の題材（y=ax²）に
  合わせるため、場面は 2乗に比例する現象（斜面を転がる球・落下距離・制動距離）に
  置き換える。設問構造（表の値を座標としてとってグラフをかく）は example のまま。
  【設計モデル】新設 solver math.draw_quantity_curve_features（表の各行に対応する点が
  答えの特徴）。式は与えず**表だけ**を与える（表からグラフをかく題材）。
  【図】x と y は単位の違う2量（秒と m など）なので、座標平面ではなく量-量グラフとして
  描く（params の grid_mode="quantity"＝第1象限のみ・軸ごとに独立な切りのよい目盛間隔。
  g3_l31.graph_table と同じ経路）。問題図は空の方眼、模範解答図は曲線つき。
concepts_default: [parabola_graph.phenomenon_table]
levels:
  "2":
    signature: phenomenon_curve_from_table
    recipe: math.draw_phenomenon_curve
    params:
      # 比例定数 a（1..20）× 表の行数 rows（3..6）× x の刻み step（1 or 2）で、
      # y の最大値 a·(rows·step)² ≦ 400（目盛が3桁に収まる）を満たす組が 90 通り。
      # 場面 4 種を掛けて params 総組合せ 360 通り（数え上げ実測・期待 dup=0.13）。
      a_domain: {int_range: [1, 20]}
      rows_domain: {int_range: [3, 6]}
      step_domain: {int_set: [1, 2]}
      value_bound: 400
    given: [situation_params, data_table]
    asked: [draw_graph]
    visual: required
    text: {tier: T1, template: lf_phenomenon_curve_v1, visual_builder: math.curve_graph}
    hints: [steps_prefix]
    concept_tags: [parabola_graph.phenomenon_table]
    cause_tags: []
remedial:
  default_level: 2
