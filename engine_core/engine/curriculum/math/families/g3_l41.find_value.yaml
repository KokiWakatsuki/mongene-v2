family: math.g3_l41.find_value
form: find_value
source_desc: |
  証明した相似から相似比で長さを求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 証明した相似から相似比で長さを求める。
       example: 右の図で三角形 ABC∽三角形 AED であることが証明されている。
                AE=4cm, AB=6cm, DE=5cm のとき、辺 BC の長さを求めよ。
  【設計モデル】既存 solver math.similarity_ratio_transfer を再利用する
  （AE:AB を相似比としてそのまま渡し、DE から対応する BC を求める・family を
  またぐ recipe/solver 共有は level_sep に無関係）。頂点Aを共有する
  △ABC∽△AED型の証明済み相似を、図なしでテキストの correspondence 指定として
  直接表す。
concepts_default: [similarity.proven_ratio_length]
levels:
  "2":
    signature: similarity_proven_ratio_length
    recipe: math.similarity_proven_ratio_length
    params:
      ratio_max: 9
      scale_max: 12
      side_max: 60
    dup_rate_max: 0.38
    dup_rate_reason: |
      100 seed で相異 68 問（実測）。中身の軸は 既知の辺 25 通り × 比 7×7 通り。
      答えが整数になる組しか使えないため、定義域を広げても通る組はこの程度にとどまる。
      以前は点名・人名・使う文字を dup_key に算入していたので閾を通っていたが、
      **名前が違うだけの問題は別の問題ではない**。増やすには題材そのものを追加する。
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_similarity_condition_v1}
    hints: [steps_prefix]
    concept_tags: [similarity.proven_ratio_length]
    cause_tags: []
remedial:
  default_level: 2
