family: math.g3_l41.proof
form: proof
source_desc: |
  相似条件を使った証明の進め方
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・示す2三角形が明示され1つの相似条件で直接証明。
  Lv3 desc: 補助線・共通角/等角の2段階の根拠づけを要する証明。
  ---
  【設計モデル】g2_l39.proof と同じ推論器。相似条件（2組の角・2組の辺の比とその間の
  角・3組の辺の比）は `rules_similarity.py` にある。

  【循環していないか】この単元で証明するのは「2つの三角形が相似であること」であって、
  相似条件そのものではない。だから `exclude_rules` は要らない。

  【深さ】Lv2 は砂時計型（AB ∥ DC の2本の線分が点Oで交わる図）で、錯角と対頂角から
  2組の角がそれぞれ等しい（深さ2）。Lv3 は**平行を仮定しない砂時計型**で、
  与えられるのは比だけ（OA：OC ＝ OB：OD）——2組の辺の比とその間の角を使うので、
  根拠づけの筋道が変わる（同じ深さでも op 列が相異する: conclude_similar_aa と
  conclude_similar_sas）。

  【定義域】`scratchpad/fit_domain.py` の実測（どちらの箱も合格率 100%・1225 通り）。
concepts_default: [similarity_proof.direct_condition]
levels:
  "2":
    signature: geometry_proof_similar_aa
    recipe: math.geometry_proof
    params:
      construction: similar_hourglass
      topic_set: similarity
      proof_depth: 2
      prefer: tri_sim
      base_domain: {int_range: [24, 48]}
      angle_domain: {int_range: [48, 54]}
      offset_domain: {int_range: [18, 24]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [similarity_proof.direct_condition]
    cause_tags: []
  "3":
    signature: geometry_proof_similar_sas
    recipe: math.geometry_proof
    params:
      construction: ratio_hourglass
      topic_set: similarity
      proof_depth: 2
      prefer: tri_sim
      base_domain: {int_range: [24, 48]}
      angle_domain: {int_range: [48, 54]}
      offset_domain: {int_range: [18, 24]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [similarity_proof.two_step]
    cause_tags: []
  "4":
    signature: geometry_proof_similar_construct
    recipe: math.geometry_proof
    params:
      # ピラミッド型から、相似の1段先（対応する辺の比）を結論に取る。
      # どの三角形を相似とみるかを決めてからでないと比の式が書けない。
      construction: similar_pyramid
      topic_set: similarity
      proof_depth: 3
      prefer: ratio_eq
      base_domain: {int_range: [28, 46]}
      angle_domain: {int_range: [40, 85]}
      offset_domain: {int_range: [10, 26]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [similarity_proof.construct]
    cause_tags: []
remedial:
  default_level: 2
