family: math.g3_l42.proof
form: proof
source_desc: |
  平行線と線分の比の定理
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 相似を根拠に比の関係を記述証明する。
  ---
  【設計モデル】g2_l39.proof と同じ推論器。

  【★証明したい定理を規則から外す】この単元で示すのは「平行線と線分の比」そのもの
  なので、その規則（`use_parallel_ratio`）を使えると1手で終わる（循環）。外して、
  **相似を経由して比を出す**筋道だけを残す——教科書の証明もその順である
  （錯角と対頂角 → 2組の角がそれぞれ等しい → 相似 → 対応する辺の比は等しい）。

  【深さ】相似（深さ2）→ 対応する辺の比（深さ3）。
