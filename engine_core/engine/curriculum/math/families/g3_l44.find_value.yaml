family: math.g3_l44.find_value
form: find_value
source_desc: |
  中点連結定理で中点を結ぶ線分の長さを求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 中点連結定理で中点を結ぶ線分の長さを求める。
       example: 三角形 ABC で、辺 AB, AC の中点をそれぞれ M, N とする。
                BC=10cm のとき、線分 MN の長さを求めよ。
  【設計モデル】新設 solver math.midpoint_connector_length（中点連結定理:
  中点を結ぶ線分の長さは残りの辺の長さの半分に等しいという恒真の性質）。
concepts_default: [midpoint_connector.length]
levels:
  "2":
    signature: midpoint_connector_length
    recipe: math.midpoint_connector_length
    params:
      # **紙の図形の辺の長さ（BC は 6〜40cm の偶数）。** 前は 1〜400 で
      # 「BC=317cm」のような教材には出てこない大きさが出ていた。
      # 偶数に限るのは、答えが半分なので奇数だと 7.5cm になるため
      # （recipe が 2 倍する＝ここは半分の値の域）。
      half_domain: {int_range: [3, 20]}
    # 図形の寸法を教材の大きさに戻した結果、組の数が減った（`statement_size`）。
    # 数を現実に戻すのが先で、重複は仕様として宣言する。
    dup_rate_max: 0.9
    dup_rate_reason: |
      中点連結定理の求値は「残りの辺 N cm → その半分」なので、変えられるのは N だけ。
      図形の寸法を教材の大きさ（6〜40cm の偶数＝18通り）に戻すと、100 seed では
      ほとんどが重なる（実測 0.82・相異18通り）。**数を現実に戻すほうを優先した**——
      317cm の中点連結定理は実物の教材に存在しない。
      頂点名は変わるが、同じ問題の書き換えなので dup_key には入れない。
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_parallel_line_ratio_condition_v1}
    hints: [steps_prefix]
    concept_tags: [midpoint_connector.length]
    cause_tags: []
remedial:
  default_level: 2
