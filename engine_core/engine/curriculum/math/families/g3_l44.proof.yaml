family: math.g3_l44.proof
form: proof
source_desc: |
  中点連結定理とその証明・利用
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 誘導あり・中点連結定理を根拠に平行・長さ関係を直接証明。
  Lv3 desc: 補助線(中点を結ぶ)を引く2段階の構成を要する証明。
  ---
  【設計モデル】g2_l39.proof と同じ推論器。Lv2 は△ABCの2辺の中点M、Nを結んだ図で、
  中点連結定理を**使って** MN ∥ BC を示す。Lv3 は3辺の中点を結んだ図（中点を結ぶ
  補助線を引いた形）で、できた四角形が平行四辺形であることを示す。

  【循環していないか】この単元で示すのは「平行であること」「四角形が平行四辺形で
  あること」であって、中点連結定理そのものではない（台帳 desc も「定理を根拠に」
  と書いている）。だから `exclude_rules` は要らない。

  【★この図は偶然の一致の検査に落ちていた】描かれていない線分の長さがたまたま
  そろっている、という理由だった。検査を「図に描かれているもの」に限ったので通った
  （naturalness.py・通過率 0/48 → 45/48）。
concepts_default: [midline_proof.direct]
levels:
  "2":
    signature: geometry_proof_midline_direct
    recipe: math.geometry_proof
    params:
      construction: midline_triangle
      topic_set: similarity
      proof_depth: 3
      prefer: parallel
      base_domain: {int_range: [28, 46]}
      angle_domain: {int_range: [40, 85]}
      offset_domain: {int_range: [10, 26]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [midline_proof.direct]
    cause_tags: []
  "3":
    signature: geometry_proof_midline_auxiliary
    recipe: math.geometry_proof
    params:
      construction: midline_medial
      topic_set: similarity
      proof_depth: 3
      prefer: parallelogram
      base_domain: {int_range: [28, 46]}
      angle_domain: {int_range: [40, 85]}
      offset_domain: {int_range: [10, 26]}
    given: [premises, conclusion]
    asked: [proof_text]
    visual: optional
    text: {tier: T1, template: pf_geometry_proof_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [midline_proof.auxiliary]
    cause_tags: []
remedial:
  default_level: 2
