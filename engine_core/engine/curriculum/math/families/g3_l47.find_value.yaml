family: math.g3_l47.find_value
form: find_value
source_desc: |
  円周角=中心角の半分で角を求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 円周角=中心角の半分/同じ弧の円周角が等しいで1回で角を求める。
       example: 右の図で、点 O は円の中心である。弧 AB に対する中心角 ∠AOB=100°
                のとき、同じ弧 AB に対する円周角 ∠APB の大きさを求めよ。
       【既知の不具合回避】notes欄に「円周角が90°に固定される不具合に注意」と
       あるため、central_angleを180に偏らせず広い値域[2,178]から一様に引く。
  Lv3 desc: 複数の円周角・二等辺/外角を組み合わせ多段で角を求める。
       example: 右の図で、4点 A, B, C, D は円周上にある。∠BAC=35°、∠ACD=50°
                であるとき、2本の弦 AD, BC の交点を P として、∠APB の大きさを
                求めよ。
  【設計モデル】新設 solver math.inscribed_angle_from_central（円周角=中心角の
  半分という恒真の性質）。「右の図」は図なしで円・点の配置をテキストで直接
  指定する（既存の合同対応セル等と同様）。
  【Lv3設計モデル】台帳例のとおり、2つの円周角∠BAC・∠ACDから弦AD,BCの交点P
  にできる∠APBを求める。円周角の定理で対応する弧の大きさを求め、円周の全体
  360°から2つの弧を除いた残りが2倍される関係(∠APB=180°-∠BAC-∠ACD)を使う
  新設 solver math.inscribed_angle_two_chords_intersection。Lv1(中心角→円周角
  を1回)とはop列が異なり、複数の円周角を組み合わせる多段構成になる。
  central_angleが180に偏ると円周角が90°に固定される既知の不具合と同種の
  退化(∠BAC+∠ACD=90)を明示的に除外する。
concepts_default: [circle.inscribed_angle_from_central]
levels:
  "1":
    signature: inscribed_angle_from_central
    recipe: math.inscribed_angle_from_central
    params:
      # 中心角は偶数に限る（円周角は半分なので、奇数だと 9° → 9/2° と分数になる。
      # 教科書は中心角を偶数にとる）。**下限は30°**——2°の中心角（円周角1°）は
      # 図にかけない。30〜178 の偶数で75通り × 点名の軸。
      central_angle_domain: {int_set: [30, 32, 34, 36, 38, 40, 42, 44, 46, 48, 50, 52, 54, 56, 58, 60, 62, 64, 66, 68, 70, 72, 74, 76, 78, 80, 82, 84, 86, 88, 90, 92, 94, 96, 98, 100, 102, 104, 106, 108, 110, 112, 114, 116, 118, 120, 122, 124, 126, 128, 130, 132, 134, 136, 138, 140, 142, 144, 146, 148, 150, 152, 154, 156, 158, 160, 162, 164, 166, 168, 170, 172, 174, 176, 178]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_inscribed_angle_condition_v1}
    hints: [steps_prefix]
    concept_tags: [circle.inscribed_angle_from_central]
    cause_tags: []
  "3":
    signature: inscribed_angle_two_chords_intersection
    recipe: math.inscribed_angle_two_chords_intersection
    params:
      # **円周角は 20°以上。** 前は 5〜75 で「∠KRD=6°」が出ていた。
      angle_domain: {int_range: [20, 75]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_inscribed_angle_condition_v1}
    hints: [steps_prefix]
    concept_tags: [circle.two_chords_intersection_angle]
    cause_tags: []
remedial:
  default_level: 1
