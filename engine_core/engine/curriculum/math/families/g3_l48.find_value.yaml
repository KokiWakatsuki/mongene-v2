family: math.g3_l48.find_value
form: find_value
source_desc: |
  逆を用いて同一円周上と判断し角を求める
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 逆を用いて同一円周上と判断し角を求める。
       example: 右の図で、∠ACB=∠ADB=40° であり、4点 A, B, C, D は同一円周上に
                ある。∠DAC=25° のとき、∠DBC の大きさを求めよ。
  【設計モデル】新設 solver math.inscribed_angle_transfer_same_arc（4点が
  同一円周上にあることは既に与えられており、同じ弧DCに対する円周角∠DAC・∠DBC
  は等しいという恒真の性質から∠DBCを求める）。∠ACB=∠ADBの部分は「円周角の
  定理の逆により同一円周上と判断できる」という前提の裏付けとして問題文に含める
  （答えの計算には使わない）。
concepts_default: [circle.inscribed_angle_transfer_same_arc]
levels:
  "2":
    signature: inscribed_angle_transfer_same_arc
    recipe: math.inscribed_angle_transfer_same_arc
    params:
      # **円周角は 20〜80°。** 前は 1〜89 で 1°の円周角が出ていた。
      angle_domain: {int_range: [20, 80]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_inscribed_angle_condition_v1}
    hints: [steps_prefix]
    concept_tags: [circle.inscribed_angle_transfer_same_arc]
    cause_tags: []
remedial:
  default_level: 2
