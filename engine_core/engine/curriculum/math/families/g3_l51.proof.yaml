family: math.g3_l51.proof
form: proof
source_desc: |
  三平方の定理の意味とその証明（面積を用いた記述証明）
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 誘導あり:正方形の面積を2通りに表し定理を証明。
       example: 1辺(a+b)の正方形に直角をはさむ2辺がa,bの直角三角形を4つ並べる。
                面積を2通りに表して a²+b²=c² を示せ。
  Lv4 desc: 誘導なし:面積分割の方針を自分で構成して証明。
       example: 三平方の定理 a²+b²=c² を、面積の考えを用いて証明せよ
                (図・補助線は自分で設定してよい)。
  ---
  【設計モデル】solvers/pythagoras_proof.py。同じ form の math.geometry_proof
  （合同・平行線など）とは**証明の進み方が違う**ので別機構にした。あちらは図の上の事実を
  前向きに増やして目標に届かせる（deduce）。こちらは
    「図の分け方 → 同じ面積の2通りの表し方 → 展開 → 共通項を消す」
  で、**式変形そのものが証明**になる。a² + b² = c² を人が式として書き下す場面はどこにも
  なく、2通りの面積の式の差を sympy に取らせ、それが a² + b² - c² の定数倍であることを
  確かめて初めて「その図で定理が示せる」と判定する（_verify_area_identity）。

  使う型は5つ:
    outer_square           1辺 a+b の正方形 ＝ 直角三角形4つ ＋ 1辺 c の正方形
    outer_square_subtract  1辺 c の正方形 ＝ 1辺 a+b の正方形 － 直角三角形4つ
    inner_square           1辺 c の正方形 ＝ 直角三角形4つ ＋ 1辺 b-a の正方形
    inner_square_subtract  1辺 b-a の正方形 ＝ 1辺 c の正方形 － 直角三角形4つ
    trapezoid              台形（Garfield）＝ 直角三角形2つ ＋ 直角二等辺三角形1つ
  型が返すのは「日本語の言い方」と「2通りの面積の式」だけで、展開・共通項の消去・
  両辺の倍率（台形だけ 2 倍が要る）は共有のコードが式から導く。

  【Lv 差】Lv3 は誘導あり6手（express_area_first → express_area_second → equate_areas
  → expand_both_sides → simplify_equation → conclude_theorem）、Lv4 は誘導なしで
  「どの図にするか」「並べたら辺がどう分かれるか」「内側は何の図形か」の3手が**先頭に
  付いて9手**（choose_figure → place_triangles → justify_inner_square → 上の6手）。
  ここを揃えると level_sep が落ちる。
  また Lv3 は図の記号（正方形ABCD・正方形EFGH）を問題文が名づけ、答えもその記号で書く。
  Lv4 は記号を使わず「大きい正方形」「内側の小さい正方形」と言葉で呼ぶ——
  **誘導なしの問題文は図を与えないので、記号は出どころが無い。**

  【dup_rate】型 × 文字の組 × 記号の組 × 結論の向き。
    Lv3  型5 × 文字120（10文字から3つ・辞書順）× 記号5 × 向き2 = 6000
    Lv4  型5 × 文字120 × 向き2 = 1200（記号を使わないぶん狭い）
  閾 0.20 に要る 250 通りに対して十分広い。
concepts_default: [pythagorean.prove_theorem_by_area]
levels:
  "3":
    signature: pythagoras_area_proof_guided
    recipe: math.pythagoras_area_proof
    params:
      guided: true
      proof_set: [outer_square, outer_square_subtract, inner_square,
                  inner_square_subtract, trapezoid]
    dup_rate_max: 0.92
    dup_rate_reason: |
      証明の道すじそのものが軸で、面積による三平方の証明は outer_square・outer_square_subtract・
      inner_square・inner_square_subtract・trapezoid の**5通り**（教科書に載る型を尽くしている）。
      並べ方の左右反転と合わせて実測 10 通り。以前は点名を dup_key に算入していた。
    given: [premises, conclusion]
    asked: [proof_text]
    visual: required
    text: {tier: T1, template: pf_pythagoras_guided_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [pythagorean.prove_theorem_by_area]
    cause_tags: []
  "4":
    signature: pythagoras_area_proof_open
    recipe: math.pythagoras_area_proof
    params:
      guided: false
      proof_set: [outer_square, outer_square_subtract, inner_square,
                  inner_square_subtract, trapezoid]
    dup_rate_max: 0.92
    dup_rate_reason: |
      Lv3 と同じ5つの道すじ（誘導が無いだけ）。実測 10 通り。
    given: [premises, conclusion]
    asked: [proof_text]
    visual: required
    text: {tier: T1, template: pf_pythagoras_open_v1, visual_builder: math.geometry_construction}
    hints: [steps_prefix]
    concept_tags: [pythagorean.construct_area_proof]
    cause_tags: []
remedial:
  default_level: 3
