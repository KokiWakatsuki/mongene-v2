family: math.g3_l55.find_value
form: find_value
source_desc: |
  空間図形への利用（対角線、錐体の高さと体積など）
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 直方体の対角線など1つの直角三角形の三平方で直接求める。
       example: 縦 3cm、横 4cm、高さ 12cm の直方体の対角線の長さを求めよ。
  Lv3 desc: 断面/側面を抜き出し補助線を引き高さ・体積を多段で求める。
       example: 底面が1辺 6cm の正方形で、他の辺の長さがすべて 6cm の正四角錐がある。
                この正四角錐の高さと体積を求めよ。
  Lv4 desc: 錐体の頂点から底面への垂線位置など非自明な構想を要す。
       example: 1辺 6cm の正四面体 ABCD について、頂点 A から底面 BCD に下ろした垂線の
                足の位置を考え、この正四面体の高さと体積を求めよ。
  【設計モデル】新 solver ゼロ（recipe math.pythagorean_find_value）。
    - Lv2: 底面の対角線を math.pythagorean_hypotenuse で求め、それと高さで
      もう一度 math.pythagorean_hypotenuse を使う（2手）。
    - Lv3: 底面の正方形の対角線の半分を出し、側辺を斜辺として math.solve_quadratic の
      正の解で高さを求め、体積を合成する（3手）。
    - Lv4: 垂線の足が底面の中線の交点であることをまず据え、中線→重心までの距離→高さ→
      体積の順に進む（4手）。中線・高さはどちらも math.solve_quadratic の正の解。
  【level_sep】Lv2=2手 / Lv3=3手 / Lv4=4手 と op 列の段数・名前が異なる。
concepts_default: [pythagorean.box_diagonal]
levels:
  "2":
    signature: pythagorean_box_diagonal
    recipe: math.pythagorean_find_value
    params:
      scenario_kind: box_diagonal
      # 縦・横・高さの3軸 × 20 値 ＝ 8000 通り（閾 0.20 に必要な約250通りを大きく超える）。
      # **直方体の辺は 2cm 以上**（1cm×1cm×5cm は棒であって直方体の図に
      # ならない）。実物の直方体の問題は 3〜12cm あたり。
      edge_domain: {int_range: [2, 20]}
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_pythagorean_condition_v1}
    hints: [steps_prefix]
    concept_tags: [pythagorean.box_diagonal]
    cause_tags: []
  "3":
    signature: pythagorean_square_pyramid_height_volume
    recipe: math.pythagorean_find_value
    params:
      scenario_kind: square_pyramid_height_volume
      # 底面の1辺は偶数（対角線の半分の二乗が整数）、側辺は
      # (側辺² − 1辺²/2) >= 4 かつ底辺の3倍以下。列挙して **459 通り**（実測）。
      # **側辺は底辺の 3 倍まで**（recipe が絞る）。前は無関係に引いていたので
      # 「底面4cm・辺29cmの正四角錐」（針のような立体）が出ていた。
      #
      # ★2026-08-18: 以前の注記は「頂点名（連続5文字 22 通り）も params に載るので
      # 実際は 9548 通り」だった。**頂点名は dup_key から外した**（数値も場面も
      # 同じで名前だけ違う問題を別物として数えていた）ので、名前で稼いでいた分は
      # 消えた。埋め合わせに 2..30/2..40（320 通り）を 2..36/2..48 に広げる。
      # 底面36cm・側辺48cm は模型としてありえる大きさ（statement_size が上限を見る）。
      base_edge_domain: {int_range: [2, 36]}
      lateral_edge_domain: {int_range: [2, 48]}
      min_height_squared: 4
    # 候補は 459 通りあるが、100 seed で相異なのは 70（同じ候補列から一様に引けば
    # 86）。空間の広さではなく**この題材が持てる相異の上限**がここにある。
    # 名前で水増しするのをやめたので、狭さは隠さず宣言する。
    dup_rate_max: 0.35
    dup_rate_reason: |
      正四角錐の「高さと体積」は (底面の1辺, 側辺) の2数だけで決まる題材で、
      さらに底面は偶数・側辺は底辺の3倍以下・高さがつぶれないという制約がかかる。
      以前は頂点名（連続5文字 22 通り）を dup_key に算入して 9548 通りに見せていたが、
      **数値も場面も同じで名前だけ違う問題を別物として数えていた**だけだった。
      名前を外した実測が 0.30。定義域は 2..30/2..40 から 2..36/2..48 に広げてある。
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_pythagorean_condition_v1}
    hints: [steps_prefix]
    concept_tags: [pythagorean.square_pyramid_height_volume]
    cause_tags: []
  "4":
    signature: pythagorean_regular_tetrahedron_height_volume
    recipe: math.pythagorean_find_value
    params:
      scenario_kind: regular_tetrahedron_height_volume
      # 1辺は教科書の大きさに（1辺57cmの正四面体は教材にならない）。
      edge_domain: {int_range: [2, 24]}
    # ★2026-08-18: 以前ここには「1辺 23 通り × **頂点名**（連続4文字 23 通り）＝
    # 529 通りで閾は通る」と書いてあった。**閾値を頂点名で通していた**という証拠。
    # 頂点名を dup_key から外したので、実測は 0.78（相異 22/100）に戻った。
    dup_rate_max: 0.80
    dup_rate_reason: |
      「1辺 a の正四面体の高さと体積」は **a ひとつで決まる1変数の題材**で、
      教材として成り立つ 1辺（2〜24cm）が 23 通りしかない。第2の軸は数学的に無い
      （高さも体積も a だけの関数）。求めるものを変えれば軸は増えるが、それは
      op 列が変わる＝別のセルであり、level_sep（G-FP）が同一署名内での op 列の
      ゆらぎを許さない。**狭いことを隠さず宣言する**のが正しい扱い。
    given: [condition]
    asked: [value]
    visual: none
    text: {tier: T1, template: lf_pythagorean_condition_v1}
    hints: [steps_prefix]
    concept_tags: [pythagorean.regular_tetrahedron_height_volume]
    cause_tags: []
remedial:
  default_level: 2
