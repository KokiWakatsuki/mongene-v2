family: math.g3_l55.graph_table
form: graph_table
source_desc: |
  空間図形への三平方の利用（units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 見取図・断面を読み補助線を引いて平面に落とす。
       example: 縦 4cm、横 3cm、高さ 5cm の直方体の見取図をもとに、頂点 A から
                向かいの頂点 G を含む断面(長方形 AEGC)を抜き出してかき、
                対角線 AG を求めるのに使う直角三角形を平面上に示せ。
  ---
  【設計モデル】数学は solvers/solid_view.box_section_diagonal、図は
  visuals/solid.py。同じ単元の find_value（対角線の長さを求める）とは、
  問うものが「長さ」ではなく「立体の問題をどの平面に落とすか」である点が違う。

  【問題図が立体であること】このセルは**与えられた見取図を見て断面をかく**ので、
  問題図そのものが直方体の見取図になる。visual_plan の element は "solid_given"
  （＝答えではない、与えられた図）で宣言する。frame が禁じているのは
  "solid"＝**答えの図**であって、立体を描くこと自体ではない
  （read_box_plot が読む対象の箱ひげ図を描いてよいのと同じ理屈）。

  【答えの中身】切り口の長方形の横＝底面の対角線 √(a²+b²)、縦＝高さ、
  対角線＝立体の対角線 √(a²+b²+h²)。答えは無理数になってよい（教科書どおり）。

  【dup（数え上げ）】3辺（相異）× 頂点名8つ。既定（2〜15）で 14×13×12=2184 通り。

  【退化の封じ方】3辺を相異にする（立方体になると断面が正方形になり、
  「横は底面の対角線」という要点が見えなくなる）。
concepts_default: [box_view.section]
