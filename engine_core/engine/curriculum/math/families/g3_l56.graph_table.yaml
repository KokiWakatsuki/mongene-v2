family: math.g3_l56.graph_table
form: graph_table
source_desc: |
  立体の表面上の最短距離（展開図の利用）
  （units.generated.yaml の desc/example を正として転記）。
  Lv2 desc: 立体を展開図に描き経路を直線化する。
       example: 縦 2cm、横 3cm、高さ 4cm の直方体の見取図で示された、ある側面と上面を
                またぐ2点間の経路について、その2面を1つの平面に開いた展開図をかき、
                経路を直線で結べ。
  ---
  【設計モデル】数学は solvers/solid_view.box_unfold_shortest_path。となり合う2面を
  1つの平面に開くと「横＝2辺の長さの和、縦＝残りの辺」の長方形になり、最短の道のりは
  その対角線＝三平方の定理そのもの。

  【台帳 example との差】example は「側面と上面をまたぐ」だが、どの2面をまたぐかを
  頂点名で明示する形にした（図に依存せず場面が一意に決まるようにするため）。
  開いた長方形の寸法は、またぐ2面の辺の和と残りの辺で決まるので、値は同型。

  【問題図が立体であること】g3_l55.graph_table と同じ。与えられた見取図は答えでは
  ないので "solid_given" で宣言する。

  【dup（数え上げ）】3辺（相異）× 頂点名8つ。既定（2〜15）で 14×13×12=2184 通り。

  【退化の封じ方】3辺を相異にする（立方体だと3通りの開き方がすべて同じ長さになり、
  「どの2面を開くか」が意味を持たなくなる）。
concepts_default: [box_view.unfold]
levels:
  "2":
    signature: box_view_unfold
    recipe: math.box_view
    params:
      mode: unfold
      length_range: [2, 15]
      unit: cm
    given: [condition]
    asked: [draw_solid]
    visual: required
    text: {tier: T1, template: lf_motion_area_v1, visual_builder: math.solid}
    hints: [steps_prefix]
    concept_tags: [box_view.unfold]
    cause_tags: []
remedial:
  default_level: 2
