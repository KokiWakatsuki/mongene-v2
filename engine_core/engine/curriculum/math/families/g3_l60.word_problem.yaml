family: math.g3_l60.word_problem
form: word_problem
source_desc: |
  標本調査の活用（標本から母集団を推定する問題）
  （units.generated.yaml の desc/example を正として転記）。
  Lv3 desc: 誘導あり:捕獲再捕獲など設定→比例式で母集団を推定。
       example: 湖にいるコイの数を調べるため、42匹のコイを捕まえて印をつけて湖に
                もどした。数日後に同じ湖で60匹のコイを捕まえると、そのうち印の
                ついたコイが7匹いた。(1)この標本での印つきのコイの割合を求めよ。
                (2)この湖にいるコイのおよその総数を求めよ。
  Lv4 desc: 誘導なし:推定の仕組みを自分でモデル化して母集団を求める。
       example: 袋の中に大量の白玉が入っている。この袋の中の白玉の総数を、玉を
                数えずに標本調査で推定する方法を考えたい。同じ大きさの赤玉を
                100個袋に加えてよくかき混ぜてよいものとして、白玉の総数を推定する
                手順を説明し、無作為に取り出した80個のうち赤玉が16個だったときの
                白玉のおよその総数を求めよ。
  ---
  【この form の型】g3_l59.word_problem と同じ recipe math.word_problem_sample_survey
  （4セルを1つの recipe で賄う。詳細は g3_l59.word_problem.yaml の source_desc 参照）。
  【level_sep】Lv3 は誘導あり＝(1)標本比率→(2)母集団の2小問。捕獲再捕獲法の手順
  （捕まえて印をつけて放し、後日また捕まえる）を場面文が明示する点が g3_l59 Lv2
  （あらかじめ放流ずみの印つき総数を前提として与える）との違い＝場面の描写が違う。
  数学は同じ math.sample_ratio_solve_population。
  Lv4 は誘導なし＝1小問。母集団（白玉の総数）そのものは場面文に出ておらず、
  「同じ大きさの玉を既知数だけ加える」というモデル化の手順自体を読み取らせる。
  標本比率から「加えた玉を含む全体」を math.sample_ratio_solve_population で推定した
  あと、加えた分（赤玉の個数）を引く最後の一手が要る＝ words_problem_linear の
  answer_coeff と同型の「求める量が solver の出力と違う」構造（このセルだけが持つ）。
  例題本文の「手順を説明し」は、無作為抽出モデルへの読み替えという発展要求を表す
  文言であり、実際に採点可能な答えは白玉の総数の値1つ（asked=value）にまとめる
  （モデル化の説明そのものは steps の narration で示す）。
  【answer-first】g3_l59.word_problem と同じ候補列挙（除法が割り切れる組だけを残す）。
  Lv4 は「白玉 = 全体 − 赤玉」が正になるよう count(標本内の赤玉数) < size(標本の
  大きさ) を候補列挙で保証する（全体 > 赤玉 が自動的に成り立つ）。
  【検証】G-Q1 が全小問 double-solve。答えは params に入れない。
concepts_default: [sample_survey.word_problem_capture_recapture]
levels:
  "3":
    signature: word_problem_sample_capture_recapture_guided
    recipe: math.word_problem_sample_survey
    params:
      scenario_kind: lake_capture_recapture
      guided: true
      # 再捕獲した標本の大きさ・そのうち印つきの数・あらかじめ捕獲して印をつけて
      # 放した総数（既知）。母集団 x = known×size/count が整数になる組だけを候補
      # として残す。
      sample_size_candidates: [40, 50, 60, 70, 80, 90, 100, 120, 150]
      sample_count_candidates: [2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 15]
      known_estimate_candidates: [20, 25, 30, 35, 40, 42, 45, 50, 55, 60, 70, 80]
    given: [scenario, quantities]
    asked: [formulation, value]
    visual: none
    text: {tier: T1, template: wp_linear_guided_v1}
    hints: [steps_prefix]
    concept_tags: [sample_survey.word_problem_capture_recapture]
    cause_tags: []
  "4":
    signature: word_problem_sample_red_ball_model_solo
    recipe: math.word_problem_sample_survey
    params:
      scenario_kind: red_ball_model
      guided: false
      # 標本の大きさ・標本内の赤玉数・加えた赤玉の総数（既知）。全体 x =
      # known×size/count が整数になる組だけを候補として残す（白玉 = x − known）。
      sample_size_candidates: [40, 50, 60, 70, 80, 90, 100, 120]
      sample_count_candidates: [2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 15, 16, 18, 20]
      red_ball_candidates: [60, 80, 100, 120, 150, 180, 200, 250]
    given: [scenario]
    asked: [value]
    visual: none
    text: {tier: T1, template: wp_linear_solo_v1}
    hints: [steps_prefix]
    concept_tags: [sample_survey.word_problem_population_modeling]
    cause_tags: []
remedial:
  default_level: 3
