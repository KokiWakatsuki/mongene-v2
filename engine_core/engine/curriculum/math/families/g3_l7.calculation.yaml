family: math.g3_l7.calculation
form: calculation
source_desc: |
  因数分解の意味と共通因数のくくり出し
  （units.generated.yaml の desc/example を正として転記）。
  Lv1 desc: 最大公約数となる共通因数を1手順でくくり出す。
       example: 6x²+9x を因数分解せよ。
  Lv2 desc: 複数項・多変数で共通因数の見極めと符号処理が複雑化。
       example: 12a²b-8ab²+4ab を因数分解せよ。
  【設計モデル】独立ソルバ math.factor_expression が sympy.factor で因数分解する。
  answer-first で因数分解形を構成し展開して given（＝問題の多項式）にする。答えは自由変数を
  含む式の SymbolicAnswer（G-Q5t は display 全体一致のみ検査＝展開形と因数分解形は構造が
  違うので漏洩しない）。level_sep は mode 別 op 列:
  Lv1（factor_common：共通因数を1手順でくくり出す）／Lv2（factor_common_multi：多変数で
  共通因数を見つけてからくくり出す2手順）。dup は係数・文字種で分散。
concepts_default: [polynomial.factor_common]
levels:
  "1":
    signature: factor_common
    recipe: math.factor_polynomial
    params:
      mode: factor_common
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_factor_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.factor_common]
    cause_tags: []
  "2":
    signature: factor_common_multi
    recipe: math.factor_polynomial
    params:
      mode: factor_common_multi
    given: [expression]
    asked: [simplified_expr]
    visual: none
    text: {tier: T1, template: lf_factor_v1}
    hints: [steps_prefix]
    concept_tags: [polynomial.factor_common]
    cause_tags: []
remedial:
  default_level: 1
