source: docs/input_spec_2026-07-08.json
subject: math
units:
  exam_l1:
    forms:
      find_value:
        levels:
          '3':
            band: 応用
            desc: 直線の交点座標・三角形の面積を多段で求める
            example: 2直線 y=3x-1 と y=-x+7 の交点をP、y=-x+7 と x軸との交点をQ、原点をOとする。交点Pの座標を求め、三角形OPQの面積を求めよ。
            market_ref: 応用問題集レベル。交点座標から面積までを多段で求める入試頻出型。
          '4':
            band: 発展
            desc: 面積条件から未知の係数・点を逆算して求める
            example: 直線 y=ax+6 が x軸、y軸と交わる点をそれぞれA、Bとする。三角形OABの面積が9であるとき、正の数 a の値を求めよ。
            market_ref: 公立トップ校〜難関私立。面積条件から係数を逆算する構成力を要する。
        rationale: 交点座標・三角形の面積を立式して求める求値
      graph_table:
        levels:
          '2':
            band: 標準
            desc: 直線と図形の位置関係をグラフ上で把握する
            example: 座標平面上に直線 y=-2x+8 と三角形OABがある。直線と x軸・y軸との交点、および三角形の頂点の位置関係をグラフ上に図示し、直線が三角形の内部を通るかどうかを読み取って答えよ。
            market_ref: 標準問題集レベル。直線と図形の位置関係をグラフ上で把握させる。
        rationale: 直線と図形の位置関係をグラフ上で把握
      word_problem:
        levels:
          '3':
            band: 応用
            desc: 誘導あり:交点→三角形の面積の小問が段階的に連なる融合
            example: 座標平面上に2直線 y=2x+4 と y=-x+7 がある。この2直線の交点をA、y=2x+4 と x軸との交点をB、y=-x+7 と x軸との交点をCとする。(1)点Aの座標を求めよ。(2)点B、点Cの座標を求めよ。(3)三角形ABCの面積を求めよ。
            market_ref: 公立入試の関数大問の定番。誘導つきで小問が段階的に導く。
          '4':
            band: 発展
            desc: 誘導なし:面積等分点・等積変形などゴールを自分で構成
            example: 座標平面上に直線 y=x+3 があり、この直線と x軸、y軸との交点をそれぞれA、Bとする。x軸上の正の部分に点Cをとり、三角形ABCの面積が三角形OABの面積の2倍になるようにしたい。このときの点Cの座標を求めよ。
            market_ref: 公立入試の後半〜難関私立。誘導が薄く、面積条件から点を自分で構成する。
        rationale: 座標平面上の融合場面を読み解き段階的に解く入試融合活用が主
    notes: 融合セクション（入試対策）。
    section: 中学3年 ／ 入試対策 ／ 入試対策
    title: 一次関数と図形の融合（交点・三角形の面積）
    unit_flag: ok
  exam_l2:
    forms:
      find_value:
        levels:
          '3':
            band: 応用
            desc: 放物線と直線を連立し交点・面積を多段で求める
            example: 放物線 y=x² と直線 y=2x+3 の2つの交点をA、Bとする。2点A、Bの座標を求め、線分ABの長さと三角形OABの面積を求めよ。
            market_ref: 応用問題集レベル。放物線と直線を連立し交点・面積を多段で求める。
          '4':
            band: 発展
            desc: 相似・面積条件から係数や点を逆算して求める
            example: 放物線 y=ax² と直線 y=x+4 が2点A、Bで交わり、Aの x座標が-2である。このとき a の値を求め、さらに三角形OABの面積を求めよ。
            market_ref: 難関私立・公立トップ校で頻出。条件から係数を逆算し面積まで構成する。
        rationale: 交点座標・面積・線分比を連立/相似で立式して求める求値
      graph_table:
        levels:
          '2':
            band: 標準
            desc: 放物線と直線が囲む図形をグラフ上で把握する
            example: 放物線 y=x² と直線 y=x+6 が2点で交わっている。この放物線と直線をグラフにかき、放物線と直線が囲む部分をグラフ上で示せ。
            market_ref: 標準問題集レベル。放物線と直線が囲む図形をグラフ上で把握させる。
        rationale: 放物線と直線が囲む図形をグラフ上で把握
      word_problem:
        levels:
          '3':
            band: 応用
            desc: 誘導あり:交点→面積/線分比の小問が段階的に連なる融合
            example: 放物線 y=x² と直線 y=x+2 が2点A、Bで交わっている。ただしAの x座標は負とする。(1)2点A、Bの座標を求めよ。(2)直線と y軸との交点をCとするとき、三角形OABの面積を求めよ。
            market_ref: 公立入試の関数大問の花形。誘導つきで交点から面積へ段階的に導く。
          '4':
            band: 発展
            desc: 誘導なし:等積変形・面積比などゴールを自分で構成
            example: 放物線 y=x² 上に2点A(-1,1)、B(2,4)がある。この放物線上の点Pを、三角形OABと三角形PABの面積が等しくなるようにとりたい。原点Oと異なる点Pの座標をすべて求めよ。
            market_ref: 公立トップ校〜難関私立で頻出。等積変形の方針を自分で構成する腕試し用。
        rationale: 放物線と直線の融合場面を段階的に解く入試活用が主
    notes: 融合セクション（入試対策）。
    section: 中学3年 ／ 入試対策 ／ 入試対策
    title: 放物線と直線の融合（二次関数×一次関数）
    unit_flag: ok
  exam_l3:
    forms:
      find_value:
        levels:
          '3':
            band: 応用
            desc: 指定区間で動点位置の図から面積を立式して求める
            example: 1辺が10cmの正方形ABCDの辺上を、点Pが頂点Aから毎秒2cmでBを通ってCまで動く。点Pが辺BC上にある区間で、出発から x秒後の三角形APDの面積 y を x の式で表し、x=6 のときの面積を求めよ。
            market_ref: 応用問題集レベル。指定区間で動点の図から面積を立式して求める。
          '4':
            band: 発展
            desc: 境界の場合分けを要する面積・逆算を構成して求める
            example: 1辺が12cmの正方形の辺上を点Pが毎秒3cmで動く。三角形の面積が36cm²になる時刻を、動点がどの辺上にあるかで場合分けして考え、そのような時刻 x の値をすべて求めよ。
            market_ref: 公立トップ校〜難関私立。境界の場合分けを要する面積・逆算を構成させる。
        rationale: 各区間で面積を図から立式して求める求値
      graph_table:
        levels:
          '2':
            band: 標準
            desc: 時間と面積の対応を読む
            example: 動点Pが図形の辺上を動くときの、経過時間 x(秒)と三角形の面積 y(cm²)の関係を表すグラフが与えられている。このグラフから、x=4 のときの面積と、面積が最大になる時刻を読み取って答えよ。
            market_ref: 標準問題集レベル。時間と面積の対応をグラフから読み取らせる。
          '3':
            band: 応用
            desc: 区間ごとに式が変わる面積のグラフを正確にかく
            example: 1辺6cmの正方形の辺上を点Pが毎秒2cmで動くとき、x秒後の三角形の面積 y を各区間で立式し、0≦x≦9 の範囲で x と y の関係を表すグラフをかけ。
            market_ref: 応用問題集レベル。区間ごとに式が変わる面積のグラフを正確にかかせる。
        rationale: 時間と面積の対応をグラフ・表で表す
      word_problem:
        levels:
          '3':
            band: 応用
            desc: 誘導あり:区間ごとの面積を立式する小問が連なる融合
            example: 1辺が6cmの正方形ABCDがある。点Pは頂点Aを出発し、毎秒2cmの速さで辺上をB、Cを通ってDまで動く。点Pが出発してから x秒後の三角形APDの面積を y cm²とする。(1)点Pが辺AB上にあるとき(0≦x≦3)、y を x の式で表せ。(2)点Pが辺BC上にあるとき(3≦x≦6)、y を x の式で表せ。(3)y=12 となる x の値をすべて求めよ。
            market_ref: 公立入試の動点大問の定番。誘導つきで区間ごとに立式させる。
          '4':
            band: 発展
            desc: 誘導なし:場合分けとグラフ構成・逆算を自分で行う融合
            example: 1辺が8cmの正方形ABCDの辺上を、点Pが頂点Aから毎秒1cmでB、C、Dの順に動く。点Pが出発してから x秒後の三角形APDの面積を y cm²とするとき、三角形APDの面積が正方形ABCDの面積の4分の1になるときの x の値をすべて求めよ。
            market_ref: 公立トップ校〜難関私立。場合分けと式の構成・逆算を自分で行う腕試し用。
        rationale: 動点の現実場面を関数で立式し面積変化を解く入試活用が主
    notes: 融合セクション（入試対策）。
    section: 中学3年 ／ 入試対策 ／ 入試対策
    title: 動点と面積変化（一次関数・二次関数の利用）
    unit_flag: ok
  exam_l4:
    forms:
      find_value:
        levels:
          '3':
            band: 応用
            desc: 断面/展開に落とし三平方で対角線・高さ・体積を求める
            example: 縦3cm、横4cm、高さ12cmの直方体ABCD-EFGHがある。対角線AGの長さを、断面の直角三角形に三平方の定理を用いて求めよ。
            market_ref: 応用問題集レベル。断面に落として三平方で対角線を求める入試頻出型。
          '4':
            band: 発展
            desc: 非自明な断面/開き方の構想を要する最短距離・体積
            example: 底面が1辺6cmの正方形、高さが4cmの正四角錐がある。この正四角錐の側面上を、底面のある頂点から出発して側面をひとまわりし元の頂点にもどる最短の道のりを、展開図を用いて求めよ。
            market_ref: 難関私立・公立トップ校で頻出。非自明な開き方を構想する最短距離問題。
        rationale: 対角線・高さ・体積・最短距離を三平方で立式して求める求値
      graph_table:
        levels:
          '2':
            band: 標準
            desc: 見取図・断面・展開図を読んで平面に落とす
            example: 1辺が5cmの立方体の見取図が与えられている。頂点AとGを結ぶ対角線AGを含む断面を考えるとき、その断面に現れる直角三角形を平面上にかき出し、各辺の長さを示せ。
            market_ref: 標準問題集レベル。見取図・断面・展開図を読んで平面に落とさせる。
        rationale: 見取図・断面・展開図を読む
      word_problem:
        levels:
          '3':
            band: 応用
            desc: 誘導あり:設定→対角線/高さ/体積/最短の小問が連なる融合
            example: 1辺が6cmの立方体ABCD-EFGHがある。(1)対角線AGの長さを求めよ。(2)三角形AFHの面積を求めよ。(3)頂点Bから辺上を通って頂点Hまで進むときの最短の道のりを、展開図を利用して求めよ。
            market_ref: 公立入試の空間図形大問の定番。誘導つきで対角線・面積・最短が連なる。
          '4':
            band: 発展
            desc: 誘導なし:断面の抜き出し・立体分割の方針を自分で構成
            example: 1辺が4cmの正四面体ABCDがある。点Aから底面BCDに下ろした垂線の足をHとするとき、この正四面体の高さAHと体積を求めよ。必要な断面を自分で取り出して考えてよい。
            market_ref: 公立トップ校〜難関私立で頻出。断面の抜き出しを自分で構想する腕試し用。
        rationale: 空間図形の融合場面を段階的に解く入試活用が主
    notes: 融合セクション（入試対策）。
    section: 中学3年 ／ 入試対策 ／ 入試対策
    title: 三平方の定理と空間図形（対角線・高さ・最短距離）
    unit_flag: ok
  exam_l5:
    forms:
      calculation:
        levels:
          '2':
            band: 標準
            desc: 場合の数から確率を計算処理する
            example: ある試行で起こりうる場合が全部で36通りあり、そのうち条件に当てはまる場合が9通りである。この条件が起こる確率を求めよ。
            market_ref: 標準問題集の計算練習。場合の数から確率を求める処理の基礎ドリル。
        rationale: 樹形図・場合の数から確率を計算処理
      word_problem:
        levels:
          '3':
            band: 応用
            desc: 誘導あり:樹形図/表で全場合を整理し複合事象の確率を求める
            example: 大小2つのさいころを同時に投げる。(1)出る目のすべての場合を樹形図または表で整理せよ。(2)出る目の和が7になる確率を求めよ。(3)出る目の積が偶数になる確率を求めよ。
            market_ref: 公立入試の確率大問の定番。誘導つきで整理から複合事象へ導く。
          '4':
            band: 発展
            desc: 誘導なし:余事象・条件付きなど数え方の方針を自分で構成
            example: 袋の中に赤玉3個、白玉2個が入っている。この袋から同時に2個の玉を取り出すとき、少なくとも1個が赤玉である確率を求めよ。
            market_ref: 公立トップ校〜難関私立。余事象など数え方の方針を自分で選ばせる腕試し用。
        rationale: 複合事象・余事象の現実場面を場合の数から立式して解く入試活用が主
    notes: 融合セクション（入試対策）。
    section: 中学3年 ／ 入試対策 ／ 入試対策
    title: 確率（複合事象・余事象）
    unit_flag: ok
  exam_l6:
    forms:
      find_value:
        levels:
          '3':
            band: 応用
            desc: 相似比から面積比/体積比・実際の量を多段で求める
            example: 相似な2つの立体があり、その相似比が2:3である。小さい方の立体の体積が16cm³であるとき、大きい方の立体の体積を、相似比から体積比を求めて計算せよ。
            market_ref: 応用問題集レベル。相似比から体積比・実際の量を多段で求める入試頻出型。
          '4':
            band: 発展
            desc: 比の合成・逆算を要する非自明な量を構成して求める
            example: 円錐を底面に平行な平面で切り、高さを上から1:2に分けた。上側の小さい円錐と下側の円錐台について、それぞれの体積の比を求めよ。
            market_ref: 難関私立・公立トップ校で頻出。比の合成・逆算を要する量を構成させる。
        rationale: 相似比から面積比・体積比・実際の量を立式して求める求値
      proof:
        levels:
          '3':
            band: 応用
            desc: 融合問題内で相似であることを記述証明する
            example: 三角形ABCで、頂点Aから辺BCに垂線AHを引く。∠BAC=90°であるとき、三角形ABHと三角形CBAが相似であることを証明せよ。
            market_ref: 公立入試の記述証明の定番。融合問題内で相似の成立を記述させる。
        rationale: 融合で相似を根拠づける記述証明
      word_problem:
        levels:
          '3':
            band: 応用
            desc: 誘導あり:相似を示す→面積比/体積比の小問が連なる融合
            example: 三角形ABCで、辺AB上に点D、辺AC上に点Eをとり、DE//BCとする。AD:DB=2:3である。(1)三角形ADEと三角形ABCが相似であることを示せ。(2)三角形ADEと三角形ABCの面積比を求めよ。(3)三角形ADEの面積が8cm²のとき、四角形DBCEの面積を求めよ。
            market_ref: 公立入試の図形大問の定番。誘導つきで相似から面積比へ連なる融合。
          '4':
            band: 発展
            desc: 誘導なし:どの相似を使い比をどう合成するか自分で構成
            example: 台形ABCD(AD//BC、AD=4cm、BC=6cm)の対角線ACとBDの交点をPとする。三角形APDと三角形BPCの面積比を求め、さらに三角形APDの面積が三角形APBの面積の何倍になるかを求めよ。
            market_ref: 公立トップ校〜難関私立。どの相似を使い比をどう合成するか自分で構成する。
        rationale: 相似と面積比・体積比を組み合わせた融合場面を段階的に解く入試活用が主
    notes: 融合セクション（入試対策）。
    section: 中学3年 ／ 入試対策 ／ 入試対策
    title: 相似と面積比・体積比の融合
    unit_flag: ok
  exam_l7:
    forms:
      calculation:
        levels:
          '2':
            band: 標準
            desc: 相対度数・比率の計算処理
            example: ある調査で、標本100人のうち賛成した人が45人であった。賛成した人の相対度数(割合)を求めよ。
            market_ref: 標準問題集の計算練習。相対度数・比率を求める処理の基礎ドリル。
        rationale: 相対度数・比率の計算処理
      find_value:
        levels:
          '3':
            band: 応用
            desc: 四分位数・範囲・推定値を求める
            example: 次の11個のデータについて、第1四分位数・第2四分位数(中央値)・第3四分位数、および四分位範囲を求めよ。データ:12, 15, 18, 20, 22, 25, 28, 30, 33, 35, 40
            market_ref: 応用問題集レベル。四分位数・範囲を求める入試頻出の計算型。
        rationale: 四分位数・推定値を求める
      graph_table:
        levels:
          '2':
            band: 標準
            desc: 箱ひげ図・ヒストグラムを読む
            example: あるクラスの生徒の睡眠時間を表した箱ひげ図が与えられている。この箱ひげ図から、中央値・第1四分位数・第3四分位数・最大値を読み取って答えよ。
            market_ref: 標準問題集レベル。箱ひげ図・ヒストグラムを読み取らせる基礎型。
          '3':
            band: 応用
            desc: データから箱ひげ図をかく・複数分布を比較する
            example: 次のデータは10人のテストの得点である。5, 6, 6, 7, 8, 8, 9, 9, 10, 10。このデータの四分位数を求め、箱ひげ図をかけ。
            market_ref: 応用問題集レベル。データから箱ひげ図をかき分布を比較させる。
        rationale: 箱ひげ図・ヒストグラムを読む/かく
      word_problem:
        levels:
          '3':
            band: 応用
            desc: 誘導あり:データを読み四分位/推定の小問に沿って判断
