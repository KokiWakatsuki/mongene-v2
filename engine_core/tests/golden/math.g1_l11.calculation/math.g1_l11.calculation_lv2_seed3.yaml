  explanation: 'まず、小さい素数でわり切れなくなったら、次に大きい素数を順に試して、わり切れる素数があるか（残った数が素数かどうか）を調べる。（7 ではわり切れない）

    次に、1020 を、わり切れる素数 2 からわっていく。（1020 ÷ 2 = 510、510 ÷ 2 = 255、255 ÷ 3 = 85、85 ÷ 5 = 17）

    最後に、現れた素数を、同じ素数の個数を指数にして、累乗の積の形に表す。（2²×3×5×17）'
