problem_ref: 93c32aabe6ad4327
problem_text: '分速225mでn分間走る。

  進んだ道のりは何kmか、nを使った式で表せ。'
sub_questions:
- answer:
    display: 9n/40 km
    kind: symbolic
    srepr: Mul(Rational(9, 40), Symbol('n'))
  cause_tags: []
  concept_tags:
  - letter_expr.word_problem_unit_convert
  explanation: 'まず、速さに時間をかけて、道のりをmで表す式をつくる。（速さ × 時間 = 道のり(m)）

    次に、1kmは1000mなので、mの式を1000でわるとkmの式になる。（道のり(m) ÷ 1000 = 道のり(km)）

    次に、÷ を、その式の逆数をかけるかけ算に直す。（(225) × (n) × (1/1000)）

    次に、係数どうしをかけ算する。（9/40）

    最後に、同じ文字は指数の和にまとめ、1つの単項式にする。（9n/40）'
  hints:
  - 速さに時間をかけて、道のりをmで表す式をつくる。
  - 1kmは1000mなので、mの式を1000でわるとkmの式になる。
  - ÷ を、その式の逆数をかけるかけ算に直す。
  - 係数どうしをかけ算する。
  label: (1)
  prompt_text: 式に表しなさい。
  solution_steps:
