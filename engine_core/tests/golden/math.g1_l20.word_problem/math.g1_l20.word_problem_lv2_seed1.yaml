  explanation: 'まず、比べられている数量のうち、一方を x を使った式で表す。（4x - 6）

    次に、もう一方の数量も、同じように x を使った式で表す。（x + 22）

    最後に、表した式どうしを、場面が示す大小や等しさのとおりに等号・不等号で結ぶ。（20 < 4x - 6 < x + 22）'
