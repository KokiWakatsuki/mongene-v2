problem_text: '次の方程式を解け。

  4(x + 1) = 5x + 11'
sub_questions:
- answer:
    display: x = -7
    kind: symbolic
    srepr: Integer(-7)
  cause_tags: []
  concept_tags:
  - equation.solve_by_expand_parens
  explanation: 'まず、分配法則を使って、かっこを外す。（4x + 4 = 5x + 11）

    次に、文字の項を左辺に、数の項を右辺に、符号を変えて移項する。（4x - 5x = 11 - 4）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（-x = 7）

    最後に、等式の性質を使い、両辺を x の係数でわる。（x = -7）'
  hints:
  - 分配法則を使って、かっこを外す。
  - 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
  - 両辺の同類項をそれぞれまとめて、ax = b の形にする。
  label: (1)
  prompt_text: 解を求めなさい。
  solution_steps:
  - args: []
    narration: 分配法則を使って、かっこを外す。
    op: expand_parentheses
    result_display: 4x + 4 = 5x + 11
    result_srepr: Integer(-7)
  - args: []
    narration: 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
    op: transpose_terms
    result_display: 4x - 5x = 11 - 4
    result_srepr: Integer(-7)
  - args: []
    narration: 両辺の同類項をそれぞれまとめて、ax = b の形にする。
    op: combine_like_terms
    result_display: -x = 7
    result_srepr: Integer(-7)
  - args: []
    narration: 等式の性質を使い、両辺を x の係数でわる。
    op: divide_both_sides
    result_display: x = -7
    result_srepr: Integer(-7)
