  explanation: 'まず、分配法則を使って、かっこを外す。（2x + 4 = 8x + 22）

    次に、右辺の +8x を左辺に、左辺の +4 を右辺に、符号を変えて移項する。（2x - 8x = 22 - 4）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（-6x = 18）

    最後に、等式の性質を使い、両辺を x の係数 -6 でわる。（x = -3）'
  hints:
