  explanation: 'まず、分母の最小公倍数を両辺にかけて、分母をはらう。（7x - 2 = 54）

    次に、文字の項を左辺に、数の項を右辺に、符号を変えて移項する。（7x = 54 + 2）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（7x = 56）

    最後に、等式の性質を使い、両辺を x の係数でわる。（x = 8）'
  hints:
