  explanation: 'まず、分母の最小公倍数を両辺にかけて、分母をはらう。（3 - 3x = 24）

    次に、文字の項を左辺に、数の項を右辺に、符号を変えて移項する。（-3x = 24 - 3）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（-3x = 21）

    最後に、等式の性質を使い、両辺を x の係数でわる。（x = -7）'
