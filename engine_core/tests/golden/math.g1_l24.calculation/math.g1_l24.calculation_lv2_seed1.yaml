  explanation: 'まず、比例式の性質を使い、外項の積と内項の積が等しい式をつくる。（3 × (x - 1) = 9 × 1）

    次に、分配法則を使って、かっこを外す。（3x - 3 = 9）

    次に、左辺の -3 を右辺に、符号を変えて移項する。（3x = 9 + 3）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（3x = 12）

    最後に、等式の性質を使い、両辺を x の係数 3 でわる。（x = 4）'
  hints:
  - 比例式の性質を使い、外項の積と内項の積が等しい式をつくる。
  - 分配法則を使って、かっこを外す。
