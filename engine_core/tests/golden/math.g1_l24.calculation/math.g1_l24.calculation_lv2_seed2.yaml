    display: x = 6
    kind: symbolic
    srepr: Integer(6)
  cause_tags: []
  concept_tags:
  - equation.solve_proportion_linear
  explanation: 'まず、比例式の性質を使い、外項の積と内項の積が等しい式（たすきがけ）をつくる。（5 × (x - 5) = 5 × 1）

    次に、分配法則を使って、かっこを外す。（5x - 25 = 5）

    次に、文字の項を左辺に、数の項を右辺に、符号を変えて移項する。（5x = 5 + 25）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（5x = 30）

    最後に、等式の性質を使い、両辺を x の係数でわる。（x = 6）'
  hints:
  - 比例式の性質を使い、外項の積と内項の積が等しい式（たすきがけ）をつくる。
  - 分配法則を使って、かっこを外す。
  - 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
  - 両辺の同類項をそれぞれまとめて、ax = b の形にする。
  label: (1)
  prompt_text: 解を求めなさい。
  solution_steps:
