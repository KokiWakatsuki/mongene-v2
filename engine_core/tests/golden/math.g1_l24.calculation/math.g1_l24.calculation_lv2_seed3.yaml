  explanation: 'まず、比例式の性質を使い、外項の積と内項の積が等しい式をつくる。（9 × (x - 1) = 9 × 5）

    次に、分配法則を使って、かっこを外す。（9x - 9 = 45）

    次に、左辺の -9 を右辺に、符号を変えて移項する。（9x = 45 + 9）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（9x = 54）

    最後に、等式の性質を使い、両辺を x の係数 9 でわる。（x = 6）'
  hints:
  - 比例式の性質を使い、外項の積と内項の積が等しい式をつくる。
  - 分配法則を使って、かっこを外す。
  - 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
  - 両辺の同類項をそれぞれまとめて、ax = b の形にする。
