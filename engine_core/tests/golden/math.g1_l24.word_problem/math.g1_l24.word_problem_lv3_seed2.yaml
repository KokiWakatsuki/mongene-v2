problem_ref: 1181bf4f84ba241e
problem_text: '緑・青・黄の玉の個数の比は1:4:3で、全部で160個ある。

  青の玉の個数を求めよ。'
sub_questions:
- answer:
    display: 80個
    kind: symbolic
    srepr: Integer(80)
  cause_tags: []
  concept_tags:
  - equation.word_problem_continued_ratio
  explanation: 'まず、連比の各項をたして、全体がいくつ分にあたるかを求める。（全体は8）

    次に、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（青の個数と全体の個数の比）

    次に、その量を x を使って両辺に表し、方程式をつくる。（4:8 = x:160）

    次に、比例式の性質を使い、外項の積と内項の積が等しい式（たすきがけ）をつくる。（8 × x = 4 × 160）

    最後に、x の係数で両辺をわって、x の値を求める。（x = 80）'
  hints:
  - 連比の各項をたして、全体がいくつ分にあたるかを求める。
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 比例式の性質を使い、外項の積と内項の積が等しい式（たすきがけ）をつくる。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    narration: 連比の各項をたして、全体がいくつ分にあたるかを求める。
    op: sum_ratio_parts
    result_display: 全体は8
    result_srepr: Symbol('x')
  - args: []
    narration: 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
    op: find_equal_relation
    result_display: 青の個数と全体の個数の比
    result_srepr: Symbol('x')
  - args: []
    narration: その量を x を使って両辺に表し、方程式をつくる。
    op: formulate_equation
    result_display: 4:8 = x:160
    result_srepr: Equality(Mul(Integer(8), Symbol('x')), Integer(640))
  - args: []
    narration: 比例式の性質を使い、外項の積と内項の積が等しい式（たすきがけ）をつくる。
    op: cross_multiply
    result_display: 8 × x = 4 × 160
    result_srepr: Integer(80)
  - args: []
    narration: x の係数で両辺をわって、x の値を求める。
    op: solve_proportion
    result_display: x = 80
    result_srepr: Integer(80)
