  explanation: 'まず、分配法則を使って、かっこを外す。（1820 - 90x = 920）

    次に、文字の項を左辺に、数の項を右辺に、符号を変えて移項する。（-90x = 920 - 1820）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（-90x = -900）

    最後に、等式の性質を使い、両辺を x の係数でわる。（x = 10）'
  hints:
  - 分配法則を使って、かっこを外す。
  - 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
  - 両辺の同類項をそれぞれまとめて、ax = b の形にする。
  label: (1)
  prompt_text: 解を求めなさい。
  solution_steps:
  - args: []
    narration: 分配法則を使って、かっこを外す。
    op: expand_parentheses
    result_display: 1820 - 90x = 920
    result_srepr: Integer(10)
  - args: []
    narration: 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
