problem_text: '1個130円のオレンジと1個110円のりんごを合わせて10個買ったところ、代金の合計は1200円だった。

  オレンジを買った個数を x 個とする。

  (1) 代金の関係を、x を使った方程式で表せ。

  (2) オレンジを買った個数を求めよ。'
