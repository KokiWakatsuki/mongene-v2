  explanation: 'まず、分配法則を使って、かっこを外す。（60x + 400 = 580）

    次に、左辺の +400 を右辺に、符号を変えて移項する。（60x = 580 - 400）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（60x = 180）

    最後に、等式の性質を使い、両辺を x の係数 60 でわる。（x = 3）'
  hints:
