  explanation: 'まず、分配法則を使って、かっこを外す。（20x + 1100 = 1200）

    次に、左辺の +1100 を右辺に、符号を変えて移項する。（20x = 1200 - 1100）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（20x = 100）

    最後に、等式の性質を使い、両辺を x の係数 20 でわる。（x = 5）'
