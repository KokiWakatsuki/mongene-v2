problem_text: '1個110円のおにぎりと1個50円のなしを合わせて8個買ったところ、代金の合計は580円だった。

  おにぎりを買った個数を x 個とする。

  (1) 代金の関係を、x を使った方程式で表せ。

  (2) おにぎりを買った個数を求めよ。'
