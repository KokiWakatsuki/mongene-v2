  explanation: 'まず、分配法則を使って、かっこを外す。（10x + 2250 = 2320）

    次に、左辺の +2250 を右辺に、符号を変えて移項する。（10x = 2320 - 2250）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（10x = 70）

    最後に、等式の性質を使い、両辺を x の係数 10 でわる。（x = 7）'
