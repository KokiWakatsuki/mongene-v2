problem_text: '1個160円のかきと1個150円のオレンジを合わせて15個買ったところ、代金の合計は2320円だった。

  かきを買った個数を x 個とする。

  (1) 代金の関係を、x を使った方程式で表せ。

  (2) かきを買った個数を求めよ。'
