  explanation: 'まず、分配法則を使って、かっこを外す。（290x - 2100 = 220）

    次に、左辺の -2100 を右辺に、符号を変えて移項する。（290x = 220 + 2100）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（290x = 2320）

    最後に、等式の性質を使い、両辺を x の係数 290 でわる。（x = 8）'
