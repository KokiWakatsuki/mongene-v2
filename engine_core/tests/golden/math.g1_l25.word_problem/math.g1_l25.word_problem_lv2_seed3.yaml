problem_text: '1個150円のキウイと1個140円のももを合わせて15個買ったところ、キウイの代金はももの代金より220円多かった。

  キウイを買った個数を x 個とする。

  (1) 代金の差の関係を、x を使った方程式で表せ。

  (2) キウイを買った個数を求めよ。'
