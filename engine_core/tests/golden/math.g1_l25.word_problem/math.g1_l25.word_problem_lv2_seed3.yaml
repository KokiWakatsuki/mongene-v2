  concept_tags:
  - equation.word_problem_price_count
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（2つの代金の差）

    次に、その量を x を使って両辺に表し、方程式をつくる。（150x - 140(15 - x) = 220）'
  hints:
