    result_srepr: Symbol('x')
  - args: []
    detail: ''
    narration: その量を x を使って両辺に表し、方程式をつくる。
    op: formulate_equation
    result_display: 110x + 84(x - 4) = 1216
    result_srepr: Equality(Add(Mul(Integer(194), Symbol('x')), Integer(-336)), Integer(1216))
  - args: []
    detail: ''
    narration: 分配法則を使って、かっこを外す。
    op: expand_parentheses
    result_display: 194x - 336 = 1216
    result_srepr: Integer(8)
  - args: []
    detail: 左辺の -336 を右辺に、符号を変えて移項する。
    narration: 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
    op: transpose_terms
    result_display: 194x = 1216 + 336
    result_srepr: Integer(8)
  - args: []
