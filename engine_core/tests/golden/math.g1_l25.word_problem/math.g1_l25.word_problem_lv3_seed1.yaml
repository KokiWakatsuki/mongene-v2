problem_ref: 611fb5fdb7924862
problem_text: '110円切手と84円切手を買った。84円切手は110円切手より4枚少なく、代金の合計は1216円だった。

  110円切手を買った枚数を求めよ。'
sub_questions:
- answer:
    display: 8枚
    kind: symbolic
    srepr: Integer(8)
  cause_tags: []
  concept_tags:
  - equation.word_problem_price_count_diff
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（代金の合計）

    次に、その量を x を使って両辺に表し、方程式をつくる。（110x + 84(x - 4) = 1216）

    次に、分配法則を使って、かっこを外す。（194x - 336 = 1216）

    次に、左辺の -336 を右辺に、符号を変えて移項する。（194x = 1216 + 336）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（194x = 1552）

    最後に、等式の性質を使い、両辺を x の係数 194 でわる。（x = 8）'
  hints:
  - 個数の差が与えられた代金の場面を自分で立式して解く（文章題）
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: ''
    narration: 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
    op: find_equal_relation
