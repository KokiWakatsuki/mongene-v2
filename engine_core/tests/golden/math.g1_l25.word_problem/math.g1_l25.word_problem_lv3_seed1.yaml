problem_ref: 611fb5fdb7924862
problem_text: '合唱団の会費は、大人1人1500円、中学生1人500円である。中学生は大人より3人多く集まり、会費の合計は15500円になった。

  大人の人数を求めよ。'
sub_questions:
- answer:
    display: 7人
    kind: symbolic
    srepr: Integer(7)
  cause_tags: []
  concept_tags:
  - equation.word_problem_price_count_diff
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（会費の合計）

    次に、その量を x を使って両辺に表し、方程式をつくる。（1500x + 500(x + 3) = 15500）

    次に、分配法則を使って、かっこを外す。（2000x + 1500 = 15500）

    次に、左辺の +1500 を右辺に、符号を変えて移項する。（2000x = 15500 - 1500）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（2000x = 14000）

    最後に、等式の性質を使い、両辺を x の係数 2000 でわる。（x = 7）'
  hints:
  - 個数の差が与えられた代金の場面を自分で立式して解く（文章題）
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: ''
    narration: 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
    op: find_equal_relation
    result_display: 会費の合計
    result_srepr: Symbol('x')
  - args: []
    detail: ''
    narration: その量を x を使って両辺に表し、方程式をつくる。
    op: formulate_equation
    result_display: 1500x + 500(x + 3) = 15500
    result_srepr: Equality(Add(Mul(Integer(2000), Symbol('x')), Integer(1500)), Integer(15500))
  - args: []
    detail: ''
    narration: 分配法則を使って、かっこを外す。
    op: expand_parentheses
    result_display: 2000x + 1500 = 15500
    result_srepr: Integer(7)
  - args: []
    detail: 左辺の +1500 を右辺に、符号を変えて移項する。
    narration: 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
    op: transpose_terms
    result_display: 2000x = 15500 - 1500
    result_srepr: Integer(7)
  - args: []
    detail: ''
    narration: 両辺の同類項をそれぞれまとめて、ax = b の形にする。
    op: combine_like_terms
    result_display: 2000x = 14000
    result_srepr: Integer(7)
  - args: []
    detail: 等式の性質を使い、両辺を x の係数 2000 でわる。
    narration: 等式の性質を使い、両辺を x の係数でわる。
    op: divide_both_sides
    result_display: x = 7
    result_srepr: Integer(7)
