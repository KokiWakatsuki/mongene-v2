    narration: その量を x を使って両辺に表し、方程式をつくる。
    op: formulate_equation
    result_display: 200x + 110(x + 2) = 2390
    result_srepr: Equality(Add(Mul(Integer(310), Symbol('x')), Integer(220)), Integer(2390))
  - args: []
