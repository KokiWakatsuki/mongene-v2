problem_ref: 611fb5fdb7924862
problem_text: 'ある店で、1本200円の定規と1本110円のボールペンを買った。ボールペンは定規より2本多く買い、代金の合計は2390円だった。

  定規を買った本数を求めよ。'
sub_questions:
- answer:
    display: 7本
    kind: symbolic
    srepr: Integer(7)
  cause_tags: []
  concept_tags:
  - equation.word_problem_price_count_diff
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（代金の合計）

    次に、その量を x を使って両辺に表し、方程式をつくる。（200x + 110(x + 2) = 2390）

    次に、分配法則を使って、かっこを外す。（310x + 220 = 2390）

    次に、左辺の +220 を右辺に、符号を変えて移項する。（310x = 2390 - 220）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（310x = 2170）

    最後に、等式の性質を使い、両辺を x の係数 310 でわる。（x = 7）'
  hints:
  - 個数の差が与えられた代金の場面を自分で立式して解く（文章題）
  label: (1)
  prompt_text: ''
  solution_steps:
