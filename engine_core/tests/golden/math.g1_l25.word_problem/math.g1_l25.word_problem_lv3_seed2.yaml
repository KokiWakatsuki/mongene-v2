problem_ref: df393f1d58c68005
problem_text: '遊園地の入園料は、大人1人1500円、子ども1人700円である。ある団体が入園したところ、大人は子どもより3人多く、入園料の合計は15500円だった。

  子どもの人数を求めよ。'
sub_questions:
- answer:
    display: 5人
    kind: symbolic
    srepr: Integer(5)
  cause_tags: []
  concept_tags:
  - equation.word_problem_price_count_diff
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（入園料の合計）

    次に、その量を x を使って両辺に表し、方程式をつくる。（700x + 1500(x + 3) = 15500）

    次に、分配法則を使って、かっこを外す。（2200x + 4500 = 15500）

    次に、左辺の +4500 を右辺に、符号を変えて移項する。（2200x = 15500 - 4500）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（2200x = 11000）

    最後に、等式の性質を使い、両辺を x の係数 2200 でわる。（x = 5）'
  hints:
  - 個数の差が与えられた代金の場面を自分で立式して解く（文章題）
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: ''
    narration: 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
    op: find_equal_relation
    result_display: 入園料の合計
    result_srepr: Symbol('x')
  - args: []
    detail: ''
    narration: その量を x を使って両辺に表し、方程式をつくる。
    op: formulate_equation
    result_display: 700x + 1500(x + 3) = 15500
    result_srepr: Equality(Add(Mul(Integer(2200), Symbol('x')), Integer(4500)), Integer(15500))
  - args: []
    detail: ''
    narration: 分配法則を使って、かっこを外す。
    op: expand_parentheses
    result_display: 2200x + 4500 = 15500
    result_srepr: Integer(5)
  - args: []
    detail: 左辺の +4500 を右辺に、符号を変えて移項する。
    narration: 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
    op: transpose_terms
    result_display: 2200x = 15500 - 4500
    result_srepr: Integer(5)
  - args: []
    detail: ''
    narration: 両辺の同類項をそれぞれまとめて、ax = b の形にする。
    op: combine_like_terms
    result_display: 2200x = 11000
    result_srepr: Integer(5)
  - args: []
    detail: 等式の性質を使い、両辺を x の係数 2200 でわる。
    narration: 等式の性質を使い、両辺を x の係数でわる。
    op: divide_both_sides
    result_display: x = 5
    result_srepr: Integer(5)
