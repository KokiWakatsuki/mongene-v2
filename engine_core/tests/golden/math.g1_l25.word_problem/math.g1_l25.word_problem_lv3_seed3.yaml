problem_ref: 64ba06825841066a
problem_text: 'ある店で、1個180円の消しゴムと1冊130円のファイルを買った。ファイルは消しゴムより5冊多く買い、代金の合計は2510円だった。

  消しゴムを買った個数を求めよ。'
sub_questions:
- answer:
    display: 6個
    kind: symbolic
    srepr: Integer(6)
  cause_tags: []
  concept_tags:
  - equation.word_problem_price_count_diff
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（代金の合計）

    次に、その量を x を使って両辺に表し、方程式をつくる。（180x + 130(x + 5) = 2510）

    次に、分配法則を使って、かっこを外す。（310x + 650 = 2510）

    次に、左辺の +650 を右辺に、符号を変えて移項する。（310x = 2510 - 650）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（310x = 1860）

    最後に、等式の性質を使い、両辺を x の係数 310 でわる。（x = 6）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 分配法則を使って、かっこを外す。
  - 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
  - 両辺の同類項をそれぞれまとめて、ax = b の形にする。
  label: (1)
  prompt_text: 答えを求めなさい。
