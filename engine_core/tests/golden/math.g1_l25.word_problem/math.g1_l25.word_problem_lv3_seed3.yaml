problem_ref: 64ba06825841066a
problem_text: 'ある店で、1冊130円のファイルと1枚100円の下じきを買った。下じきはファイルより3枚多く買い、代金の合計は990円だった。

  ファイルを買った冊数を求めよ。'
sub_questions:
- answer:
    display: 3冊
    kind: symbolic
    srepr: Integer(3)
  cause_tags: []
  concept_tags:
  - equation.word_problem_price_count_diff
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（代金の合計）

    次に、その量を x を使って両辺に表し、方程式をつくる。（130x + 100(x + 3) = 990）

    次に、分配法則を使って、かっこを外す。（230x + 300 = 990）

    次に、左辺の +300 を右辺に、符号を変えて移項する。（230x = 990 - 300）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（230x = 690）

    最後に、等式の性質を使い、両辺を x の係数 230 でわる。（x = 3）'
  hints:
  - 個数の差が与えられた代金の場面を自分で立式して解く（文章題）
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: ''
    narration: 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
    op: find_equal_relation
    result_display: 代金の合計
    result_srepr: Symbol('x')
  - args: []
    detail: ''
    narration: その量を x を使って両辺に表し、方程式をつくる。
    op: formulate_equation
    result_display: 130x + 100(x + 3) = 990
    result_srepr: Equality(Add(Mul(Integer(230), Symbol('x')), Integer(300)), Integer(990))
  - args: []
    detail: ''
    narration: 分配法則を使って、かっこを外す。
    op: expand_parentheses
    result_display: 230x + 300 = 990
    result_srepr: Integer(3)
  - args: []
    detail: 左辺の +300 を右辺に、符号を変えて移項する。
    narration: 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
    op: transpose_terms
    result_display: 230x = 990 - 300
    result_srepr: Integer(3)
  - args: []
    detail: ''
    narration: 両辺の同類項をそれぞれまとめて、ax = b の形にする。
    op: combine_like_terms
    result_display: 230x = 690
    result_srepr: Integer(3)
  - args: []
    detail: 等式の性質を使い、両辺を x の係数 230 でわる。
    narration: 等式の性質を使い、両辺を x の係数でわる。
    op: divide_both_sides
    result_display: x = 3
    result_srepr: Integer(3)
