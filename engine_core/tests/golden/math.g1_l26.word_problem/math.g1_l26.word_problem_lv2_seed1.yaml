problem_text: '何人かの子どもに色紙を配る。1人に5枚ずつ配ると2枚余り、1人に6枚ずつ配ると9枚足りない。

  子どもの人数を x 人とする。

  (1) どちらの配り方でも色紙の全部の枚数は同じであることから、x についての方程式をつくれ。

  (2) 子どもの人数を求めよ。'
