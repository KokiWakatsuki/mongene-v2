problem_text: '何人かの部員に色紙を配る。1人に3枚ずつ配ると1枚余り、1人に4枚ずつ配ると13枚足りない。

  部員の人数を x 人とする。

  (1) どちらの配り方でも色紙の全部の枚数は同じであることから、x についての方程式をつくれ。

  (2) 部員の人数を求めよ。'
