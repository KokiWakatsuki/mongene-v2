problem_ref: 571f385ff53e61af
problem_text: '長いすに見学者を座らせる。1脚に3人ずつ座ると5人が座れず、1脚に4人ずつ座ると最後の1脚だけ1人になり、いすはちょうど埋まった。

  見学者の人数を求めよ。'
sub_questions:
- answer:
    display: 29人
    kind: symbolic
    srepr: Integer(29)
  cause_tags: []
  concept_tags:
  - equation.word_problem_seat_shortage
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（見学者の全体の人数）

    次に、その量を x を使って両辺に表し、方程式をつくる。（3x + 5 = 4(x - 1) + 1）

    次に、分配法則を使って、かっこを外す。（3x + 5 = 4x - 3）

    次に、文字の項を左辺に、数の項を右辺に、符号を変えて移項する。（3x - 4x = -3 - 5）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（-x = -8）

    次に、等式の性質を使い、両辺を x の係数でわる。（x = 8）

    最後に、求めた x をもとに、問われている量を計算する。（29人）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 分配法則を使って、かっこを外す。
  - 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
  - 両辺の同類項をそれぞれまとめて、ax = b の形にする。
  - 等式の性質を使い、両辺を x の係数でわる。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    narration: 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
    op: find_equal_relation
    result_display: 見学者の全体の人数
    result_srepr: Symbol('x')
  - args: []
    narration: その量を x を使って両辺に表し、方程式をつくる。
    op: formulate_equation
    result_display: 3x + 5 = 4(x - 1) + 1
    result_srepr: Equality(Add(Mul(Integer(3), Symbol('x')), Integer(5)), Add(Mul(Integer(4), Symbol('x')), Integer(-3)))
  - args: []
    narration: 分配法則を使って、かっこを外す。
    op: expand_parentheses
    result_display: 3x + 5 = 4x - 3
    result_srepr: Integer(8)
  - args: []
    narration: 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
    op: transpose_terms
    result_display: 3x - 4x = -3 - 5
    result_srepr: Integer(8)
  - args: []
    narration: 両辺の同類項をそれぞれまとめて、ax = b の形にする。
    op: combine_like_terms
    result_display: -x = -8
    result_srepr: Integer(8)
  - args: []
    narration: 等式の性質を使い、両辺を x の係数でわる。
    op: divide_both_sides
    result_display: x = 8
    result_srepr: Integer(8)
  - args: []
    narration: 求めた x をもとに、問われている量を計算する。
    op: derive_asked_quantity
    result_display: 29人
    result_srepr: Integer(29)
