problem_ref: 571f385ff53e61af
problem_text: '長いすに見学者を座らせる。1脚に5人ずつ座ると25人が座れず、1脚に6人ずつ座ると最後の1脚だけ5人になり、いすはちょうど埋まった。

  見学者の人数を求めよ。'
sub_questions:
- answer:
    display: 155人
    kind: symbolic
    srepr: Integer(155)
  cause_tags: []
  concept_tags:
  - equation.word_problem_seat_shortage
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（見学者の全体の人数）

    次に、その量を x を使って両辺に表し、方程式をつくる。（5x + 25 = 6(x - 1) + 5）

    次に、分配法則を使って、かっこを外す。（5x + 25 = 6x - 1）

    次に、右辺の +6x を左辺に、左辺の +25 を右辺に、符号を変えて移項する。（5x - 6x = -1 - 25）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（-x = -26）

    次に、等式の性質を使い、両辺を x の係数 -1 でわる。（x = 26）

    最後に、求めた x をもとに、問われている量を計算する。（155人）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 分配法則を使って、かっこを外す。
