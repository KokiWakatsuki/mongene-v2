problem_ref: 7afd7445f9840d4e
problem_text: '長いすに参加者を座らせる。1脚に4人ずつ座ると14人が座れず、1脚に5人ずつ座ると最後の1脚だけ1人になり、いすはちょうど埋まった。

  参加者の人数を求めよ。'
sub_questions:
- answer:
    display: 86人
    kind: symbolic
    srepr: Integer(86)
  cause_tags: []
  concept_tags:
  - equation.word_problem_seat_shortage
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（参加者の全体の人数）

    次に、その量を x を使って両辺に表し、方程式をつくる。（4x + 14 = 5(x - 1) + 1）

    次に、分配法則を使って、かっこを外す。（4x + 14 = 5x - 4）

    次に、文字の項を左辺に、数の項を右辺に、符号を変えて移項する。（4x - 5x = -4 - 14）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（-x = -18）

    次に、等式の性質を使い、両辺を x の係数でわる。（x = 18）

    最後に、求めた x をもとに、問われている量を計算する。（86人）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 分配法則を使って、かっこを外す。
  - 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
  - 両辺の同類項をそれぞれまとめて、ax = b の形にする。
  - 等式の性質を使い、両辺を x の係数でわる。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    narration: 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
    op: find_equal_relation
    result_display: 参加者の全体の人数
    result_srepr: Symbol('x')
  - args: []
    narration: その量を x を使って両辺に表し、方程式をつくる。
    op: formulate_equation
    result_display: 4x + 14 = 5(x - 1) + 1
    result_srepr: Equality(Add(Mul(Integer(4), Symbol('x')), Integer(14)), Add(Mul(Integer(5), Symbol('x')), Integer(-4)))
  - args: []
    narration: 分配法則を使って、かっこを外す。
    op: expand_parentheses
    result_display: 4x + 14 = 5x - 4
    result_srepr: Integer(18)
  - args: []
    narration: 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
    op: transpose_terms
    result_display: 4x - 5x = -4 - 14
    result_srepr: Integer(18)
  - args: []
    narration: 両辺の同類項をそれぞれまとめて、ax = b の形にする。
    op: combine_like_terms
    result_display: -x = -18
    result_srepr: Integer(18)
  - args: []
    narration: 等式の性質を使い、両辺を x の係数でわる。
    op: divide_both_sides
    result_display: x = 18
    result_srepr: Integer(18)
  - args: []
    narration: 求めた x をもとに、問われている量を計算する。
    op: derive_asked_quantity
    result_display: 86人
    result_srepr: Integer(86)
