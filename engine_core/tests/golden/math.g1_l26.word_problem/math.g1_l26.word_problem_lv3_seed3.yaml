problem_ref: 8cba4d42787e3600
problem_text: '長いすに参加者を座らせる。1脚に3人ずつ座ると27人が座れず、1脚に4人ずつ座ると最後の1脚だけ1人になり、いすはちょうど埋まった。

  参加者の人数を求めよ。'
sub_questions:
- answer:
    display: 117人
    kind: symbolic
    srepr: Integer(117)
  cause_tags: []
  concept_tags:
  - equation.word_problem_seat_shortage
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（参加者の全体の人数）

    次に、その量を x を使って両辺に表し、方程式をつくる。（3x + 27 = 4(x - 1) + 1）

    次に、分配法則を使って、かっこを外す。（3x + 27 = 4x - 3）

    次に、右辺の +4x を左辺に、左辺の +27 を右辺に、符号を変えて移項する。（3x - 4x = -3 - 27）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（-x = -30）

    次に、等式の性質を使い、両辺を x の係数 -1 でわる。（x = 30）

    最後に、求めた x をもとに、問われている量を計算する。（117人）'
  hints:
  - 過不足から脚数を求め、問われている人数まで求める（文章題）
