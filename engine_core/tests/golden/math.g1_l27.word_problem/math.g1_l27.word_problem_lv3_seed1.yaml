problem_ref: 631dfdf511aa706a
problem_text: '姉は分速120mで家を出発し、その8分後に妹が分速184mの自転車で同じ道を追いかけた。

  妹が姉に追いつくのは、妹が出発してから何分後か求めよ。'
sub_questions:
- answer:
    display: 15分
    kind: symbolic
    srepr: Integer(15)
  cause_tags: []
  concept_tags:
  - equation.word_problem_catch_up
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（追いついたときに2人が進んだ道のり）

    次に、その量を x を使って両辺に表し、方程式をつくる。（120(x + 8) = 184x）

    次に、分配法則を使って、かっこを外す。（120x + 960 = 184x）

    最後に、文字の項を左辺に、数の項を右辺に移項し、両辺を整理して解く。（x = 15）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 分配法則を使って、かっこを外す。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    narration: 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
    op: find_equal_relation
    result_display: 追いついたときに2人が進んだ道のり
    result_srepr: Symbol('x')
  - args: []
    narration: その量を x を使って両辺に表し、方程式をつくる。
    op: formulate_equation
    result_display: 120(x + 8) = 184x
    result_srepr: Equality(Add(Mul(Integer(120), Symbol('x')), Integer(960)), Mul(Integer(184), Symbol('x')))
  - args: []
    narration: 分配法則を使って、かっこを外す。
    op: expand_parentheses
    result_display: 120x + 960 = 184x
    result_srepr: Integer(15)
  - args: []
    narration: 文字の項を左辺に、数の項を右辺に移項し、両辺を整理して解く。
    op: transpose_and_solve
    result_display: x = 15
    result_srepr: Integer(15)
