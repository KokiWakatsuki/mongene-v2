problem_ref: a25a6c92cfdb676a
problem_text: '姉は分速60mで家を出発し、その12分後に妹が分速300mの自転車で同じ道を追いかけた。

  妹が姉に追いつくのは、妹が出発してから何分後か求めよ。'
sub_questions:
- answer:
    display: 3分
    kind: symbolic
    srepr: Integer(3)
  cause_tags: []
  concept_tags:
  - equation.word_problem_catch_up
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（追いついたときに2人が進んだ道のり）

    次に、その量を x を使って両辺に表し、方程式をつくる。（60(x + 12) = 300x）

    次に、分配法則を使って、かっこを外す。（60x + 720 = 300x）

    次に、右辺の +300x を左辺に、左辺の +720 を右辺に、符号を変えて移項する。（60x - 300x = -720）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（-240x = -720）

    最後に、等式の性質を使い、両辺を x の係数 -240 でわる。（x = 3）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 分配法則を使って、かっこを外す。
  - 文字の項を左辺に、数の項を右辺に、符号を変えて移項する。
  - 両辺の同類項をそれぞれまとめて、ax = b の形にする。
  label: (1)
  prompt_text: 答えを求めなさい。
