problem_ref: cc87d31da0773870
problem_text: 'Aさんは分速100mで家を出発し、その3分後にBさんが分速160mの自転車で同じ道を追いかけた。

  BさんがAさんに追いつくのは、Bさんが出発してから何分後か求めよ。'
sub_questions:
- answer:
    display: 5分
    kind: symbolic
    srepr: Integer(5)
  cause_tags: []
  concept_tags:
  - equation.word_problem_catch_up
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（追いついたときに2人が進んだ道のり）

    次に、その量を x を使って両辺に表し、方程式をつくる。（100(x + 3) = 160x）

    次に、分配法則を使って、かっこを外す。（100x + 300 = 160x）

    次に、右辺の +160x を左辺に、左辺の +300 を右辺に、符号を変えて移項する。（100x - 160x = -300）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（-60x = -300）

    最後に、等式の性質を使い、両辺を x の係数 -60 でわる。（x = 5）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 分配法則を使って、かっこを外す。
  label: (1)
  prompt_text: ''
