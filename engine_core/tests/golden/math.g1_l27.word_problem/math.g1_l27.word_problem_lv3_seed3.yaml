problem_ref: dd53d8252b31ef8a
problem_text: '兄は分速90mで家を出発し、その6分後に弟が分速180mの自転車で同じ道を追いかけた。

  弟が兄に追いつくのは、弟が出発してから何分後か求めよ。'
sub_questions:
- answer:
    display: 6分
    kind: symbolic
    srepr: Integer(6)
  cause_tags: []
  concept_tags:
  - equation.word_problem_catch_up
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（追いついたときに2人が進んだ道のり）

    次に、その量を x を使って両辺に表し、方程式をつくる。（90(x + 6) = 180x）

    次に、分配法則を使って、かっこを外す。（90x + 540 = 180x）

    次に、右辺の +180x を左辺に、左辺の +540 を右辺に、符号を変えて移項する。（90x - 180x = -540）

    次に、両辺の同類項をそれぞれまとめて、ax = b の形にする。（-90x = -540）

    最後に、等式の性質を使い、両辺を x の係数 -90 でわる。（x = 6）'
  hints:
  - 道のりが等しい関係から追いつく時間を求める（文章題）
  label: (1)
  prompt_text: ''
  solution_steps:
