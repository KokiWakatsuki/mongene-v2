- answer:
    display: 片道の道のりは5km、往復の平均の速さは時速5km
    kind: symbolic
    srepr: Tuple(Integer(5), Integer(5))
  cause_tags: []
  concept_tags:
  - equation.word_problem_round_trip_average_speed
  explanation: 'まず、片道の道のりを x とおき、行きにかかる時間と帰りにかかる時間の和が往復の時間に等しいという方程式をつくる。（x/3 + x/15 = 2）

    次に、両辺に分母の最小公倍数をかけて、分数のない形に直す。（5x + 1x = 30）

    次に、方程式を解いて片道の道のりを求める。（x = 5）

    次に、片道の道のりを二倍して、往復の道のり全体を求める。（10km）

    最後に、往復の道のりを往復にかかった時間でわって、往復の平均の速さを求める。（片道の道のりは5km、往復の平均の速さは時速5km）'
