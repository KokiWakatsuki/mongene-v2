problem_ref: 843f9cc05764e7f5
problem_text: '学校から体育館まで、行きは時速3km、帰りは同じ道を時速15kmの速さで進んだところ、往復にかかった時間は2時間だった。

  学校から体育館までの片道の道のりと、往復の平均の速さを求めよ。'
