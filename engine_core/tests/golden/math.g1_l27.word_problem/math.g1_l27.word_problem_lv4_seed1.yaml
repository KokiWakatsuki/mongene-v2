problem_ref: 843f9cc05764e7f5
problem_text: '町からとなり町まで、行きは自転車で時速10km、帰りは同じ道を自転車で時速15kmの速さで進んだところ、往復にかかった時間は5時間だった。

  町からとなり町までの片道の道のりと、往復の平均の速さを求めよ。'
sub_questions:
- answer:
    display: 片道の道のりは30km、往復の平均の速さは時速12km
    kind: symbolic
    srepr: Tuple(Integer(30), Integer(12))
  cause_tags: []
  concept_tags:
  - equation.word_problem_round_trip_average_speed
  explanation: 'まず、片道の道のりを x とおき、行きにかかる時間と帰りにかかる時間の和が往復の時間に等しいという方程式をつくる。（x/10 + x/15 = 5）

    次に、両辺に分母の最小公倍数をかけて、分数のない形に直す。（3x + 2x = 150）

    次に、方程式を解いて片道の道のりを求める。（x = 30）

    次に、片道の道のりを二倍して、往復の道のり全体を求める。（60km）

    最後に、往復の道のりを往復にかかった時間でわって、往復の平均の速さを求める。（片道の道のりは30km、往復の平均の速さは時速12km）'
  hints:
