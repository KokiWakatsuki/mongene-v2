problem_ref: fa3336e5b9d204c6
problem_text: '川ぞいの道を分速100mで歩く生徒がいる。歩いた時間と進んだ道のりは比例する。

  この生徒が10分で歩く道のりは何kmか。式を立てて求めよ。'
sub_questions:
- answer:
    display: 1km
    kind: symbolic
    srepr: Integer(1)
  cause_tags: []
  concept_tags:
  - direct_proportion.word_problem_unit_convert
  explanation: 'まず、比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。（a = 100 / 1）

    次に、求めた比例定数を使って、比例の式を組み立てる。（y = 100x）

    次に、比例定数と x の値を、比例の式 y=ax の x にあてはめる。（y = 100 × 10）

    次に、かけ算を計算して y の値を求める。（y = 1000）

    最後に、道のりの単位を m から km に直す。（1km）'
  hints:
  - 比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
  - 求めた比例定数を使って、比例の式を組み立てる。
  - 比例定数と x の値を、比例の式 y=ax の x にあてはめる。
  - かけ算を計算して y の値を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args:
    - '1'
    - '100'
    narration: 比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
    op: substitute_point
    result_display: a = 100 / 1
    result_srepr: Integer(100)
  - args:
    - '100'
    narration: 求めた比例定数を使って、比例の式を組み立てる。
    op: form_expression
    result_display: y = 100x
    result_srepr: Mul(Integer(100), Symbol('x'))
  - args:
    - '100'
    - '10'
    narration: 比例定数と x の値を、比例の式 y=ax の x にあてはめる。
    op: substitute_x
    result_display: y = 100 × 10
    result_srepr: Integer(1000)
  - args:
    - y = 100 × 10
    narration: かけ算を計算して y の値を求める。
    op: evaluate
    result_display: y = 1000
    result_srepr: Integer(1000)
  - args: []
    narration: 道のりの単位を m から km に直す。
    op: convert_unit
    result_display: 1km
    result_srepr: Integer(1)
