problem_ref: 16f08b876678ef8a
problem_text: '学校のまわりを分速100mで歩く男の子がいる。歩いた時間と進んだ道のりは比例する。

  この男の子が50分で歩く道のりは何kmか。式を立てて求めよ。'
sub_questions:
- answer:
    display: 5km
    kind: symbolic
    srepr: Integer(5)
  cause_tags: []
  concept_tags:
  - direct_proportion.word_problem_unit_convert
  explanation: 'まず、比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。（a = 100 / 1）

    次に、比例定数は a = 100 なので、y = ax にあてはめる。（y = 100x）

    次に、比例定数と x の値を、比例の式 y=ax の x にあてはめる。（y = 100 × 50）

    次に、かけ算を計算して y の値を求める。（y = 5000）

    最後に、道のりの単位を m から km に直す。（5km）'
  hints:
  - 単位変換を含む比例の場面を自分で立式し、値を求める(誘導なし)
  label: (1)
  prompt_text: ''
  solution_steps:
  - args:
    - '1'
    - '100'
    detail: ''
    narration: 比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
    op: substitute_point
    result_display: a = 100 / 1
    result_srepr: Integer(100)
  - args:
    - '100'
    detail: 比例定数は a = 100 なので、y = ax にあてはめる。
    narration: 求めた比例定数を使って、比例の式を組み立てる。
    op: form_expression
    result_display: y = 100x
    result_srepr: Mul(Integer(100), Symbol('x'))
  - args:
    - '100'
    - '50'
    detail: ''
    narration: 比例定数と x の値を、比例の式 y=ax の x にあてはめる。
    op: substitute_x
    result_display: y = 100 × 50
    result_srepr: Integer(5000)
  - args:
    - y = 100 × 50
    detail: ''
    narration: かけ算を計算して y の値を求める。
    op: evaluate
    result_display: y = 5000
    result_srepr: Integer(5000)
  - args: []
    detail: ''
    narration: 道のりの単位を m から km に直す。
    op: convert_unit
    result_display: 5km
    result_srepr: Integer(5)
