problem_ref: ba2890f6ccb43871
problem_text: '町の中を分速50mで歩く女の子がいる。歩いた時間と進んだ道のりは比例する。

  この女の子が100分で歩く道のりは何kmか。式を立てて求めよ。'
sub_questions:
- answer:
    display: 5km
    kind: symbolic
    srepr: Integer(5)
  cause_tags: []
  concept_tags:
  - direct_proportion.word_problem_unit_convert
  explanation: 'まず、比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。（a = 50 / 1）

    次に、求めた比例定数を使って、比例の式を組み立てる。（y = 50x）

    次に、比例定数と x の値を、比例の式 y=ax の x にあてはめる。（y = 50 × 100）

    次に、かけ算を計算して y の値を求める。（y = 5000）

    最後に、道のりの単位を m から km に直す。（5km）'
  hints:
  - 比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
  - 求めた比例定数を使って、比例の式を組み立てる。
  - 比例定数と x の値を、比例の式 y=ax の x にあてはめる。
  - かけ算を計算して y の値を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args:
    - '1'
    - '50'
    narration: 比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
    op: substitute_point
    result_display: a = 50 / 1
    result_srepr: Integer(50)
  - args:
    - '50'
    narration: 求めた比例定数を使って、比例の式を組み立てる。
    op: form_expression
    result_display: y = 50x
    result_srepr: Mul(Integer(50), Symbol('x'))
  - args:
    - '50'
    - '100'
    narration: 比例定数と x の値を、比例の式 y=ax の x にあてはめる。
    op: substitute_x
    result_display: y = 50 × 100
    result_srepr: Integer(5000)
  - args:
    - y = 50 × 100
    narration: かけ算を計算して y の値を求める。
    op: evaluate
    result_display: y = 5000
    result_srepr: Integer(5000)
  - args: []
    narration: 道のりの単位を m から km に直す。
    op: convert_unit
    result_display: 5km
    result_srepr: Integer(5)
