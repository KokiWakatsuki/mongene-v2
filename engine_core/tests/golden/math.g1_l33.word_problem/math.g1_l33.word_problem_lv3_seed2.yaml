problem_ref: 71811d5739bef977
problem_text: 'ある資料の印刷を6人ですると2日かかる。この資料の印刷をする人数x人と、かかる日数y日は反比例する。

  この資料の印刷を3人でするとき、何日で終わるか。式を立てて求めよ。'
sub_questions:
- answer:
    display: 4日
    kind: symbolic
    srepr: Integer(4)
  cause_tags: []
  concept_tags:
  - inverse_proportion.word_problem_worker_days
  explanation: 'まず、反比例の式 y=a/x に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。（a = 6 × 2）

    次に、比例定数は a = 12 なので、y = a/x にあてはめる。（y = 12/x）

    次に、比例定数と x の値を、反比例の式 y=a/x の x にあてはめる。（y = 12 / 3）

    最後に、わり算を計算して y の値を求める。（y = 4）'
  hints:
  - 反比例の式 y=a/x に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
  - 求めた比例定数を使って、反比例の式を組み立てる。
  label: (1)
  prompt_text: ''
  solution_steps:
  - args:
    - '6'
    - '2'
    detail: ''
    narration: 反比例の式 y=a/x に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
    op: substitute_point
    result_display: a = 6 × 2
    result_srepr: Integer(12)
  - args:
    - '12'
    detail: 比例定数は a = 12 なので、y = a/x にあてはめる。
    narration: 求めた比例定数を使って、反比例の式を組み立てる。
    op: form_expression
    result_display: y = 12/x
    result_srepr: Mul(Integer(12), Pow(Symbol('x'), Integer(-1)))
  - args:
    - '12'
    - '3'
    detail: ''
    narration: 比例定数と x の値を、反比例の式 y=a/x の x にあてはめる。
    op: substitute_x
    result_display: y = 12 / 3
    result_srepr: Integer(4)
  - args:
    - y = 12 / 3
    detail: ''
    narration: わり算を計算して y の値を求める。
    op: evaluate
    result_display: y = 4
    result_srepr: Integer(4)
