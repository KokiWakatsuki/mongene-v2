problem_ref: 274a90dc1e92382a
problem_text: 'ある仕事を6人ですると5日かかる。この仕事をする人数x人と、かかる日数y日は反比例する。

  この仕事を10人でするとき、何日で終わるか。式を立てて求めよ。'
sub_questions:
- answer:
    display: 3日
    kind: symbolic
    srepr: Integer(3)
  cause_tags: []
  concept_tags:
  - inverse_proportion.word_problem_worker_days
  explanation: 'まず、反比例の式 y=a/x に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。（a = 6 × 5）

    次に、比例定数は a = 30 なので、y = a/x にあてはめる。（y = 30/x）

    次に、比例定数と x の値を、反比例の式 y=a/x の x にあてはめる。（y = 30 / 10）

    最後に、わり算を計算して y の値を求める。（y = 3）'
  hints:
  - 複数条件の反比例の場面(人数と日数)を自分で立式し、値を求める(誘導なし)
  label: (1)
  prompt_text: ''
  solution_steps:
  - args:
    - '6'
    - '5'
    detail: ''
    narration: 反比例の式 y=a/x に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
    op: substitute_point
    result_display: a = 6 × 5
    result_srepr: Integer(30)
  - args:
    - '30'
    detail: 比例定数は a = 30 なので、y = a/x にあてはめる。
    narration: 求めた比例定数を使って、反比例の式を組み立てる。
    op: form_expression
    result_display: y = 30/x
    result_srepr: Mul(Integer(30), Pow(Symbol('x'), Integer(-1)))
  - args:
    - '30'
    - '10'
    detail: ''
    narration: 比例定数と x の値を、反比例の式 y=a/x の x にあてはめる。
    op: substitute_x
    result_display: y = 30 / 10
    result_srepr: Integer(3)
  - args:
    - y = 30 / 10
    detail: ''
    narration: わり算を計算して y の値を求める。
    op: evaluate
    result_display: y = 3
    result_srepr: Integer(3)
