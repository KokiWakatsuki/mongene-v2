  explanation: 'まず、反比例の式 y=a/x に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。（a = 15 × 16）

    次に、比例定数は a = 240 なので、y = a/x にあてはめる。（y = 240/x）'
  hints:
