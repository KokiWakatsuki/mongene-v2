problem_text: '毎分15Lずつ水を入れると、満水になるまで16分かかる水そうがある。

  この水そうに毎分xLずつ水を入れるとき、満水になるまでy分かかるとする。

  (1) yはxに比例するか、反比例するかを答え、yをxの式で表せ。

  (2) 毎分2Lずつ水を入れると、何分で満水になるか求めよ。'
