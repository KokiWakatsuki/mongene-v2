problem_text: '空の水そうに、毎分12Lの割合で水を入れる。

  水を入れ始めてからx分後の、水そうの中の水の量をyLとする。

  (1) yはxに比例するか、反比例するかを答え、yをxの式で表せ。

  (2) 水を入れ始めてから15分後の水の量は何Lか求めよ。'
