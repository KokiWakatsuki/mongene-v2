problem_ref: 1f218cc2ff89b878
problem_text: '面積が240cm²の長方形の花だんがある。縦を x cm、横を y cm とする。

  y を x の式で表せ。また、縦が6cm以上20cm以下であるとき、横はどんな範囲になるか求めよ。'
sub_questions:
- answer:
    display: y = 240/x、横は 12cm 以上 40cm 以下
    kind: symbolic
    srepr: Tuple(Mul(Integer(240), Pow(Symbol('x'), Integer(-1))), Integer(12), Integer(40))
  cause_tags: []
  concept_tags:
  - proportion.word_problem_max_area_and_times
  explanation: 'まず、面積が決まっているとき、縦と横の積は一定なので、横は縦に反比例する。その式に表す。（y = 240/x）

    次に、縦の変域の両端を式にあてはめて、それぞれのときの横の長さを求める。（40cm と 12cm）

    最後に、反比例では、縦が大きくなるほど横は小さくなる。だから縦が最小のときの横が最大、縦が最大のときの横が最小になる。その順に並べて変域として答える。（12cm 以上 40cm 以下）'
  hints:
  - 動点の面積が最大になる範囲を調べ、指定の面積になる時刻をすべて求める
  label: (1)
  prompt_text: ''
