problem_ref: 8941808618de029a
problem_text: '1辺が36cmの正方形KLMNの周上を、点VがKを出発してK→L→M→Nの順に毎秒1cmの速さでNまで動く。点VがKを出発してからx秒後の三角形KVNの面積をy cm²とする。

  面積が最大になるのはxがどの範囲にあるときかとそのときの面積、および面積が342cm²になるときの x の値をすべて求めよ。'
sub_questions:
- answer:
    display: 面積が最大になるのは x が 36 から 72 までのときで、そのときの面積は 648cm²。指定された面積になるのは 19秒後と89秒後
    kind: symbolic
    srepr: Tuple(Integer(648), Integer(36), Integer(72), Integer(19), Integer(89))
  cause_tags: []
  concept_tags:
  - proportion.word_problem_max_area_and_times
  explanation: 'まず、動く点がどの辺の上にあるかで時間を区間に分け、面積が増える区間・変わらない区間・減る区間を見つける。（0〜36秒、36〜72秒、72〜108秒）

    次に、面積が変わらない区間で最大になるので、その面積の値と、区間の始まりと終わりの時刻を求める。（648cm²）

    次に、増えていく区間の式を方程式とみて、指定された面積になる時刻を求める。（19秒後）

    次に、減っていく区間の式を方程式とみて、指定された面積になる時刻を求める。（89秒後）

    最後に、求めた時刻がそれぞれの区間の中にあることを確かめ、答えを並べる。（面積が最大になるのは x が 36 から 72 までのときで、そのときの面積は 648cm²。指定された面積になるのは 19秒後と89秒後）'
  hints:
