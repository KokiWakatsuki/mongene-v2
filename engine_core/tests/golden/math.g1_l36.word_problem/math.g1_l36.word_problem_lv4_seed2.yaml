problem_ref: aa88e35dd00e42b7
problem_text: '1辺が20cmの正方形RSTUの周上を、点ZがRを出発してR→S→T→Uの順に毎秒1cmの速さでUまで動く。点ZがRを出発してからx秒後の三角形RZUの面積をy cm²とする。

  面積が最大になるのはxがどの範囲にあるときかとそのときの面積、および面積が90cm²になるときの x の値をすべて求めよ。'
sub_questions:
- answer:
    display: 面積が最大になるのは x が 20 から 40 までのときで、そのときの面積は 200cm²。指定された面積になるのは 9秒後と51秒後
    kind: symbolic
    srepr: Tuple(Integer(200), Integer(20), Integer(40), Integer(9), Integer(51))
  cause_tags: []
  concept_tags:
  - proportion.word_problem_max_area_and_times
  explanation: 'まず、動く点がどの辺の上にあるかで時間を区間に分け、面積が増える区間・変わらない区間・減る区間を見つける。（0〜20秒、20〜40秒、40〜60秒）

    次に、面積が変わらない区間で最大になるので、その面積の値と、区間の始まりと終わりの時刻を求める。（200cm²）

    次に、増えていく区間の式を方程式とみて、指定された面積になる時刻を求める。（9秒後）

    次に、減っていく区間の式を方程式とみて、指定された面積になる時刻を求める。（51秒後）

    最後に、求めた時刻がそれぞれの区間の中にあることを確かめ、答えを並べる。（面積が最大になるのは x が 20 から 40 までのときで、そのときの面積は 200cm²。指定された面積になるのは 9秒後と51秒後）'
  hints:
