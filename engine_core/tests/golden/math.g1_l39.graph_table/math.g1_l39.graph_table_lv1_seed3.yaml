  explanation: 'まず、回転の中心と、反時計回りの回転角を読み取る。（中心 (1, 1)、180°）

    次に、もとの図形の各頂点を、回転の中心のまわりに同じ角だけ回転させる。（(4, 0)、(-2, 4)、(-3, 3)）'
  hints:
  - 回転の中心と、反時計回りの回転角を読み取る。
