problem_text: 座標平面上に合同な三角形ABCと三角形A'B'C'があり、A(3, 0)、B(6, -5)、C(-4, 0)、A'(5, 0)、B'(0, -3)、C'(5, 7)である。三角形A'B'C'は三角形ABCをある点を中心として回転移動したものである。回転の中心を点Zとするとき、対応する点を結んでできる線分の垂直二等分線を使って点Zの位置を求め、その座標を答えよ。
