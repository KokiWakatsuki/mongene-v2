problem_text: 下の図のように、半径3cm、中心角30°のおうぎ形がある。このおうぎ形の弧の長さを求めよ。ただし円周率はπとする。
sub_questions:
- answer:
    display: π/2
    kind: symbolic
    srepr: Mul(Rational(1, 2), pi)
  cause_tags: []
  concept_tags:
  - sector.arc_length_or_area
  explanation: 'まず、おうぎ形の半径と中心角の大きさを読み取る。（半径 3、中心角 30°）

    次に、弧の長さの公式にあてはめて、2π × 3 × 30/360 を計算する。（π/2）'
  hints:
  - 半径と中心角からおうぎ形の弧の長さ/面積を求める
  label: (1)
