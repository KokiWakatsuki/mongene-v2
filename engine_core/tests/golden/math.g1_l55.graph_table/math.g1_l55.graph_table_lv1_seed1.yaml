    display: 20m以上24m未満の階級の度数は5人、度数が最も大きい階級は16m以上20m未満
    kind: symbolic
    srepr: Tuple(Integer(5), Integer(16))
  cause_tags: []
  concept_tags:
  - frequency_polygon.read_chart
  explanation: 'まず、対象の階級の位置をグラフの横軸で見つけ、その高さを縦軸の目盛で読み取る。（20m以上24m未満の階級の度数は5）

    次に、グラフでいちばん高くなっている階級を探してその範囲を横軸から読み取り、先に読んだ度数とあわせて答える。（20m以上24m未満の階級の度数は5人、度数が最も大きい階級は16m以上20m未満）'
  hints:
  - 度数折れ線から階級の度数と最頻の階級を読み取る
