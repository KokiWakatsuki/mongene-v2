problem_text: ある中学校の33人のハンドボール投げの記録を調べ、8mから4mずつの階級に分けて度数折れ線に表した。20m以上24m未満の階級の度数を答えよ。また、度数がもっとも大きい階級を答えよ。
sub_questions:
