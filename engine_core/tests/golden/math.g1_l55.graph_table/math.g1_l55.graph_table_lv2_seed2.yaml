problem_text: 次の度数分布表は、ある中学校の生徒20人の身長を調べたものである。各階級の相対度数を求めて表を完成させ、この分布の度数折れ線をかけ。〔階級と度数：150cm以上155cm未満…2人、155cm以上160cm未満…4人、160cm以上165cm未満…8人、165cm以上170cm未満…4人、170cm以上175cm未満…2人〕。
