  explanation: 'まず、すべての階級の度数を足し合わせ、総度数を求める。（度数の合計は25）

    次に、階級ごとに、その階級の度数を総度数でわって相対度数を求め、表に書き入れる。（0.08、0.2、0.4、0.2、0.12）

    最後に、各階級の階級値の位置にその階級の度数の高さで点を打ち、順に線分で結ぶ（両端は度数のない階級まで下ろす）。（度数折れ線）'
  hints:
  - すべての階級の度数を足し合わせ、総度数を求める。
