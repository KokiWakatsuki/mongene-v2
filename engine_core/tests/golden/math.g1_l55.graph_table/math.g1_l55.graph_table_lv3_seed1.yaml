problem_text: A校の生徒28人とB校の生徒25人の身長を調べ、140cmから5cmずつの同じ階級に分けて、2つの度数折れ線を1つのグラフに重ねて表した（A校は実線、B校は破線）。150cm以上155cm未満の階級について、それぞれの相対度数をグラフから読み取って求め、この階級の割合が大きいのはどちらの学校か答えよ。
sub_questions:
- answer:
    display: 'A: 0.25、B: 0.12（Aのほうが大きい）'
    kind: symbolic
    srepr: Tuple(Rational(1, 4), Rational(3, 25))
  cause_tags: []
  concept_tags:
  - frequency_polygon.compare_groups_by_relative_frequency
  explanation: 'まず、それぞれの集団について、対象の階級の度数を総度数でわり、相対度数を求める。（A 0.25、B 0.12）

    次に、求めた相対度数どうしを比べ、値が大きいほうを答える。（A: 0.25、B: 0.12（Aのほうが大きい））'
  hints:
