problem_text: A校の生徒30人とB校の生徒32人の握力の記録を調べ、20kgから5kgずつの同じ階級に分けて、2つの度数折れ線を1つのグラフに重ねて表した（A校は実線、B校は破線）。25kg以上30kg未満の階級について、それぞれの相対度数をグラフから読み取って求め、この階級の割合が大きいのはどちらの学校か答えよ。
sub_questions:
