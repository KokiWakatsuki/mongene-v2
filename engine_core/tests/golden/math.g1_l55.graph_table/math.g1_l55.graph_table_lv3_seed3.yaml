    display: 'A: 0.3、B: 0.1875（Aのほうが大きい）'
    kind: symbolic
    srepr: Tuple(Rational(3, 10), Rational(3, 16))
  cause_tags: []
  concept_tags:
  - frequency_polygon.compare_groups_by_relative_frequency
  explanation: 'まず、それぞれの集団について、対象の階級の度数を総度数でわり、相対度数を求める。（A 0.3、B 0.1875）

    次に、求めた相対度数どうしを比べ、値が大きいほうを答える。（A: 0.3、B: 0.1875（Aのほうが大きい））'
  hints:
  - それぞれの集団について、対象の階級の度数を総度数でわり、相対度数を求める。
