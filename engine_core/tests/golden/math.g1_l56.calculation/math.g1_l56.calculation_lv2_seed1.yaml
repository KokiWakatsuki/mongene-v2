problem_text: 生徒40人の睡眠時間を調べた度数分布表がある。7時間未満の生徒までの累積相対度数を求めよ。また、睡眠時間が7時間以上の生徒は全体の何％か求めよ。〔階級と度数：6時間以上7時間未満…4人、7時間以上8時間未満…11人、8時間以上9時間未満…18人、9時間以上10時間未満…7人〕。
