  explanation: 'まず、はじめの式を x について解く。（x = 9 - 2y）

    次に、もう一方の式の x に 9 - 2y を代入すると、3(9 - 2y) + 2y = 19 になる。（-4y = -8）

    次に、両辺を y の係数 -4 でわる。（y = 2）

    最後に、求めた y を x = … の式に代入して x を求め、解の組にまとめる。（x = 5、y = 2）'
  hints:
  - 連立方程式を代入法で解く（そのまま代入／変形して代入）
  label: (1)
  prompt_text: ''
  solution_steps:
  - args:
    - x + 2y = 9
    detail: ''
    narration: はじめの式を x について解く。
    op: isolate_variable
    result_display: x = 9 - 2y
    result_srepr: Equality(Symbol('x'), Add(Integer(9), Mul(Integer(-1), Integer(2), Symbol('y'))))
  - args:
    - x = 9 - 2y
    - 3x + 2y = 19
    detail: もう一方の式の x に 9 - 2y を代入すると、3(9 - 2y) + 2y = 19 になる。
    narration: これをもう一方の式に代入して y だけの方程式にする。
    op: substitute_expr
    result_display: -4y = -8
    result_srepr: Equality(Mul(Integer(-1), Integer(4), Symbol('y')), Integer(-8))
  - args:
    - -4y = -8
    detail: 両辺を y の係数 -4 でわる。
    narration: y の値を求める。
    op: solve_for_y
    result_display: y = 2
    result_srepr: Integer(2)
  - args:
    - '2'
    detail: ''
    narration: 求めた y を x = … の式に代入して x を求め、解の組にまとめる。
    op: back_substitute
    result_display: x = 5、y = 2
    result_srepr: Integer(5)
