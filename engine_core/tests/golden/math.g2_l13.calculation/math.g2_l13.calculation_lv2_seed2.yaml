problem_text: '次の連立方程式を代入法で解け。

  x - 3y = -8 , -3x + 3y = 0'
sub_questions:
- answer:
    display: (4, 4)
    kind: symbolic
    srepr: Tuple(Integer(4), Integer(4))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.solve_by_substitution
  explanation: 'まず、はじめの式を x について解く。（x = 3y - 8）

    次に、これをもう一方の式に代入して y だけの方程式にする。（-6y = -24）

    次に、y の値を求める。（y = 4）

    最後に、求めた y を x = … の式に代入して x を求める。（x = 4）'
  hints:
  - はじめの式を x について解く。
  - これをもう一方の式に代入して y だけの方程式にする。
  - y の値を求める。
  label: (1)
  prompt_text: 解を求めなさい。
  solution_steps:
  - args:
    - x - 3y = -8
    narration: はじめの式を x について解く。
    op: isolate_variable
    result_display: x = 3y - 8
    result_srepr: Equality(Symbol('x'), Add(Mul(Integer(3), Symbol('y')), Integer(-8)))
  - args:
    - x = 3y - 8
    - -3x + 3y = 0
    narration: これをもう一方の式に代入して y だけの方程式にする。
    op: substitute_expr
    result_display: -6y = -24
    result_srepr: Equality(Mul(Integer(-1), Integer(6), Symbol('y')), Integer(-24))
  - args:
    - -6y = -24
    narration: y の値を求める。
    op: solve_for_y
    result_display: y = 4
    result_srepr: Integer(4)
  - args:
    - '4'
    narration: 求めた y を x = … の式に代入して x を求める。
    op: back_substitute
    result_display: x = 4
    result_srepr: Integer(4)
