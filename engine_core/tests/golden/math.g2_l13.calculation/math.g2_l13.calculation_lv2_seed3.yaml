problem_text: '次の連立方程式を代入法で解け。

  x + 3y = 0 , -3x + 3y = 12'
sub_questions:
- answer:
    display: (-3, 1)
    kind: symbolic
    srepr: Tuple(Integer(-3), Integer(1))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.solve_by_substitution
  explanation: 'まず、はじめの式を x について解く。（x = -3y）

    次に、もう一方の式の x に -3y を代入すると、-3(-3y) + 3y = 12 になる。（12y = 12）

    次に、両辺を y の係数 12 でわる。（y = 1）

    最後に、求めた y を x = … の式に代入して x を求め、解の組にまとめる。（x = -3、y = 1）'
  hints:
  - はじめの式を x について解く。
  - これをもう一方の式に代入して y だけの方程式にする。
  label: (1)
  prompt_text: ''
  solution_steps:
  - args:
    - x + 3y = 0
    detail: ''
    narration: はじめの式を x について解く。
    op: isolate_variable
    result_display: x = -3y
    result_srepr: Equality(Symbol('x'), Mul(Integer(-1), Integer(3), Symbol('y')))
  - args:
    - x = -3y
    - -3x + 3y = 12
    detail: もう一方の式の x に -3y を代入すると、-3(-3y) + 3y = 12 になる。
    narration: これをもう一方の式に代入して y だけの方程式にする。
    op: substitute_expr
    result_display: 12y = 12
    result_srepr: Equality(Mul(Integer(12), Symbol('y')), Integer(12))
  - args:
    - 12y = 12
    detail: 両辺を y の係数 12 でわる。
    narration: y の値を求める。
    op: solve_for_y
    result_display: y = 1
    result_srepr: Integer(1)
  - args:
    - '1'
    detail: ''
    narration: 求めた y を x = … の式に代入して x を求め、解の組にまとめる。
    op: back_substitute
    result_display: x = -3、y = 1
    result_srepr: Integer(-3)
