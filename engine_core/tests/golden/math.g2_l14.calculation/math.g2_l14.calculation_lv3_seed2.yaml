  explanation: 'まず、分母を払って整数の連立方程式に直す。（-3x + 2y = -2 , 2x - 3y = 3）

    次に、はじめの式の両辺を 3 倍、もう一方の式の両辺を 2 倍して y の係数の大きさをそろえ、辺々を足す。整理すると -5x = 0 になるので、両辺を -5 でわる。（x = 0）

    最後に、求めた x をもとの式に代入して y を求める。（y = -1）'
