  explanation: 'まず、A=B=C を A=C と B=C の2つの式に分けて連立方程式にする。（3x - 2y = -1 , -2x + 3y = 4）

    次に、はじめの式の両辺を 3 倍、もう一方の式の両辺を 2 倍して y の係数の大きさをそろえ、辺々を足す。整理すると 5x = 5 になるので、両辺を 5 でわる。（x = 1）

    最後に、求めた x をもとの式に代入して y を求める。（y = 2）'
