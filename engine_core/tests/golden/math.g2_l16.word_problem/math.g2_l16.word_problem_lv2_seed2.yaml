  explanation: 'まず、おにぎりの個数を x、グレープフルーツの個数を y とおく。（x, y）

    次に、個数の関係から、x と y の和が合わせて買った個数に等しいという式をつくる。（x + y = 7）

    最後に、代金の関係から、それぞれの単価と個数の積の和が代金の合計に等しいという式をつくる。（90x + 150y = 810）'
