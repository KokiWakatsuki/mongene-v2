problem_text: '1個90円のなしと1個150円のかきを合わせて7個買ったところ、代金の合計は810円だった。なしの個数を x 個、かきの個数を y 個とする。

  (1) 個数と代金の関係を表す2つの式をつくれ。

  (2) なしとかきをそれぞれ何個買ったか求めよ。'
