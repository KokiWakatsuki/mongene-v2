problem_text: '1個90円のおにぎりと1個150円のグレープフルーツを合わせて7個買ったところ、代金の合計は810円だった。おにぎりの個数を x 個、グレープフルーツの個数を y 個とする。

  (1) 個数と代金の関係を表す2つの式をつくれ。

  (2) おにぎりとグレープフルーツをそれぞれ何個買ったか求めよ。'
