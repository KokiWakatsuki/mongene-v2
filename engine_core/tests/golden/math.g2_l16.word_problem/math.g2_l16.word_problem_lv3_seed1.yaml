problem_ref: eb9de69781330def
problem_text: 'コップを何個かと皿を何枚か買った。コップ1個は80円、皿1枚は150円で、買った数はコップより皿のほうが2枚多く、代金の合計は990円だった。

  コップと皿を買った数をそれぞれ求めよ。'
sub_questions:
- answer:
    display: コップは3個、皿は5枚
    kind: symbolic
    srepr: Tuple(Integer(3), Integer(5))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_price_count_diff
  explanation: 'まず、コップの数を x 個、皿の数を y 枚とおく。（x, y）

    次に、買った数の関係に着目して、1つめの式をつくる。（y = x + 2）

    次に、代金の合計の関係に着目して、2つめの式をつくる。（80x + 150y = 990）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 3）

    最後に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = 5）'
  hints:
  - コップの数を x 個、皿の数を y 枚とおく。
  - 買った数の関係に着目して、1つめの式をつくる。
  - 代金の合計の関係に着目して、2つめの式をつくる。
  - 係数をそろえて一方の文字を消去し、残った文字を求める。
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: ''
    narration: コップの数を x 個、皿の数を y 枚とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    detail: ''
    narration: 買った数の関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: y = x + 2
    result_srepr: Equality(Add(Mul(Integer(-1), Symbol('x')), Symbol('y')), Integer(2))
  - args: []
    detail: ''
    narration: 代金の合計の関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 80x + 150y = 990
    result_srepr: Equality(Add(Mul(Integer(80), Symbol('x')), Mul(Integer(150), Symbol('y'))), Integer(990))
  - args:
    - Eq(-x + y, 2)
    - Eq(80*x + 150*y, 990)
    detail: ''
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 3
    result_srepr: Equality(Symbol('x'), Integer(3))
  - args:
    - '3'
    detail: ''
    narration: 求めた値をもとの式に代入し、もう一方の文字を求める。
    op: back_substitute
    result_display: y = 5
    result_srepr: Integer(5)
