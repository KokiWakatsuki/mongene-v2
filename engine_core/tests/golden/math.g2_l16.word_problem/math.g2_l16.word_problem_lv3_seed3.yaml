problem_ref: 07af1875033011da
problem_text: 'おかしを何個かとジュースを何本か買った。おかし1個は140円、ジュース1本は70円で、買った数はおかしよりジュースのほうが3本多く、代金の合計は1470円だった。

  おかしとジュースを買った数をそれぞれ求めよ。'
sub_questions:
- answer:
    display: おかしは6個、ジュースは9本
    kind: symbolic
    srepr: Tuple(Integer(6), Integer(9))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_price_count_diff
  explanation: 'まず、おかしの数を x 個、ジュースの数を y 本とおく。（x, y）

    次に、買った数の関係に着目して、1つめの式をつくる。（y = x + 3）

    次に、代金の合計の関係に着目して、2つめの式をつくる。（140x + 70y = 1470）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 6）

    最後に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = 9）'
  hints:
  - おかしの数を x 個、ジュースの数を y 本とおく。
  - 買った数の関係に着目して、1つめの式をつくる。
  - 代金の合計の関係に着目して、2つめの式をつくる。
  - 係数をそろえて一方の文字を消去し、残った文字を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    narration: おかしの数を x 個、ジュースの数を y 本とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    narration: 買った数の関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: y = x + 3
    result_srepr: Equality(Add(Mul(Integer(-1), Symbol('x')), Symbol('y')), Integer(3))
  - args: []
    narration: 代金の合計の関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 140x + 70y = 1470
    result_srepr: Equality(Add(Mul(Integer(140), Symbol('x')), Mul(Integer(70), Symbol('y'))), Integer(1470))
  - args:
    - Eq(-x + y, 3)
    - Eq(140*x + 70*y, 1470)
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 6
    result_srepr: Equality(Symbol('x'), Integer(6))
  - args:
    - '6'
    narration: 求めた値をもとの式に代入し、もう一方の文字を求める。
    op: back_substitute
    result_display: y = 9
    result_srepr: Integer(9)
