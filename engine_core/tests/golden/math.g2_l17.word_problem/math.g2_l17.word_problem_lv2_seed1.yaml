problem_text: '家から駅を通って港まで行った。家から駅までは時速4kmで歩き、駅から港までは時速12kmの自転車で進んだところ、全体で20km進むのに3時間かかった。

  歩いた道のりを x km、自転車で進んだ道のりを y km とする。

  (1) 道のりと時間の関係を表す2つの式をつくれ。

  (2) 歩いた道のりと自転車で進んだ道のりをそれぞれ求めよ。'
