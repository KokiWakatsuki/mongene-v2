problem_ref: 9a2d2aecc14fb6c2
problem_text: 'A町からB町を通ってC町まで行った。A町からB町までは時速5kmで歩き、B町からC町までは時速10kmの自転車で進んだところ、全体で35km進むのに5時間かかった。

  歩いた道のりを x km、自転車で進んだ道のりを y km とする。

  (1) 道のりと時間の関係を表す2つの式をつくれ。

  (2) 歩いた道のりと自転車で進んだ道のりをそれぞれ求めよ。'
sub_questions:
- answer:
    display: x + y = 35、x/5 + y/10 = 5
    kind: symbolic
    srepr: Tuple(Equality(Add(Symbol('x'), Symbol('y')), Integer(35)), Equality(Add(Mul(Rational(1, 5), Symbol('x')), Mul(Rational(1, 10), Symbol('y'))), Integer(5)))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_distance_time
  explanation: 'まず、歩いた道のりを x km、自転車で進んだ道のりを y km とおく。（x, y）

    次に、道のりの関係に着目して、1つめの式をつくる。（x + y = 35）

    最後に、かかった時間の関係に着目して、2つめの式をつくる。（x/5 + y/10 = 5）'
  hints:
  - 歩いた道のりを x km、自転車で進んだ道のりを y km とおく。
  - 道のりの関係に着目して、1つめの式をつくる。
  label: (1)
  prompt_text: 式に表しなさい。
  solution_steps:
