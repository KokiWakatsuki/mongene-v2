problem_text: '駅から市役所を通って美術館まで行った。駅から市役所までは時速5kmで歩き、市役所から美術館までは時速12kmの自転車で進んだところ、全体で34km進むのに4時間かかった。

  歩いた道のりを x km、自転車で進んだ道のりを y km とする。

  (1) 道のりと時間の関係を表す2つの式をつくれ。

  (2) 歩いた道のりと自転車で進んだ道のりをそれぞれ求めよ。'
