problem_ref: 7a2fec4dc55e885f
problem_text: '宿から展望台まで行くのに、初めは分速80mで歩き、途中から分速150mで走ったところ、宿から展望台まで2640mの道のりを26分で着いた。

  歩いた道のりと走った道のりはそれぞれ何mか求めよ。'
sub_questions:
- answer:
    display: 歩いた道のりは1440m、走った道のりは1200m
    kind: symbolic
    srepr: Tuple(Integer(1440), Integer(1200))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_time_split
  explanation: 'まず、歩いた時間を x 分、走った時間を y 分とおく。（x, y）

    次に、かかった時間の関係に着目して、1つめの式をつくる。（x + y = 26）

    次に、道のりの関係に着目して、2つめの式をつくる。（80x + 150y = 2640）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 18）

    次に、求めた値をもとの式に代入し、もう一方の文字を求めて交点の座標にする。（交点 (18, 8)）

    最後に、求めた x、y をもとに、問われている量を計算して答える。（歩いた道のりは1440m、走った道のりは1200m）'
  hints:
  - 歩いた時間を x 分、走った時間を y 分とおく。
  - かかった時間の関係に着目して、1つめの式をつくる。
  - 道のりの関係に着目して、2つめの式をつくる。
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: ''
    narration: 歩いた時間を x 分、走った時間を y 分とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    detail: ''
    narration: かかった時間の関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: x + y = 26
    result_srepr: Equality(Add(Symbol('x'), Symbol('y')), Integer(26))
  - args: []
    detail: ''
    narration: 道のりの関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 80x + 150y = 2640
    result_srepr: Equality(Add(Mul(Integer(80), Symbol('x')), Mul(Integer(150), Symbol('y'))), Integer(2640))
  - args:
    - Eq(x + y, 26)
    - Eq(80*x + 150*y, 2640)
    detail: ''
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 18
    result_srepr: Equality(Symbol('x'), Integer(18))
  - args:
    - '18'
    detail: ''
    narration: 求めた値をもとの式に代入し、もう一方の文字を求めて交点の座標にする。
    op: back_substitute
    result_display: 交点 (18, 8)
    result_srepr: Integer(8)
  - args: []
