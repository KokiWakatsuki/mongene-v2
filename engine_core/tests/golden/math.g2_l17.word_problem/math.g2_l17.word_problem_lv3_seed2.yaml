problem_ref: 4b5067e6383b157e
problem_text: '家から体育館まで行くのに、初めは分速70mで歩き、途中から分速200mで走ったところ、家から体育館まで1910mの道のりを18分で着いた。

  歩いた道のりと走った道のりはそれぞれ何mか求めよ。'
sub_questions:
- answer:
    display: 歩いた道のりは910m、走った道のりは1000m
    kind: symbolic
    srepr: Tuple(Integer(910), Integer(1000))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_time_split
  explanation: 'まず、歩いた時間を x 分、走った時間を y 分とおく。（x, y）

    次に、かかった時間の関係に着目して、1つめの式をつくる。（x + y = 18）

    次に、道のりの関係に着目して、2つめの式をつくる。（70x + 200y = 1910）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 13）

    次に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = 5）

    最後に、求めた x、y をもとに、問われている量を計算する。（歩いた道のりは910m、走った道のりは1000m）'
  hints:
  - 歩いた時間を x 分、走った時間を y 分とおく。
  - かかった時間の関係に着目して、1つめの式をつくる。
  - 道のりの関係に着目して、2つめの式をつくる。
  - 係数をそろえて一方の文字を消去し、残った文字を求める。
  - 求めた値をもとの式に代入し、もう一方の文字を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    narration: 歩いた時間を x 分、走った時間を y 分とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    narration: かかった時間の関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: x + y = 18
    result_srepr: Equality(Add(Symbol('x'), Symbol('y')), Integer(18))
  - args: []
    narration: 道のりの関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 70x + 200y = 1910
    result_srepr: Equality(Add(Mul(Integer(70), Symbol('x')), Mul(Integer(200), Symbol('y'))), Integer(1910))
  - args:
    - Eq(x + y, 18)
    - Eq(70*x + 200*y, 1910)
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 13
    result_srepr: Equality(Symbol('x'), Integer(13))
  - args:
    - '13'
    narration: 求めた値をもとの式に代入し、もう一方の文字を求める。
    op: back_substitute
    result_display: y = 5
    result_srepr: Integer(5)
  - args: []
    narration: 求めた x、y をもとに、問われている量を計算する。
    op: derive_asked_quantities
    result_display: 歩いた道のりは910m、走った道のりは1000m
    result_srepr: Tuple(Integer(910), Integer(1000))
