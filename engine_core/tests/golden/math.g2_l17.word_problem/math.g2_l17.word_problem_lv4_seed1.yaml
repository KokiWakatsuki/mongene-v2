problem_ref: 36c4b68dc1ba3665
problem_text: '1周600mの池のまわりを、AさんとBさんが同じ地点から同時に出発する。反対向きに進むと3分後に出会い、同じ向きに進むとAさんがBさんに10分後に追いつく。

  AさんとBさんの速さはそれぞれ分速何mか求めよ。'
sub_questions:
- answer:
    display: Aさんの速さは分速130m、Bさんの速さは分速70m
    kind: symbolic
    srepr: Tuple(Integer(130), Integer(70))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_lap_meet_catch_up
  explanation: 'まず、Aさんの速さを分速 x m、Bさんの速さを分速 y m とおく。（x, y）

    次に、反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。（3(x + y) = 600）

    次に、同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。（10(x - y) = 600）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 130）

    次に、求めた値をもとの式に代入し、もう一方の文字を求めて交点の座標にする。（交点 (130, 70)）

    最後に、求めた値を、問題が聞いている量のことばに直して答える。（Aさんの速さは分速130m、Bさんの速さは分速70m）'
  hints:
  - Aさんの速さを分速 x m、Bさんの速さを分速 y m とおく。
  - 反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。
  - 同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。
  label: (1)
  prompt_text: ''
