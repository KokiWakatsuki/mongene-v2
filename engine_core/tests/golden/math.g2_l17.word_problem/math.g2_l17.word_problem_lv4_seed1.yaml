problem_ref: 46ff0271ab9b5cb7
problem_text: '1周2400mの池のまわりを、AさんとBさんが同じ地点から同時に出発する。反対向きに進むと12分後に出会い、同じ向きに進むとAさんがBさんに48分後に追いつく。

  AさんとBさんの速さはそれぞれ分速何mか求めよ。'
sub_questions:
- answer:
    display: Aさんの速さは分速125m、Bさんの速さは分速75m
    kind: symbolic
    srepr: Tuple(Integer(125), Integer(75))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_lap_meet_catch_up
  explanation: 'まず、Aさんの速さを分速 x m、Bさんの速さを分速 y m とおく。（x, y）

    次に、反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。（12(x + y) = 2400）

    次に、同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。（48(x - y) = 2400）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 125）

    最後に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = 75）'
  hints:
  - Aさんの速さを分速 x m、Bさんの速さを分速 y m とおく。
  - 反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。
  - 同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。
  - 係数をそろえて一方の文字を消去し、残った文字を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    detail: ''
    narration: Aさんの速さを分速 x m、Bさんの速さを分速 y m とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    detail: ''
    narration: 反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: 12(x + y) = 2400
    result_srepr: Equality(Add(Mul(Integer(12), Symbol('x')), Mul(Integer(12), Symbol('y'))), Integer(2400))
  - args: []
    detail: ''
    narration: 同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 48(x - y) = 2400
    result_srepr: Equality(Add(Mul(Integer(48), Symbol('x')), Mul(Integer(-1), Integer(48), Symbol('y'))), Integer(2400))
  - args:
    - Eq(12*x + 12*y, 2400)
    - Eq(48*x - 48*y, 2400)
    detail: ''
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 125
    result_srepr: Equality(Symbol('x'), Integer(125))
  - args:
    - '125'
    detail: ''
    narration: 求めた値をもとの式に代入し、もう一方の文字を求める。
    op: back_substitute
    result_display: y = 75
    result_srepr: Integer(75)
