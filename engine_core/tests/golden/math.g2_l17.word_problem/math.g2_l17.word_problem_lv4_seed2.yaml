problem_ref: c01c83297db32a6f
problem_text: '1周1200mの池のまわりを、兄と弟が同じ地点から同時に出発する。反対向きに進むと5分後に出会い、同じ向きに進むと兄が弟に10分後に追いつく。

  兄と弟の速さはそれぞれ分速何mか求めよ。'
sub_questions:
- answer:
    display: 兄の速さは分速180m、弟の速さは分速60m
    kind: symbolic
    srepr: Tuple(Integer(180), Integer(60))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_lap_meet_catch_up
  explanation: 'まず、兄の速さを分速 x m、弟の速さを分速 y m とおく。（x, y）

    次に、反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。（5(x + y) = 1200）

    次に、同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。（10(x - y) = 1200）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 180）

    次に、求めた値をもとの式に代入し、もう一方の文字の値も求める。（x = 180、y = 60）

    最後に、求めた値を、問題が聞いている量のことばに直して答える。（兄の速さは分速180m、弟の速さは分速60m）'
  hints:
  - 出会いと追いつきから速さの和と差の2式を立てて解く（文章題）
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: ''
    narration: 兄の速さを分速 x m、弟の速さを分速 y m とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    detail: ''
    narration: 反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: 5(x + y) = 1200
    result_srepr: Equality(Add(Mul(Integer(5), Symbol('x')), Mul(Integer(5), Symbol('y'))), Integer(1200))
  - args: []
    detail: ''
    narration: 同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 10(x - y) = 1200
    result_srepr: Equality(Add(Mul(Integer(10), Symbol('x')), Mul(Integer(-1), Integer(10), Symbol('y'))), Integer(1200))
  - args:
    - Eq(5*x + 5*y, 1200)
    - Eq(10*x - 10*y, 1200)
    detail: ''
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 180
    result_srepr: Equality(Symbol('x'), Integer(180))
  - args:
    - '180'
    detail: ''
    narration: 求めた値をもとの式に代入し、もう一方の文字の値も求める。
    op: back_substitute
    result_display: x = 180、y = 60
    result_srepr: Integer(60)
  - args: []
    detail: ''
    narration: 求めた値を、問題が聞いている量のことばに直して答える。
    op: state_answer_in_context
    result_display: 兄の速さは分速180m、弟の速さは分速60m
    result_srepr: Tuple(Integer(180), Integer(60))
