problem_ref: 2fd3dc5dd25eb335
problem_text: '1周1080mの池のまわりを、はるとさんとゆいさんが同じ地点から同時に出発する。反対向きに進むと9分後に出会い、同じ向きに進むとはるとさんがゆいさんに54分後に追いつく。

  はるとさんとゆいさんの速さはそれぞれ分速何mか求めよ。'
sub_questions:
- answer:
    display: はるとさんの速さは分速70m、ゆいさんの速さは分速50m
    kind: symbolic
    srepr: Tuple(Integer(70), Integer(50))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_lap_meet_catch_up
  explanation: 'まず、はるとさんの速さを分速 x m、ゆいさんの速さを分速 y m とおく。（x, y）

    次に、反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。（9(x + y) = 1080）

    次に、同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。（54(x - y) = 1080）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 70）

    次に、求めた値をもとの式に代入し、もう一方の文字の値も求める。（x = 70、y = 50）

    最後に、求めた値を、問題が聞いている量のことばに直して答える。（はるとさんの速さは分速70m、ゆいさんの速さは分速50m）'
  hints:
  - 出会いと追いつきから速さの和と差の2式を立てて解く（文章題）
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: ''
    narration: はるとさんの速さを分速 x m、ゆいさんの速さを分速 y m とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    detail: ''
    narration: 反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: 9(x + y) = 1080
    result_srepr: Equality(Add(Mul(Integer(9), Symbol('x')), Mul(Integer(9), Symbol('y'))), Integer(1080))
  - args: []
    detail: ''
    narration: 同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 54(x - y) = 1080
    result_srepr: Equality(Add(Mul(Integer(54), Symbol('x')), Mul(Integer(-1), Integer(54), Symbol('y'))), Integer(1080))
  - args:
    - Eq(9*x + 9*y, 1080)
    - Eq(54*x - 54*y, 1080)
    detail: ''
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 70
    result_srepr: Equality(Symbol('x'), Integer(70))
  - args:
    - '70'
    detail: ''
    narration: 求めた値をもとの式に代入し、もう一方の文字の値も求める。
    op: back_substitute
    result_display: x = 70、y = 50
    result_srepr: Integer(50)
  - args: []
    detail: ''
    narration: 求めた値を、問題が聞いている量のことばに直して答える。
    op: state_answer_in_context
    result_display: はるとさんの速さは分速70m、ゆいさんの速さは分速50m
    result_srepr: Tuple(Integer(70), Integer(50))
