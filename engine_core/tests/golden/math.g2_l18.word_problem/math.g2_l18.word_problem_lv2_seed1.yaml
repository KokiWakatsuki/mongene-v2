problem_text: 'ある中学校の昨年の生徒数は男女合わせて700人だった。今年は昨年に比べて男子が12%増え、女子が4%減ったので、全体で28人増えた。

  昨年の男子の人数を x 人、女子の人数を y 人とする。

  (1) 人数と増減の関係を表す2つの式をつくれ。

  (2) 昨年の男子と女子の人数をそれぞれ求めよ。'
