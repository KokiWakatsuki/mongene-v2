problem_text: '12%の食塩水と18%の食塩水を混ぜて、13%の食塩水を600gつくりたい。

  それぞれ何gずつ混ぜればよいか求めよ。'
sub_questions:
- answer:
    display: 12%の食塩水は500g、18%の食塩水は100g
    kind: symbolic
    srepr: Tuple(Integer(500), Integer(100))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_salt_mixture
  explanation: 'まず、12%の食塩水を x g、18%の食塩水を y g とおく。（x, y）

    次に、食塩水の重さの関係に着目して、1つめの式をつくる。（x + y = 600）

    次に、溶けている食塩の重さの関係に着目して、2つめの式をつくる。（12x/100 + 18y/100 = 78）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 500）

    次に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = 100）

    最後に、求めた値を、問題が聞いている量のことばに直して答える。（12%の食塩水は500g、18%の食塩水は100g）'
  hints:
