problem_text: '5%の食塩水と14%の食塩水を混ぜて、9%の食塩水を900gつくりたい。

  それぞれ何gずつ混ぜればよいか求めよ。'
sub_questions:
- answer:
    display: 5%の食塩水は500g、14%の食塩水は400g
    kind: symbolic
    srepr: Tuple(Integer(500), Integer(400))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_salt_mixture
  explanation: 'まず、5%の食塩水を x g、14%の食塩水を y g とおく。（x, y）

    次に、食塩水の重さの関係に着目して、1つめの式をつくる。（x + y = 900）

    次に、溶けている食塩の重さの関係に着目して、2つめの式をつくる。（5x/100 + 14y/100 = 81）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 500）

    次に、求めた値をもとの式に代入し、もう一方の文字を求めて交点の座標にする。（交点 (500, 400)）

    最後に、求めた値を、問題が聞いている量のことばに直して答える。（5%の食塩水は500g、14%の食塩水は400g）'
  hints:
  - 5%の食塩水を x g、14%の食塩水を y g とおく。
  - 食塩水の重さの関係に着目して、1つめの式をつくる。
  - 溶けている食塩の重さの関係に着目して、2つめの式をつくる。
