problem_ref: ff6199456eedf66a
problem_text: '容器Aには濃度のわからない食塩水が500g、容器Bには別の濃度の食塩水が300g入っている。AとBをすべて混ぜると15%の食塩水になり、Aの食塩水100gとBの食塩水100gだけを混ぜると14%の食塩水になる。

  容器A、Bの食塩水の濃度をそれぞれ求めよ。'
sub_questions:
- answer:
    display: 容器Aの濃度は18%、容器Bの濃度は10%
    kind: symbolic
    srepr: Tuple(Integer(18), Integer(10))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_two_containers
  explanation: 'まず、容器Aの濃度を x %、容器Bの濃度を y %とおく。（x, y）

    次に、すべて混ぜたときの食塩の重さの関係に着目して、1つめの式をつくる。（500x/100 + 300y/100 = 120）

    次に、100gずつ混ぜたときの食塩の重さの関係に着目して、2つめの式をつくる。（100x/100 + 100y/100 = 14×200/100）

    次に、2つめの式は両辺を100でわれるので、簡単な形に直す。（x + y = 28）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 18）

    最後に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = 10）'
  hints:
  - 容器Aの濃度を x %、容器Bの濃度を y %とおく。
  - すべて混ぜたときの食塩の重さの関係に着目して、1つめの式をつくる。
  - 100gずつ混ぜたときの食塩の重さの関係に着目して、2つめの式をつくる。
  - 2つめの式は両辺を100でわれるので、簡単な形に直す。
  - 係数をそろえて一方の文字を消去し、残った文字を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    narration: 容器Aの濃度を x %、容器Bの濃度を y %とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    narration: すべて混ぜたときの食塩の重さの関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: 500x/100 + 300y/100 = 120
    result_srepr: Equality(Add(Mul(Integer(5), Symbol('x')), Mul(Integer(3), Symbol('y'))), Integer(120))
  - args: []
    narration: 100gずつ混ぜたときの食塩の重さの関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 100x/100 + 100y/100 = 14×200/100
    result_srepr: Equality(Add(Symbol('x'), Symbol('y')), Integer(28))
  - args: []
    narration: 2つめの式は両辺を100でわれるので、簡単な形に直す。
    op: reduce_equation
    result_display: x + y = 28
    result_srepr: Equality(Add(Symbol('x'), Symbol('y')), Integer(28))
  - args:
    - Eq(5*x + 3*y, 120)
    - Eq(x + y, 28)
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 18
    result_srepr: Equality(Symbol('x'), Integer(18))
  - args:
    - '18'
    narration: 求めた値をもとの式に代入し、もう一方の文字を求める。
    op: back_substitute
    result_display: y = 10
    result_srepr: Integer(10)
