problem_ref: 4d7a98ed44e88b75
problem_text: '容器Aには濃度のわからない食塩水が450g、容器Bには別の濃度の食塩水が350g入っている。AとBをすべて混ぜると10%の食塩水になり、Aの食塩水100gとBの食塩水100gだけを混ぜると11%の食塩水になる。

  容器A、Bの食塩水の濃度をそれぞれ求めよ。'
sub_questions:
- answer:
    display: 容器Aの濃度は3%、容器Bの濃度は19%
    kind: symbolic
    srepr: Tuple(Integer(3), Integer(19))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_two_containers
  explanation: 'まず、容器Aの濃度を x %、容器Bの濃度を y %とおく。（x, y）

    次に、すべて混ぜたときの食塩の重さの関係に着目して、1つめの式をつくる。（450x/100 + 350y/100 = 80）

    次に、100gずつ混ぜたときの食塩の重さの関係に着目して、2つめの式をつくる。（100x/100 + 100y/100 = 11×200/100）

    次に、2つめの式は両辺を100でわれるので、簡単な形に直す。（x + y = 22）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 3）

    最後に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = 19）'
  hints:
  - 容器Aの濃度を x %、容器Bの濃度を y %とおく。
  - すべて混ぜたときの食塩の重さの関係に着目して、1つめの式をつくる。
  - 100gずつ混ぜたときの食塩の重さの関係に着目して、2つめの式をつくる。
  - 2つめの式は両辺を100でわれるので、簡単な形に直す。
  - 係数をそろえて一方の文字を消去し、残った文字を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    detail: ''
    narration: 容器Aの濃度を x %、容器Bの濃度を y %とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    detail: ''
    narration: すべて混ぜたときの食塩の重さの関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: 450x/100 + 350y/100 = 80
    result_srepr: Equality(Add(Mul(Rational(9, 2), Symbol('x')), Mul(Rational(7, 2), Symbol('y'))), Integer(80))
  - args: []
    detail: ''
    narration: 100gずつ混ぜたときの食塩の重さの関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 100x/100 + 100y/100 = 11×200/100
    result_srepr: Equality(Add(Symbol('x'), Symbol('y')), Integer(22))
  - args: []
    detail: ''
    narration: 2つめの式は両辺を100でわれるので、簡単な形に直す。
    op: reduce_equation
    result_display: x + y = 22
    result_srepr: Equality(Add(Symbol('x'), Symbol('y')), Integer(22))
  - args:
    - Eq(9*x/2 + 7*y/2, 80)
    - Eq(x + y, 22)
    detail: ''
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 3
    result_srepr: Equality(Symbol('x'), Integer(3))
  - args:
    - '3'
    detail: ''
    narration: 求めた値をもとの式に代入し、もう一方の文字を求める。
    op: back_substitute
    result_display: y = 19
    result_srepr: Integer(19)
