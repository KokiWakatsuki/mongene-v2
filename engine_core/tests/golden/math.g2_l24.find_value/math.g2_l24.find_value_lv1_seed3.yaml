  explanation: 'まず、傾きと通る点の座標を y = ax + b に代入する。（-1 × -3 + b = 0）

    次に、代入した式を b について解き、切片を求める。（切片 b = -3）

    最後に、傾きと切片から一次関数の式を組み立てる。（y = -x - 3）'
