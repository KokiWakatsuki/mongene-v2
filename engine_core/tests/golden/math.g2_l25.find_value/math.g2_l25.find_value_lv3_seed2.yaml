  explanation: 'まず、2点をそれぞれ y = ax + b に代入し、a, b の連立方程式を立てる。（-3a + b = -2, b = 0）

    次に、連立方程式を解いて a, b を同時に求める。（a = 2/3, b = 0）

    最後に、求めた a, b から一次関数の式を組み立てる。（y = (2/3)x）'
