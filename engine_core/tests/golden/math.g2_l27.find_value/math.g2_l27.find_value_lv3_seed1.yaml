  - linear_function.intersection_of_two_lines
  explanation: 'まず、2つの直線を ax + by = c の形にそろえて連立方程式を立てる。（2x - y = -1, x - y = -3）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 2）

    最後に、求めた値をもとの式に代入し、もう一方の文字を求めて交点の座標にする。（交点 (2, 5)）'
  hints:
  - 2直線の交点の座標を求める（連立方程式の解）
  label: (1)
  prompt_text: ''
  solution_steps:
  - args:
    - Eq(2*x - y, -1)
    - Eq(x - y, -3)
    detail: ''
    narration: 2つの直線を ax + by = c の形にそろえて連立方程式を立てる。
    op: setup_system
    result_display: 2x - y = -1, x - y = -3
    result_srepr: '[Equality(Add(Mul(Integer(2), Symbol(''x'')), Mul(Integer(-1), Symbol(''y''))), Integer(-1)), Equality(Add(Symbol(''x''), Mul(Integer(-1), Symbol(''y''))), Integer(-3))]'
  - args:
    - Eq(2*x - y, -1)
    - Eq(x - y, -3)
    detail: ''
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 2
    result_srepr: Equality(Symbol('x'), Integer(2))
  - args:
    - '2'
    detail: ''
