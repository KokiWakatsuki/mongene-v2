problem_text: 2本の直線 y = -2x + 11 と y = -x + 7 を同じ座標平面にかき、その交点の座標を読み取れ。
sub_questions:
- answer:
    display: (4, 3)
    kind: symbolic
    srepr: Tuple(Integer(4), Integer(3))
  cause_tags: []
  concept_tags:
  - linear_function.read_intersection_from_graph
  explanation: 'まず、1本目の直線を座標平面にかく。（y = -2x + 11）

    次に、2本目の直線を同じ平面にかく。（y = -x + 7）

    最後に、2本の直線が交わる点の座標を読み取る。（(4, 3)）'
  hints:
  - 2直線をかき交点の座標をグラフから読み取る
  label: (1)
  prompt_text: ''
  solution_steps:
  - args:
    - y = -2x + 11
    detail: ''
    narration: 1本目の直線を座標平面にかく。
    op: draw_line_1
    result_display: y = -2x + 11
    result_srepr: Add(Integer(11), Mul(Integer(-1), Integer(2), Symbol('x')))
  - args:
    - y = -x + 7
    detail: ''
    narration: 2本目の直線を同じ平面にかく。
    op: draw_line_2
    result_display: y = -x + 7
    result_srepr: Add(Integer(7), Mul(Integer(-1), Symbol('x')))
  - args: []
    detail: ''
    narration: 2本の直線が交わる点の座標を読み取る。
    op: read_intersection
    result_display: (4, 3)
    result_srepr: Tuple(Integer(4), Integer(3))
