problem_ref: eee7e5201bc6cc87
problem_text: 2本の直線 y = 2x + 6 と y = -3x + 1 を同じ座標平面にかき、その交点の座標を読み取れ。
sub_questions:
- answer:
    display: (-1, 4)
    kind: symbolic
    srepr: Tuple(Integer(-1), Integer(4))
  cause_tags: []
  concept_tags:
  - linear_function.read_intersection_from_graph
  explanation: 'まず、1本目の直線を座標平面にかく。（y = 2x + 6）

    次に、2本目の直線を同じ平面にかく。（y = -3x + 1）

    最後に、2本の直線が交わる点の座標を読み取る。（(-1, 4)）'
  hints:
  - 1本目の直線を座標平面にかく。
  label: (1)
  prompt_text: ''
  solution_steps:
  - args:
    - y = 2x + 6
    detail: ''
    narration: 1本目の直線を座標平面にかく。
    op: draw_line_1
    result_display: y = 2x + 6
    result_srepr: Add(Mul(Integer(2), Symbol('x')), Integer(6))
  - args:
    - y = -3x + 1
    detail: ''
    narration: 2本目の直線を同じ平面にかく。
    op: draw_line_2
    result_display: y = -3x + 1
    result_srepr: Add(Integer(1), Mul(Integer(-1), Integer(3), Symbol('x')))
  - args: []
    detail: ''
    narration: 2本の直線が交わる点の座標を読み取る。
    op: read_intersection
    result_display: (-1, 4)
    result_srepr: Tuple(Integer(-1), Integer(4))
