    kind: symbolic
    srepr: Add(Mul(Rational(3, 2), Symbol('x')), Integer(9))
  cause_tags: []
  concept_tags:
  - linear_function.word_problem_two_point_eval
  explanation: 'まず、2点の y 座標の差を x 座標の差で割り、傾きを求める。（傾き a = 3/2）

    次に、傾きと通る1点を y = ax + b に代入し、切片を求める。（切片 b = 9）

    最後に、傾きと切片から一次関数の式を組み立てる。（y = 3/2x + 9）'
  hints:
  - 2点の y 座標の差を x 座標の差で割り、傾きを求める。
  - 傾きと通る1点を y = ax + b に代入し、切片を求める。
  label: (1)
  prompt_text: 式に表しなさい。
