problem_text: 'あるばねに30gのおもりをつるすと全体の長さが54cmになり、40gのおもりをつるすと69cmになった。

  ばねの長さ y cm はおもりの重さ x g の1次関数であるとする。

  (1) y を x の式で表せ。

  (2) 60gのおもりをつるしたときのばねの長さを求めよ。'
