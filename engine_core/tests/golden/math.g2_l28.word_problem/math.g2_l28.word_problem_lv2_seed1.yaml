problem_text: 'あるばねに40gのおもりをつるすと全体の長さが26cmになり、100gのおもりをつるすと41cmになった。

  ばねの長さ y cm はおもりの重さ x g の1次関数であるとする。

  (1) y を x の式で表せ。

  (2) 20gのおもりをつるしたときのばねの長さを求めよ。'
