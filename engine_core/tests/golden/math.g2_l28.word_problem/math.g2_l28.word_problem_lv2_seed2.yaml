problem_text: 'あるつる巻きばねに60gのおもりをつるすと全体の長さが35cmになり、120gのおもりをつるすと50cmになった。

  つる巻きばねの長さ y cm はおもりの重さ x g の1次関数であるとする。

  (1) y を x の式で表せ。

  (2) 40gのおもりをつるしたときのつる巻きばねの長さを求めよ。'
