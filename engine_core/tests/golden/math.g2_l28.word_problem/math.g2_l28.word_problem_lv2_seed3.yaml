problem_text: 'あるばねに25gのおもりをつるすと全体の長さが21cmになり、75gのおもりをつるすと31cmになった。

  ばねの長さ y cm はおもりの重さ x g の1次関数であるとする。

  (1) y を x の式で表せ。

  (2) 50gのおもりをつるしたときのばねの長さを求めよ。'
