problem_text: 'あるゴムひもに10gのおもりをつるすと全体の長さが25cmになり、30gのおもりをつるすと65cmになった。

  ゴムひもの長さ y cm はおもりの重さ x g の1次関数であるとする。

  (1) y を x の式で表せ。

  (2) 5gのおもりをつるしたときのゴムひもの長さを求めよ。'
