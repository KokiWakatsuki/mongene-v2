problem_text: 'あるばねに15gのおもりをつるすと全体の長さが34cmになり、30gのおもりをつるすと49cmになった。

  ばねの長さ y cm はおもりの重さ x g の1次関数であるとする。

  (1) y を x の式で表せ。

  (2) 10gのおもりをつるしたときのばねの長さを求めよ。'
