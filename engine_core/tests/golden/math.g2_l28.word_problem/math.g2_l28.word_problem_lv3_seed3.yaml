problem_text: '空のタンクに水を入れ始める。初めの14分間は毎分8Lで入れ、その後は毎分5Lで入れる。

  タンクに水を入れ始めてから x 分後の水の量を y Lとする。

  (1) 0≦x≦14 のときの y を x の式で表せ。

  (2) x≧14 のときの y を x の式で表せ。

  (3) 水の量が152Lになるのは、水を入れ始めてから何分後か求めよ。'
