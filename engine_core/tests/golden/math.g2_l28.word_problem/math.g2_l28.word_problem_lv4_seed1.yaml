problem_ref: 246711f5db67892d
problem_text: '満水で45Lの水そうがある。あきらさんは一定の割合で水を抜き、9分後に空にした。同時に、別の空の水そうにゆうこさんが毎分10Lの割合で水を入れ始めた。

  2つの水そうの水の量が等しくなるのは水を入れ始めてから何分後か、また、そのときの水の量を求めよ。'
sub_questions:
- answer:
    display: 3分後、そのときの水の量は30L
    kind: symbolic
    srepr: Tuple(Integer(3), Integer(30))
  cause_tags: []
  concept_tags:
  - linear_function.word_problem_tank_race
  explanation: 'まず、満水の量を空になるまでの時間でわって、水を抜く割合を求める。（毎分5L）

    次に、減っていく水そうと増えていく水そうの量を、それぞれ経過した時間の式で表す。（二つの水そうの量を x の式で表す）

    次に、2つの直線を ax + by = c の形にそろえて連立方程式を立てる。（5x + y = 45, -10x + y = 0）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 3）

    最後に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = 30）'
  hints:
  - 満水の量を空になるまでの時間でわって、水を抜く割合を求める。
  - 減っていく水そうと増えていく水そうの量を、それぞれ経過した時間の式で表す。
  - 2つの直線を ax + by = c の形にそろえて連立方程式を立てる。
  - 係数をそろえて一方の文字を消去し、残った文字を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
