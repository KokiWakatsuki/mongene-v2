    result_display: 二つの水そうの量を x の式で表す
    result_srepr: ''
  - args:
    - Eq(5*x + y, 45)
    - Eq(-10*x + y, 0)
    detail: ''
    narration: 2つの直線を ax + by = c の形にそろえて連立方程式を立てる。
