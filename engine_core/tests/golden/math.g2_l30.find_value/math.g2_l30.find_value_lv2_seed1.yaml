  explanation: 'まず、2つの直線の y を等しいとおき、x についての方程式をつくる。（13 - 4x = x + 3）

    次に、その方程式を解いて、x の値を求める。（x = 2）

    最後に、求めた x をどちらかの式に代入し、y を求める。（y = 5）'
  hints:
