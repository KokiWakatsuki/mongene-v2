problem_text: AさんとBさんが動くようすを、出発してからの時間 x とP地点からの道のり y の関係で表すと、Aさんは y = -3x + 34、Bさんは y = -x + 18 である。2人が同じ地点にいる（2つの直線が交わる）ときの時間 x と道のり y を求めよ。
