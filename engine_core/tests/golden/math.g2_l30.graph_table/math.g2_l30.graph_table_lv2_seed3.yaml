problem_ref: 391653cd07bd0563
problem_text: AさんとBさんが動くようすを、出発してからの時間 x とP地点からの道のり y の関係で表す。Aさんの進むようすは y = 2x + 2、Bさんの進むようすは y = -2x + 14 である。この2つの直線を同じ座標平面にかき、2つの直線が交わる点の座標（2人が同じ地点にいる時間と、そのときの道のり）を読み取れ。
sub_questions:
- answer:
    display: (3, 8)
    kind: symbolic
    srepr: Tuple(Integer(3), Integer(8))
  cause_tags: []
  concept_tags:
  - linear_function.diagram_intersection
  explanation: 'まず、Aさんの進むようすを表す直線を座標平面にかく。（y = 2x + 2）

    次に、Bさんの進むようすを表す直線を同じ平面にかく。（y = -2x + 14）

    最後に、2つの直線が交わる点の座標（同じ地点にいる時間と道のり）を読み取る。（(3, 8)）'
  hints:
  - ダイヤグラム(時間-道のり)の2直線の交点(出会い/追いつき)をグラフから読み取る
  label: (1)
  prompt_text: ''
  solution_steps:
  - args:
    - y = 2x + 2
    detail: ''
    narration: Aさんの進むようすを表す直線を座標平面にかく。
    op: draw_line_a
    result_display: y = 2x + 2
    result_srepr: Add(Mul(Integer(2), Symbol('x')), Integer(2))
  - args:
    - y = -2x + 14
    detail: ''
    narration: Bさんの進むようすを表す直線を同じ平面にかく。
    op: draw_line_b
    result_display: y = -2x + 14
    result_srepr: Add(Integer(14), Mul(Integer(-1), Integer(2), Symbol('x')))
  - args: []
    detail: ''
    narration: 2つの直線が交わる点の座標（同じ地点にいる時間と道のり）を読み取る。
    op: read_intersection
    result_display: (3, 8)
    result_srepr: Tuple(Integer(3), Integer(8))
