problem_text: '姉と妹は1760mはなれた甲地点と乙地点にいる。姉は甲地点を出発して乙地点へ毎分50mで、妹は姉と同時に乙地点を出発して甲地点へ毎分60mで進む。

  出発してから x 分後とする。

  (1) 姉について、出発してから x 分後の甲地点からの道のり y m を式で表せ。

  (2) 2人が出会うのは出発してから何分後か求めよ。'
