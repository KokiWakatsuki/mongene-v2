  explanation: 'まず、もう一方の人が出発地点から相手に向かって進むようすを、道のりの式で表す。（y = 1760 - 60x）

    次に、2つの直線の y を等しいとおき、x についての方程式をつくる。（50x = 1760 - 60x）

    最後に、その方程式を解いて、x の値を求める。（x = 16）'
