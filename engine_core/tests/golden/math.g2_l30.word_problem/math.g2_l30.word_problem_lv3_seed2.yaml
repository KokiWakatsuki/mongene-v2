  explanation: 'まず、もう一方の人が出発地点から相手に向かって進むようすを、道のりの式で表す。（y = 2176 - 52x）

    次に、2つの直線の y を等しいとおき、x についての方程式を解く。（x = 16）

    最後に、x の値を求める。（x = 16）'
  hints:
  - もう一方の人が出発地点から相手に向かって進むようすを、道のりの式で表す。
  - 2つの直線の y を等しいとおき、x についての方程式を解く。
  label: (2)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    narration: もう一方の人が出発地点から相手に向かって進むようすを、道のりの式で表す。
    op: formulate_line_b
    result_display: y = 2176 - 52x
    result_srepr: Equality(Symbol('y'), Add(Integer(2176), Mul(Integer(-1), Integer(52), Symbol('x'))))
  - args:
    - Eq(84*x - y, 0)
    - Eq(52*x + y, 2176)
    narration: 2つの直線の y を等しいとおき、x についての方程式を解く。
    op: equate_expressions
    result_display: x = 16
    result_srepr: Equality(Symbol('x'), Integer(16))
  - args:
    - '16'
    narration: x の値を求める。
    op: solve_for_x
    result_display: x = 16
    result_srepr: Integer(16)
