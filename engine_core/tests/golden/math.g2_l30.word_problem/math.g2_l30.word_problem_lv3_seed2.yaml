problem_ref: 70a9f2649f01ced9
problem_text: '姉と妹は2176mはなれた甲地点と乙地点にいる。姉は甲地点を出発して乙地点へ毎分84mで、妹は姉と同時に乙地点を出発して甲地点へ毎分52mで進む。

  出発してから x 分後とする。

  (1) 姉について、出発してから x 分後の甲地点からの道のり y m を式で表せ。

  (2) 2人が出会うのは出発してから何分後か求めよ。'
sub_questions:
- answer:
    display: y = 84x
    kind: symbolic
    srepr: Mul(Integer(84), Symbol('x'))
  cause_tags: []
  concept_tags:
  - linear_function.word_problem_meeting_intersection
  explanation: 'まず、傾きと通る点の座標を y = ax + b に代入する。（84 × 0 + b = 0）

    次に、代入した式を b について解き、切片を求める。（切片 b = 0）

    最後に、傾きと切片から一次関数の式を組み立てる。（y = 84x）'
  hints:
  - 傾きと通る点の座標を y = ax + b に代入する。
  - 代入した式を b について解き、切片を求める。
  label: (1)
  prompt_text: 式に表しなさい。
  solution_steps:
  - args:
    - '84'
    - (0, 0)
    narration: 傾きと通る点の座標を y = ax + b に代入する。
    op: substitute_point
    result_display: 84 × 0 + b = 0
    result_srepr: Equality(Symbol('b'), Integer(0))
  - args:
    - '84'
    - (0, 0)
    narration: 代入した式を b について解き、切片を求める。
    op: compute_intercept
    result_display: 切片 b = 0
    result_srepr: Integer(0)
  - args:
    - '84'
    - '0'
    narration: 傾きと切片から一次関数の式を組み立てる。
    op: form_expression
    result_display: y = 84x
    result_srepr: Mul(Integer(84), Symbol('x'))
- answer:
    display: 16分後
    kind: symbolic
    srepr: Integer(16)
  cause_tags: []
  concept_tags:
