  explanation: 'まず、もう一方の人が出発地点から相手に向かって進むようすを、道のりの式で表す。（y = 2700 - 85x）

    次に、2つの直線の y を等しいとおき、x についての方程式をつくる。（95x = 2700 - 85x）

    最後に、その方程式を解いて、x の値を求める。（x = 15）'
  hints:
  - もう一方の人が出発地点から相手に向かって進むようすを、道のりの式で表す。
  label: (2)
  prompt_text: ''
  solution_steps:
