    detail: ''
    narration: もう一方の人が出発地点から相手に向かって進むようすを、道のりの式で表す。
    op: formulate_line_b
    result_display: y = 2700 - 85x
    result_srepr: Equality(Symbol('y'), Add(Integer(2700), Mul(Integer(-1), Integer(85), Symbol('x'))))
  - args:
    - Eq(95*x - y, 0)
    - Eq(85*x + y, 2700)
    detail: ''
    narration: 2つの直線の y を等しいとおき、x についての方程式をつくる。
    op: equate_expressions
    result_display: 95x = 2700 - 85x
    result_srepr: Equality(Symbol('x'), Integer(15))
  - args:
