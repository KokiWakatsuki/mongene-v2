problem_ref: 553909e10f2ace50
problem_text: '姉と妹は2700mはなれたX地点とY地点にいる。姉はX地点を出発してY地点へ毎分95mで、妹は姉と同時にY地点を出発してX地点へ毎分85mで進む。

  出発してから x 分後とする。

  (1) 姉について、出発してから x 分後のX地点からの道のり y m を式で表せ。

  (2) 2人が出会うのは出発してから何分後か求めよ。'
sub_questions:
- answer:
    display: y = 95x
    kind: symbolic
    srepr: Mul(Integer(95), Symbol('x'))
  cause_tags: []
  concept_tags:
  - linear_function.word_problem_meeting_intersection
  explanation: 'まず、傾きと通る点の座標を y = ax + b に代入する。（95 × 0 + b = 0）

    次に、代入した式を b について解き、切片を求める。（切片 b = 0）

    最後に、傾きと切片から一次関数の式を組み立てる。（y = 95x）'
  hints:
  - 傾きと通る点の座標を y = ax + b に代入する。
  label: (1)
  prompt_text: ''
  solution_steps:
