problem_ref: ed74040dcab6e77b
problem_text: '学校と公園は1800mはなれている。あきらさんは学校を出発して公園へ毎分120mで進み、公園に着くとすぐ折り返して同じ速さで学校へもどる。ゆうこさんはあきらさんが出発してから10分後に公園を出発し、毎分80mで学校へ進む。

  2人が2回目に出会うのはあきらさんが出発してから何分後か求めよ。'
sub_questions:
- answer:
    display: 25分後
    kind: symbolic
    srepr: Integer(25)
  cause_tags: []
  concept_tags:
  - linear_function.word_problem_second_meeting
  explanation: 'まず、二人の位置を、出発してからの時間を使ってそれぞれ式で表す。（先に出た人は 120x、あとの人は 1800 - 80(x - 10)）

    次に、向かい合って進む間に位置が等しくなる時刻を求め、これが一回目の出会いであることを確かめる。（13分後）

    次に、折り返したあとの位置は、折り返す地点までの道のりから、折り返してから進んだ道のりを引いて表す。（折り返した人は 3600 - 120x）

    最後に、折り返したあとの位置と、向かってくる相手の位置が等しいとおいて方程式を解く。（25分後）'
  hints:
  - 折り返す人と向かってくる人が2回目に出会う時刻を、区間ごとに立式して求める
