problem_text: '学校と公園は1600mはなれている。ひろしさんは学校を出発して公園へ毎分80mで進み、公園に着くとすぐ折り返して同じ速さで学校へもどる。さくらさんはひろしさんが出発してから2分後に公園を出発し、毎分40mで学校へ進む。

  2人が2回目に出会うのはひろしさんが出発してから何分後か求めよ。'
