  explanation: 'まず、二人の位置を、出発してからの時間を使ってそれぞれ式で表す。（先に出た人は 80x、あとの人は 1600 - 40(x - 2)）

    次に、向かい合って進む間に位置が等しくなる時刻を求め、これが一回目の出会いであることを確かめる。（14分後）

    次に、折り返したあとの位置は、折り返す地点までの道のりから、折り返してから進んだ道のりを引いて表す。（折り返した人は 3200 - 80x）

    最後に、折り返したあとの位置と、向かってくる相手の位置が等しいとおいて方程式を解く。（38分後）'
  hints:
  - 折り返す人と向かってくる人が2回目に出会う時刻を、区間ごとに立式して求める
