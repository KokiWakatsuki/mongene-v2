  explanation: 'まず、合同を表す式で、角の頂点がどの位置に対応づけられているかを確認する。（KLM と XYZ）

    次に、対応する位置にある頂点にできる角が、対応する角になることから読み取る。（∠Z）

    次に、合同を表す式で、辺の両端の頂点がどの位置に対応づけられているかを確認する。（KLM と XYZ）

    最後に、対応する位置にある頂点どうしが結ぶ辺が、対応する辺になることから読み取る。（辺XY）'
  hints:
