  explanation: 'まず、等積変形をする前の、面積がわかっている図形はどれかを確かめる。

    次に、もとの四角形を対角線で2つの三角形に分けると、一方は平行な直線にはさまれた三角形になる。その三角形を平行線にそって移しても底辺と高さが変わらないので面積は同じ。だから全体の面積も変わらない。（200）'
  hints:
  - 等積変形でつくった三角形の面積を求める
