problem_text: 座標平面上に四角形ABCDがあり、A(4, 7)、B(0, 0)、C(11, 0)、D(12, 6)である。頂点Aを通り、この四角形の面積を2等分する直線を1本引く。その直線が辺BCと交わる点をPとするとき、点Pの座標を面積の関係から求めよ。
