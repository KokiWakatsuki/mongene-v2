  explanation: 'まず、まわりの座標から四角形全体の面積を求める。（63）

    次に、頂点を通る直線が面積を2等分するのだから、分けられた一方の三角形の面積が全体の半分になる、という式を立てる。（△ABP = 63/2（△ABC = 77/2））

    最後に、その三角形は辺の上の点までの長さを底辺とみられるので、面積の式を長さについて解いて、点の位置を求める。（P(9, 0)（BP:PC = 9:2））'
