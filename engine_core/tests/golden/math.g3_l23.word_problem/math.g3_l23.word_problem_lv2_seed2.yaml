  explanation: 'まず、正方形の面積は1辺の長さを2乗した値だから、1辺の長さは面積の正の平方根で表せる。（√448）

    次に、根号の中を素因数分解し、平方の因数を見つける。（√(64 × 7)）

    最後に、平方の因数を根号の外に出して a√b の形にする。（8√7）'
  hints:
  - 正方形の面積は1辺の長さを2乗した値だから、1辺の長さは面積の正の平方根で表せる。
  - 根号の中を素因数分解し、平方の因数を見つける。
