problem_text: '面積が1000cm²の正方形のタイルをつくる。ただし、√10=3.16として計算してよいものとする。

  (1) この正方形のタイルの1辺の長さを、根号を使って表せ。

  (2) その長さを、小数第一位まで求めよ。'
