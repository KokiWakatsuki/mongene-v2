problem_text: '縦と横の長さの比が1：4である長方形の空き地があり、その面積は68m²である。

  この空き地の縦の長さを、根号を使って表せ。'
sub_questions:
- answer:
    display: √17
    kind: symbolic
    srepr: Pow(Integer(17), Rational(1, 2))
  cause_tags: []
  concept_tags:
  - radical.word_problem_rectangle_ratio_side
  explanation: 'まず、縦の長さを x とおき、比を使って横の長さを x の何倍かで表す。（x）

    次に、縦と横の長さの積が面積になることから、面積の関係を式に表す。（4x² = 68）

    次に、両辺を比から出てきた数でわって、縦の長さの2乗の値を求める。（x² = 17）

    次に、根号の中を素因数分解し、平方の因数を見つける。（√(1 × 17)）

    最後に、平方の因数を根号の外に出して a√b の形にする。（√17）'
  hints:
