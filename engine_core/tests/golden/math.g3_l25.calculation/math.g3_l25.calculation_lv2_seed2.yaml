  cause_tags: []
  concept_tags:
  - quadratic.solve_by_square_root
  explanation: 'まず、定数項を、符号を変えて右辺に移項する。（x² + 4x = 7）

    次に、左辺を平方の形にするために、x の係数の半分を平方した数を両辺に加える。（x² + 4x + 4 = 7 + 4）

    次に、左辺を、かっこの平方の形にまとめる。（(x + 2)² = 11）

    次に、平方根の考え方で、両辺の平方根をとる。（x + 2 = ±√11）

    最後に、正の場合と負の場合に分けて x を求める。（x = -√11 - 2, x = -2 + √11）'
  hints:
  - 定数項を、符号を変えて右辺に移項する。
  - 左辺を平方の形にするために、x の係数の半分を平方した数を両辺に加える。
