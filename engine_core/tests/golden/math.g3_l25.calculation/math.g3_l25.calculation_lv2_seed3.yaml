  explanation: 'まず、定数項を、符号を変えて右辺に移項する。（x² - 10x = -8）

    次に、左辺を平方の形にするために、x の係数の半分を平方した数を両辺に加える。（x² - 10x + 25 = -8 + 25）

    次に、左辺を、かっこの平方の形にまとめる。（(x - 5)² = 17）

    次に、平方根の考え方で、両辺の平方根をとる。（x - 5 = ±√17）

    最後に、正の場合と負の場合に分けて x を求める。（x = 5 - √17, x = √17 + 5）'
  hints:
  - 定数項を、符号を変えて右辺に移項する。
  - 左辺を平方の形にするために、x の係数の半分を平方した数を両辺に加える。
  - 左辺を、かっこの平方の形にまとめる。
  - 平方根の考え方で、両辺の平方根をとる。
  label: (1)
  prompt_text: 解を求めなさい。
