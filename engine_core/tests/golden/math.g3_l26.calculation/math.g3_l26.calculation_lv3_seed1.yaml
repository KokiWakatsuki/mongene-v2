  explanation: 'まず、与式を整理して、それぞれの項の係数 a・b・c を読み取る。（a = 3、b = 4、c = -6）

    次に、読み取った a・b・c を、解の公式にそのまま代入する。（x = (-4 ± √(4² - 4 × 3 × (-6))) / (2 × 3)）

    次に、根号の中の値（判別式）を計算する。（4² - 4 × 3 × (-6) = 88）

    最後に、根号の中を計算し、約分できるところを約分して x を求める。（x = (-√22 - 2)/3, x = (-2 + √22)/3）'
