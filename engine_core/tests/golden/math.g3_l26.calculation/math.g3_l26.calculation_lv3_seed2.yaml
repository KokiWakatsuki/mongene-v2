  explanation: 'まず、与式を整理して、それぞれの項の係数 a・b・c を読み取る。（a = -4、b = -6、c = 1）

    次に、読み取った a・b・c を、解の公式にそのまま代入する。（x = (-(-6) ± √((-6)² - 4 × (-4) × 1)) / (2 × (-4))）

    次に、根号の中の値（判別式）を計算する。（(-6)² - 4 × (-4) × 1 = 52）

    最後に、根号の中を計算し、約分できるところを約分して x を求める。（x = (-√13 - 3)/4, x = (-3 + √13)/4）'
