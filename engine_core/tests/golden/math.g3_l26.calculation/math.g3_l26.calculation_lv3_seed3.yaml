  cause_tags: []
  concept_tags:
  - quadratic.solve_by_formula
  explanation: 'まず、与式を整理して、それぞれの項の係数 a・b・c を読み取る。（a = 5、b = -9、c = -9）

    次に、読み取った a・b・c を、解の公式にそのまま代入する。（x = (-(-9) ± √((-9)² - 4 × 5 × (-9))) / (2 × 5)）

    次に、根号の中の値（判別式）を計算する。（(-9)² - 4 × 5 × (-9) = 261）

    最後に、根号の中を計算し、約分できるところを約分して x を求める。（x = 3(3 - √29)/10, x = 3(3 + √29)/10）'
  hints:
