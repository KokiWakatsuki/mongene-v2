  explanation: 'まず、かっこを展開し、右辺を左辺に移項して、=0 の形に整理する。（x² + 2x - 675 = 0）

    次に、左辺を因数分解する。（(x - 25)(x + 27) = 0）

    次に、積が 0 になるのは各因数が 0 のときだから、それぞれを 0 とおいて x を求める。（x - 25 = 0、x + 27 = 0）

    次に、求めるものは正の数だから、2つの解のうち条件に合う正の解を選ぶ。（25）

    最後に、求めた x をもとに、問われている量を計算する。（小さい方の数は25、大きい方の数は27）'
  hints:
