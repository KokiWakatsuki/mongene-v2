problem_ref: b6906a8b2db5e40f
problem_text: 'ある正の整数がある。この数を2乗した数から、もとの数の7倍をひくと170になる。

  この整数を求めよ。'
sub_questions:
- answer:
    display: '17'
    kind: symbolic
    srepr: Tuple(Integer(17))
  cause_tags: []
  concept_tags:
  - quadratic.word_problem_number_relation
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（2乗した数ともとの数をもとにした数）

    次に、その量を x を使って両辺に表し、方程式をつくる。（x² = 7x + 170）

    次に、かっこを展開し、右辺を左辺に移項して、=0 の形に整理する。（x² - 7x - 170 = 0）

    次に、左辺を因数分解する。（(x - 17)(x + 10) = 0）

    次に、積が 0 になるのは各因数が 0 のときだから、それぞれを 0 とおいて x を求める。（x - 17 = 0、x + 10 = 0）

    最後に、求めるものは正の数だから、2つの解のうち条件に合う正の解を選ぶ。（17）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
