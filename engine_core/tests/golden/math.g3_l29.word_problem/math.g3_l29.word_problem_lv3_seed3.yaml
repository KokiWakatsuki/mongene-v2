problem_ref: 5ac4dde791380854
problem_text: 'ある正の整数がある。この数を2乗した数から、もとの数の3倍をひくと180になる。

  この整数を求めよ。'
sub_questions:
- answer:
    display: '15'
    kind: symbolic
    srepr: Tuple(Integer(15))
  cause_tags: []
  concept_tags:
  - quadratic.word_problem_number_relation
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（2乗した数ともとの数をもとにした数）

    次に、その量を x を使って両辺に表し、方程式をつくる。（x² = 3x + 180）

    次に、かっこを展開し、右辺を左辺に移項して、=0 の形に整理する。（x² - 3x - 180 = 0）

    次に、左辺を因数分解する。（(x - 15)(x + 12) = 0）

    次に、積が 0 になるのは各因数が 0 のときだから、それぞれを 0 とおいて x を求める。（x - 15 = 0、x + 12 = 0）

    最後に、求めるものは正の数だから、2つの解のうち条件に合う正の解を選ぶ。（15）'
  hints:
  - ある数とその2乗の関係から2次方程式を自分で立て、正の解を選んで数を求める
  label: (1)
  prompt_text: ''
