  concept_tags:
  - quadratic.solve_from_rectangle_area
  explanation: 'まず、かっこを展開し、右辺を左辺に移項して、=0 の形に整理する。（x² + 5x - 84 = 0）

    次に、左辺を因数分解する。（(x - 7)(x + 12) = 0）

    次に、積が 0 になるのは各因数が 0 のときだから、それぞれを 0 とおいて x を求める。（x - 7 = 0、x + 12 = 0）

    最後に、求めるものは正の数だから、2つの解のうち条件に合う正の解を選ぶ。（7）'
