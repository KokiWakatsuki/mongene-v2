  explanation: 'まず、かっこを展開し、右辺を左辺に移項して、=0 の形に整理する。（x² + 18x - 819 = 0）

    次に、左辺を因数分解する。（(x - 21)(x + 39) = 0）

    次に、積が 0 になるのは各因数が 0 のときだから、それぞれを 0 とおいて x を求める。（x - 21 = 0、x + 39 = 0）

    最後に、求めるものは正の数だから、2つの解のうち条件に合う正の解を選ぶ。（21）'
