problem_ref: 70ef5d3b5cbe2937
problem_text: '1辺が28cmの正方形がある。縦を x cm 短くし、横を x cm 長くして長方形をつくったところ、面積が684cm²になった。

  x の値を求めよ。'
sub_questions:
- answer:
    display: 10cm
    kind: symbolic
    srepr: Tuple(Integer(10))
  cause_tags: []
  concept_tags:
  - quadratic.word_problem_square_cut
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（変形後の長方形の面積）

    次に、その量を x を使って両辺に表し、方程式をつくる。（(28 - x)(28 + x) = 684）

    次に、かっこを展開し、右辺を左辺に移項して、=0 の形に整理する。（100 - x² = 0）

    次に、左辺を因数分解する。（-(x - 10)(x + 10) = 0）

    次に、積が 0 になるのは各因数が 0 のときだから、それぞれを 0 とおいて x を求める。（x - 10 = 0、x + 10 = 0）

    最後に、求めるものは正の数だから、2つの解のうち条件に合う正の解を選ぶ。（10）'
  hints:
  - 正方形の縦横を増減させた面積の条件から2次方程式を自分で立て、正の解を求める
  label: (1)
  prompt_text: ''
