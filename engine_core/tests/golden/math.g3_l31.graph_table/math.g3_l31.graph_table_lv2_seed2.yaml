  explanation: 'まず、変域の左端の x に対応する点をとり、端をふくむなら●、ふくまないなら○で表す。（(0, 0)）

    次に、変域の右端の x に対応する点をとり、端をふくむなら●、ふくまないなら○で表す。（(4, 288)）

    最後に、とった2つの端点を結ぶ線分をひく。（両端点を結ぶ線分）'
  hints:
  - 変域の左端の x に対応する点をとり、端をふくむなら●、ふくまないなら○で表す。
  - 変域の右端の x に対応する点をとり、端をふくむなら●、ふくまないなら○で表す。
  label: (1)
  prompt_text: 線分をかきなさい。
  solution_steps:
  - args: []
    narration: 変域の左端の x に対応する点をとり、端をふくむなら●、ふくまないなら○で表す。
    op: plot_endpoint_lo
    result_display: (0, 0)
    result_srepr: Tuple(Integer(0), Integer(0))
  - args: []
    narration: 変域の右端の x に対応する点をとり、端をふくむなら●、ふくまないなら○で表す。
    op: plot_endpoint_hi
    result_display: (4, 288)
    result_srepr: Tuple(Integer(4), Integer(288))
  - args: []
    narration: とった2つの端点を結ぶ線分をひく。
    op: draw_segment
    result_display: 両端点を結ぶ線分
    result_srepr: Tuple(Tuple(Integer(0), Integer(0)), Tuple(Integer(4), Integer(288)))
