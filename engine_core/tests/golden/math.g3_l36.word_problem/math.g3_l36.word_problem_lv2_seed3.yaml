    display: y = (1/100)x²
    kind: symbolic
    srepr: Mul(Rational(1, 100), Pow(Symbol('x'), Integer(2)))
  cause_tags: []
  concept_tags:
  - quadratic_function.word_problem_determine_then_evaluate
  explanation: 'まず、y は x の2乗に比例するから、比例定数を a とおいて y=ax² と表し、与えられている x と y の値を代入する。（y = ax²）

    次に、代入してできた式を a について解いて、比例定数を求める。（a = 1/100）

    最後に、求めた比例定数を y=ax² にもどして、y を x の式で表す。（y = (1/100)x²）'
