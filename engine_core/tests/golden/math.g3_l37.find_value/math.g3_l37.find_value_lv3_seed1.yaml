  explanation: 'まず、放物線の式と直線の式の右辺どうしを等しいとおき、方程式を立てる。（-3x² = -6x - 9）

    次に、その方程式を解いて、交点の x 座標を求める。（x = -1, x = 3）

    次に、求めた x の値を式に代入して、交点の y 座標を求める。（A(-1, -3), B(3, -27)）

    次に、2点の座標の差から、線分の長さを求める。（AB = 4√37）

    最後に、頂点の座標から、三角形の面積を求める公式で面積を計算する。（AB = 4√37, △OAB = 18）'
  hints:
  - 放物線と直線の交点・線分長・三角形の面積・面積を等分する点を求める
