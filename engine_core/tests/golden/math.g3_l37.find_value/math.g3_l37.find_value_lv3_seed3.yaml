- answer:
    display: AB = 10√65, △OAB = 480
    kind: symbolic
    srepr: Tuple(Mul(Integer(10), Pow(Integer(65), Rational(1, 2))), Integer(480))
  cause_tags: []
  concept_tags:
  - quadratic_function.intersection_with_line
  explanation: 'まず、放物線の式と直線の式の右辺どうしを等しいとおき、方程式を立てる。（-4x² = -8x - 96）

    次に、その方程式を解いて、交点の x 座標を求める。（x = -4, x = 6）

    次に、求めた x の値を式に代入して、交点の y 座標を求める。（A(-4, -64), B(6, -144)）

    次に、2点の座標の差から、線分の長さを求める。（AB = 10√65）

    最後に、頂点の座標から、三角形の面積を求める公式で面積を計算する。（AB = 10√65, △OAB = 480）'
