problem_ref: c23869a22f8aa7bc
problem_text: 放物線 y = 3x² と直線 y = 12x - 9 が2点 A, B で交わっている。原点を O とするとき、y 軸上に O と異なる点 P をとる。三角形 PAB の面積が三角形 OAB の面積と等しくなるような点 P の座標を求めよ。
