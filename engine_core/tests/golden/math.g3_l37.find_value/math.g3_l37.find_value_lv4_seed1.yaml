  - quadratic_function.intersection_with_line
  explanation: 'まず、放物線の式と直線の式の右辺どうしを等しいとおき、方程式を立てる。（3x² = 12x - 9）

    次に、その方程式を解いて、交点の x 座標を求める。（x = 1, x = 3）

    次に、求めた x の値を式に代入して、交点の y 座標を求める。（A(1, 3), B(3, 27)）

    次に、頂点の座標から、三角形の面積を求める公式で面積を計算する。（△OAB = 9）

    最後に、三角形 PAB の面積が三角形 OAB の面積と等しくなる条件から方程式を立て、点 P の座標を決める。（P(0, -18)）'
