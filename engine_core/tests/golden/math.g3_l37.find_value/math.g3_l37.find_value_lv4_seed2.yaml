problem_ref: c504c8ecdf82c53d
problem_text: 放物線 y = 4x² と直線 y = -16x + 48 が2点 A, B で交わっている。原点を O とするとき、y 軸上に O と異なる点 P をとる。三角形 PAB の面積が三角形 OAB の面積と等しくなるような点 P の座標を求めよ。
sub_questions:
- answer:
    display: P(0, 96)
    kind: symbolic
    srepr: Tuple(Integer(0), Integer(96))
  cause_tags: []
  concept_tags:
  - quadratic_function.intersection_with_line
  explanation: 'まず、放物線の式と直線の式の右辺どうしを等しいとおき、方程式を立てる。（4x² = 48 - 16x）

    次に、その方程式を解いて、交点の x 座標を求める。（x = -6, x = 2）

    次に、求めた x の値を式に代入して、交点の y 座標を求める。（A(-6, 144), B(2, 16)）

    次に、頂点の座標から、三角形の面積を求める公式で面積を計算する。（△OAB = 192）

    最後に、三角形 PAB の面積が三角形 OAB の面積と等しくなる条件から方程式を立て、点 P の座標を決める。（P(0, 96)）'
