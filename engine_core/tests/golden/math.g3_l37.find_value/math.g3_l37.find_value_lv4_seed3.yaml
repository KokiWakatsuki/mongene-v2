    display: P(0, 24)
    kind: symbolic
    srepr: Tuple(Integer(0), Integer(24))
  cause_tags: []
  concept_tags:
  - quadratic_function.intersection_with_line
  explanation: 'まず、放物線の式と直線の式の右辺どうしを等しいとおき、方程式を立てる。（2x² = 2x + 12）

    次に、その方程式を解いて、交点の x 座標を求める。（x = -2, x = 3）

    次に、求めた x の値を式に代入して、交点の y 座標を求める。（A(-2, 8), B(3, 18)）

    次に、頂点の座標から、三角形の面積を求める公式で面積を計算する。（△OAB = 30）

    最後に、三角形 PAB の面積が三角形 OAB の面積と等しくなる条件から方程式を立て、点 P の座標を決める。（P(0, 24)）'
