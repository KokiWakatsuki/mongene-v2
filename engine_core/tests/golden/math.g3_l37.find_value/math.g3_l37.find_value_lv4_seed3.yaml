problem_ref: 11e657bf2dfc6e40
problem_text: 放物線 y = 2x² と直線 y = 2x + 12 が2点 A, B で交わっている。原点を O とするとき、y 軸上に O と異なる点 P をとる。三角形 PAB の面積が三角形 OAB の面積と等しくなるような点 P の座標を求めよ。
