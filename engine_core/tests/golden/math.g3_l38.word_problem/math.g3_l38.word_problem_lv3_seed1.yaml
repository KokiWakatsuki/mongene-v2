    display: y = 50x
    kind: symbolic
    srepr: Mul(Integer(50), Symbol('x'))
  cause_tags: []
  concept_tags:
  - quadratic_function.word_problem_moving_point_area
  explanation: 'まず、点が最初の辺の上にある間は、速さと経過時間から、動いた道のりを x を使って表す。（進んだ道のり = 5x）

    次に、三角形の底辺を正方形の1つの辺とみると、高さは動いた道のりに等しいから、面積を x の式で表す。（y = 50x）'
  hints:
