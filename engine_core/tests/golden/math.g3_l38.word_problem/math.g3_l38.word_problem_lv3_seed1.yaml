problem_text: '1辺が20cmの正方形CDEFがある。点Wは頂点Dを出発し、辺DE、辺EFの上を毎秒5cmの速さでFまで動く。

  出発してから x 秒後の三角形CDWの面積を y cm²とする。

  (1) 0≦x≦4 のとき、y を x の式で表せ。

  (2) 4≦x≦8 のとき、y を x の式で表せ。'
sub_questions:
