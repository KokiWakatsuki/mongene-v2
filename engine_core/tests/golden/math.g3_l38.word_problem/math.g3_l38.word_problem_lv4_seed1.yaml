  - quadratic_function.word_problem_area_graph_and_times
  explanation: 'まず、動く点がどの辺の上にあるかで、時間を区間に分ける。（0〜10秒、10〜20秒、20〜30秒）

    次に、はじめの区間では高さが時間に比例するので、面積を時間の1次式で表す。（y = 5x）

    次に、次の区間では底辺も高さも変わらないので、面積が一定になることを確かめる。（y = 50）

    次に、最後の区間では高さが減っていくので、面積を時間の1次式で表す。（y = -5x + 150）

    次に、区間の境目と両端で面積を求め、その組を座標とみて点をとる。（(0, 0)、(10, 50)、(20, 50)、(30, 0)）

    最後に、とった点を順に線分で結び、区間ごとに式が変わるグラフをかく。（区間の境目を折れ点とする折れ線）'
  hints:
  - 動く点がどの辺の上にあるかで、時間を区間に分ける。
  - はじめの区間では高さが時間に比例するので、面積を時間の1次式で表す。
  - 次の区間では底辺も高さも変わらないので、面積が一定になることを確かめる。
  - 最後の区間では高さが減っていくので、面積を時間の1次式で表す。
  - 区間の境目と両端で面積を求め、その組を座標とみて点をとる。
  label: (1)
  prompt_text: グラフをかきなさい。
  solution_steps:
