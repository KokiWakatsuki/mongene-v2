problem_text: '1辺が26cmの正方形LMNPの周上を、点RがLを出発してL→M→N→Pの順に毎秒1cmの速さでPまで動く。点Rが動き始めてからx秒後の三角形LRPの面積をy cm²とする。

  xとyの関係をグラフに表し、面積が312cm²になる時刻をすべて求めよ。'
