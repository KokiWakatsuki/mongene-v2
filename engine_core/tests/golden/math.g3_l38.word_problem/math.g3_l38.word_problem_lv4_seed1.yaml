  explanation: 'まず、点Rがどの辺の上にあるかで時間を区間に分け、区間ごとに面積の式が変わることを確かめる。（0〜10秒、10〜20秒、20〜30秒）

    次に、はじめの辺の上の面積の式は y = 5x なので、5x = 40 を解く。（8秒後）

    次に、次の辺の上の面積はつねに 50 なので、40 にはならない。（面積は 50 のままなので解なし）

    次に、最後の辺の上の面積の式は y = -5x + 150 なので、-5x + 150 = 40 を解く。（22秒後）

    最後に、求めた時刻がそれぞれの区間の中にあることを確かめ、答えをすべて並べる。（8秒後、22秒後）'
  hints:
  - 点Rがどの辺の上にあるかで時間を区間に分け、区間ごとに面積の式が変わることを確かめる。
  - はじめの辺の上では高さが時間に比例するので、面積の式を方程式とみて解く。
  - 次の辺の上では底辺も高さも変わらず面積が一定なので、その値と比べて解があるかを調べる。
  - 最後の辺の上では高さが減っていくので、その区間の式を方程式とみて解く。
