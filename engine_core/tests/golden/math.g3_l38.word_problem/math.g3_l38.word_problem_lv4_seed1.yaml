  explanation: 'まず、点Rがどの辺の上にあるかで時間を区間に分け、区間ごとに面積の式が変わることを確かめる。（0〜26秒、26〜52秒、52〜78秒）

    次に、はじめの辺の上の面積の式は y = 13x なので、13x = 312 を解く。（24秒後）

    次に、次の辺の上の面積はつねに 338 なので、312 にはならない。（面積は 338 のままなので解なし）

    次に、最後の辺の上の面積の式は y = -13x + 1014 なので、-13x + 1014 = 312 を解く。（54秒後）

    最後に、求めた時刻がそれぞれの区間の中にあることを確かめ、答えをすべて並べる。（24秒後、54秒後）'
  hints:
