    kind: graph
    solution_svg_ref: ''
  cause_tags: []
  concept_tags:
  - quadratic_function.word_problem_area_graph_and_times
  explanation: 'まず、動く点がどの辺の上にあるかで、時間を区間に分ける。（0〜12秒、12〜24秒、24〜36秒）

    次に、はじめの区間では高さが時間に比例するので、面積を時間の1次式で表す。（y = 24x）

    次に、次の区間では底辺も高さも変わらないので、面積が一定になることを確かめる。（y = 288）

    次に、最後の区間では高さが減っていくので、面積を時間の1次式で表す。（y = -24x + 864）

    次に、区間の境目と両端で面積を求め、その組を座標とみて点をとる。（(0, 0)、(12, 288)、(24, 288)、(36, 0)）

    最後に、とった点を順に線分で結び、区間ごとに式が変わるグラフをかく。（区間の境目を折れ点とする折れ線）'
  hints:
  - 動く点がどの辺の上にあるかで、時間を区間に分ける。
  - はじめの区間では高さが時間に比例するので、面積を時間の1次式で表す。
  - 次の区間では底辺も高さも変わらないので、面積が一定になることを確かめる。
  - 最後の区間では高さが減っていくので、面積を時間の1次式で表す。
  - 区間の境目と両端で面積を求め、その組を座標とみて点をとる。
  label: (1)
  prompt_text: グラフをかきなさい。
  solution_steps:
  - args: []
    narration: 動く点がどの辺の上にあるかで、時間を区間に分ける。
    op: identify_intervals
    result_display: 0〜12秒、12〜24秒、24〜36秒
    result_srepr: ''
  - args: []
    narration: はじめの区間では高さが時間に比例するので、面積を時間の1次式で表す。
    op: express_area_on_increasing_interval
    result_display: y = 24x
    result_srepr: ''
  - args: []
    narration: 次の区間では底辺も高さも変わらないので、面積が一定になることを確かめる。
    op: express_area_on_constant_interval
    result_display: y = 288
    result_srepr: ''
  - args: []
    narration: 最後の区間では高さが減っていくので、面積を時間の1次式で表す。
    op: express_area_on_decreasing_interval
    result_display: y = -24x + 864
    result_srepr: ''
  - args: []
    narration: 区間の境目と両端で面積を求め、その組を座標とみて点をとる。
    op: plot_breakpoints
    result_display: (0, 0)、(12, 288)、(24, 288)、(36, 0)
    result_srepr: ''
  - args: []
    narration: とった点を順に線分で結び、区間ごとに式が変わるグラフをかく。
    op: draw_polyline
    result_display: 区間の境目を折れ点とする折れ線
    result_srepr: Tuple(Tuple(Integer(0), Integer(0)), Tuple(Integer(12), Integer(288)), Tuple(Integer(24), Integer(288)), Tuple(Integer(36), Integer(0)))
