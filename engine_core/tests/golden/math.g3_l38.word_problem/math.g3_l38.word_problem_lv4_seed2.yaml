problem_ref: dda46647f4ddaa60
problem_text: '1辺が24cmの正方形DEFGの周上を、点JがDを出発してD→E→F→Gの順に毎秒2cmの速さでGまで動く。点Jが動き始めてからx秒後の三角形DJGの面積をy cm²とする。

  xとyの関係をグラフに表し、面積が192cm²になる時刻をすべて求めよ。'
