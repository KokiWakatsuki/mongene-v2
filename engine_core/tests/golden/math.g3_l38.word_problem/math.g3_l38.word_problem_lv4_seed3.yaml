  explanation: 'まず、点Yがどの辺の上にあるかで時間を区間に分け、区間ごとに面積の式が変わることを確かめる。（0〜8秒、8〜16秒、16〜24秒）

    次に、はじめの辺の上の面積の式は y = 64x なので、64x = 384 を解く。（6秒後）

    次に、次の辺の上の面積はつねに 512 なので、384 にはならない。（面積は 512 のままなので解なし）

    次に、最後の辺の上の面積の式は y = -64x + 1536 なので、-64x + 1536 = 384 を解く。（18秒後）

    最後に、求めた時刻がそれぞれの区間の中にあることを確かめ、答えをすべて並べる。（6秒後、18秒後）'
  hints:
  - 点Yがどの辺の上にあるかで時間を区間に分け、区間ごとに面積の式が変わることを確かめる。
  - はじめの辺の上では高さが時間に比例するので、面積の式を方程式とみて解く。
  - 次の辺の上では底辺も高さも変わらず面積が一定なので、その値と比べて解があるかを調べる。
  - 最後の辺の上では高さが減っていくので、その区間の式を方程式とみて解く。
  label: (2)
