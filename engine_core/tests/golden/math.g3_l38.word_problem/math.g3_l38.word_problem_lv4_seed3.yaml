problem_ref: c3a16ad9e7584af0
problem_text: '1辺が32cmの正方形LMNPの周上を、点YがLを出発してL→M→N→Pの順に毎秒4cmの速さでPまで動く。点Yが動き始めてからx秒後の三角形LYPの面積をy cm²とする。

  xとyの関係をグラフに表し、面積が384cm²になる時刻をすべて求めよ。'
