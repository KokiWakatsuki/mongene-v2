  explanation: 'まず、MN∥KL であることから、三角形JMNと三角形JKLが相似になることを見つける。（三角形JMN と 三角形JKL）

    次に、JMとMKをたして、辺JK全体の長さを求める。（JK = 3 + 9 = 12）

    最後に、3:12 = 2:KL を解いて、辺KLの長さを求める。（8cm）'
