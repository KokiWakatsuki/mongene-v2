problem_text: 下の図で、3本の直線z, n, ℓは平行である。直線sはz, n, ℓとそれぞれ点C, D, Eで交わり、直線uはz, n, ℓとそれぞれ点F, G, Hで交わる。CD=15cm, FG=18cm, GH=12cm のとき、線分DEの長さを求めよ。
