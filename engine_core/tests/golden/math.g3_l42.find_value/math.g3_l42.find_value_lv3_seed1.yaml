    display: 10cm
    kind: symbolic
    srepr: Integer(10)
  cause_tags: []
  concept_tags:
  - parallel_segment.transversal_ratio
  explanation: 'まず、3本の平行な直線が2本の直線と交わるとき、対応する線分の比が等しくなることを見つける。（15:18 = x:12）

    次に、対応する線分の比が等しいことから、比例式を立てて長さを求める。（10cm）'
  hints:
