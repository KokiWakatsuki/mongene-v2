problem_text: 下の図で、3本の直線u, w, tは平行である。直線qはu, w, tとそれぞれ点K, L, Mで交わり、直線vはu, w, tとそれぞれ点N, P, Qで交わる。KL=9cm, NP=6cm, PQ=12cm のとき、線分LMの長さを求めよ。
