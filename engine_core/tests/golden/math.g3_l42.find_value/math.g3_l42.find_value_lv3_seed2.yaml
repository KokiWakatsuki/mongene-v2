    display: 18cm
    kind: symbolic
    srepr: Integer(18)
  cause_tags: []
  concept_tags:
  - parallel_segment.transversal_ratio
  explanation: 'まず、3本の平行な直線が2本の直線と交わるとき、対応する線分の比が等しくなることを見つける。（9:6 = x:12）

    次に、対応する線分の比が等しいことから、比例式を立てて長さを求める。（18cm）'
  hints:
  - 3本の平行線が2直線を切る線分の比から辺の長さを求める
  label: (1)
