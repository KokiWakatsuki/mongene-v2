    display: 9cm
    kind: symbolic
    srepr: Integer(9)
  cause_tags: []
  concept_tags:
  - parallel_segment.transversal_ratio
  explanation: 'まず、3本の平行な直線が2本の直線と交わるとき、対応する線分の比が等しくなることを見つける。（18:16 = x:8）

    次に、対応する線分の比が等しいことから、比例式を立てて長さを求める。（9cm）'
  hints:
  - 3本の平行な直線が2本の直線と交わるとき、対応する線分の比が等しくなることを見つける。
