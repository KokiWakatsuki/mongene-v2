problem_text: 下の図で、3本の直線w, r, sは平行である。直線uはw, r, sとそれぞれ点U, V, Wで交わり、直線zはw, r, sとそれぞれ点X, Y, Zで交わる。UV=18cm, XY=16cm, YZ=8cm のとき、線分VWの長さを求めよ。
sub_questions:
