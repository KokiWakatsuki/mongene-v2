problem_text: 三角形QRSで、辺QR, QS上に点T, Uがある。QT=2cm, TR=6cm, QU=8cm, US=24cm である。TU=9cm のとき、TUとRSが平行であることを確かめたうえで、辺RSの長さを求めよ。
