problem_ref: 6390630791a7fcb0
problem_text: 下の図の三角形TUVで、辺TU, TV上に点W, Xがある。TW=4cm, WU=12cm, TX=8cm, XV=24cm である。WX=10cm のとき、WXとUVが平行であることを確かめたうえで、辺UVの長さを求めよ。
sub_questions:
- answer:
    display: 40cm
    kind: symbolic
    srepr: Integer(40)
  cause_tags: []
  concept_tags:
  - parallel_segment.judge_then_length
  explanation: 'まず、TW:WUとTX:XVを、それぞれ簡単な比にすると 1:3 と 1:3 で、等しい。（1:3 と 1:3）

    次に、平行線と線分の比の定理の逆から、WXとUVが平行であるかどうかを判別する。（平行である）

    次に、WX∥UV であることから、三角形TWXと三角形TUVが相似になることを見つける。（三角形TWX と 三角形TUV）

    次に、TWとWUをたして、辺TU全体の長さを求める。（TU = 4 + 12 = 16）

    最後に、4:16 = 10:UV を解いて、辺UVの長さを求める。（40cm）'
  hints:
  - TW:WUとTX:XVの比が等しいかどうかを比べる。
  - 平行線と線分の比の定理の逆から、WXとUVが平行であるかどうかを判別する。
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: TW:WUとTX:XVを、それぞれ簡単な比にすると 1:3 と 1:3 で、等しい。
    narration: TW:WUとTX:XVの比が等しいかどうかを比べる。
    op: compare_division_ratios
    result_display: 1:3 と 1:3
    result_srepr: ''
  - args: []
    detail: ''
    narration: 平行線と線分の比の定理の逆から、WXとUVが平行であるかどうかを判別する。
    op: judge_by_parallel_ratio_converse
    result_display: 平行である
    result_srepr: 'true'
  - args: []
    detail: ''
    narration: WX∥UV であることから、三角形TWXと三角形TUVが相似になることを見つける。
    op: identify_similar_triangles_from_parallel
    result_display: 三角形TWX と 三角形TUV
    result_srepr: ''
  - args: []
    detail: ''
    narration: TWとWUをたして、辺TU全体の長さを求める。
    op: compose_whole_side
    result_display: TU = 4 + 12 = 16
    result_srepr: ''
  - args: []
    detail: 4:16 = 10:UV を解いて、辺UVの長さを求める。
    narration: TW:TU=WX:UV が成り立つことから、辺UVの長さを求める。
    op: apply_parallel_segment_ratio
    result_display: 40cm
    result_srepr: Integer(40)
