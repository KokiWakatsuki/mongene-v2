problem_ref: 947cc4a9790e446a
problem_text: 三角形PQRで、辺PQ, PR上に点S, Tがある。PS=9cm, SQ=5cm, PT=18cm, TR=10cm である。ST=18cm のとき、STとQRが平行であることを確かめたうえで、辺QRの長さを求めよ。
sub_questions:
- answer:
    display: 28cm
    kind: symbolic
    srepr: Integer(28)
  cause_tags: []
  concept_tags:
  - parallel_segment.judge_then_length
  explanation: 'まず、PS:SQとPT:TRを、それぞれ簡単な比にすると 9:5 と 9:5 で、等しい。（9:5 と 9:5）

    次に、平行線と線分の比の定理の逆から、STとQRが平行であるかどうかを判別する。（平行である）

    次に、ST∥QR であることから、三角形PSTと三角形PQRが相似になることを見つける。（三角形PST と 三角形PQR）

    次に、PSとSQをたして、辺PQ全体の長さを求める。（PQ = 9 + 5 = 14）

    最後に、9:14 = 18:QR を解いて、辺QRの長さを求める。（28cm）'
  hints:
  - PS:SQとPT:TRの比が等しいかどうかを比べる。
  - 平行線と線分の比の定理の逆から、STとQRが平行であるかどうかを判別する。
