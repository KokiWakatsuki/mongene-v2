problem_ref: 61a7df8011a13b9b
problem_text: 三角形PQRで、辺PQ, PR上に点S, Tがある。PS=8cm, SQ=9cm, PT=32cm, TR=36cm である。ST=8cm のとき、STとQRが平行であることを確かめたうえで、辺QRの長さを求めよ。
sub_questions:
- answer:
    display: '17'
    kind: symbolic
    srepr: Integer(17)
  cause_tags: []
  concept_tags:
  - parallel_segment.judge_then_length
  explanation: 'まず、PS:SQとPT:TRの比が等しいかどうかを比べる。（8:9 と 32:36）

    次に、平行線と線分の比の定理の逆から、STとQRが平行であるかどうかを判別する。（平行である）

    次に、ST∥QR であることから、三角形PSTと三角形PQRが相似になることを見つける。（三角形PST と 三角形PQR）

    最後に、PS:PQ=ST:QR が成り立つことから、辺QRの長さを求める。（17）'
  hints:
  - PS:SQとPT:TRの比が等しいかどうかを比べる。
  - 平行線と線分の比の定理の逆から、STとQRが平行であるかどうかを判別する。
  - ST∥QR であることから、三角形PSTと三角形PQRが相似になることを見つける。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    narration: PS:SQとPT:TRの比が等しいかどうかを比べる。
    op: compare_division_ratios
    result_display: 8:9 と 32:36
    result_srepr: ''
  - args: []
    narration: 平行線と線分の比の定理の逆から、STとQRが平行であるかどうかを判別する。
    op: judge_by_parallel_ratio_converse
    result_display: 平行である
    result_srepr: 'true'
  - args: []
    narration: ST∥QR であることから、三角形PSTと三角形PQRが相似になることを見つける。
    op: identify_similar_triangles_from_parallel
    result_display: 三角形PST と 三角形PQR
    result_srepr: ''
  - args: []
    narration: PS:PQ=ST:QR が成り立つことから、辺QRの長さを求める。
    op: apply_parallel_segment_ratio
    result_display: '17'
    result_srepr: Integer(17)
