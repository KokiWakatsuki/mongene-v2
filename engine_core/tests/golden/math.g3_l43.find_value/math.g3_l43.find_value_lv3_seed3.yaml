problem_ref: 947cc4a9790e446a
problem_text: 下の図の三角形PQRで、辺PQ, PR上に点S, Tがある。PS=9cm, SQ=5cm, PT=18cm, TR=10cm である。ST=18cm のとき、STとQRが平行であることを確かめたうえで、辺QRの長さを求めよ。
sub_questions:
- answer:
    display: 28cm
    kind: symbolic
    srepr: Integer(28)
  cause_tags: []
  concept_tags:
  - parallel_segment.judge_then_length
  explanation: 'まず、PS:SQとPT:TRを、それぞれ簡単な比にすると 9:5 と 9:5 で、等しい。（9:5 と 9:5）

    次に、平行線と線分の比の定理の逆から、STとQRが平行であるかどうかを判別する。（平行である）

    次に、ST∥QR であることから、三角形PSTと三角形PQRが相似になることを見つける。（三角形PST と 三角形PQR）

    次に、PSとSQをたして、辺PQ全体の長さを求める。（PQ = 9 + 5 = 14）

    最後に、9:14 = 18:QR を解いて、辺QRの長さを求める。（28cm）'
  hints:
  - PS:SQとPT:TRの比が等しいかどうかを比べる。
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: PS:SQとPT:TRを、それぞれ簡単な比にすると 9:5 と 9:5 で、等しい。
    narration: PS:SQとPT:TRの比が等しいかどうかを比べる。
    op: compare_division_ratios
    result_display: 9:5 と 9:5
    result_srepr: ''
  - args: []
    detail: ''
    narration: 平行線と線分の比の定理の逆から、STとQRが平行であるかどうかを判別する。
    op: judge_by_parallel_ratio_converse
    result_display: 平行である
    result_srepr: 'true'
  - args: []
    detail: ''
    narration: ST∥QR であることから、三角形PSTと三角形PQRが相似になることを見つける。
    op: identify_similar_triangles_from_parallel
    result_display: 三角形PST と 三角形PQR
    result_srepr: ''
  - args: []
    detail: ''
    narration: PSとSQをたして、辺PQ全体の長さを求める。
    op: compose_whole_side
    result_display: PQ = 9 + 5 = 14
    result_srepr: ''
  - args: []
    detail: 9:14 = 18:QR を解いて、辺QRの長さを求める。
    narration: PS:PQ=ST:QR が成り立つことから、辺QRの長さを求める。
    op: apply_parallel_segment_ratio
    result_display: 28cm
    result_srepr: Integer(28)
