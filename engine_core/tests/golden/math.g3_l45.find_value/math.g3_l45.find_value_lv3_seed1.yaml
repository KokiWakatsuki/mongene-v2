  explanation: 'まず、NRとRPの比から、NRとNP全体の比になおす。（NR:NP = 7:18）

    次に、三角形NRSと三角形NPQは相似であることから、面積比は相似比の二乗に等しいことを使って、三角形NRSと三角形NPQ全体の面積比を求める。（49:324）

