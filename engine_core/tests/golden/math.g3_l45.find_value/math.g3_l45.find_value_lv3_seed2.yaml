  cause_tags: []
  concept_tags:
  - similarity.trapezoid_area_ratio
  explanation: 'まず、RUとUSの比から、RUとRS全体の比になおす。（RU:RS = 9:22）

    次に、三角形RUVと三角形RSTは相似であることから、面積比は相似比の二乗に等しいことを使って、三角形RUVと三角形RST全体の面積比を求める。（81:484）

    最後に、三角形RST全体の面積から三角形RUVの面積を除いた残りが台形の面積になることから、三角形RUVと台形の面積比を求める。（三角形RUV:台形USTV = 81:403）'
