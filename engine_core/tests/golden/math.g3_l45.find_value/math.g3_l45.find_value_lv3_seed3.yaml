    display: 三角形MQR:台形QNPR = 1:3
    kind: symbolic
    srepr: Tuple(Integer(1), Integer(3))
  cause_tags: []
  concept_tags:
  - similarity.trapezoid_area_ratio
  explanation: 'まず、MQとQNの比から、MQとMN全体の比になおす。（MQ:MN = 1:2）

    次に、三角形MQRと三角形MNPは相似であることから、面積比は相似比の二乗に等しいことを使って、三角形MQRと三角形MNP全体の面積比を求める。（1:4）

    最後に、三角形MNP全体の面積から三角形MQRの面積を除いた残りが台形の面積になることから、三角形MQRと台形の面積比を求める。（三角形MQR:台形QNPR = 1:3）'
  hints:
  - MQとQNの比から、MQとMN全体の比になおす。
  - 三角形MQRと三角形MNPは相似であることから、面積比は相似比の二乗に等しいことを使って、三角形MQRと三角形MNP全体の面積比を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
