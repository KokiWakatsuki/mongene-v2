problem_ref: 346fd47dd6d3808a
problem_text: 下の図のように、相似な2つの正四角錐E, Rがあり、相似比は 2:5 である。EとRの表面積の比と体積の比をそれぞれ求めよ。
sub_questions:
- answer:
    display: 表面積の比 4:25、体積の比 8:125
    kind: symbolic
    srepr: Tuple(Integer(4), Integer(25), Integer(8), Integer(125))
  cause_tags: []
  concept_tags:
  - similarity.solid_surface_volume_ratio
  explanation: 'まず、相似な立体の表面積の比は相似比の二乗に等しいことから、表面積の比を求める。（4:25）

    次に、相似比 2:5 を三乗して、2³:5³ = 8:125 を求める。（8:125）'
  hints:
  - 相似比から表面積比・体積比を直接求める
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: ''
    narration: 相似な立体の表面積の比は相似比の二乗に等しいことから、表面積の比を求める。
    op: square_ratio_for_surface_area
    result_display: '4:25'
    result_srepr: ''
  - args: []
    detail: 相似比 2:5 を三乗して、2³:5³ = 8:125 を求める。
    narration: 相似な立体の体積の比は相似比の三乗に等しいことから、体積の比を求める。
    op: cube_ratio_for_volume
    result_display: 8:125
    result_srepr: Tuple(Integer(4), Integer(25), Integer(8), Integer(125))
