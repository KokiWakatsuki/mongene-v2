problem_ref: d4c3c98dfd1f96dd
problem_text: 下の図で、4点P, Q, R, Sがこの順に円周上にある。∠QPR=40°、∠PRS=61° であるとき、2本の弦PR, QSの交点をTとして、∠PTQの大きさを求めよ。
sub_questions:
- answer:
    display: 79°
    kind: symbolic
    srepr: Integer(79)
  cause_tags: []
  concept_tags:
  - circle.two_chords_intersection_angle
  explanation: 'まず、与えられた2つの角のうち一方は、交点でできる三角形の頂点の角と同じ弧に対する円周角である。だからその角も 61° になる。（61°）

    次に、交点でできる三角形の内角の和は 180° だから、180° - 40° - 61° = 79°。（79°）'
  hints:
  - 2つの円周角から2本の弦の交点にできる角の大きさを求める
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: 与えられた2つの角のうち一方は、交点でできる三角形の頂点の角と同じ弧に対する円周角である。だからその角も 61° になる。
    narration: 同じ弧に対する円周角は等しいので、交点でできる三角形のもう一つの角の大きさが分かる。
    op: equal_inscribed_angles_on_same_arc
    result_display: 61°
    result_srepr: ''
  - args: []
    detail: 交点でできる三角形の内角の和は 180° だから、180° - 40° - 61° = 79°。
    narration: 三角形の内角の和から、残りの角として求める角を計算する。
    op: apply_triangle_angle_sum
    result_display: 79°
    result_srepr: Integer(79)
