problem_ref: d4bc53b0d0b13b75
problem_text: 下の図で、4点D, E, F, Gがこの順に円周上にある。∠EDF=24°、∠DFG=65° であるとき、2本の弦DF, EGの交点をHとして、∠DHEの大きさを求めよ。
sub_questions:
- answer:
    display: 91°
    kind: symbolic
    srepr: Integer(91)
  cause_tags: []
  concept_tags:
  - circle.two_chords_intersection_angle
  explanation: 'まず、与えられた2つの角のうち一方は、交点でできる三角形の頂点の角と同じ弧に対する円周角である。だからその角も 65° になる。（65°）

    次に、交点でできる三角形の内角の和は 180° だから、180° - 24° - 65° = 91°。（91°）'
  hints:
  - 2つの円周角から2本の弦の交点にできる角の大きさを求める
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: 与えられた2つの角のうち一方は、交点でできる三角形の頂点の角と同じ弧に対する円周角である。だからその角も 65° になる。
    narration: 同じ弧に対する円周角は等しいので、交点でできる三角形のもう一つの角の大きさが分かる。
    op: equal_inscribed_angles_on_same_arc
    result_display: 65°
    result_srepr: ''
  - args: []
    detail: 交点でできる三角形の内角の和は 180° だから、180° - 24° - 65° = 91°。
    narration: 三角形の内角の和から、残りの角として求める角を計算する。
    op: apply_triangle_angle_sum
    result_display: 91°
    result_srepr: Integer(91)
