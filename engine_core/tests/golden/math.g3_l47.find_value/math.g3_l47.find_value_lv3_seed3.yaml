  cause_tags: []
  concept_tags:
  - circle.two_chords_intersection_angle
  explanation: 'まず、円周角の定理から、それぞれの円周角に対応する弧の大きさを求める。（48° と 130°）

    次に、2本の弦の交点にできる角の大きさは、向かい合う2つの弧の大きさの和の半分に等しい。向かい合う弧の和は、円周全体の360°から、先に求めた2つの弧をひいて 182° だから、求める角はその半分になる。（91°）'
  hints:
  - 円周角の定理から、それぞれの円周角に対応する弧の大きさを求める。
