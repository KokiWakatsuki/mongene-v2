  explanation: 'まず、∠PRQ と ∠PSQ が等しく、R と S は直線PQの同じ側にあるので、4点P、Q、R、S は同一円周上にある。（4点P、Q、R、S は同一円周上にある）

    次に、∠SPR と ∠SQR はどちらも弧SRに対する円周角なので、等しい。（16°）'
