  explanation: 'まず、∠JLK と ∠JMK が等しく、L と M は直線JKの同じ側にあるので、4点J、K、L、M は同一円周上にある。（4点J、K、L、M は同一円周上にある）

    次に、∠MJL と ∠MKL はどちらも弧MLに対する円周角なので、等しい。（60°）'
  hints:
