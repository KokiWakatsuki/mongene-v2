  explanation: 'まず、円周をn等分してできる1つの弧に対する中心角から、その弧に対する円周角を求める。（20°）

    次に、角の頂点をふくまない側の弧が、等分した弧の何個分にあたるかを数える。（5個分）

    最後に、弧の長さは円周角の大きさに比例することから、求める角の大きさを求める。（100°）'
  hints:
