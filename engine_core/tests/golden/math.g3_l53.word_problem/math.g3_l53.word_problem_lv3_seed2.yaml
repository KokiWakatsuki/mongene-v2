  - pythagorean.word_problem_rhombus_diagonal_area
  explanation: 'まず、ひし形の対角線は、それぞれの中点で垂直に交わるから、与えられた対角線の長さの半分をとって、直角三角形の直角をはさむ辺の長さを求める。（7 cm）

    次に、ひし形の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理からもう一方の辺の長さを求める。（3√23 cm）

    最後に、求めた長さは対角線の半分だから、これをもとにもどして、対角線全体の長さを求める。（6√23 cm）'
  hints:
  - ひし形の対角線は、それぞれの中点で垂直に交わるから、与えられた対角線の長さの半分をとって、直角三角形の直角をはさむ辺の長さを求める。
  - ひし形の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理からもう一方の辺の長さを求める。
  label: (1)
  prompt_text: 答えを求めなさい。
