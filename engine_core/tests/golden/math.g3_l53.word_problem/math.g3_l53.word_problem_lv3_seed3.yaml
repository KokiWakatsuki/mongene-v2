- answer:
    display: 24 cm
    kind: symbolic
    srepr: Integer(24)
  cause_tags: []
  concept_tags:
  - pythagorean.word_problem_rhombus_diagonal_area
  explanation: 'まず、ひし形の対角線は、それぞれの中点で垂直に交わるから、与えられた対角線の長さの半分をとって、直角三角形の直角をはさむ辺の長さを求める。（16 cm）

    次に、ひし形の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理からもう一方の辺の長さを求める。（12 cm）

    最後に、求めた長さは対角線の半分だから、これをもとにもどして、対角線全体の長さを求める。（24 cm）'
  hints:
  - ひし形の1辺と対角線の一方から、もう一方の対角線と面積を三平方の定理で求める
  label: (1)
  prompt_text: ''
  solution_steps:
