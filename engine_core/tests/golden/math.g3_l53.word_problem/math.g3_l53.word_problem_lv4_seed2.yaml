problem_ref: 0f74826248d3df25
problem_text: 'QRが13cm、RSが21cm、SQが20cmの三角形QRSがある。

  必要な補助線を自分で引き、辺RSを底辺としたときの高さと三角形QRSの面積を求めよ。'
sub_questions:
- answer:
    display: 高さ 12 cm、面積 126 cm²
    kind: symbolic
    srepr: Tuple(Integer(12), Integer(126))
  cause_tags: []
  concept_tags:
  - pythagorean.word_problem_triangle_height_area_solo
  explanation: 'まず、3辺の長さしかわかっていないので、頂点から底辺に垂線を引く補助線を自分で入れる。底辺が2つに分かれて、高さを共有する直角三角形が2つできる。（頂点から底辺への垂線）

    次に、分かれた底辺の一方の長さを文字でおくと、もう一方は底辺の長さからその分をひいた残りになる。（5 cm）

    次に、2つの直角三角形それぞれで、高さの二乗を三平方の定理で表す。高さは共通だから、その2つの式は等しい。この方程式を解いて、分けた底辺の長さを求める。（13² - x² = 20² - (21 - x)²）

    次に、求めた長さを一方の直角三角形にあてはめて、三平方の定理から高さを求める。（12 cm）

    最後に、底辺と、いま求めた高さから、三角形の面積を求める。（126 cm²）'
  hints:
