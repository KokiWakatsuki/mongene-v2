problem_ref: 4796a26e289d12fe
problem_text: '底面が1辺6cmの正方形NPQRで、底面以外の辺の長さがすべて8cmである正四角錐T-NPQRがある。

  (1) この正四角錐の高さを求めよ。

  (2) この正四角錐の体積を求めよ。'
sub_questions:
- answer:
    display: √46 cm
    kind: symbolic
    srepr: Pow(Integer(46), Rational(1, 2))
  cause_tags: []
  concept_tags:
  - pythagorean.word_problem_square_pyramid_volume
  explanation: 'まず、底面は正方形だから、となり合う辺を直角をはさむ2辺とみて、三平方の定理から底面の対角線の長さを求める。（6√2 cm）

    次に、頂点から底面に下ろした垂線の足は底面の対角線の交点だから、対角線の長さの半分が、直角三角形の直角をはさむ一方の辺になる。（3√2 cm）

    最後に、側面の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理から高さを求める。（√46 cm）'
  hints:
  - 正四角錐の底面の1辺と側辺から、高さと体積を三平方の定理で求める
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: ''
    narration: 底面は正方形だから、となり合う辺を直角をはさむ2辺とみて、三平方の定理から底面の対角線の長さを求める。
    op: compute_base_diagonal
    result_display: 6√2 cm
    result_srepr: Mul(Integer(6), Pow(Integer(2), Rational(1, 2)))
  - args: []
    detail: ''
    narration: 頂点から底面に下ろした垂線の足は底面の対角線の交点だから、対角線の長さの半分が、直角三角形の直角をはさむ一方の辺になる。
    op: halve_base_diagonal
    result_display: 3√2 cm
    result_srepr: Mul(Integer(3), Pow(Integer(2), Rational(1, 2)))
  - args: []
    detail: ''
    narration: 側面の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理から高さを求める。
    op: apply_pythagorean_theorem
    result_display: √46 cm
    result_srepr: Pow(Integer(46), Rational(1, 2))
