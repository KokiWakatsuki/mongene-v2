problem_text: '底面が1辺24cmの正方形PQRSで、底面以外の辺の長さがすべて21cmである正四角錐X-PQRSがある。

  (1) この正四角錐の高さを求めよ。

  (2) この正四角錐の体積を求めよ。'
sub_questions:
- answer:
    display: 3√17 cm
    kind: symbolic
    srepr: Mul(Integer(3), Pow(Integer(17), Rational(1, 2)))
  cause_tags: []
  concept_tags:
  - pythagorean.word_problem_square_pyramid_volume
  explanation: 'まず、底面は正方形だから、となり合う辺を直角をはさむ2辺とみて、三平方の定理から底面の対角線の長さを求める。（24√2 cm）

    次に、頂点から底面に下ろした垂線の足は底面の対角線の交点だから、対角線の長さの半分が、直角三角形の直角をはさむ一方の辺になる。（12√2 cm）

    最後に、側面の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理から高さを求める。（3√17 cm）'
  hints:
  - 底面は正方形だから、となり合う辺を直角をはさむ2辺とみて、三平方の定理から底面の対角線の長さを求める。
  label: (1)
  prompt_text: ''
  solution_steps:
  - args: []
    detail: ''
    narration: 底面は正方形だから、となり合う辺を直角をはさむ2辺とみて、三平方の定理から底面の対角線の長さを求める。
