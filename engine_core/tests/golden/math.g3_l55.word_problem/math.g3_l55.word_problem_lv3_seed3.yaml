    op: halve_base_diagonal
    result_display: 12√2 cm
    result_srepr: Mul(Integer(12), Pow(Integer(2), Rational(1, 2)))
  - args: []
    detail: ''
    narration: 側面の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理から高さを求める。
