problem_text: '1辺が21cmの立方体DEFG-HIJKがある。ここでDEFGは底面、HIJKは上面で、辺DHが高さにあたる。

  頂点Eから平面DFIに下ろした垂線の長さを、立体の体積を二通りに表す方針を自分で立てて求めよ。'
