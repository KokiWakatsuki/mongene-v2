problem_text: '1辺が30cmの立方体STUV-WXYZがある。ここでSTUVは底面、WXYZは上面で、辺SWが高さにあたる。

  頂点Tから平面SUXに下ろした垂線の長さを、立体の体積を二通りに表す方針を自分で立てて求めよ。'
