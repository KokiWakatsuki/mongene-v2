problem_text: '1辺が6cmの立方体PQRS-TUVWがある。ここでPQRSは底面、TUVWは上面で、辺PTが高さにあたる。

  頂点Qから平面PRUに下ろした垂線の長さを、立体の体積を二通りに表す方針を自分で立てて求めよ。'
