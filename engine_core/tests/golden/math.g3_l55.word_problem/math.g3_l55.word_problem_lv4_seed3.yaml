  explanation: 'まず、三角錐の体積を、直角をはさむ三つの辺を使う見方と、求める垂線を高さとみる見方の二通りで表すことにする。（36 cm³）

    次に、底面とみる三角形は正三角形なので、その一辺の長さから面積を求める。（18√3 cm²）

    最後に、二通りに表した体積が等しいとおいて、垂線の長さについて解く。（2√3 cm）'
