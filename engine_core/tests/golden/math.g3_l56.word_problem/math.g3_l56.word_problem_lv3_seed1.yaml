problem_ref: 5254b759e83945b9
problem_text: '辺EFの長さが6cm、辺FGの長さが6cm、高さが15cmの直方体EFGH-IJKLの形をした箱がある。ここでEFGHは底面、IJKLは上面で、辺EIが高さにあたる。この箱の表面上を、頂点Eから、側面EFJIと側面FGKJを通って、頂点Kまで進む。

  (1) 進む道のりが最も短くなるときの、その道のりの長さを求めよ。

  (2) この二つの側面の面積の和を求めよ。'
