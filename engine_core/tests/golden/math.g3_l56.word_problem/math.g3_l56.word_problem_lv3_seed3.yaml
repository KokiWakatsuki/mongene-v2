problem_ref: 87d9baef852a8de1
problem_text: '辺MNの長さが12cm、辺NOの長さが8cm、高さが10cmの直方体MNOP-QRSTの形をしたケースがある。ここでMNOPは底面、QRSTは上面で、辺MQが高さにあたる。このケースの表面上を、頂点Mから、側面MNRQと側面NOSRを通って、頂点Sまで進む。

  (1) 進む道のりが最も短くなるときの、その道のりの長さを求めよ。

  (2) この二つの側面の面積の和を求めよ。'
sub_questions:
- answer:
    display: 10√5 cm
    kind: symbolic
    srepr: Mul(Integer(10), Pow(Integer(5), Rational(1, 2)))
  cause_tags: []
  concept_tags:
  - pythagorean.word_problem_box_shortest_path
  explanation: 'まず、表面上の最短の道のりを考えるために、通る二つの側面を一つの平面に開いた展開図をかく。（横 20、縦 10 の長方形）

    次に、開いた図では二つの側面が横に並んだ長方形になり、道のりが最も短くなるのは出発点と到着点を結ぶ線分のときだから、その線分を斜辺とする直角三角形をとらえる。（20 cm）

    最後に、直角をはさむ2辺は、底面の二つの辺の長さの和と、直方体の高さだから、三平方の定理から最短の道のりを求める。（10√5 cm）'
  hints:
  - 直方体の側面を展開して、表面上の最短の道のりと通る側面の面積を求める
  label: (1)
