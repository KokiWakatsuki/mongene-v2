problem_text: '辺LMの長さが11cm、辺MNの長さが2cm、高さが9cmの直方体LMNO-PQRSの形をした容器がある。ここでLMNOは底面、PQRSは上面で、辺LPが高さにあたる。

  この容器の表面上を頂点Lから頂点Rまで進むとき、どの面をどのように開くと最短になるかを自分で判断し、その最短の道のりを求めよ。'
