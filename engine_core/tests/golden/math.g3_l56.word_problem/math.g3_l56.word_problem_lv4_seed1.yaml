  explanation: 'まず、となり合う二つの面の開き方が三通りあることを確かめ、それぞれで開いた長方形の縦と横を書き出す。（11√2 cm、5√10 cm、2√101 cm）

    次に、開いた長方形の対角線の長さを三通りとも式にして比べ、最も短くなるのがどれかを決める。（最も短いのは 11√2 cm）

    最後に、選んだ開き方の長方形について、対角線の長さを三平方の定理で求める。（11√2 cm）'
