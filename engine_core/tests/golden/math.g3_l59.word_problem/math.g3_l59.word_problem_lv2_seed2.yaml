problem_text: 'ある池にいる魚の総数を調べるため、無作為に150匹の魚を調べたところ、そのうち印のついた魚が15匹いた。この池にはあらかじめ印をつけた魚が80匹放してある。

  この池にいる魚の総数を x 匹とする。

  (1) 標本での印つきの魚の割合を求めよ。

  (2) この池の魚のおよその総数を求めよ。'
