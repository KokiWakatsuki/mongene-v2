problem_ref: 628a0edd06e4aaea
problem_text: 'ある工場で1日に作られる大量の製品から無作為に100個を取り出したところ、不良品が12個含まれていた。この日に作られた製品は6000個である。

  この中に含まれる不良品はおよそ何個と推定できるか求めよ。'
sub_questions:
- answer:
    display: 720個
    kind: symbolic
    srepr: Integer(720)
  cause_tags: []
  concept_tags:
  - sample_survey.word_problem_defect_estimate
  explanation: 'まず、標本の中で、該当するものの個数と標本全体の個数を確認する。（標本の大きさと、そのうち該当するものの個数）

    次に、該当するものの個数を標本の大きさでわり、標本での割合を求める。（0.12）

    次に、標本での該当する個数の割合が、母集団全体でもおよそ等しいとみて比例式をつくる。（12 : 100 = x : 6000）

    最後に、比例式を解き、母集団に含まれるおよその個数を求める。（720）'
  hints:
  - 母集団の大きさと標本の不良率から母集団中の該当個数を推定する
  label: (1)
  prompt_text: ''
  solution_steps:
