problem_text: '湖にいるコイの数を調べるため、30匹のコイを捕まえて印をつけて湖にもどした。数日後に同じ湖で100匹のコイを捕まえると、そのうち印のついたコイが15匹いた。

  この湖にいるコイの総数を x 匹とする。

  (1) この標本での印つきのコイの割合を求めよ。

  (2) この湖にいるコイのおよその総数を求めよ。'
