problem_ref: b9834bf3d11680e4
problem_text: '袋の中に大量の白玉が入っている。この袋の中の白玉の総数を、玉を数えずに標本調査で推定したい。同じ大きさの赤玉を100個袋に加えてよくかき混ぜ、無作為に100個を取り出したところ、そのうち赤玉が10個だった。

  はじめに入っていた白玉のおよその総数を求めよ。'
sub_questions:
- answer:
    display: 900個
    kind: symbolic
    srepr: Integer(900)
  cause_tags: []
  concept_tags:
  - sample_survey.word_problem_population_modeling
  explanation: 'まず、標本の中で、該当するものの個数と標本全体の個数を確認する。（標本の大きさと、そのうち該当するものの個数）

    次に、該当するものの個数を標本の大きさでわり、標本での割合を求める。（0.1）

    次に、標本での該当する個数の割合が、母集団全体でもおよそ等しいとみて、母集団の大きさ x を含む比例式をつくる。（10 : 100 = 100 : x）

    次に、比例式を解き、母集団の大きさ x を求める。（1000）

    最後に、求めた全体の個数から、はじめに加えた赤玉の個数を引いて、もとからあった白玉の総数を求める。（900個）'
  hints:
  - 既知数の対象を加えるモデル化から母集団を推定し差し引く
  label: (1)
  prompt_text: ''
  solution_steps:
