problem_ref: 7ed4261303dd9138
problem_text: '赤・白・青のビーズの個数の比は2:1:2で、全部で100個ある。

  白のビーズの個数を求めよ。'
sub_questions:
- answer:
    display: 20個
    kind: symbolic
    srepr: Integer(20)
  cause_tags: []
  concept_tags:
  - equation.word_problem_continued_ratio
  explanation: 'まず、連比の各項をたして、全体がいくつ分にあたるかを求める。（全体は5）

    次に、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（白の個数と全体の個数の比）

    次に、その量を x を使って両辺に表し、方程式をつくる。（1:5 = x:100）

    次に、比例式の性質を使い、外項の積と内項の積が等しい式（たすきがけ）をつくる。（たすきがけの式をつくる）

    最後に、x の係数で両辺をわって、x の値を求める。（x = 20）'
  hints:
  - 連比の各項をたして、全体がいくつ分にあたるかを求める。
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 比例式の性質を使い、外項の積と内項の積が等しい式（たすきがけ）をつくる。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    narration: 連比の各項をたして、全体がいくつ分にあたるかを求める。
    op: sum_ratio_parts
    result_display: 全体は5
    result_srepr: Symbol('x')
  - args: []
    narration: 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
    op: find_equal_relation
    result_display: 白の個数と全体の個数の比
    result_srepr: Symbol('x')
  - args: []
    narration: その量を x を使って両辺に表し、方程式をつくる。
    op: formulate_equation
    result_display: 1:5 = x:100
    result_srepr: Equality(Mul(Integer(5), Symbol('x')), Integer(100))
  - args: []
    narration: 比例式の性質を使い、外項の積と内項の積が等しい式（たすきがけ）をつくる。
    op: cross_multiply
    result_display: たすきがけの式をつくる
    result_srepr: Integer(20)
  - args: []
    narration: x の係数で両辺をわって、x の値を求める。
