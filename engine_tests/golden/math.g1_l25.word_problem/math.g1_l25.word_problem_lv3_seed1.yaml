problem_text: 'ある店で、1本200円の定規と1本110円のボールペンを買った。ボールペンは定規より2本多く買い、代金の合計は2390円だった。

  定規を買った本数を求めよ。'
sub_questions:
- answer:
    display: 7本
    kind: symbolic
    srepr: Integer(7)
  cause_tags: []
  concept_tags:
  - equation.word_problem_price_count_diff
  explanation: まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。 代金の合計次に、その量を x を使って両辺に表し、方程式をつくる。 200x + 110(x + 2) = 2390次に、分配法則を使って、かっこを外す。 かっこを外す最後に、文字の項を左辺に、数の項を右辺に移項し、両辺を整理して解く。 x = 7
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 分配法則を使って、かっこを外す。
