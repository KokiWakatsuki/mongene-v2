    op: formulate_equation
    result_display: 90x + 150(x + 3) = 930
    result_srepr: Equality(Add(Mul(Integer(240), Symbol('x')), Integer(450)), Integer(930))
  - args: []
    narration: 分配法則を使って、かっこを外す。
    op: expand_parentheses
    result_display: かっこを外す
    result_srepr: Integer(2)
