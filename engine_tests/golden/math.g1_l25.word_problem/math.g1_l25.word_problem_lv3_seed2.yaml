problem_ref: 1820c468e770678a
problem_text: 'ある店で、1個90円の消しゴムと1冊150円のノートを買った。ノートは消しゴムより3冊多く買い、代金の合計は930円だった。

  消しゴムを買った個数を求めよ。'
sub_questions:
- answer:
    display: 2個
    kind: symbolic
    srepr: Integer(2)
  cause_tags: []
  concept_tags:
  - equation.word_problem_price_count_diff
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（代金の合計）

    次に、その量を x を使って両辺に表し、方程式をつくる。（90x + 150(x + 3) = 930）

    次に、分配法則を使って、かっこを外す。（かっこを外す）

    最後に、文字の項を左辺に、数の項を右辺に移項し、両辺を整理して解く。（x = 2）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 分配法則を使って、かっこを外す。
  label: (1)
  prompt_text: value を求めなさい。
  solution_steps:
