problem_ref: f3827fff2176af19
problem_text: 'ある店で、1個180円の消しゴムと1冊130円のファイルを買った。ファイルは消しゴムより5冊多く買い、代金の合計は2510円だった。

  消しゴムを買った個数を求めよ。'
sub_questions:
- answer:
    display: 6個
    kind: symbolic
    srepr: Integer(6)
  cause_tags: []
  concept_tags:
  - equation.word_problem_price_count_diff
  explanation: まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。 代金の合計次に、その量を x を使って両辺に表し、方程式をつくる。 180x + 130(x + 5) = 2510次に、分配法則を使って、かっこを外す。 かっこを外す最後に、文字の項を左辺に、数の項を右辺に移項し、両辺を整理して解く。 x = 6
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 分配法則を使って、かっこを外す。
  label: (1)
  prompt_text: value を求めなさい。
  solution_steps:
  - args: []
    narration: 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
    op: find_equal_relation
    result_display: 代金の合計
    result_srepr: Symbol('x')
  - args: []
    narration: その量を x を使って両辺に表し、方程式をつくる。
    op: formulate_equation
    result_display: 180x + 130(x + 5) = 2510
    result_srepr: Equality(Add(Mul(Integer(310), Symbol('x')), Integer(650)), Integer(2510))
  - args: []
    narration: 分配法則を使って、かっこを外す。
    op: expand_parentheses
    result_display: かっこを外す
    result_srepr: Integer(6)
  - args: []
    narration: 文字の項を左辺に、数の項を右辺に移項し、両辺を整理して解く。
    op: transpose_and_solve
    result_display: x = 6
    result_srepr: Integer(6)
