problem_ref: 2190a72ea93893c5
problem_text: '長いすに見学者を座らせる。1脚に4人ずつ座ると10人が座れず、1脚に5人ずつ座ると最後の1脚だけ1人になり、いすはちょうど埋まった。

  見学者の人数を求めよ。'
sub_questions:
