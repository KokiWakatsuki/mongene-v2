    display: 66人
    kind: symbolic
    srepr: Integer(66)
  cause_tags: []
  concept_tags:
  - equation.word_problem_seat_shortage
  explanation: まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。 見学者の全体の人数次に、その量を x を使って両辺に表し、方程式をつくる。 4x + 10 = 5(x - 1) + 1次に、分配法則を使って、かっこを外す。 かっこを外す次に、文字の項を左辺に、数の項を右辺に移項し、両辺を整理して解く。 x = 14最後に、求めた x をもとに、問われている量を計算する。
    66人
