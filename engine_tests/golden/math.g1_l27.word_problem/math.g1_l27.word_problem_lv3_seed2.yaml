problem_ref: d15163031547131f
problem_text: 'Aさんは分速120mで家を出発し、その3分後にBさんが分速160mの自転車で同じ道を追いかけた。

  BさんがAさんに追いつくのは、Bさんが出発してから何分後か求めよ。'
sub_questions:
- answer:
    display: 9分
    kind: symbolic
    srepr: Integer(9)
  cause_tags: []
  concept_tags:
  - equation.word_problem_catch_up
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（追いついたときに2人が進んだ道のり）

    次に、その量を x を使って両辺に表し、方程式をつくる。（120(x + 3) = 160x）

    次に、分配法則を使って、かっこを外す。（かっこを外す）

    最後に、文字の項を左辺に、数の項を右辺に移項し、両辺を整理して解く。（x = 9）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - 分配法則を使って、かっこを外す。
  label: (1)
  prompt_text: 答えを求めなさい。
