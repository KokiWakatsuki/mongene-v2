problem_text: '家から公園まで、行きは時速4km、帰りは同じ道を時速12kmの速さで進んだところ、往復にかかった時間は15時間だった。

  家から公園までの片道の道のりと、往復の平均の速さを求めよ。'
sub_questions:
- answer:
    display: 片道の道のりは45km、往復の平均の速さは時速6km
    kind: symbolic
    srepr: Tuple(Integer(45), Integer(6))
  cause_tags: []
  concept_tags:
  - equation.word_problem_round_trip_average_speed
  explanation: 'まず、片道の道のりを x とおき、行きにかかる時間と帰りにかかる時間の和が往復の時間に等しいという方程式をつくる。（x/4 + x/12 = 15）

    次に、両辺に分母の最小公倍数をかけて、分数のない形に直す。（3x + 1x = 180）

    次に、方程式を解いて片道の道のりを求める。（x = 45）

    次に、片道の道のりを二倍して、往復の道のり全体を求める。（90km）

    最後に、往復の道のりを往復にかかった時間でわって、往復の平均の速さを求める。（片道の道のりは45km、往復の平均の速さは時速6km）'
