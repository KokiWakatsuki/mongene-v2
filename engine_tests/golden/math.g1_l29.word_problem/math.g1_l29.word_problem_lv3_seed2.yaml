problem_ref: 16f08b876678ef8a
problem_text: '分速120mで歩く人がいる。歩いた時間と進んだ道のりは比例する。

  この人が75分で歩く道のりは何kmか。式を立てて求めよ。'
sub_questions:
- answer:
    display: 9km
    kind: symbolic
    srepr: Integer(9)
  cause_tags: []
  concept_tags:
  - direct_proportion.word_problem_unit_convert
  explanation: 'まず、比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。（a = 120 / 1）

    次に、求めた比例定数を使って、比例の式を組み立てる。（y = 120x）

    次に、比例定数と x の値を、比例の式 y=ax の x にあてはめる。（y = 120 × 75）

    次に、かけ算を計算して y の値を求める。（y = 9000）

    最後に、道のりの単位を m から km に直す。（9km）'
  hints:
  - 比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
  - 求めた比例定数を使って、比例の式を組み立てる。
  - 比例定数と x の値を、比例の式 y=ax の x にあてはめる。
  - かけ算を計算して y の値を求める。
  label: (1)
  prompt_text: value を求めなさい。
  solution_steps:
  - args:
    - '1'
    - '120'
    narration: 比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
    op: substitute_point
    result_display: a = 120 / 1
    result_srepr: Integer(120)
  - args:
    - '120'
    narration: 求めた比例定数を使って、比例の式を組み立てる。
    op: form_expression
    result_display: y = 120x
    result_srepr: Mul(Integer(120), Symbol('x'))
  - args:
    - '120'
    - '75'
    narration: 比例定数と x の値を、比例の式 y=ax の x にあてはめる。
    op: substitute_x
    result_display: y = 120 × 75
    result_srepr: Integer(9000)
  - args:
    - y = 120 × 75
    narration: かけ算を計算して y の値を求める。
    op: evaluate
    result_display: y = 9000
    result_srepr: Integer(9000)
  - args: []
    narration: 道のりの単位を m から km に直す。
    op: convert_unit
    result_display: 9km
    result_srepr: Integer(9)
