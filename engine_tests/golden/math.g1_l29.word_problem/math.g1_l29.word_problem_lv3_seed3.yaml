problem_ref: ba2890f6ccb43871
problem_text: '分速250mで歩く生徒がいる。歩いた時間と進んだ道のりは比例する。

  この生徒が52分で歩く道のりは何kmか。式を立てて求めよ。'
sub_questions:
- answer:
    display: 13km
    kind: symbolic
    srepr: Integer(13)
  cause_tags: []
  concept_tags:
  - direct_proportion.word_problem_unit_convert
  explanation: 'まず、比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。（a = 250 / 1）

    次に、求めた比例定数を使って、比例の式を組み立てる。（y = 250x）

    次に、比例定数と x の値を、比例の式 y=ax の x にあてはめる。（y = 250 × 52）

    次に、かけ算を計算して y の値を求める。（y = 13000）

    最後に、道のりの単位を m から km に直す。（13km）'
  hints:
  - 比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
  - 求めた比例定数を使って、比例の式を組み立てる。
  - 比例定数と x の値を、比例の式 y=ax の x にあてはめる。
  - かけ算を計算して y の値を求める。
  label: (1)
  prompt_text: value を求めなさい。
  solution_steps:
  - args:
    - '1'
    - '250'
    narration: 比例の式 y=ax に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
    op: substitute_point
    result_display: a = 250 / 1
    result_srepr: Integer(250)
  - args:
    - '250'
    narration: 求めた比例定数を使って、比例の式を組み立てる。
    op: form_expression
    result_display: y = 250x
    result_srepr: Mul(Integer(250), Symbol('x'))
  - args:
    - '250'
    - '52'
    narration: 比例定数と x の値を、比例の式 y=ax の x にあてはめる。
    op: substitute_x
    result_display: y = 250 × 52
    result_srepr: Integer(13000)
  - args:
    - y = 250 × 52
    narration: かけ算を計算して y の値を求める。
    op: evaluate
    result_display: y = 13000
    result_srepr: Integer(13000)
  - args: []
    narration: 道のりの単位を m から km に直す。
    op: convert_unit
    result_display: 13km
    result_srepr: Integer(13)
