problem_ref: 274a90dc1e92382a
problem_text: 'ある仕事を12人ですると12日かかる。この仕事をする人数x人と、かかる日数y日は反比例する。

  この仕事を3人でするとき、何日で終わるか。式を立てて求めよ。'
sub_questions:
- answer:
    display: 48日
    kind: symbolic
    srepr: Integer(48)
  cause_tags: []
  concept_tags:
  - inverse_proportion.word_problem_worker_days
  explanation: 'まず、反比例の式 y=a/x に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。（a = 12 × 12）

    次に、求めた比例定数を使って、反比例の式を組み立てる。（y = 144/x）

    次に、比例定数と x の値を、反比例の式 y=a/x の x にあてはめる。（y = 144 / 3）

    最後に、わり算を計算して y の値を求める。（y = 48）'
  hints:
  - 反比例の式 y=a/x に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
  - 求めた比例定数を使って、反比例の式を組み立てる。
  - 比例定数と x の値を、反比例の式 y=a/x の x にあてはめる。
  label: (1)
  prompt_text: value を求めなさい。
  solution_steps:
  - args:
    - '12'
    - '12'
    narration: 反比例の式 y=a/x に、通る点の x, y の値をあてはめ、比例定数を求める式をつくる。
    op: substitute_point
    result_display: a = 12 × 12
    result_srepr: Integer(144)
  - args:
    - '144'
    narration: 求めた比例定数を使って、反比例の式を組み立てる。
    op: form_expression
    result_display: y = 144/x
    result_srepr: Mul(Integer(144), Pow(Symbol('x'), Integer(-1)))
  - args:
    - '144'
    - '3'
    narration: 比例定数と x の値を、反比例の式 y=a/x の x にあてはめる。
    op: substitute_x
    result_display: y = 144 / 3
    result_srepr: Integer(48)
  - args:
    - y = 144 / 3
    narration: わり算を計算して y の値を求める。
    op: evaluate
    result_display: y = 48
    result_srepr: Integer(48)
