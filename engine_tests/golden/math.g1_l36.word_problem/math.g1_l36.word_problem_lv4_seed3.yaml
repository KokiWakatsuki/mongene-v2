problem_text: '1辺が14cmの正方形NLBDの周上を、点QがNを出発してN→L→B→Dの順に毎秒1cmの速さでDまで動く。点QがNを出発してからx秒後の三角形NQDの面積をy cm²とする。

  面積が最大になるのはxがどの範囲にあるときかとそのときの面積、および面積が84cm²になるときのxの値をすべて求めよ。'
sub_questions:
- answer:
    display: 面積が最大になるのは x が 14 から 28 までのときで、そのときの面積は 98cm²。指定された面積になるのは 12秒後と30秒後
    kind: symbolic
    srepr: Tuple(Integer(98), Integer(14), Integer(28), Integer(12), Integer(30))
