  explanation: 'まず、動く点がどの辺の上にあるかで時間を区間に分け、面積が増える区間・変わらない区間・減る区間を見つける。（時間を区間に分ける）

    次に、面積が変わらない区間で最大になるので、その面積の値と、区間の始まりと終わりの時刻を求める。（面積が最大になるところを見つける）

    次に、増えていく区間の式を方程式とみて、指定された面積になる時刻を求める。（増えていく区間で解く）

    次に、減っていく区間の式を方程式とみて、指定された面積になる時刻を求める。（減っていく区間で解く）

    最後に、求めた時刻がそれぞれの区間の中にあることを確かめ、答えを並べる。（面積が最大になるのは x が 14 から 28 までのときで、そのときの面積は 98cm²。指定された面積になるのは 12秒後と30秒後）'
