  explanation: 'まず、回転の中心は、対応する2点から同じ距離にある。だから1組の対応する点を結び、その線分の垂直二等分線を引く。中心はこの直線上のどこかにある。（1組目の垂直二等分線を引く）

    次に、もう1組の対応する点についても同じように垂直二等分線を引く。中心はこの直線上にもある。（2組目の垂直二等分線を引く）

    最後に、2本の垂直二等分線の交点が、両方の条件を同時に満たす点、つまり回転の中心である。（(2, -4)）'
  hints:
  - 回転の中心は、対応する2点から同じ距離にある。だから1組の対応する点を結び、その線分の垂直二等分線を引く。中心はこの直線上のどこかにある。
  - もう1組の対応する点についても同じように垂直二等分線を引く。中心はこの直線上にもある。
  label: (1)
  prompt_text: 点の座標を読み取りなさい。
