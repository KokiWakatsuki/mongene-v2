problem_text: 座標平面上に合同な三角形ABCと三角形A'B'C'があり、A(-6, 2)、B(6, -4)、C(6, 0)、A'(10, -10)、B'(-2, -4)、C'(-2, -8)である。三角形A'B'C'は三角形ABCをある点を中心として回転移動したものである。回転の中心を点Eとするとき、対応する点を結んでできる線分の垂直二等分線を使って点Eの位置を求め、その座標を答えよ。
