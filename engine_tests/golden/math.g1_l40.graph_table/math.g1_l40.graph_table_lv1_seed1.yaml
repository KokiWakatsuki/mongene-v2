  explanation: 'まず、対称移動の軸がどこにあるかを読み取る。（対称の軸を読み取る）

    次に、もとの図形の各頂点を、軸について反対側の同じ距離の位置に折り返す。（各頂点を軸について折り返す）'
  hints:
  - 対称移動の軸がどこにあるかを読み取る。
  label: (1)
  prompt_text: draw_transformed_polygon を求めなさい。
