problem_text: A校の生徒20人とB校の生徒32人の身長を調べ、140cmから5cmずつの同じ階級に分けて、2つの度数折れ線を1つのグラフに重ねて表した（A校は実線、B校は破線）。160cm以上165cm未満の階級について、それぞれの相対度数をグラフから読み取って求め、この階級の割合が大きいのはどちらの学校か答えよ。
sub_questions:
- answer:
    display: 'A: 0.35、B: 0.21875（Aのほうが大きい）'
    kind: symbolic
    srepr: Tuple(Rational(7, 20), Rational(7, 32))
  cause_tags: []
  concept_tags:
  - frequency_polygon.compare_groups_by_relative_frequency
  explanation: 'まず、それぞれの集団について、対象の階級の度数を総度数でわり、相対度数を求める。（A 0.35、B 0.21875）

    次に、求めた相対度数どうしを比べ、値が大きいほうを答える。（A: 0.35、B: 0.21875（Aのほうが大きい））'
  hints:
  - それぞれの集団について、対象の階級の度数を総度数でわり、相対度数を求める。
