problem_ref: e25b23fad64bec9a
problem_text: 'ある工場で作られた缶づめを無作為に400個検査したところ、不良品が15個あった。この工場では、これから缶づめをさらに20000個作る予定である。

  そのうち、およそ何個の不良品が出ると予測されるか。見積もりの方針を自分で決めて求めよ。'
sub_questions:
- answer:
    display: 750個
    kind: symbolic
    srepr: Integer(750)
  cause_tags: []
  concept_tags:
  - probability.word_problem_defect_rate_estimate
  explanation: 'まず、不良品だった個数を、検査した個数でわって、不良品の割合を求める。（3/80）

    次に、検査した個数がじゅうぶんに多いので、この割合を、不良品が出る確率の見積もりとして使う。（3/80）

    最後に、見積もった割合に、これから作る個数をかけて、不良品の個数を予測する。（750個）'
  hints:
  - 不良品だった個数を、検査した個数でわって、不良品の割合を求める。
  - 検査した個数がじゅうぶんに多いので、この割合を、不良品が出る確率の見積もりとして使う。
  label: (1)
  prompt_text: value を求めなさい。
  solution_steps:
  - args: []
    narration: 不良品だった個数を、検査した個数でわって、不良品の割合を求める。
    op: divide_occurred_by_total
    result_display: 3/80
    result_srepr: Rational(3, 80)
  - args: []
    narration: 検査した個数がじゅうぶんに多いので、この割合を、不良品が出る確率の見積もりとして使う。
    op: regard_as_probability
    result_display: 3/80
    result_srepr: Rational(3, 80)
  - args: []
    narration: 見積もった割合に、これから作る個数をかけて、不良品の個数を予測する。
    op: evaluate
    result_display: 750個
    result_srepr: Integer(750)
