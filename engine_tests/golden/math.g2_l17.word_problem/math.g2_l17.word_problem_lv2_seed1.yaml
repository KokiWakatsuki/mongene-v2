problem_text: '家から駅を通って港まで行った。家から駅までは時速4kmで歩き、駅から港までは時速12kmの自転車で進んだところ、全体で44km進むのに5時間かかった。

  歩いた道のりを x km、自転車で進んだ道のりを y km とする。

  (1) 道のりと時間の関係を表す2つの式をつくれ。

  (2) 歩いた道のりと自転車で進んだ道のりをそれぞれ求めよ。'
sub_questions:
- answer:
    display: x + y = 44、x/4 + y/12 = 5
    kind: symbolic
    srepr: Tuple(Equality(Add(Symbol('x'), Symbol('y')), Integer(44)), Equality(Add(Mul(Rational(1, 4), Symbol('x')), Mul(Rational(1, 12), Symbol('y'))), Integer(5)))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_distance_time
  explanation: 'まず、歩いた道のりを x km、自転車で進んだ道のりを y km とおく。（x, y）

    次に、道のりの関係に着目して、1つめの式をつくる。（x + y = 44）

    最後に、かかった時間の関係に着目して、2つめの式をつくる。（x/4 + y/12 = 5）'
  hints:
  - 歩いた道のりを x km、自転車で進んだ道のりを y km とおく。
  - 道のりの関係に着目して、1つめの式をつくる。
  label: (1)
  prompt_text: formulation を求めなさい。
  solution_steps:
