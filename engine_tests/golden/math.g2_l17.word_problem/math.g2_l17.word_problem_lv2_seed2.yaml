problem_text: 'A町からB町を通ってC町まで行った。A町からB町までは時速3kmで歩き、B町からC町までは時速16kmの自転車で進んだところ、全体で38km進むのに4時間かかった。

  歩いた道のりを x km、自転車で進んだ道のりを y km とする。

  (1) 道のりと時間の関係を表す2つの式をつくれ。

  (2) 歩いた道のりと自転車で進んだ道のりをそれぞれ求めよ。'
sub_questions:
- answer:
    display: x + y = 38、x/3 + y/16 = 4
    kind: symbolic
    srepr: Tuple(Equality(Add(Symbol('x'), Symbol('y')), Integer(38)), Equality(Add(Mul(Rational(1, 3), Symbol('x')), Mul(Rational(1, 16), Symbol('y'))), Integer(4)))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_distance_time
  explanation: 'まず、歩いた道のりを x km、自転車で進んだ道のりを y km とおく。（x, y）

    次に、道のりの関係に着目して、1つめの式をつくる。（x + y = 38）

    最後に、かかった時間の関係に着目して、2つめの式をつくる。（x/3 + y/16 = 4）'
  hints:
  - 歩いた道のりを x km、自転車で進んだ道のりを y km とおく。
  - 道のりの関係に着目して、1つめの式をつくる。
  label: (1)
  prompt_text: formulation を求めなさい。
  solution_steps:
