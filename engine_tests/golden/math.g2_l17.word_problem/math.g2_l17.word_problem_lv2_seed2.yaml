    narration: 歩いた道のりを x km、自転車で進んだ道のりを y km とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    narration: 道のりの関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: x + y = 38
    result_srepr: Equality(Add(Symbol('x'), Symbol('y')), Integer(38))
  - args: []
