  explanation: 'まず、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 6）

    次に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = 32）'
  hints:
  - 係数をそろえて一方の文字を消去し、残った文字を求める。
  label: (2)
  prompt_text: value を求めなさい。
