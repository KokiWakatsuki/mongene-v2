problem_ref: 286fc89f45f84827
problem_text: '駅から港まで行くのに、初めは分速50mで歩き、途中から分速150mで走ったところ、駅から港まで1650mの道のりを17分で着いた。

  歩いた道のりと走った道のりはそれぞれ何mか求めよ。'
sub_questions:
- answer:
    display: 歩いた道のりは450m、走った道のりは1200m
    kind: symbolic
    srepr: Tuple(Integer(450), Integer(1200))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_time_split
  explanation: まず、歩いた時間を x 分、走った時間を y 分とおく。 x, y次に、かかった時間の関係に着目して、1つめの式をつくる。 x + y = 17次に、道のりの関係に着目して、2つめの式をつくる。 50x + 150y = 1650次に、係数をそろえて一方の文字を消去し、残った文字を求める。 x = 9次に、求めた値をもとの式に代入し、もう一方の文字を求める。 y = 8最後に、求めた
    x、y をもとに、問われている量を計算する。 歩いた道のりは450m、走った道のりは1200m
  hints:
  - 歩いた時間を x 分、走った時間を y 分とおく。
  - かかった時間の関係に着目して、1つめの式をつくる。
  - 道のりの関係に着目して、2つめの式をつくる。
  - 係数をそろえて一方の文字を消去し、残った文字を求める。
  - 求めた値をもとの式に代入し、もう一方の文字を求める。
  label: (1)
  prompt_text: value を求めなさい。
  solution_steps:
  - args: []
    narration: 歩いた時間を x 分、走った時間を y 分とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    narration: かかった時間の関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: x + y = 17
    result_srepr: Equality(Add(Symbol('x'), Symbol('y')), Integer(17))
  - args: []
    narration: 道のりの関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 50x + 150y = 1650
    result_srepr: Equality(Add(Mul(Integer(50), Symbol('x')), Mul(Integer(150), Symbol('y'))), Integer(1650))
  - args:
    - Eq(x + y, 17)
    - Eq(50*x + 150*y, 1650)
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 9
    result_srepr: Equality(Symbol('x'), Integer(9))
  - args:
    - '9'
    narration: 求めた値をもとの式に代入し、もう一方の文字を求める。
    op: back_substitute
    result_display: y = 8
    result_srepr: Integer(8)
  - args: []
    narration: 求めた x、y をもとに、問われている量を計算する。
    op: derive_asked_quantities
    result_display: 歩いた道のりは450m、走った道のりは1200m
    result_srepr: Tuple(Integer(450), Integer(1200))
