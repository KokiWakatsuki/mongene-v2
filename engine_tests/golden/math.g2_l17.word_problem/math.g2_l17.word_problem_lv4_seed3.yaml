problem_ref: 724bc2c56a94a732
problem_text: '1周2400mの池のまわりを、はるとさんとゆいさんが同じ地点から同時に出発する。反対向きに進むと12分後に出会い、同じ向きに進むとはるとさんがゆいさんに24分後に追いつく。

  はるとさんとゆいさんの速さはそれぞれ分速何mか求めよ。'
sub_questions:
- answer:
    display: はるとさんの速さは分速150m、ゆいさんの速さは分速50m
    kind: symbolic
    srepr: Tuple(Integer(150), Integer(50))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_lap_meet_catch_up
  explanation: 'まず、はるとさんの速さを分速 x m、ゆいさんの速さを分速 y m とおく。（x, y）

    次に、反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。（12(x + y) = 2400）

    次に、同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。（24(x - y) = 2400）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 150）

    最後に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = 50）'
  hints:
  - はるとさんの速さを分速 x m、ゆいさんの速さを分速 y m とおく。
  - 反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。
  - 同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。
  - 係数をそろえて一方の文字を消去し、残った文字を求める。
  label: (1)
  prompt_text: value を求めなさい。
  solution_steps:
  - args: []
    narration: はるとさんの速さを分速 x m、ゆいさんの速さを分速 y m とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    narration: 反対向きに進んだときの道のりの関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: 12(x + y) = 2400
    result_srepr: Equality(Add(Mul(Integer(12), Symbol('x')), Mul(Integer(12), Symbol('y'))), Integer(2400))
  - args: []
    narration: 同じ向きに進んだときの道のりの関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 24(x - y) = 2400
    result_srepr: Equality(Add(Mul(Integer(24), Symbol('x')), Mul(Integer(-1), Integer(24), Symbol('y'))), Integer(2400))
  - args:
    - Eq(12*x + 12*y, 2400)
    - Eq(24*x - 24*y, 2400)
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 150
    result_srepr: Equality(Symbol('x'), Integer(150))
  - args:
    - '150'
    narration: 求めた値をもとの式に代入し、もう一方の文字を求める。
    op: back_substitute
    result_display: y = 50
    result_srepr: Integer(50)
