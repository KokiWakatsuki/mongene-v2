problem_ref: c916d6d9ea45e71d
problem_text: 'ある中学校の昨年の生徒数は男女合わせて200人だった。今年は昨年に比べて男子が12%増え、女子が6%減ったので、全体で6人増えた。

  昨年の男子の人数を x 人、女子の人数を y 人とする。

  (1) 人数と増減の関係を表す2つの式をつくれ。

  (2) 昨年の男子と女子の人数をそれぞれ求めよ。'
sub_questions:
- answer:
    display: x + y = 200、12x/100 - 6y/100 = 6
    kind: symbolic
    srepr: Tuple(Equality(Add(Symbol('x'), Symbol('y')), Integer(200)), Equality(Add(Mul(Rational(3, 25), Symbol('x')), Mul(Integer(-1), Rational(3, 50), Symbol('y'))), Integer(6)))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_percent_change
  explanation: 'まず、昨年の男子の人数を x 人、女子の人数を y 人とおく。（x, y）

    次に、昨年の人数の関係に着目して、1つめの式をつくる。（x + y = 200）

    最後に、増減した人数の関係に着目して、2つめの式をつくる。（12x/100 - 6y/100 = 6）'
  hints:
  - 昨年の男子の人数を x 人、女子の人数を y 人とおく。
  - 昨年の人数の関係に着目して、1つめの式をつくる。
  label: (1)
  prompt_text: 式に表しなさい。
  solution_steps:
  - args: []
    narration: 昨年の男子の人数を x 人、女子の人数を y 人とおく。
    op: set_variables
    result_display: x, y
    result_srepr: Tuple(Symbol('x'), Symbol('y'))
  - args: []
    narration: 昨年の人数の関係に着目して、1つめの式をつくる。
    op: formulate_first
    result_display: x + y = 200
    result_srepr: Equality(Add(Symbol('x'), Symbol('y')), Integer(200))
  - args: []
    narration: 増減した人数の関係に着目して、2つめの式をつくる。
    op: formulate_second
    result_display: 12x/100 - 6y/100 = 6
    result_srepr: Equality(Add(Mul(Rational(3, 25), Symbol('x')), Mul(Integer(-1), Rational(3, 50), Symbol('y'))), Integer(6))
- answer:
    display: 昨年の男子は100人、昨年の女子は100人
    kind: symbolic
    srepr: Tuple(Integer(100), Integer(100))
  cause_tags: []
  concept_tags:
  - simultaneous_equations.word_problem_percent_change
  explanation: 'まず、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 100）

    次に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = 100）'
  hints:
  - 係数をそろえて一方の文字を消去し、残った文字を求める。
  label: (2)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args:
    - Eq(x + y, 200)
    - Eq(3*x/25 - 3*y/50, 6)
    narration: 係数をそろえて一方の文字を消去し、残った文字を求める。
    op: eliminate_variable
    result_display: x = 100
    result_srepr: Equality(Symbol('x'), Integer(100))
  - args:
    - '100'
    narration: 求めた値をもとの式に代入し、もう一方の文字を求める。
    op: back_substitute
    result_display: y = 100
    result_srepr: Integer(100)
