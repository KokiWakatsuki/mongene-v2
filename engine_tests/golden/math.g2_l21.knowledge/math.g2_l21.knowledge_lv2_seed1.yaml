  explanation: 'まず、傾き a の符号から、グラフが右上がりか右下がりかを判断する。（傾きの符号）

    次に、切片 b の符号から、y 軸の正の部分・負の部分のどちらで交わるかを判断する。（切片の符号）

    最後に、傾きと切片の符号を合わせて、グラフのようすを選ぶ。（右上がりで、y 軸の正の部分で y 軸と交わる）'
