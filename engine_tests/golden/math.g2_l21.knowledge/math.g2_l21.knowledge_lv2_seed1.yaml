problem_text: 1次関数 y = 25x + 1 のグラフのようすとして正しいものを、次のア〜エから選べ。ア 右上がりで、y 軸の正の部分で y 軸と交わる イ 右上がりで、y 軸の負の部分で y 軸と交わる ウ 右下がりで、y 軸の正の部分で y 軸と交わる エ 右下がりで、y 軸の負の部分で y 軸と交わる
