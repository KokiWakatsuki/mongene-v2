  explanation: 'まず、y 軸との交点（切片）に点をとる。（(0, 2)）

    次に、切片から、傾きの分母のぶんだけ x 軸の正の向きに進む。（分母のぶん x 方向へ）

    次に、そこから、傾きの分子のぶんだけ y 軸方向に進む（分子の符号にしたがう）。（分子のぶん y 方向へ）

    次に、進んだ先の格子点に印をつける。（(2, 5)）

    最後に、切片と格子点の2点を通る直線をひく。（3/2x + 2）'
  hints:
  - y 軸との交点（切片）に点をとる。
  - 切片から、傾きの分母のぶんだけ x 軸の正の向きに進む。
  - そこから、傾きの分子のぶんだけ y 軸方向に進む（分子の符号にしたがう）。
  - 進んだ先の格子点に印をつける。
  label: (1)
  prompt_text: draw_graph を求めなさい。
  solution_steps:
  - args: []
    narration: y 軸との交点（切片）に点をとる。
    op: plot_intercept
    result_display: (0, 2)
    result_srepr: Tuple(Integer(0), Integer(2))
  - args: []
    narration: 切片から、傾きの分母のぶんだけ x 軸の正の向きに進む。
    op: apply_slope_denominator
    result_display: 分母のぶん x 方向へ
    result_srepr: Integer(2)
  - args: []
    narration: そこから、傾きの分子のぶんだけ y 軸方向に進む（分子の符号にしたがう）。
    op: apply_slope_numerator
    result_display: 分子のぶん y 方向へ
    result_srepr: Integer(3)
  - args: []
    narration: 進んだ先の格子点に印をつける。
    op: mark_lattice_point
    result_display: (2, 5)
    result_srepr: Tuple(Integer(2), Integer(5))
  - args: []
    narration: 切片と格子点の2点を通る直線をひく。
    op: draw_line
    result_display: 3/2x + 2
    result_srepr: Add(Mul(Rational(3, 2), Symbol('x')), Integer(2))
