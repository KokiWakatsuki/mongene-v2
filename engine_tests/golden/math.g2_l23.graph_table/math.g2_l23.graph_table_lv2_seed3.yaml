  explanation: 'まず、変域の左端の x に対応する点をとり、端をふくむなら●、ふくまないなら○で表す。（(-1, -5)）

    次に、変域の右端の x に対応する点をとり、端をふくむなら●、ふくまないなら○で表す。（(1, 3)）

    最後に、とった2つの端点を結ぶ線分をひく。（両端点を結ぶ線分）'
  hints:
  - 変域の左端の x に対応する点をとり、端をふくむなら●、ふくまないなら○で表す。
  - 変域の右端の x に対応する点をとり、端をふくむなら●、ふくまないなら○で表す。
