  explanation: 'まず、平行な直線は傾きが等しいので、与えられた直線の傾きをそのまま用いる。（傾き a = -2/3）

    次に、傾きと通る1点を y = ax + b に代入し、切片を求める。（切片 b = 11/3）

    最後に、傾きと切片から一次関数の式を組み立てる。（y = -2/3x + 11/3）'
  hints:
