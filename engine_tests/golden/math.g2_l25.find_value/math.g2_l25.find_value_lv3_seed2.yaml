  explanation: 'まず、2点をそれぞれ y = ax + b に代入し、a, b の連立方程式を立てる。（Eq(a + b, -14/3), Eq(-4*a + b, -4/3)）

    次に、連立方程式を解いて a, b を同時に求める。（a = -2/3, b = -4）

    最後に、求めた a, b から一次関数の式を組み立てる。（y = -2/3x - 4）'
  hints:
