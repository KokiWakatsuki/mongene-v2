  - args:
    - Eq(a + b, -14/3)
    - Eq(-4*a + b, -4/3)
    narration: 連立方程式を解いて a, b を同時に求める。
    op: solve_simultaneous
    result_display: a = -2/3, b = -4
    result_srepr: '{''a'': Rational(-2, 3), ''b'': Integer(-4)}'
  - args:
    - -2/3
    - '-4'
