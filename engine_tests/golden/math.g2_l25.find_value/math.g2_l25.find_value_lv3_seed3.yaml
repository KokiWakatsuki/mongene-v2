  explanation: 'まず、2点をそれぞれ y = ax + b に代入し、a, b の連立方程式を立てる。（Eq(b, 7), Eq(4*a + b, 9)）

    次に、連立方程式を解いて a, b を同時に求める。（a = 1/2, b = 7）

    最後に、求めた a, b から一次関数の式を組み立てる。（y = 1/2x + 7）'
  hints:
  - 2点をそれぞれ y = ax + b に代入し、a, b の連立方程式を立てる。
  - 連立方程式を解いて a, b を同時に求める。
  label: (1)
  prompt_text: expression を求めなさい。
  solution_steps:
  - args:
    - (0, 7)
    - (4, 9)
    narration: 2点をそれぞれ y = ax + b に代入し、a, b の連立方程式を立てる。
    op: setup_simultaneous
    result_display: Eq(b, 7), Eq(4*a + b, 9)
    result_srepr: '[Equality(Symbol(''b''), Integer(7)), Equality(Add(Mul(Integer(4), Symbol(''a'')), Symbol(''b'')), Integer(9))]'
  - args:
    - Eq(b, 7)
    - Eq(4*a + b, 9)
    narration: 連立方程式を解いて a, b を同時に求める。
    op: solve_simultaneous
    result_display: a = 1/2, b = 7
    result_srepr: '{''a'': Rational(1, 2), ''b'': Integer(7)}'
  - args:
    - 1/2
    - '7'
    narration: 求めた a, b から一次関数の式を組み立てる。
    op: form_expression
    result_display: y = 1/2x + 7
    result_srepr: Add(Mul(Rational(1, 2), Symbol('x')), Integer(7))
