  explanation: 'まず、x の項を右辺に移項し、y の項だけを左辺に残す。（3y = -6x - 24）

    次に、両辺を y の係数で割り、y = の形にする。（y = -2x - 8）

    次に、y 軸との交点（切片）に点をとる。（(0, -8)）

    次に、傾きにしたがって、右へ進んだときの上下の変化の分だけ動いた点をとる。（傾き -2）

    最後に、とった2点を通る直線をひく。（y = -2x - 8）'
  hints:
  - x の項を右辺に移項し、y の項だけを左辺に残す。
  - 両辺を y の係数で割り、y = の形にする。
  - y 軸との交点（切片）に点をとる。
  - 傾きにしたがって、右へ進んだときの上下の変化の分だけ動いた点をとる。
  label: (1)
  prompt_text: グラフをかきなさい。
  solution_steps:
  - args:
    - 6x + 3y = -24
    narration: x の項を右辺に移項し、y の項だけを左辺に残す。
    op: isolate_y_term
    result_display: 3y = -6x - 24
    result_srepr: Equality(Mul(Integer(3), Symbol('y')), Add(Mul(Integer(-1), Integer(6), Symbol('x')), Integer(-24)))
  - args:
    - '3'
    narration: 両辺を y の係数で割り、y = の形にする。
    op: divide_by_coefficient
    result_display: y = -2x - 8
    result_srepr: Add(Mul(Integer(-1), Integer(2), Symbol('x')), Integer(-8))
  - args:
    - '-8'
    narration: y 軸との交点（切片）に点をとる。
    op: plot_intercept
    result_display: (0, -8)
    result_srepr: Tuple(Integer(0), Integer(-8))
  - args:
    - '-2'
    narration: 傾きにしたがって、右へ進んだときの上下の変化の分だけ動いた点をとる。
    op: apply_slope
    result_display: 傾き -2
    result_srepr: Integer(-2)
  - args: []
    narration: とった2点を通る直線をひく。
    op: draw_line
    result_display: y = -2x - 8
    result_srepr: Add(Mul(Integer(-1), Integer(2), Symbol('x')), Integer(-8))
