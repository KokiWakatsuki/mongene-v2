  explanation: 'まず、2つの直線を ax + by = c の形にそろえて連立方程式を立てる。（x + y = -1, 3x - y = 17）

    次に、係数をそろえて一方の文字を消去し、残った文字を求める。（x = 4）

    最後に、求めた値をもとの式に代入し、もう一方の文字を求める。（y = -5）'
