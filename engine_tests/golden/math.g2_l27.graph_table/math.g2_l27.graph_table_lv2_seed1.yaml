problem_ref: df4eae24dfdb54b6
problem_text: 2本の直線 y = -2x + 6 と y = 3x - 14 を同じ座標平面にかき、その交点の座標を読み取れ。
sub_questions:
- answer:
    display: (4, -2)
    kind: symbolic
    srepr: Tuple(Integer(4), Integer(-2))
  cause_tags: []
  concept_tags:
  - linear_function.read_intersection_from_graph
  explanation: まず、1本目の直線を座標平面にかく。 y = -2x + 6次に、2本目の直線を同じ平面にかく。 y = 3x - 14最後に、2本の直線が交わる点の座標を読み取る。 (4, -2)
  hints:
  - 1本目の直線を座標平面にかく。
  - 2本目の直線を同じ平面にかく。
  label: (1)
  prompt_text: read_intersection を求めなさい。
  solution_steps:
  - args:
    - y = -2x + 6
    narration: 1本目の直線を座標平面にかく。
    op: draw_line_1
    result_display: y = -2x + 6
    result_srepr: Add(Integer(6), Mul(Integer(-1), Integer(2), Symbol('x')))
  - args:
    - y = 3x - 14
    narration: 2本目の直線を同じ平面にかく。
    op: draw_line_2
    result_display: y = 3x - 14
    result_srepr: Add(Mul(Integer(3), Symbol('x')), Integer(-14))
  - args: []
    narration: 2本の直線が交わる点の座標を読み取る。
    op: read_intersection
    result_display: (4, -2)
    result_srepr: Tuple(Integer(4), Integer(-2))
