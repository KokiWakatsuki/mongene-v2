problem_ref: eee7e5201bc6cc87
problem_text: 2本の直線 y = -2x - 2 と y = -3x - 3 を同じ座標平面にかき、その交点の座標を読み取れ。
sub_questions:
- answer:
    display: (-1, 0)
    kind: symbolic
    srepr: Tuple(Integer(-1), Integer(0))
  cause_tags: []
  concept_tags:
  - linear_function.read_intersection_from_graph
  explanation: 'まず、1本目の直線を座標平面にかく。（y = -2x - 2）

    次に、2本目の直線を同じ平面にかく。（y = -3x - 3）

    最後に、2本の直線が交わる点の座標を読み取る。（(-1, 0)）'
  hints:
  - 1本目の直線を座標平面にかく。
  - 2本目の直線を同じ平面にかく。
  label: (1)
  prompt_text: read_intersection を求めなさい。
  solution_steps:
  - args:
    - y = -2x - 2
    narration: 1本目の直線を座標平面にかく。
    op: draw_line_1
    result_display: y = -2x - 2
    result_srepr: Add(Mul(Integer(-1), Integer(2), Symbol('x')), Integer(-2))
  - args:
    - y = -3x - 3
    narration: 2本目の直線を同じ平面にかく。
    op: draw_line_2
    result_display: y = -3x - 3
    result_srepr: Add(Mul(Integer(-1), Integer(3), Symbol('x')), Integer(-3))
  - args: []
    narration: 2本の直線が交わる点の座標を読み取る。
    op: read_intersection
    result_display: (-1, 0)
    result_srepr: Tuple(Integer(-1), Integer(0))
