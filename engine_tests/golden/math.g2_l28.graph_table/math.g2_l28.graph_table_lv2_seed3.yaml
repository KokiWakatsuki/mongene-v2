  explanation: 'まず、表から x と y の値の組を読み取り、座標平面上の点とみる。（表の x と y の組）

    次に、読み取った点を座標平面にとる。（表の各点）

    最後に、とった点を通る直線をひく。（y = 4x + 7）'
  hints:
  - 表から x と y の値の組を読み取り、座標平面上の点とみる。
  - 読み取った点を座標平面にとる。
  label: (1)
  prompt_text: グラフをかきなさい。
  solution_steps:
  - args: []
    narration: 表から x と y の値の組を読み取り、座標平面上の点とみる。
    op: read_table_points
    result_display: 表の x と y の組
    result_srepr: Tuple(Tuple(Integer(0), Integer(7)), Tuple(Integer(2), Integer(15)), Tuple(Integer(4), Integer(23)), Tuple(Integer(6), Integer(31)))
  - args: []
