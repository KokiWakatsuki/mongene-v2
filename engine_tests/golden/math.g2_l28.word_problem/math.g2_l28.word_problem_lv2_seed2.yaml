    - (125, 86)
    narration: 傾きと通る1点を y = ax + b に代入し、切片を求める。
    op: compute_intercept
    result_display: 切片 b = 11
    result_srepr: Integer(11)
  - args:
    - 3/5
    - '11'
    narration: 傾きと切片から一次関数の式を組み立てる。
    op: form_expression
    result_display: y = 3/5x + 11
    result_srepr: Add(Mul(Rational(3, 5), Symbol('x')), Integer(11))
