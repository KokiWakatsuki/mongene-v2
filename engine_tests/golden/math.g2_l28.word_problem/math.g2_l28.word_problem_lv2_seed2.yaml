problem_text: 'あるつる巻きばねに125gのおもりをつるすと全体の長さが86cmになり、150gのおもりをつるすと101cmになった。

  つる巻きばねの長さ y cm はおもりの重さ x g の1次関数であるとする。

  (1) y を x の式で表せ。

  (2) 75gのおもりをつるしたときのつる巻きばねの長さを求めよ。'
sub_questions:
- answer:
    display: y = 3/5x + 11
    kind: symbolic
    srepr: Add(Mul(Rational(3, 5), Symbol('x')), Integer(11))
  cause_tags: []
  concept_tags:
  - linear_function.word_problem_two_point_eval
  explanation: 'まず、2点の y 座標の差を x 座標の差で割り、傾きを求める。（傾き a = 3/5）

    次に、傾きと通る1点を y = ax + b に代入し、切片を求める。（切片 b = 11）

    最後に、傾きと切片から一次関数の式を組み立てる。（y = 3/5x + 11）'
  hints:
  - 2点の y 座標の差を x 座標の差で割り、傾きを求める。
  - 傾きと通る1点を y = ax + b に代入し、切片を求める。
  label: (1)
  prompt_text: formulation を求めなさい。
  solution_steps:
  - args:
    - (125, 86)
    - (150, 101)
    narration: 2点の y 座標の差を x 座標の差で割り、傾きを求める。
    op: compute_slope
    result_display: 傾き a = 3/5
    result_srepr: Rational(3, 5)
  - args:
