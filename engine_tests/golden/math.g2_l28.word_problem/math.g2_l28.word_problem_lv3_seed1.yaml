problem_text: '空のタンクに水を入れ始める。初めの12分間は毎分2Lで入れ、その後は毎分7Lで入れる。

  タンクに水を入れ始めてから x 分後の水の量を y Lとする。

  (1) 0≦x≦12 のときの y を x の式で表せ。

  (2) x≧12 のときの y を x の式で表せ。

  (3) 水の量が45Lになるのは、水を入れ始めてから何分後か求めよ。'
