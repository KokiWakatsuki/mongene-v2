  explanation: 'まず、傾きと通る点の座標を y = ax + b に代入する。（2 × 0 + b = 0）

    次に、代入した式を b について解き、切片を求める。（切片 b = 0）

    最後に、傾きと切片から一次関数の式を組み立てる。（y = 2x）'
