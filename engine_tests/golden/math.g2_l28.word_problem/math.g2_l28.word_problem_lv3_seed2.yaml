problem_text: '空の浴槽にお湯を入れ始める。初めの15分間は毎分3Lで入れ、その後は毎分2Lで入れる。

  浴槽にお湯を入れ始めてから x 分後のお湯の量を y Lとする。

  (1) 0≦x≦15 のときの y を x の式で表せ。

  (2) x≧15 のときの y を x の式で表せ。

  (3) お湯の量が67Lになるのは、お湯を入れ始めてから何分後か求めよ。'
