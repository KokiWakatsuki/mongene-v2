problem_ref: 5cf200886cad0b96
problem_text: '太郎さんと花子さんは1208mはなれたA地点とB地点にいる。太郎さんはA地点を出発してB地点へ毎分80mで、花子さんは太郎さんと同時にB地点を出発してA地点へ毎分71mで進む。

  出発してから x 分後とする。

  (1) 太郎さんについて、出発してから x 分後のA地点からの道のり y m を式で表せ。

  (2) 2人が出会うのは出発してから何分後か求めよ。'
sub_questions:
- answer:
    display: y = 80x
    kind: symbolic
    srepr: Mul(Integer(80), Symbol('x'))
  cause_tags: []
  concept_tags:
  - linear_function.word_problem_meeting_intersection
  explanation: 'まず、傾きと通る点の座標を y = ax + b に代入する。（80 × 0 + b = 0）

    次に、代入した式を b について解き、切片を求める。（切片 b = 0）

    最後に、傾きと切片から一次関数の式を組み立てる。（y = 80x）'
  hints:
  - 傾きと通る点の座標を y = ax + b に代入する。
  - 代入した式を b について解き、切片を求める。
  label: (1)
  prompt_text: formulation を求めなさい。
  solution_steps:
  - args:
    - '80'
    - (0, 0)
    narration: 傾きと通る点の座標を y = ax + b に代入する。
    op: substitute_point
    result_display: 80 × 0 + b = 0
    result_srepr: Equality(Symbol('b'), Integer(0))
  - args:
    - '80'
    - (0, 0)
    narration: 代入した式を b について解き、切片を求める。
    op: compute_intercept
    result_display: 切片 b = 0
    result_srepr: Integer(0)
  - args:
    - '80'
    - '0'
    narration: 傾きと切片から一次関数の式を組み立てる。
    op: form_expression
    result_display: y = 80x
    result_srepr: Mul(Integer(80), Symbol('x'))
- answer:
    display: 8分後
    kind: symbolic
    srepr: Integer(8)
  cause_tags: []
  concept_tags:
  - linear_function.word_problem_meeting_intersection
  explanation: 'まず、もう一方の人が出発地点から相手に向かって進むようすを、道のりの式で表す。（y = 1208 - 71x）

    次に、2つの直線の y を等しいとおき、x についての方程式を解く。（x = 8）

    最後に、x の値を求める。（x = 8）'
  hints:
  - もう一方の人が出発地点から相手に向かって進むようすを、道のりの式で表す。
  - 2つの直線の y を等しいとおき、x についての方程式を解く。
  label: (2)
  prompt_text: value を求めなさい。
  solution_steps:
  - args: []
    narration: もう一方の人が出発地点から相手に向かって進むようすを、道のりの式で表す。
    op: formulate_line_b
    result_display: y = 1208 - 71x
    result_srepr: Equality(Symbol('y'), Add(Integer(1208), Mul(Integer(-1), Integer(71), Symbol('x'))))
  - args:
    - Eq(80*x - y, 0)
    - Eq(71*x + y, 1208)
    narration: 2つの直線の y を等しいとおき、x についての方程式を解く。
    op: equate_expressions
    result_display: x = 8
    result_srepr: Equality(Symbol('x'), Integer(8))
  - args:
    - '8'
    narration: x の値を求める。
    op: solve_for_x
    result_display: x = 8
    result_srepr: Integer(8)
