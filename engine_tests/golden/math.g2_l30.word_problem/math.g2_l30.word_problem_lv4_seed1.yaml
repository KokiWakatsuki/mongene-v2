- answer:
    display: 13分後
    kind: symbolic
    srepr: Integer(13)
  cause_tags: []
  concept_tags:
  - linear_function.word_problem_second_meeting
  explanation: 'まず、二人の位置を、出発してからの時間を使ってそれぞれ式で表す。（先に出た人は 120x、あとの人は 1200 - 90(x - 9)）

    次に、向かい合って進む間に位置が等しくなる時刻を求め、これが一回目の出会いであることを確かめる。（67/7分後）

    次に、折り返したあとの位置は、折り返す地点までの道のりから、折り返してから進んだ道のりを引いて表す。（折り返した人は 2400 - 120x）

    最後に、折り返したあとの位置と、向かってくる相手の位置が等しいとおいて方程式を解く。（13分後）'
  hints:
