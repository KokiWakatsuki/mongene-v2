problem_ref: eb67d2fb0c433fdf
problem_text: 'P地点とQ地点は1200mはなれている。けんたさんはP地点を出発してQ地点へ毎分120mで進み、Q地点に着くとすぐ折り返して同じ速さでP地点へもどる。みさきさんはけんたさんが出発してから9分後にQ地点を出発し、毎分90mでP地点へ進む。

  2人が2回目に出会うのはけんたさんが出発してから何分後か求めよ。'
