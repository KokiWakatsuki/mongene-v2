  explanation: 'まず、頂点Aと内部の点Dを結んだ直線を、Dの向こう側までのばす補助線を引く。この1本で、もとの図が2つの三角形に分かれる。（点Aと点Dを結んでのばした線）

    次に、一方の三角形について、外角は隣り合わない2つの内角の和に等しいことを使い、のばした線とDBがつくる角を求める。（10° の一部と 30° の和）

    次に、もう一方の三角形についても同じように、のばした線とDCがつくる角を求める。（10° の残りと 16° の和）

    最後に、求める角は、いま求めた2つの角を合わせたものだから、それらをたして求める。（56）'
