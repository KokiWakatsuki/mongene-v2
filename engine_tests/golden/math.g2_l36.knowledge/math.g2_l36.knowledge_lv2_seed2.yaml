  explanation: 'まず、合同を表す式で、角の頂点がどの位置に対応づけられているかを確認する。（角の対応する頂点を確認する）

    次に、対応する位置にある頂点にできる角が、対応する角になることから読み取る。（∠G）

    次に、合同を表す式で、辺の両端の頂点がどの位置に対応づけられているかを確認する。（辺の対応する頂点の並びを確認する）

    最後に、対応する位置にある頂点どうしが結ぶ辺が、対応する辺になることから読み取る。（辺FG）'
  hints:
