problem_text: '袋の中に緑玉が4個、青玉が6個、白玉が6個入っている。この袋から玉を2個同時に取り出すとき、取り出し方は同様に確からしいものとする。

  取り出した玉に少なくとも2色がふくまれる確率を求めよ。'
sub_questions:
- answer:
    display: 7/10
    kind: symbolic
    srepr: Rational(7, 10)
  cause_tags: []
  concept_tags:
  - probability.word_problem_at_least_two_colors
  explanation: 'まず、求める事象の余事象を考える。色が一種類しかふくまれない場合、つまり取り出した玉が全部同じ色である場合が、それにあたる。（余事象は「取り出した玉が全部同じ色」）

    次に、色ごとに、取り出した玉がすべてその色になる確率を求め、それらをたして、全部同じ色になる確率を求める。（3/10）

    最後に、全体の確率から、いま求めた確率をひいて、求める確率とする。（7/10）'
