problem_text: '面積が28cm²の正方形の花だんの囲いをつくる。ただし、√7=2.65として計算してよいものとする。

  (1) この正方形の花だんの囲いの1辺の長さを、根号を使って表せ。

  (2) その長さを、小数第一位まで求めよ。'
