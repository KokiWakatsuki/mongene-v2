  explanation: 'まず、縦の長さを x とおき、比を使って横の長さを x の何倍かで表す。（x）

    次に、縦と横の長さの積が面積になることから、面積の関係を式に表す。（3x² = 240）

    次に、両辺を比から出てきた数でわって、縦の長さの2乗の値を求める。（x² = 80）

    次に、根号の中を素因数分解し、平方の因数を見つける。（平方の因数を見つける）

    最後に、平方の因数を根号の外に出して a√b の形にする。（4√5）'
