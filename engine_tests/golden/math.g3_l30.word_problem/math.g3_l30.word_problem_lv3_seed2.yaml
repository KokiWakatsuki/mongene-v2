problem_ref: 667c34f5fd32bcf4
problem_text: '1辺が37cmの正方形がある。縦を x cm 短くし、横を x cm 長くして長方形をつくったところ、面積が1225cm²になった。

  x の値を求めよ。'
sub_questions:
- answer:
    display: 12cm
    kind: symbolic
    srepr: Tuple(Integer(12))
  cause_tags: []
  concept_tags:
  - quadratic.word_problem_square_cut
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（変形後の長方形の面積）

    次に、その量を x を使って両辺に表し、方程式をつくる。（(37 - x)(37 + x) = 1225）

    次に、かっこを展開し、右辺を左辺に移項して、=0 の形に整理する。（展開して整理する）

    次に、左辺を因数分解する。（左辺を因数分解する）

    次に、積が 0 になるのは各因数が 0 のときだから、それぞれを 0 とおいて x を求める。

    最後に、求めるものは正の数だから、2つの解のうち条件に合う正の解を選ぶ。（12）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - かっこを展開し、右辺を左辺に移項して、=0 の形に整理する。
  - 左辺を因数分解する。
  - 積が 0 になるのは各因数が 0 のときだから、それぞれを 0 とおいて x を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
