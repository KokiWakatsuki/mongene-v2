problem_ref: 70ef5d3b5cbe2937
problem_text: '1辺が23cmの正方形がある。縦を x cm 短くし、横を x cm 長くして長方形をつくったところ、面積が385cm²になった。

  x の値を求めよ。'
sub_questions:
- answer:
    display: 12cm
    kind: symbolic
    srepr: Tuple(Integer(12))
  cause_tags: []
  concept_tags:
  - quadratic.word_problem_square_cut
  explanation: 'まず、場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。（変形後の長方形の面積）

    次に、その量を x を使って両辺に表し、方程式をつくる。（(23 - x)(23 + x) = 385）

    次に、かっこを展開し、右辺を左辺に移項して、=0 の形に整理する。（144 - x² = 0）

    次に、左辺を因数分解する。（-(x - 12)(x + 12) = 0）

    次に、積が 0 になるのは各因数が 0 のときだから、それぞれを 0 とおいて x を求める。（x - 12 = 0、x + 12 = 0）

    最後に、求めるものは正の数だから、2つの解のうち条件に合う正の解を選ぶ。（12）'
  hints:
  - 場面の中で、どちらの見方でも同じになる（等しくなっている）量に着目する。
  - その量を x を使って両辺に表し、方程式をつくる。
  - かっこを展開し、右辺を左辺に移項して、=0 の形に整理する。
  - 左辺を因数分解する。
  - 積が 0 になるのは各因数が 0 のときだから、それぞれを 0 とおいて x を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
