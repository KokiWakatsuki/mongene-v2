  explanation: 'まず、y は x の2乗に比例するから、比例定数を a とおいて y=ax² と表し、与えられている x と y の値を代入する。（y=ax² に与えられた値を代入する）

    次に、代入してできた式を a について解いて、比例定数を求める。（a = 1/25）

    最後に、求めた比例定数を y=ax² にもどして、y を x の式で表す。（y = (1/25)x²）'
