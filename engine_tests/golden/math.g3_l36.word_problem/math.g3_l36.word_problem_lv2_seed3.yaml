problem_text: '車がブレーキをかけてから止まるまでに進む距離を停止距離という。ある乗用車は、速さが30km/hのとき停止距離が36mであった。

  停止距離 y m は、ブレーキをかけたときの速さ x km/h の2乗に比例するものとする。

  (1) y を x の式で表せ。

  (2) 速さが90km/hのときの停止距離を求めよ。'
