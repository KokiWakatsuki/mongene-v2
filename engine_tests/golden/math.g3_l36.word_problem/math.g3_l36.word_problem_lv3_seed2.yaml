problem_text: '高いところから鉄球を静かに落とすとき、落ち始めてから x 秒間に落下する距離 y m は、x の2乗に比例する。この鉄球は1秒間に5m落下した。

  落下距離が980mになるのは、落ち始めてから何秒後か求めよ。'
sub_questions:
- answer:
    display: 14秒後
    kind: symbolic
    srepr: Integer(14)
  cause_tags: []
  concept_tags:
  - quadratic_function.word_problem_determine_then_inverse
  explanation: 'まず、y は x の2乗に比例するから、比例定数を a とおいて y=ax² と表し、与えられている x と y の値を代入する。（y=ax² に与えられた値を代入する）

    次に、代入してできた式を a について解いて、比例定数を求める。（a = 5）

    次に、求めた比例定数を y=ax² にもどして、y を x の式で表す。（y = 5x²）

    次に、求める時刻を x とみて、距離を表す式に、与えられている距離をあてはめて方程式をつくる。（距離の式に、与えられた距離をあてはめる）

    次に、両辺を x の2乗にかかっている数でわり、平方根の考え方で x を求める。（平方根の考え方で x を求める）

    最後に、時刻は正の数だから、求めた解のうち正の解を選ぶ。（14秒後）'
