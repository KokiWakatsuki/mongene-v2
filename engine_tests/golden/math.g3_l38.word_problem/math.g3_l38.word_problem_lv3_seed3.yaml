problem_text: '1辺が24cmの正方形FBEKがある。点Cは頂点Bを出発し、辺BE、辺EKの上を毎秒1cmの速さでKまで動く。

  出発してから x 秒後の三角形FBCの面積を y cm²とする。

  (1) 0≦x≦24 のとき、y を x の式で表せ。

  (2) 24≦x≦48 のとき、y を x の式で表せ。'
