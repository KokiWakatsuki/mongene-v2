  explanation: 'まず、AKとKBの比から、AKとAB全体の比になおす。（AKとAB全体の比になおす）

    次に、三角形AKJと三角形ABMは相似であることから、面積比は相似比の二乗に等しいことを使って、三角形AKJと三角形ABM全体の面積比を求める。（相似比を二乗して三角形AKJと三角形ABMの面積比を求める）

    最後に、三角形ABM全体の面積から三角形AKJの面積を除いた残りが台形の面積になることから、三角形AKJと台形の面積比を求める。（三角形AKJ:台形KBMJ = 4:21）'
