problem_ref: 90ba171f962d0d12
problem_text: 三角形HCDで、辺HC, HD上に点E, AがありEA∥CD、HE:EC=9:1である。三角形HEAの面積と、台形ECDAの面積の比を求めよ。
sub_questions:
- answer:
    display: 三角形HEA:台形ECDA = 81:19
    kind: symbolic
    srepr: Tuple(Integer(81), Integer(19))
  cause_tags: []
  concept_tags:
  - similarity.trapezoid_area_ratio
  explanation: 'まず、HEとECの比から、HEとHC全体の比になおす。（HE:HC = 9:10）

    次に、三角形HEAと三角形HCDは相似であることから、面積比は相似比の二乗に等しいことを使って、三角形HEAと三角形HCD全体の面積比を求める。（81:100）

    最後に、三角形HCD全体の面積から三角形HEAの面積を除いた残りが台形の面積になることから、三角形HEAと台形の面積比を求める。（三角形HEA:台形ECDA = 81:19）'
  hints:
  - HEとECの比から、HEとHC全体の比になおす。
  - 三角形HEAと三角形HCDは相似であることから、面積比は相似比の二乗に等しいことを使って、三角形HEAと三角形HCD全体の面積比を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
