  explanation: 'まず、HEとEQの比から、HEとHQ全体の比になおす。（HEとHQ全体の比になおす）

    次に、三角形HEAと三角形HQBは相似であることから、面積比は相似比の二乗に等しいことを使って、三角形HEAと三角形HQB全体の面積比を求める。（相似比を二乗して三角形HEAと三角形HQBの面積比を求める）

    最後に、三角形HQB全体の面積から三角形HEAの面積を除いた残りが台形の面積になることから、三角形HEAと台形の面積比を求める。（三角形HEA:台形EQBA = 9:91）'
