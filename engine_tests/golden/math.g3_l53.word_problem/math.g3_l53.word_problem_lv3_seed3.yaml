    srepr: Mul(Integer(8), Pow(Integer(6), Rational(1, 2)))
  cause_tags: []
  concept_tags:
  - pythagorean.word_problem_rhombus_diagonal_area
  explanation: 'まず、ひし形の対角線は、それぞれの中点で垂直に交わるから、与えられた対角線の長さの半分をとって、直角三角形の直角をはさむ辺の長さを求める。（5 cm）

    次に、ひし形の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理からもう一方の辺の長さを求める。（4√6 cm）

    最後に、求めた長さは対角線の半分だから、これをもとにもどして、対角線全体の長さを求める。（8√6 cm）'
  hints:
  - ひし形の対角線は、それぞれの中点で垂直に交わるから、与えられた対角線の長さの半分をとって、直角三角形の直角をはさむ辺の長さを求める。
  - ひし形の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理からもう一方の辺の長さを求める。
  label: (1)
  prompt_text: value を求めなさい。
  solution_steps:
  - args: []
    narration: ひし形の対角線は、それぞれの中点で垂直に交わるから、与えられた対角線の長さの半分をとって、直角三角形の直角をはさむ辺の長さを求める。
    op: halve_given_diagonal
    result_display: 5 cm
    result_srepr: Integer(5)
  - args: []
    narration: ひし形の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理からもう一方の辺の長さを求める。
    op: apply_pythagorean_theorem
    result_display: 4√6 cm
    result_srepr: Mul(Integer(4), Pow(Integer(6), Rational(1, 2)))
  - args: []
