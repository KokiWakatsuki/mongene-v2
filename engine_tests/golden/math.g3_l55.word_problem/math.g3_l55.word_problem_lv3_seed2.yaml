problem_ref: 189cef75791c9f72
problem_text: '底面が1辺10cmの正方形CDEFで、底面以外の辺の長さがすべて8cmである正四角錐P-CDEFがある。

  (1) この正四角錐の高さを求めよ。

  (2) この正四角錐の体積を求めよ。'
sub_questions:
- answer:
    display: √14 cm
    kind: symbolic
    srepr: Pow(Integer(14), Rational(1, 2))
  cause_tags: []
  concept_tags:
  - pythagorean.word_problem_square_pyramid_volume
  explanation: 'まず、底面は正方形だから、となり合う辺を直角をはさむ2辺とみて、三平方の定理から底面の対角線の長さを求める。（10√2 cm）

    次に、頂点から底面に下ろした垂線の足は底面の対角線の交点だから、対角線の長さの半分が、直角三角形の直角をはさむ一方の辺になる。（5√2 cm）

    最後に、側面の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理から高さを求める。（√14 cm）'
  hints:
  - 底面は正方形だから、となり合う辺を直角をはさむ2辺とみて、三平方の定理から底面の対角線の長さを求める。
  - 頂点から底面に下ろした垂線の足は底面の対角線の交点だから、対角線の長さの半分が、直角三角形の直角をはさむ一方の辺になる。
  label: (1)
  prompt_text: value を求めなさい。
  solution_steps:
  - args: []
    narration: 底面は正方形だから、となり合う辺を直角をはさむ2辺とみて、三平方の定理から底面の対角線の長さを求める。
    op: compute_base_diagonal
    result_display: 10√2 cm
    result_srepr: Mul(Integer(10), Pow(Integer(2), Rational(1, 2)))
  - args: []
    narration: 頂点から底面に下ろした垂線の足は底面の対角線の交点だから、対角線の長さの半分が、直角三角形の直角をはさむ一方の辺になる。
    op: halve_base_diagonal
    result_display: 5√2 cm
    result_srepr: Mul(Integer(5), Pow(Integer(2), Rational(1, 2)))
  - args: []
    narration: 側面の辺を斜辺、いま求めた長さを直角をはさむ一方の辺とする直角三角形で、三平方の定理から高さを求める。
    op: apply_pythagorean_theorem
    result_display: √14 cm
    result_srepr: Pow(Integer(14), Rational(1, 2))
