problem_text: '辺LMの長さが7cm、辺MNの長さが4cm、高さが14cmの直方体LMNO-PQRSの形をしたケースがある。ここでLMNOは底面、PQRSは上面で、辺LPが高さにあたる。このケースの表面上を、頂点Lから、側面LMQPと側面MNRQを通って、頂点Rまで進む。

  (1) 進む道のりが最も短くなるときの、その道のりの長さを求めよ。

  (2) この二つの側面の面積の和を求めよ。'
