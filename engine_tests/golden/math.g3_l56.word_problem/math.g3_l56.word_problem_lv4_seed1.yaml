  explanation: 'まず、となり合う二つの面の開き方が三通りあることを確かめ、それぞれで開いた長方形の縦と横を書き出す。（三通りの開き方を書き出す）

    次に、開いた長方形の対角線の長さを三通りとも式にして比べ、最も短くなるのがどれかを決める。（どの開き方が最も短いかを比べる）

    最後に、選んだ開き方の長方形について、対角線の長さを三平方の定理で求める。（3√61 cm）'
