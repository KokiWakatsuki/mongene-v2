problem_ref: ea93e8370eafe0c6
problem_text: '湖にいるコイの数を調べるため、80匹のコイを捕まえて印をつけて湖にもどした。数日後に同じ湖で80匹のコイを捕まえると、そのうち印のついたコイが10匹いた。

  この湖にいるコイの総数を x 匹とする。

  (1) この標本での印つきのコイの割合を求めよ。

  (2) この湖にいるコイのおよその総数を求めよ。'
