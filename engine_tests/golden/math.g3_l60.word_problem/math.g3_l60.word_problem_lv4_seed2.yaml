problem_ref: ac80b5731ec6e204
problem_text: '袋の中に大量の白玉が入っている。この袋の中の白玉の総数を、玉を数えずに標本調査で推定したい。同じ大きさの赤玉を120個袋に加えてよくかき混ぜ、無作為に40個を取り出したところ、そのうち赤玉が3個だった。

  はじめに入っていた白玉のおよその総数を求めよ。'
sub_questions:
- answer:
    display: 1480個
    kind: symbolic
    srepr: Integer(1480)
  cause_tags: []
  concept_tags:
  - sample_survey.word_problem_population_modeling
  explanation: 'まず、標本の中で、該当するものの個数と標本全体の個数を確認する。（標本の大きさと、そのうち該当するものの個数）

    次に、該当するものの個数を標本の大きさでわり、標本での割合を求める。（0.075）

    次に、標本での該当する個数の割合が、母集団全体でもおよそ等しいとみて、母集団の大きさ x を含む比例式をつくる。（標本比率と母集団の比率が等しいとみて x を含む比例式をつくる）

    次に、比例式を解き、母集団の大きさ x を求める。（1600）

    最後に、求めた全体の個数から、はじめに加えた赤玉の個数を引いて、もとからあった白玉の総数を求める。（1480個）'
  hints:
  - 標本の中で、該当するものの個数と標本全体の個数を確認する。
  - 該当するものの個数を標本の大きさでわり、標本での割合を求める。
  - 標本での該当する個数の割合が、母集団全体でもおよそ等しいとみて、母集団の大きさ x を含む比例式をつくる。
  - 比例式を解き、母集団の大きさ x を求める。
  label: (1)
  prompt_text: 答えを求めなさい。
  solution_steps:
  - args: []
    narration: 標本の中で、該当するものの個数と標本全体の個数を確認する。
    op: identify_sample_ratio_terms
    result_display: 標本の大きさと、そのうち該当するものの個数
    result_srepr: Symbol('r')
  - args: []
