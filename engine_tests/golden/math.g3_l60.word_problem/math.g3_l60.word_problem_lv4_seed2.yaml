    op: compute_sample_ratio
    result_display: '0.075'
    result_srepr: Rational(3, 40)
  - args: []
    narration: 標本での該当する個数の割合が、母集団全体でもおよそ等しいとみて、母集団の大きさ x を含む比例式をつくる。
    op: form_ratio_equation_for_x
    result_display: 標本比率と母集団の比率が等しいとみて x を含む比例式をつくる
    result_srepr: ''
