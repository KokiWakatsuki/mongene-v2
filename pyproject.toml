[project]
name = "mongene-v2"
version = "0.1.0"
description = "mongene エンジンの開発記録・走査・失敗カタログ（エンジン本体は mongene-engine）"
requires-python = ">=3.12"
dependencies = [
    # ★エンジンは別リポジトリ（mongene-engine）にある。ここは記録と走査だけを持つ。
    #   pip install -e ../mongene-engine
    # で入れる（editable。エンジンを直したら即座にこちらの走査へ効く）。
    "mongene-engine",
    "matplotlib>=3.9.0",   # 走査の作図
    "networkx>=3.4.0",     # 前提関係の可視化
    "google-genai>=2.0.0", # 読み手を API から回すとき
]>=0.32.0",
    "pydantic>=2.9.0",
    "google-genai>=2.0.0",
    "svgwrite>=1.4.3",
    "matplotlib>=3.9.0",
    "networkx>=3.4.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# エンジンは engine_core/ に置く（1つのディレクトリだけを持ち出せば動く形）。
# 旧世代の apps/ は archive/legacy_app/ へ移した（もう配布物ではない）。
where = ["engine_core"]
include = ["engine*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["engine_core/tests"]
# **カバレッジは既定で切る。** 前は `--cov=apps` が既定に入っていて、
# engine を1行も測らないのに計測の重さだけ乗っていた（実測 2.6倍）。さらに
# `--cov-fail-under=80` のせいで**テストが全部通っても終了コードが 1** になり、
# 終了コードによる自動判定が書けなかった。測りたいときだけ明示して付ける。
#
# 並列は `-n 7 --dist worksteal`。既定の `--dist load` だと
# tests/eval/test_eval_suite.py の重い群が1本のワーカーに固まり、
# 残りが遊んだまま終盤で止まる（直列だと1時間37分たっても 0%）。
# 8コアの機械で 4 しか使っていなかったので 7 に上げた（1つは親と OS のため）。
addopts = "-q -p no:cacheprovider --no-cov -n 7 --dist worksteal"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
