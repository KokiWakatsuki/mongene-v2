# 失敗カタログ — 場面・数式が「機械検査を全部通ったうえで」壊れていた実例。
#
# ## 何のためにあるか
#
# 2つの読み手が読む。
#   1. **書き手**（新しい場面・数式を作る側）が、書く前に読む
#   2. **検査**（G-WK＝世界知識ゲート）が、判定の項目としてそのまま使う
#
# ★**ここに載っているものは、engine の宣言からは導けない。** 施設と料金名の対応も、
# 実在する切手の額面も、engine のどこにも書いていない事実（世界の知識）で、
# 値の突き合わせでは出ない——どれも**数としては解ける**問題だった。
#
# ## 書き方の規約
#
# - `悪い例` は**実際に engine が出した文**（作り話を載せない）。対照に使うので原文のまま
# - `機械検査` は、いまその型を捕まえている走査の名前。捕まえていなければ `なし`
# - `対照` が true のものは G-WK の問題群に混ぜられる。**読み手がこれを見落としたら、
#   その回の判定は信用しない**（0件を返す検査は、動いていないのと区別がつかない）

- id: fee_name_matches_place
  種類: 語の対
  悪い例: 美術館の入園料は、大人1人900円、子ども1人450円である。
  なぜ悪い: 館なので入館料。施設名と料金名は対で決まる。
  直し方: 施設と料金名をカタログに対で持たせる（品名と助数詞と同じ扱い）。
  見つけ方: G-BT の読み手。機械検査5つは全部通っていた
  機械検査: なし
  対照: true

- id: ticket_name_matches_vehicle
  種類: 語の対
  悪い例: 遊覧船の乗車券は、おとな1人480円、こども1人240円である。
  なぜ悪い: 船なので乗船券。乗り物と券の名前は対で決まる。
  直し方: 路線・乗り物と券名を対でカタログに持たせる。
  見つけ方: G-BT の読み手
  機械検査: なし
  対照: true

- id: stamp_value_must_exist
  種類: 実在する値の集合
  悪い例: 1枚180円の切手と1枚290円の切手を合わせて12枚買った。
  なぜ悪い: 180円・290円の切手は実在しない。額面は連続した範囲ではなく**決まった集合**。
  直し方: 定義域を `int_set` にして実在する額面だけにする（範囲で引かない）。
  見つけ方: G-BT の読み手
  機械検査: なし（G-SC5 は上下限しか見ない＝180 は範囲の中に入ってしまう）
  対照: true

- id: price_pair_must_be_meaningful
  種類: 2つの値の関係
  悪い例: 会費は大人1人2500円、中学生1人2000円である。
  なぜ悪い: 差が500円しかなく、大人と中学生で区分を分ける意味が無い。実物は2倍前後。
  直し方: 2つの値を独立に引かず、**(高い|安い) を対で1回引く**。
  見つけ方: G-BT の読み手
  機械検査: なし（1つずつの上下限は両方とも妥当）
  対照: true

- id: scene_sets_its_own_price_range
  種類: 場面ごとの相場
  悪い例: 植物園の入園料は、大人1人130円、子ども1人90円である。
  なぜ悪い: 入園料は数百円〜千円台。買い物の相場（40〜160円）をそのまま使っていた。
  直し方: 場面が定義域を上書きできるようにし、**場面を先に引く**順序にする。
  見つけ方: 新しい場面を足した直後に自分で気づいた（engine の暗黙の前提が出た）
  機械検査: なし
  対照: true

- id: item_price_must_match_the_item
  種類: 品物ごとの相場
  悪い例: 1個50円のなしと1個140円のももを合わせて12個買った。
  なぜ悪い: なしは200〜400円台、ももは200〜500円台。品物ごとに相場が違う。
  直し方: 品名と値段を対にして1回で引く（`品名|助数詞|下限|上限`）。
  見つけ方: G-BT の読み手
  機械検査: なし
  対照: true
  未修正: true    # 場面ごとの相場と品物ごとの相場を1つの仕掛けに統合するのが筋（作業3 の範囲外）

- id: counter_must_match_the_item
  種類: 語の対
  悪い例: 1個110円のぶどうと1個90円のみかんを合わせて12個買った。
  なぜ悪い: ぶどうは房で売る。1個いくらで数えない。
  直し方: 1個単位で買える品だけをカタログに置く（品名と助数詞を対で持つ）。
  見つけ方: コーパスの読み直し
  機械検査: check_scene_words.py（G-SC4・品名と助数詞の対）
  対照: false     # 既に機械が捕まえるので、読み手に混ぜる必要が無い

- id: quantity_must_be_possible_in_the_scene
  種類: 数の大きさ
  悪い例: 斜面の長さが432mの坂道を、時速4kmで歩いて登る。
  なぜ悪い: 式としては解けるが、場面としてありえない大きさ（円周角231°・歩いて30km も同型）。
  直し方: 関係の隣に上下限を宣言する（候補列挙とは別の原理で二重に書く）。
  見つけ方: コーパスの読み直し
  機械検査: check_scene_plausible.py（G-SC5）
  対照: false

- id: domain_widened_past_reality
  種類: 数の大きさ
  悪い例: 正三百四十八角形の1つの内角の大きさを求めよ。
  なぜ悪い: 重複率の閾値を通すために定義域を広げた結果。教材に存在しない設定。
  直し方: 数を現実に戻し、**狭さのほうを宣言する**（dup_rate_max ＋ 理由）。
  見つけ方: コーパスの読み直し（recipe のコメントに「閾値を通すため」と書いてあった）
  機械検査: statement_size / answer_size（eval のゲート）
  対照: false

# --- 2026-08-20 G-WK の初回で読み手（Opus）が見つけたもの。対照6件を全部捕まえた回。 ---
# ★3件とも「数の大きさ」だが、**G-SC5 が見ていない面**だった。G-SC5 は
# 引いた値ごとの上下限を見る。ここで出たのは
#   ①掛け合わせた量（毎分8L × 27分 = 満水216L）
#   ②場面に対する妥当性（公園まで片道12km ＝ 歩いて3時間）
#   ③割合の端（9割引き）
# どれも**個々の値は範囲の中**なので、値ごとの上下限では出ない。

- id: derived_quantity_must_be_possible
  種類: 数の大きさ
  悪い例: 空のプールに、毎分8Lの割合で水を入れると27分で満水になる。
  なぜ悪い: 満水量が 8×27=216L。プールではなく浴槽以下。**掛け合わせた量**が場面と合っていない。
  直し方: 関係の非退化条件に「積」も入れる（速さ×時間・割合×分数）。値ごとの上下限では出ない。
  見つけ方: G-WK の読み手（Opus）。G-SC5 は通っていた
  機械検査: なし
  対照: true

- id: distance_must_suit_the_destination
  種類: 数の大きさ
  悪い例: 家から公園まで、行きは歩いて時速4km、帰りは同じ道を自転車で時速12kmの速さで進んだところ、進むのにかかった時間は合わせて4時間だった。
  なぜ悪い: 片道12km。歩きだけで3時間かかる「公園」は場面として成り立たない。
    行き先の語（公園・駅・図書館）が道のりの上限を決めている。
  直し方: 行き先と道のりの範囲を対で持つ（施設と料金名を対で持つのと同じ手）。
  見つけ方: G-WK の読み手（Opus）
  機械検査: なし
  対照: true

- id: rate_must_not_sit_at_the_extreme
  種類: 数の大きさ
  悪い例: 定価a円のハンカチを、定価の9割引きで買う。
  なぜ悪い: 9割引きの店は無い。割合は範囲の端が現実の外にある（1〜7割引きが実物）。
  直し方: 割合の定義域を実物の幅にする。★狭めるのではなく**実物に合わせる**。
  見つけ方: G-WK の読み手（Opus）
  機械検査: なし
  対照: true
